            return `<div class="card classcard ${sel?'sel':''}" data-cls="${c}" style="--cls:${classColor(c)}">
              <div class="cport"><img src="${portraitFor({className:c})}" alt="" onerror="this.style.display='none'"><span class="ph">${esc(dn(c))}</span></div>
              <div class="cbody">
                <div class="cname">${dn(c)}</div>
                <div class="ctag">${esc(info.title)}</div>
                <div class="budget">${esc(info.budget)}</div>
                <div class="muted" style="font-size:12px;margin-top:6px">${esc(info.blurb)}</div>
              </div>
            </div>`;
          }).join('')}
        </div>
        <div class="team-slots">
          ${[0,1].map(i=>{
            const c=chosen[i];
            return c
              ? `<div class="team-slot filled" data-slot="${i}" style="--cls:${classColor(c)}" title="Remove ${esc(dn(c))}">
                   <div class="cport"><img src="${portraitFor({className:c})}" alt="" onerror="this.style.display='none'"><span class="ph">${esc(dn(c))}</span></div>
                   <div class="slot-name">${esc(dn(c))}</div>
                   <span class="slot-x">✕</span>
                 </div>`
              : `<div class="team-slot empty"><span class="slot-hint">Fighter ${i+1}</span></div>`;
          }).join('')}
        </div>
        ${inEsc ? `
        <div class="map-select">
          <span class="ms-label">Warp Zone</span>
          <div class="ms-row"><span class="pill" style="--cls:${classColor(escDefn.homeClass)}">${esc(GF.CLASSES[escDefn.homeClass].world)} · fixed for this Escalation</span></div>
        </div>` : `
        <div class="map-select">
          <span class="ms-label">Warp Zone</span>
          <div class="ms-row">
            <button class="ms-chip ${UI.map==='random'?'sel':''}" data-map="random">🎲 Random</button>
            ${classes.map(c=>`<button class="ms-chip ${UI.map===c?'sel':''}" data-map="${c}" style="--cls:${classColor(c)}">${esc(GF.CLASSES[c].world)}</button>`).join('')}
          </div>
        </div>`}
        <div class="bar" style="margin-top:14px">
          <span class="muted">${chosen.length}/2 selected${chosen.length?': '+chosen.join(' + '):''}</span>
          <div class="row">
            <button data-act="back">Back</button>
            <button class="primary" data-act="go" ${chosen.length===2?'':'disabled'}>Confirm team</button>
          </div>
        </div>
      `);
      $$('[data-cls]').forEach(d=> d.onclick=()=>{
        const c=d.dataset.cls; const i=chosen.indexOf(c);
        if(i>=0) chosen.splice(i,1); else if(chosen.length<2) chosen.push(c);
        draw();
      });
      $$('[data-slot]').forEach(s=> s.onclick=()=>{ chosen.splice(+s.dataset.slot,1); draw(); });
      $$('[data-map]').forEach(b=> b.onclick=()=>{ UI.map=b.dataset.map; draw(); });
      $('[data-act="back"]').onclick=()=> inEsc ? (function(){ UI.escSetup=null; showEscalations(); })()
                                       : (playerNum===2 ? showClassSelect(1) : showStart());
      $('[data-act="go"]').onclick=()=>{
        if(chosen.length!==2) return;
        if(inEsc){ beginEscalation(escDefn.id, chosen); return; }
        if(playerNum===1){
          UI.classesP1 = chosen.slice();
          if(UI.mode==='hotseat') showPass('Player 2', ()=> showClassSelect(2));
          else startMatch();
        } else { UI.classesP2 = chosen.slice(); startMatch(); }
      };
    };
    draw();
  }

  function aiClasses(){
    const classes = Object.keys(GF.CLASSES).slice();
    for(let i=classes.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [classes[i],classes[j]]=[classes[j],classes[i]]; }
    return classes.slice(0,2);
  }

  /* ---------------- match setup ---------------- */
  // build + launch a match from explicit teams/map (shared by Deploy and Rematch)
  function deployMatch(classesA, classesB, mapKey){
    const seed = (Math.floor(Math.random()*2147483647))|0;
    UI.mapKey = mapKey; UI.mapBg = zoneBgPath(mapKey);
    UI.lastSetup = { classesA: classesA.slice(), classesB: classesB.slice(), ai: UI.mode, mapKey };
    UI.state = GF.newMatch({ seed,
      sideA:{ name:'You', classes:classesA, ai:null },
      sideB:{ name:'AI', classes:classesB, ai:UI.mode } });
    music('battle');   // crossfade to the battle theme under the cinematic
    playIntro(()=> runRound());
  }
  function startMatch(){
    escRun = null;   // standard/hotseat play is never part of an Escalation run
    // resolve the selected Warp Zone (random by default)
    const zoneKeys = Object.keys(WARP_ZONES);
    const mapKey = (UI.map && UI.map!=='random' && WARP_ZONES[UI.map]) ? UI.map
                 : zoneKeys[Math.floor(Math.random()*zoneKeys.length)];
    deployMatch(UI.classesP1, aiClasses(), mapKey);
  }
  // replay the last match with the same teams, map, and difficulty
  function rematch(){
    const s=UI.lastSetup; if(!s){ showStart(); return; }
    UI.mode = s.ai;
    deployMatch(s.classesA, s.classesB, s.mapKey);
  }

  /* ================= Escalations (single-player ladder) =================
     Six Escalations across three difficulty tiers, all unlocked. Each is a
     sequence of battles ending in a mirror team of the home class; AI tier is
     drawn from the tier's pool per battle (highest tier on the final). State
     lives in `escRun` (scoped to this flow), serializable for a future save.   */
  const ESC_COUNT = { easy:3, medium:4, hard:5 };
  const ESC_TIERS = {                       // AI-difficulty pool drawn from per battle
    easy:   ['random','heuristic'],
    medium: ['random','heuristic','captain'],
    hard:   ['random','heuristic','captain','warden'],
  };
  const ESC_FINAL = { easy:'heuristic', medium:'captain', hard:'warden' };   // final battle tier
  const ESC_TIER_LABEL = { easy:'Easy', medium:'Medium', hard:'Hard' };
  // homeClass uses the engine class key; its codename renders via dn(), its zone
  // background via zoneBgPath() (which equals the required bg mapping).
  const ESCALATIONS = [
    { id:'radiant_compact', name:'Radiant Compact Vigil',  difficulty:'easy',   homeClass:'Cleric'   },
    { id:'pale_rim',        name:'Pale Rim Circuit',        difficulty:'easy',   homeClass:'Drifter'  },
    { id:'ashfield',        name:'Ashfield Run',            difficulty:'medium', homeClass:'Scout'    },
    { id:'holdfast',        name:'Holdfast Siege',          difficulty:'medium', homeClass:'Warden'   },
    { id:'shatter_court',   name:'Shatter Court Gauntlet',  difficulty:'hard',   homeClass:'Arcanist' },
    { id:'chrome_fold',     name:'Chrome Fold Descent',     difficulty:'hard',   homeClass:'Soldier'  },
  ];
  function escDefById(id){ return ESCALATIONS.find(e=>e.id===id) || null; }
  function pickRand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  // a valid random 2-operative enemy team: two DIFFERENT classes (mirror is reserved for the final).
  function randomEnemyTeam(){ const cs=Object.keys(GF.CLASSES); const a=pickRand(cs); return [a, pickRand(cs.filter(c=>c!==a))]; }

  // Build a fresh, serializable run object for an Escalation + player team.
  function buildEscalationRun(escId, playerTeam){
    const def = escDefById(escId);
    const total = ESC_COUNT[def.difficulty];
    const pool = ESC_TIERS[def.difficulty];
    const battles = [];
    for(let i=0;i<total;i++){
      const isFinal = i===total-1;
      battles.push({
        opponentTeam: isFinal ? [def.homeClass, def.homeClass] : randomEnemyTeam(),
        aiTier: isFinal ? ESC_FINAL[def.difficulty] : pickRand(pool),
        result: null,
      });
    }
    return {
      escalationId: escId,
      difficulty: def.difficulty,
      playerTeam: playerTeam.slice(),
      currentBattle: 0,
      totalBattles: total,
      battles,
    };
  }

  function beginEscalation(escId, playerTeam){
    UI.escSetup = null;
    escRun = buildEscalationRun(escId, playerTeam);
    showInterBattle();
  }

  // Inter-battle brief: battle N of M, upcoming opponent preview, Continue.
  function showInterBattle(){
    clearOverlay();
    music('menu');
    const def = escDefById(escRun.escalationId);
    const idx = escRun.currentBattle, total = escRun.totalBattles;
    const b = escRun.battles[idx];
    const isFinal = idx===total-1;
    const pips = escRun.battles.map((bt,i)=>{
      const cls = i<idx ? 'done' : (i===idx ? 'cur' : '');
      const fin = i===total-1 ? 'final' : '';
      return `<span class="esc-pip ${cls} ${fin}" title="Battle ${i+1}${i===total-1?' · final (mirror)':''}"></span>`;
    }).join('');
    const opHTML = (c)=>`<div class="esc-prev-op" style="--cls:${classColor(c)}">
        <div class="cport"><img src="${portraitFor({className:c})}" alt="" onerror="this.style.display='none'"><span class="ph">${esc(dn(c))}</span></div>
        <div class="nm">${esc(dn(c))}</div>
      </div>`;
    const node = showOverlay(`
      <div id="end" class="end-screen ${isFinal?'loss':'win'}" style="background-image:linear-gradient(rgba(8,8,6,.74),rgba(8,8,6,.9)), url('${zoneBgPath(def.homeClass)}')">
        <div class="end-tag">${esc(def.name)} · ${ESC_TIER_LABEL[def.difficulty]} Escalation</div>
        <h1 class="end-title" style="font-size:clamp(34px,6vw,54px)">Battle ${idx+1} of ${total}</h1>
        <div class="esc-prog">${pips}</div>
        <p class="end-reason">${isFinal
          ? `Final breach — a mirror cell of <b>${esc(dn(def.homeClass))}</b> operatives holds the zone.`
          : `Incoming hostile cell. Health is restored each engagement.`}</p>
        <div class="esc-preview">${b.opponentTeam.map(opHTML).join('')}</div>
        ${isFinal?'<div class="esc-final-flag">Final Battle</div>':''}
        <div class="row end-actions">
          <button class="primary" data-act="go">Continue</button>
          <button data-act="abandon">Abandon</button>
        </div>
      </div>`);
    node.querySelector('[data-act="go"]').onclick=()=>{ clearOverlay(); startEscalationBattle(); };
    node.querySelector('[data-act="abandon"]').onclick=()=>{ clearOverlay(); escRun=null; showEscalations(); };
  }

  // Launch the current Escalation battle: zone locked to the home zone, AI tier from the battle.
  function startEscalationBattle(){
    const def = escDefById(escRun.escalationId);
    const b = escRun.battles[escRun.currentBattle];
    UI.mode = b.aiTier;                 // aiForMode(UI.mode) in runRound uses this tier
    deployMatch(escRun.playerTeam, b.opponentTeam, def.homeClass);   // mapKey=homeClass → home zone bg
  }

  // Called from showEnd when an Escalation run is active. Player is side 0.
  // Idempotent per match: a stale "See result" button (still in the DOM behind the
  // inter-battle overlay / fight intro) can re-fire showEnd — guard so each match's
  // result is processed exactly once and a finished/empty state can't advance the run.
  function escEnd(){
    const st = UI.state, r = st && st.result;
    const cur = escRun && escRun.battles[escRun.currentBattle];
    if(!st || !r || st._escHandled || !cur) return;
    st._escHandled = true;
    const win = r.winner===0;
    cur.result = win ? 'win' : (r.winner===1 ? 'loss' : 'draw');
    if(win){
      aud('MATCH_WIN');
      escRun.currentBattle++;
      if(escRun.currentBattle >= escRun.totalBattles){ showEscalationClear(); }
      else { showInterBattle(); }
    } else {
      showEscalationFail();
    }
  }

  function showEscalationClear(){
    const def = escDefById(escRun.escalationId);
    aud('MATCH_WIN'); music('victory');
    recordEscalationClear(def.id);
    const node = showOverlay(`
      <div id="end" class="end-screen win" style="background-image:linear-gradient(rgba(8,8,6,.7),rgba(8,8,6,.92)), url('${zoneBgPath(def.homeClass)}')">
        <div class="end-tag">${esc(def.name)} · ${ESC_TIER_LABEL[def.difficulty]} · ${escRun.totalBattles} battles cleared</div>
        <h1 class="end-title">Escalation Complete</h1>
        <p class="end-reason">The breaches across <b>${esc(GF.CLASSES[def.homeClass].world)}</b> are sealed. ${esc(def.name)} is secured.</p>
        <p class="end-reason" style="opacity:.7;font-style:italic">Unlock rewards arrive in a future update.</p>
        <div class="row end-actions">
          <button class="primary" data-act="more">Escalations</button>
          <button data-act="menu">Main Menu</button>
        </div>
      </div>`);
    node.querySelector('[data-act="more"]').onclick=()=>{ clearOverlay(); escRun=null; showEscalations(); };
    node.querySelector('[data-act="menu"]').onclick=()=>{ clearOverlay(); showStart(); };
  }

  function showEscalationFail(){
    const def = escDefById(escRun.escalationId);
    aud('MATCH_LOSS'); music('menu');
    const failedId = def.id, team = escRun.playerTeam.slice();
    const reached = escRun.currentBattle+1, total = escRun.totalBattles;
    const node = showOverlay(`
      <div id="end" class="end-screen loss" style="background-image:linear-gradient(rgba(8,8,6,.74),rgba(8,8,6,.92)), url('${zoneBgPath(def.homeClass)}')">
        <div class="end-tag">${esc(def.name)} · ${ESC_TIER_LABEL[def.difficulty]} Escalation</div>
        <h1 class="end-title">Escalation Failed</h1>
        <p class="end-reason">Your cell fell at <b>battle ${reached} of ${total}</b>. There are no mid-Escalation checkpoints — a retry restarts from the first battle.</p>
        <div class="row end-actions">
          <button class="primary" data-act="retry">Retry Escalation</button>
          <button data-act="abandon">Abandon</button>
        </div>
      </div>`);
    node.querySelector('[data-act="retry"]').onclick=()=>{ clearOverlay(); escRun = buildEscalationRun(failedId, team); showInterBattle(); };
    node.querySelector('[data-act="abandon"]').onclick=()=>{ clearOverlay(); escRun=null; showEscalations(); };
  }

  // Escalations select screen — 6 cards, 2x3, all unlocked.
  function showEscalations(){
    clearOverlay();
    escRun=null; UI.escSetup=null;
    music('menu');
    const saved = loadPlayer();
    render(`
      <div class="cscreen">
      <div class="bar"><h1 style="margin:0">Escalations</h1>
        <button data-act="back">← Menu</button></div>
      <p class="muted" style="max-width:620px;margin:0 auto 4px">Run a sequence of breaches in a fixed Warp Zone. Each Escalation ends against a mirror cell of its home operative — the deeper the tier, the higher the enemy clearance.</p>
      <div class="esc-grid">
        ${ESCALATIONS.map(e=>{
          const cleared = !!(saved.escalationClears && saved.escalationClears[e.id]);
          return `<div class="esc-card" data-esc="${e.id}" style="--cls:${classColor(e.homeClass)};background-image:url('${zoneBgPath(e.homeClass)}')">
            <span class="esc-tier">${ESC_TIER_LABEL[e.difficulty]}</span>
            <div class="esc-port"><img src="${portraitFor({className:e.homeClass})}" alt="" onerror="this.style.display='none'"><span class="ph">${esc(dn(e.homeClass))}</span></div>
            <div class="esc-foot">
              <div class="esc-name">${esc(e.name)}${cleared?' ✓':''}</div>
              <div class="esc-zone">${esc(GF.CLASSES[e.homeClass].world)} · ${esc(dn(e.homeClass))} home</div>
              <span class="esc-count">${ESC_COUNT[e.difficulty]} Battles</span>
            </div>
          </div>`;
        }).join('')}
      </div>
      <footer style="margin-top:16px">All Escalations available · two Easy · two Medium · two Hard</footer>
      </div>
    `);
    $('[data-act="back"]').onclick=()=> showStart();
    $$('[data-esc]').forEach(d=> d.onclick=()=>{ UI.escSetup = d.dataset.esc; showClassSelect(1); });
  }

  /* ---------------- save stub (localStorage; foundation only) ----------------
     Lightweight player profile. Read silently / fail gracefully if missing or
     corrupt. Extended later for unlocks + multiplayer identity.                */
  const SAVE_KEY = 'rift_player';
  function loadPlayer(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return { displayName:'', escalationClears:{} };
      const o = JSON.parse(raw) || {};
      return { displayName: o.displayName || '', escalationClears: o.escalationClears || {} };
    }catch(e){ return { displayName:'', escalationClears:{} }; }
  }
  function savePlayer(p){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(p)); }catch(e){} }
  function recordEscalationClear(escId){
    try{ const p = loadPlayer(); p.escalationClears[escId] = true; savePlayer(p); }catch(e){}
  }

  /* ---------------- per-round driver ---------------- */
  function runRound(){
    const st = UI.state;
    GF.startOfTurn(st);
    if(st.over){ showEnd(); return; }   // a burn could finish the match at start of turn
    GF.drawHands(st);
    UI.picks = [[],[]];
    if(UI.mode==='hotseat'){
      UI.steps = [
        ()=> showPass('Player 1', ()=> doSelection(0)),
        ()=> showPass('Player 2', ()=> doSelection(1)),
        ()=> resolveAndShow(),
      ];
    } else {
      UI.steps = [
        ()=> doSelection(0),
        ()=>{ UI.picks[1] = GF.aiForMode(UI.mode)(st,1); resolveAndShow(); },
      ];
    }
    UI.stepIdx = 0; nextStep();
  }
  function nextStep(){ const s = UI.steps[UI.stepIdx++]; if(s) s(); }

  /* ---------------- pass-the-device cover (hotseat) ---------------- */
  function showPass(label, next){
    const node = showOverlay(`
      <div id="cover">
        <div class="muted">Hotseat</div>
        <h1>Pass the device to<br>${esc(label)}</h1>
        <p class="muted">Make sure the previous player isn't looking.</p>
        <button class="primary" data-act="ready">${esc(label)} is ready — tap to continue</button>
      </div>`);
    node.querySelector('[data-act="ready"]').onclick=()=>{ clearOverlay(); next(); };
  }

  /* ---------------- selection screen ---------------- */
  // Hand grouped by living fighter, each group ordered by tier speed (1→4).
  // Two groups when both fighters live (rendered with a gap); one when solo.
  function livingHandGroups(side){
    return side.fighters.filter(f=>f.alive && f.hand && f.hand.length)
      .map(f=>({owner:f, items:f.hand.slice().sort((a,b)=> (a.card.speed-b.card.speed) || a.card.name.localeCompare(b.card.name))}));
  }
  function livingHand(side){ return livingHandGroups(side).flatMap(g=>g.items); }
  // owner-performs: the card is performed by its owner; we only choose the
  // enemy target (attacks) or the ally recipient (ally cards).
  function addablePicks(state, sideIdx, picks, hi){
    const side=state.sides[sideIdx];
    const allies=GF.livingFighters(side);
    const enemies=GF.livingFighters(GF.enemyOf(state,sideIdx));
    const card=hi.card, owner=hi.owner, out=[];
    if(owner.turn.silencedTypes && owner.turn.silencedTypes.has(card.type)) return out;
    let targs;
    if(card.aim==='enemy') targs = enemies;
    else if(card.aim==='ally') targs = allies;          // choose which ally receives it
    else if(card.aim==='self') targs = [owner];
    else targs = [null];                                 // enemyAll / allyAll / none
    for(const t of targs){
      const p={handItem:hi, card, owner, caster:owner, target:t};
      if(GF.validatePicks(state,sideIdx,picks.concat([p])).ok) out.push(p);
    }
    return out;
  }

  // Draw one card from a fighter's own deck into its hand (reshuffling the
  // discard pile if the draw pile is empty). Used by discard-to-redraw.
  function drawOneInto(f, rng){
    if(f.deck.draw.length===0){
      if(f.deck.discard.length===0) return null;     // deck fully exhausted
      f.deck.draw = rng.shuffle(f.deck.discard.slice()); f.deck.discard = [];
    }
    const card = f.deck.draw.shift();
    if(card){ f.hand = f.hand || []; f.hand.push({card, owner:f}); }
    return card;
  }
  // floating full-card preview, shown when hovering a staged ability in the arena
  let _cardPreviewEl=null;
  function showCardPreview(card, anchorEl){
    if(!_cardPreviewEl){ _cardPreviewEl=document.createElement('div'); _cardPreviewEl.className='card-preview'; document.body.appendChild(_cardPreviewEl); }
    _cardPreviewEl.innerHTML = catalogCardHTML(card);
    _cardPreviewEl.style.display='block';
    const r=anchorEl.getBoundingClientRect();
    const pw=_cardPreviewEl.offsetWidth, ph=_cardPreviewEl.offsetHeight;
    let left = Math.max(8, Math.min(window.innerWidth - pw - 8, r.left + r.width/2 - pw/2));
    let top = r.top - ph - 10;                 // prefer above the staged chip
    if(top < 8) top = r.bottom + 10;           // flip below if there's no room
    _cardPreviewEl.style.left = left+'px';
    _cardPreviewEl.style.top = top+'px';
  }
  function hideCardPreview(){ if(_cardPreviewEl) _cardPreviewEl.style.display='none'; }
  // large, easy-to-read card popup pinned to an open corner (bottom-right) while
  // hovering a card in the hand.
  let _handPreviewEl=null;
  function showHandPreview(card){
    if(!_handPreviewEl){ _handPreviewEl=document.createElement('div'); _handPreviewEl.className='hand-preview'; document.body.appendChild(_handPreviewEl); }
    _handPreviewEl.innerHTML = catalogCardHTML(card);
    _handPreviewEl.style.display='block';
  }
  function hideHandPreview(){ if(_handPreviewEl) _handPreviewEl.style.display='none'; }
  function doSelection(sideIdx){
    UI.sel = { sideIdx, picks:[], stage:null, pendingHi:null, discardUsed:false };
    UI.deckView = null;
    drawSelection();
  }

  function drawSelection(){
    hideCardPreview();
    const st = UI.state, sel = UI.sel, sideIdx = sel.sideIdx;
    const side = st.sides[sideIdx], enemy = GF.enemyOf(st, sideIdx);
    const groups = livingHandGroups(side);          // one per living fighter, tier-sorted
    const hand = groups.flatMap(g=>g.items);         // flat, same order (for indexing/wiring)
    const usedItems = new Set(sel.picks.map(p=>p.handItem));
    const reservedDiscards = new Set(sel.picks.map(p=>p.discardHi).filter(Boolean));  // cards spent as discard-on-play cost
    const budget = GF.energyBudget(st, side), spent = GF.energyOf(sel.picks), remaining = budget - spent;
    const nextEnergy = GF.roundEnergy(st.round+1);
    const addableMap = new Map();
    hand.forEach(hi=>{ if(!usedItems.has(hi) && !reservedDiscards.has(hi)) addableMap.set(hi, addablePicks(st, sideIdx, sel.picks, hi)); });

    // valid click targets for the current stage
    let validEnemy = new Set(), validAlly = new Set();
    if(sel.pendingHi){
      const picksOf = addableMap.get(sel.pendingHi) || [];
      if(sel.stage==='target') picksOf.forEach(p=>{ if(p.target) validEnemy.add(p.target.uid); });
      if(sel.stage==='ally')   picksOf.forEach(p=>{ if(p.target) validAlly.add(p.target.uid); });
    }

    const hint = sel.stage==='target' ? `Choose the <b>enemy</b> target for <b>${esc(sel.pendingHi.card.name)}</b>.`
              : sel.stage==='ally'   ? `Choose which <b>ally</b> receives <b>${esc(sel.pendingHi.card.name)}</b>.`
              : sel.stage==='discard'? `Choose a card to <b>discard</b> for <b>${esc(sel.pendingHi.card.name)}</b> — click it again to cancel.`
              : remaining<=0 ? `Out of energy — lock in.`
              : `Click a card to play it. <b>${remaining}</b> energy left.`;

    // --- top bar, side panels, staging & dock ---
    // quit + round + hint across the top.
    const top = topBarHTML(st, hint);

    // left: How-to-play, collapsed by default, each feature its own accordion row.
    const left = `<div class="sidepanel tutpanel">
        <button class="tut-toggle" data-act="tut">How to play <span class="chev">${UI.tutOpen?'▾':'▸'}</span></button>
        <div class="tut-body ${UI.tutOpen?'':'hidden'}">
          ${tutorialSections().map(([h,b],i)=>{
            const open=!!UI.tutSec[i];
            return `<div class="acc-item">
              <button class="acc-head" data-acc="${i}">${h} <span class="chev">${open?'▾':'▸'}</span></button>
              <div class="acc-body ${open?'':'hidden'}">${b}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`;

    // right: energy meter + lock / undo controls.
    const right = `<div class="sidepanel">
        <div class="energy-box">
          <div class="big">⚡ ${remaining} / ${budget}</div>
          <div class="pips">${Array.from({length:budget}).map((_,i)=>`<i class="${i<remaining?'on':''}"></i>`).join('')}</div>
          ${st.round<5?`<div class="tip" style="margin:2px 0 0">→ ${nextEnergy} next round</div>`:`<div class="tip" style="margin:2px 0 0">max (final round)</div>`}
        </div>
      </div>
      <div class="sidepanel"><div class="rail-label">Your decks</div>${deckRailHTML(side)}</div>`;

    // staging: clicked cards wait in the arena middle, shown in cast order (tier
    // speed). Lock in / Undo all sit directly beneath them, above your portraits.
    // A prominent notice appears here while a target is being chosen.
    const targetNotice = (sel.stage==='target' || sel.stage==='ally')
      ? `<div class="target-notice ${sel.stage==='ally'?'ally':'enemy'}">
           ${sel.stage==='ally' ? 'Choose an <b>ally</b> to receive' : 'Choose an <b>enemy</b> target for'} <b>${esc(sel.pendingHi.card.name)}</b>
           <span class="tn-sub">${sel.stage==='ally'?'click a glowing ally below':'click a glowing enemy above'}</span>
         </div>`
      : '';
    const ordered = sel.picks.map((p,i)=>({p,i})).sort((a,b)=> (a.p.card.speed-b.p.card.speed) || (a.i-b.i));
    const staging = `<div class="staging">
        ${targetNotice}
        <div class="staging-label">${sel.picks.length ? 'Playing this round (cast order) — tap to remove' : ''}</div>
        <div class="staging-row">${ordered.map(o=>stagedCardHTML(o.p,o.i)).join('')}</div>
        ${sel.picks.length||sel.pendingHi ? '' : '<div class="staging-empty">Tap a card below to stage it here</div>'}
        <div class="mid-controls">
          <button class="primary ctrlbtn" data-act="lock">Lock in →</button>
          <button class="ctrlbtn" data-act="clear" ${sel.picks.length||sel.pendingHi?'':'disabled'}>Undo all</button>
        </div>
      </div>`;

    // dock: just the hand, full width (queued cards are staged, not shown here).
    let gi = 0;
    const handHTML = groups.map(g=>{
        const cards = g.items.map(hi=>{
          const idx = gi++;                         // absolute index into flat `hand`
          if(usedItems.has(hi) || reservedDiscards.has(hi)) return '';   // queued or spent as discard cost
          // discard-on-play cards need at least one other card to discard
          const others = hand.some(h=> h!==hi && !usedItems.has(h) && !reservedDiscards.has(h));
          const playable = (addableMap.get(hi)||[]).length>0 && (!hi.card.discardOnPlay || others);
          const unaffordable = !playable && GF.energyCost(hi.card) > remaining;
          return handCardHTML(hi, idx, false, !playable && !unaffordable, sel.pendingHi===hi, unaffordable, !sel.discardUsed);
        }).join('');
        return cards ? `<div class="hand-group">${cards}</div>` : '';
      }).join('');
    const handSlot = `<div class="hand-fan">${handHTML}</div>`;

    // deck viewer (opened by clicking a deck in the right rail), contained in the arena
    let deckViewer='', dvCards=[];
    if(UI.deckView!=null){
      const dvF = side.fighters.find(f=>f.uid===UI.deckView);
      if(dvF){ dvCards = dvF.deck.draw.slice().sort((a,b)=>(a.speed-b.speed)||a.name.localeCompare(b.name)); deckViewer = deckViewerHTML(dvF, dvCards); }
      else UI.deckView=null;
    }

    render(frameHTML({
      top, left, right,
      center: enemyZoneHTML(sideIdx, st, {
        staging, deckViewer,
        enemy:(f)=>({enemy:true, clickable: validEnemy.has(f.uid), targetKind:'enemy'})
      }),
      hand: `<div class="arena-slot">${handSlot}</div>`,
      you: yourZoneHTML(sideIdx, st, {
        you:(f)=>({clickable: validAlly.has(f.uid), targetKind:'ally'})
      })
    }));
    if(sel.stage && $('#battle')) $('#battle').classList.add('targeting');

    // wire hand cards
    $$('.hand-fan .pcard').forEach(el=>{
      const idx=+el.dataset.hand, hi=hand[idx];
      // hover a hand card → big readable popup in the open bottom-right corner
      el.onmouseenter=()=>{ if(hi) showHandPreview(hi.card); };
      el.onmouseleave=hideHandPreview;
      const disc=el.querySelector('.disc');
      if(disc) disc.onclick=(ev)=>{ ev.stopPropagation(); doDiscard(hi); };
      // during a discard-on-play selection, every card is a discard candidate
      if(sel.stage==='discard'){
        if(hi!==sel.pendingHi) el.classList.add('discardable');
        el.onclick=()=>{
          if(hi===sel.pendingHi){ resetPending(); drawSelection(); return; }  // click the source again to cancel
          const base=addableMap.get(sel.pendingHi)[0];
          commitPick(Object.assign({}, base, {discardHi:hi}));
        };
        return;
      }
      if(usedItems.has(hi) || (addableMap.get(hi)||[]).length===0) return;
      el.onclick=()=>{
        const card=hi.card;
        sel.pendingHi=hi;
        if(card.discardOnPlay){ sel.stage='discard'; drawSelection(); }       // pick a card to discard
        else if(card.aim==='enemy'){ sel.stage='target'; drawSelection(); }
        else if(card.aim==='ally'){
          const opts=addableMap.get(hi);
          if(GF.livingFighters(side).length===1 || opts.length===1) commitPick(opts[0]);
          else { sel.stage='ally'; drawSelection(); }
        } else { commitPick(addableMap.get(hi)[0]); }   // self / aoe / team
      };
    });
    // wire fighters
    $$('.cfighter').forEach(el=>{
      const uid=+el.dataset.uid;
      if(validEnemy.has(uid)) el.onclick=()=> commitPick(addableMap.get(sel.pendingHi).find(p=>p.target&&p.target.uid===uid));
      else if(validAlly.has(uid)) el.onclick=()=> commitPick(addableMap.get(sel.pendingHi).find(p=>p.target&&p.target.uid===uid));
    });
    // staged cards: tap to unqueue, hover to preview the full card
    $$('.staged[data-pick]').forEach(el=>{
      const pi=+el.dataset.pick;
      el.onclick=()=>{ hideCardPreview(); aud('CARD_REMOVE'); sel.picks.splice(pi,1); resetPending(); drawSelection(); };
      el.onmouseenter=()=>{ const p=sel.picks[pi]; if(p) showCardPreview(p.card, el); };
      el.onmouseleave=hideCardPreview;
    });
    // deck rail: click a deck to toggle its card viewer
    $$('[data-deckview]').forEach(el=> el.onclick=()=>{ const uid=+el.dataset.deckview; UI.deckView=(UI.deckView===uid?null:uid); drawSelection(); });
    if(UI.deckView!=null){
      const pane=$('#dvPreview');
      const cardsEl=$$('.dv-card');
      const showPrev=(el)=>{ if(!pane) return; pane.innerHTML = dvPreviewHTML(dvCards[+el.dataset.dvi]); cardsEl.forEach(x=>x.classList.toggle('active', x===el)); };
      cardsEl.forEach(el=>{ el.onmouseenter=()=> showPrev(el); el.onclick=()=> showPrev(el); });   // hover or tap; preview persists below the list
      const cl=$('[data-act="dvclose"]'); if(cl) cl.onclick=()=>{ UI.deckView=null; drawSelection(); };
      const bd=$('[data-act="dvbackdrop"]'); if(bd) bd.onclick=(e)=>{ if(e.target===bd){ UI.deckView=null; drawSelection(); } };   // tap outside closes
    }
    const quitBtn=$('[data-act="quit"]'); if(quitBtn) quitBtn.onclick=()=> confirmQuit();
    $('[data-act="clear"]').onclick=()=>{ sel.picks=[]; resetPending(); drawSelection(); };
    $('[data-act="lock"]').onclick=()=>{ if(!sel.pendingHi){
      // finalize discard-on-play costs: move reserved discards to their decks
      sel.picks.forEach(p=>{ if(p.discardHi){ const o=p.discardHi.owner; o.hand=o.hand.filter(x=>x!==p.discardHi); o.deck.discard.push(p.discardHi.card); } });
      UI.picks[sideIdx]=sel.picks; nextStep();
    } };
    // auto-lock hook (used only by the multiplayer turn timer): drop any half-made
    // target choice, then lock in whatever is currently staged.
    UI._lockNow = ()=>{ resetPending(); const lb=$('[data-act="lock"]'); if(lb) lb.click(); };
    const tutBtn=$('[data-act="tut"]'); if(tutBtn) tutBtn.onclick=()=>{ UI.tutOpen=!UI.tutOpen; drawSelection(); };
    $$('[data-acc]').forEach(b=> b.onclick=()=>{ const i=+b.dataset.acc; UI.tutSec[i]=!UI.tutSec[i]; drawSelection(); });
    applyArena('#battle', st);
    // Recon tutor: if a living fighter earned a pick this turn, offer it (UI only)
    if(!overlay){ const rf = side.fighters.find(f=>f.alive && f.turn.reconPick); if(rf) showReconPicker(rf); }

    function commitPick(p){ if(!p) return; sel.picks.push({handItem:p.handItem,card:p.card,owner:p.owner,caster:p.caster,target:p.target,discardHi:p.discardHi||null}); aud('CARD_STAGE'); resetPending(); drawSelection(); }
    function resetPending(){ sel.pendingHi=null; sel.stage=null; }
    function doDiscard(hi){
      if(sel.discardUsed) return;
      // remove from any queued pick, from owner's hand, to discard pile, then
      // immediately redraw one card from that same deck to replace it.
      sel.picks = sel.picks.filter(p=>p.handItem!==hi);
      const owner=hi.owner; owner.hand = owner.hand.filter(x=>x!==hi); owner.deck.discard.push(hi.card);
      drawOneInto(owner, UI.state.rng);
      aud('CARD_REMOVE');
      sel.discardUsed=true; resetPending(); drawSelection();
    }
  }

  /* ---------------- shared battle-frame rendering ---------------- */
  // Battle frame, top→bottom: top bar · [left | enemy+staging | right] · hand (full width) · your team (full width)
  function frameHTML({top, left, center, right, hand, you}){
    return `<div id="battle">
      <div class="bf-top">${top||''}</div>
      <div class="bf-left">${left||''}</div>
      <div class="bf-center">${center||''}</div>
      <div class="bf-right">${right||''}</div>
      <div class="bf-hand">${hand||''}</div>
      <div class="bf-you">${you||''}</div>
    </div>`;
  }
  // enemy team + staging/lock-in (row 2 center); deck viewer overlays the screen
  function enemyZoneHTML(sideIdx, st, fopt){
    const enemy = GF.enemyOf(st, sideIdx);
    const enemyLabel = (MP.inMatch && MP.opponentName) ? esc(MP.opponentName) : 'Enemy';
    return `
      <div class="arena-side enemy-side"><div class="label">${enemyLabel} · ${GF.sumHp(enemy)} HP</div>
        <div class="pair">${enemy.fighters.map(f=> cfighterHTML(f, Object.assign({enemy:true}, fopt.enemy?fopt.enemy(f):{}))).join('')}</div></div>

  // your team (full-width bottom row)
  function yourZoneHTML(sideIdx, st, fopt){
    const you = st.sides[sideIdx];
    return `<div class="arena-side your-side"><div class="label">Your team · ${GF.sumHp(you)} HP</div>
        <div class="pair">${you.fighters.map(f=> cfighterHTML(f, fopt.you?fopt.you(f):{})).join('')}</div></div>`;
  }
  // two player decks (draw piles) for the right rail, under Lock in / Undo.
  function deckRailHTML(side){
    return `<div class="deck-rail">${side.fighters.map(f=>deckHTML(f)).join('')}</div>`;
  }
  // a card staged in the arena middle (clicked, waiting to play); tap to unqueue.
  function stagedCardHTML(p, i){
    const c=p.card, cost=GF.energyCost(c);
    const tgt = (p.target && p.target!==p.owner)
      ? (c.aim==='enemy' ? '→ '+dn(p.target.className) : '('+dn(p.target.className)+')') : '';
    return `<div class="staged" data-pick="${i}" style="--cls:${classColor(c.cls)}" title="Tap to remove ${esc(c.name)}">
      <span class="staged-cost cost t${c.speed}">⚡${cost}</span>
      <span class="tsym-wrap">${typeSymHTML(c)}</span>
      <span class="staged-name">${esc(c.name)}</span>
      ${tgt?`<span class="staged-tgt">${esc(tgt)}</span>`:''}
      ${p.discardHi?`<span class="staged-tgt">⤵ ${esc(p.discardHi.card.name)}</span>`:''}
      <span class="staged-x">✕</span>
    </div>`;
  }
  // Recon tutor picker: choose one card from the fighter's draw pile into hand.
  function showReconPicker(f){
    if(!f.deck.draw.length && f.deck.discard.length){ f.deck.draw = UI.state.rng.shuffle(f.deck.discard.slice()); f.deck.discard=[]; }
    const cards = f.deck.draw.slice().sort((a,b)=>(a.speed-b.speed)||a.name.localeCompare(b.name));
    const node = showOverlay(`<div id="cover" class="reconpick">
        <div class="muted">Recon · ${esc(dn(f.className))}</div>
        <h1 style="font-size:26px;margin:0">Pick a card into your hand</h1>
        <div class="dv-grid reconpick-grid">
          ${cards.length ? cards.map((c,i)=>`<div class="dv-card" data-rp="${i}" style="--cls:${classColor(c.cls)}" title="${esc(c.text)}">
              <span class="dv-cost cost t${c.speed}">⚡${GF.energyCost(c)}</span>
              <span class="tsym-wrap">${typeSymHTML(c)}</span>
              <span class="dv-name">${esc(c.name)}</span>
            </div>`).join('') : '<div class="dv-hint">Deck empty — nothing to pick.</div>'}
        </div>
        <button data-act="rpskip">${cards.length?'Skip — take nothing':'Continue'}</button>
      </div>`);
    const finish=()=>{ f.turn.reconPick=false; clearOverlay(); drawSelection(); };
    node.querySelectorAll('[data-rp]').forEach(el=> el.onclick=()=>{
      const c=cards[+el.dataset.rp]; const di=f.deck.draw.indexOf(c); if(di>=0) f.deck.draw.splice(di,1);
      f.hand.push({card:c, owner:f}); finish();
    });
    node.querySelector('[data-act="rpskip"]').onclick=finish;
  }
  // top bar shared by selection + resolution: quit (left), round (center), hint.
  function topBarHTML(st, hint){
    const timerHTML = (MP.inMatch && typeof MP.timer==='number')
      ? `<span class="mp-timer" id="mpTimer">${mpFmtTime(MP.timeLeft)}</span>` : '';
    return `<button class="quit-btn" data-act="quit" title="Quit to main menu">⮜ Menu</button>
      <span class="round-pill">Round ${st.round} of 5</span>${timerHTML}
      <span class="top-hint">${hint||''}</span>`;
  }
  // confirm dialog before abandoning a match.
  function confirmQuit(){
    const node=showOverlay(`<div id="cover" class="confirmbox">
        <h1>Quit to menu?</h1>
        <p class="muted">This match will be lost.</p>
        <div class="row">
          <button data-act="cancel">Cancel</button>
          <button class="primary" data-act="quityes">Quit to menu</button>
        </div>
      </div>`);
    node.querySelector('[data-act="cancel"]').onclick=()=> clearOverlay();
    node.querySelector('[data-act="quityes"]').onclick=()=>{ clearOverlay(); showStart(); };
  }
  // One player class deck (draw pile), flanking the portraits on the outside.
  // Card-back art per class; missing file → solid class-color back. Shows the
  // number of cards left to draw; greyed when that fighter is down.
  function deckHTML(f){
    if(!f) return '';
    const n = (f.deck && f.deck.draw ? f.deck.draw.length : 0);
    const disc = (f.deck && f.deck.discard ? f.deck.discard.length : 0);
    const tip = `${dn(f.className)} deck — ${n} card${n===1?'':'s'} left to draw${disc?` (+${disc} in discard)`:''}`;
    return `<div class="deck ${f.alive?'':'deckdead'}" data-deckview="${f.uid}" title="${esc(tip)} — click to view" style="--cls:${classColor(f.className)}">
      <div class="deck-back"><img src="${cardBackFor(f.className)}" alt="" onerror="this.style.display='none'"><span class="deck-ph">${esc(dn(f.className))}</span></div>
      <div class="deck-count">${f.alive ? n+' left' : '—'}</div>
    </div>`;
  }
  // expanded deck viewer (centered modal): header · scrollable pill list · divider ·
  // full-width preview below. Hover (or tap on touch) a pill to preview the full card.
  // `cards` are the sorted draw-pile cards. Backdrop click / X closes.
  function deckViewerHTML(f, cards){
    const touch = ('ontouchstart' in window);
    return `<div class="dv-backdrop" data-act="dvbackdrop"><div class="deck-viewer" role="dialog" aria-modal="true">
      <div class="dv-head"><span>${esc(dn(f.className))} deck · ${cards.length} card${cards.length===1?'':'s'} left to draw</span>
        <button class="dv-close" data-act="dvclose" title="Close">✕</button></div>
      <div class="dv-grid">
        ${cards.map((c,i)=>`<div class="dv-card" data-dvi="${i}" style="--cls:${classColor(c.cls)}">
          <span class="dv-cost cost t${c.speed}">⚡${GF.energyCost(c)}</span>
          <span class="tsym-wrap">${typeSymHTML(c)}</span>
          <span class="dv-name">${esc(c.name)}</span>
        </div>`).join('')}
      </div>
      <div class="dv-divider"></div>
      <div class="dv-preview" id="dvPreview"><div class="dv-hint">${touch?'Tap':'Hover'} a card to preview</div></div>
    </div></div>`;
  }
  // Full-card preview shown below the deck-viewer list. Separate from the hand-rail
  // hover preview (showCardPreview/showHandPreview) — these two systems don't interfere.
  function dvPreviewHTML(c){
    const cost=GF.energyCost(c);
    return `<div class="dv-prev-card" style="--cls:${classColor(c.cls)}">
      <div class="dv-prev-head">
        <div class="dv-prev-name">${esc(c.name)}</div>
        <div class="dv-prev-badges"><span class="cost t${c.speed}" title="costs ${cost} energy (T${c.speed})">⚡${cost}</span><span class="tsym-wrap">${typeSymHTML(c)}</span><span class="spd t${c.speed}">T${c.speed}</span> <span>${esc(c.type)}${c.once?' · once':''}</span></div>
      </div>
      <div class="cardart dv-prev-art sym-${typeKey(c.type)}" style="--ct:${typeColor(c.type)}">
        <img class="cardart-img" src="${typeArtFor(c.type)}" alt="" onerror="this.style.display='none'">
        <span class="artph">${esc(c.type)}</span>
      </div>
      <div class="dv-prev-text">${esc(c.text)}</div>
      ${c.flavor?`<div class="dv-prev-flavor">${esc(c.flavor)}</div>`:''}
    </div>`;
  }
  function cfighterHTML(f, o){
    o=o||{};
    const hp = (o.hp!=null ? o.hp : f.hp);
    const pct = f.alive ? Math.max(0, hp/f.maxHp*100) : 0;
    const tgtClass = o.clickable ? ('targetable '+(o.targetKind==='ally'?'target-ally':'target-enemy')) : '';
    return `<div class="cfighter ${f.alive?'':'dead'} ${tgtClass} ${o.selected?'seltarget':''}"
        data-uid="${f.uid}" style="--cls:${classColor(f.className)}">
      <div class="floatlayer" data-float="${f.uid}"></div>
      <div class="cport ${o.enemy?'enemyart':''}">
        <img src="${portraitFor(f)}" alt="" onerror="this.style.display='none'"><span class="ph">${esc(dn(f.className))}</span>
      </div>
      <div class="cmeta">
        <div class="cname"><span>${esc(dn(f.className))}</span>${f.alive?'':'<span class="muted">down</span>'}</div>
        <div class="chpwrap"><div class="chpbar"><div class="chpfill" data-hp="${f.uid}" data-max="${f.maxHp}" style="width:${pct}%"></div></div>
          <span class="chpnum" data-hpnum="${f.uid}">${f.alive?hp:0}/${f.maxHp}</span></div>
        <div class="ctags" data-tags="${f.uid}">${tagsHTML(GF.fighterStatus(f))}</div>
      </div>
    </div>`;
  }
  function tagsHTML(status){ return (status||[]).map(s=>`<span class="ctag ${s.cls}">${esc(s.label)}</span>`).join(''); }
  const sleep = (ms)=> new Promise(r=> setTimeout(r, ms));
  function floatOn(uid, text, cls){
    const layer=$(`[data-float="${uid}"]`); if(!layer) return;
    const s=document.createElement('span'); s.className='floatnum '+cls; s.textContent=text;
    layer.appendChild(s); setTimeout(()=>s.remove(),1100);
  }
  function updateFighter(uid, hp, delta, status, absorbed, negated){
    const fill=$(`[data-hp="${uid}"]`), num=$(`[data-hpnum="${uid}"]`), tags=$(`[data-tags="${uid}"]`);
    const card=$(`.cfighter[data-uid="${uid}"]`);
    const max = fill ? (+fill.dataset.max||20) : 20;
    if(fill) fill.style.width = Math.max(0,Math.min(100, hp/max*100))+'%';
    if(num) num.textContent = Math.max(0,hp)+'/'+max;
    if(tags) tags.innerHTML = tagsHTML(status);
    if(card && hp<=0) card.classList.add('dead');
    if(delta<0){ floatOn(uid, ''+delta, 'dmg'); if(card){ card.classList.add('hit'); setTimeout(()=>card.classList.remove('hit'),320); } }
    else if(delta>0){ floatOn(uid, '+'+delta, 'heal'); }
    if(absorbed>0){
      // show the block — especially important when the hit was fully negated (delta 0)
      floatOn(uid, (delta>=0 ? '🛡 blocked '+absorbed : '🛡 '+absorbed), 'block');
      if(card){ card.classList.add('blockflash'); setTimeout(()=>card.classList.remove('blockflash'),360); }
    } else if(negated && delta>=0){
      // an attack landed but defenses reduced it to nothing
      floatOn(uid, 'negated', 'block');
      if(card){ card.classList.add('blockflash'); setTimeout(()=>card.classList.remove('blockflash'),360); }
    }
  }
  /* ---- art wiring (graceful fallback to colored placeholders) ---- */
  const CLASS_COLOR = { Soldier:'#c9a24a', Arcanist:'#9a6cff', Scout:'#46b3c9', Drifter:'#d08a4a', Cleric:'#e6dca0', Warden:'#5fae7e' };
  const CLASS_THEME = { Soldier:'wasteland', Arcanist:'shrine', Scout:'wasteland', Drifter:'western', Cleric:'shrine', Warden:'cyberpunk' };
  const BG_DIR = 'artassets/Backgrounds/';

  // background filename for that zone's battlefield; `entry` is the lore report.
  // Missing files degrade gracefully (the arena keeps its gradient / falls back).
  const WARP_ZONES = {
    Soldier:  { bg:'gf_bg_cyberpunk_v1.jpg', entry:"The breach here opened inside a collapsed weapons foundry still running on automated war protocols. Elemental cores fused to the structural metal are destabilizing the local fold. Breachblade holds primary assignment — the only operative who knows how the Junction systems work from the inside." },

    Scout:    { bg:'gf_bg_wasteland_v1.jpg', entry:"A dead expanse of irradiated flats where nothing moves that does not want to be seen. The breach here is quiet and wide — the most dangerous kind. Wraith holds primary assignment, and prefers to work it alone." },
    Drifter:  { bg:'gf_bg_western_v1.png',   entry:"A sun-bleached frontier system on the edge of total stellar collapse. Breach points here open and close unpredictably, demanding long-range threat response before RIFT extraction teams can get close. Longshot holds primary assignment, and does not call for backup." },
    Cleric:   { bg:'gf_bg_shrine_v1.jpg',    entry:"What was once a sanctuary world is now a breach hotspot drawing threats from six adjacent dimensions at once. Beacon holds primary assignment, and has run sustained support operations here longer than any operative has held a single zone." },
    Warden:   { bg:'gf_bg_aegis_v1.png',     entry:"An orbital station in permanent siege condition, now also a breach magnet for dimensional threats drawn to concentrated structural resistance. Aegis holds primary assignment. The station has not fallen. It will not." },
  };
  function zoneBgPath(cls){ return BG_DIR + (WARP_ZONES[cls] ? WARP_ZONES[cls].bg : ''); }
  function classColor(cls){ return CLASS_COLOR[cls] || '#d8a657'; }
  function portraitFor(f){
    // class portrait; <img onerror> hides a missing file so the placeholder shows.
    // (enemy-specific art keyed by class would slot in here once it exists.)
    return 'artassets/characterportraits/gf_' + f.className.toLowerCase() + '_portrait_v1.jpg';
  }
  // Per-class deck card-back (used for the on-board draw piles). Path derived from
  // the artassets/cardbacks/ naming convention; <img onerror> reveals a color back.
  function cardBackFor(cls){ return 'artassets/cardbacks/gf_card_back_' + String(cls).toLowerCase() + '.png'; }
  // Per-type card illustration from artassets/skillportraits/. Types without a file
  // (e.g. Equip) fall back to the type-color background behind the <img>.
  const TYPE_COLOR = { attack:'var(--bad)', defend:'var(--t1)', buff:'var(--good)', spell:'var(--pierce)', potion:'var(--t2)', equip:'var(--accent)', signature:'#f2c14e' };
  function typeColor(type){ return TYPE_COLOR[typeKey(type)] || 'var(--accent)'; }
  function typeArtFor(type){ return 'artassets/skillportraits/gf_card_' + typeKey(type) + '.png'; }
  // try a list of image URLs in order; call onLoad(url) for the first that loads.
  function loadFirst(urls, onLoad){
    let i=0;
    (function next(){ if(i>=urls.length) return; const u=urls[i++]; const img=new Image();
      img.onload=()=>onLoad(u); img.onerror=next; img.src=u; })();
  }
  // best available battle-arena background; if none load, keep the gradient.
  function applyArena(elSelector, st){
    const el = $(elSelector); if(!el) return;
    const urls = [];
    if(UI.mapBg) urls.push(UI.mapBg);              // selected Warp Zone background (random by default)
    // graceful fallbacks: themes drawn from the fighters' classes, then the rest
    const themes = [];
    for(const side of st.sides) for(const f of side.fighters){ const t=CLASS_THEME[f.className]; if(t && !themes.includes(t)) themes.push(t); }
    ['shrine','cyberpunk','wasteland','western'].forEach(t=>{ if(!themes.includes(t)) themes.push(t); });
    themes.forEach(t=>{ urls.push(BG_DIR+'gf_bg_'+t+'_v1.jpg', BG_DIR+'gf_bg_'+t+'_v1.png'); });
    // first that loads wins; if none load, the arena keeps its gradient
    loadFirst(urls, (u)=>{ el.style.setProperty('--arena', `url("${u}")`); el.classList.add('hasbg'); });
  }
  // main-menu key-art: try a dedicated menu bg, fall back to a battle bg.
  function applyMenuBg(){
    const el=$('#menu'); if(!el) return;
    loadFirst(['artassets/Backgrounds/gf_menu_bg.png','artassets/gf_menu_bg_v1.jpg','artassets/gf_menu_bg_v1.png','artassets/Backgrounds/gf_menu_bg_v1.jpg',
               'artassets/Backgrounds/gf_bg_shrine_v1.jpg','artassets/Backgrounds/gf_bg_cyberpunk_v1.jpg'],
      (u)=>{ el.style.setProperty('--menubg', `url("${u}")`); el.classList.add('hasbg'); });

  // Fullscreen muted fight cinematic, played at match start. Cut off after 2s,
  // then renders the battle underneath and fades the overlay out (fade into battle).
  // On error/blocked-autoplay/missing file it skips straight through. Skippable.
  // Never leaves a broken <video> behind.
  function playIntro(onDone){
    let done=false;
    const finish=()=>{
      if(done) return; done=true;
      onDone && onDone();                         // render the battle underneath the overlay
      ov.classList.add('fade-out');               // CSS opacity transition → fades into battle
      setTimeout(()=>{ try{ ov.remove(); }catch(e){} }, 520);
    };
    const ov=document.createElement('div'); ov.className='intro-overlay';
    const v=document.createElement('video'); v.className='intro-video';
    v.muted=true; v.setAttribute('muted',''); v.playsInline=true; v.setAttribute('playsinline','');
    v.src='artassets/animations/gf_menu_intro.mp4';
    v.onerror=finish;   // missing/broken source → skip into battle
    const skip=document.createElement('button'); skip.className='intro-skip'; skip.textContent='Skip ▶';
    skip.onclick=finish;
    ov.appendChild(v); ov.appendChild(skip);
    document.body.appendChild(ov);
    const p=v.play();
    if(p && p.catch) p.catch(()=>finish());       // autoplay blocked or can't play → skip
    setTimeout(finish, 2000);                      // cut the cinematic off after 2s
  }

  /* ---------------- resolution + animated reveal ---------------- */
  function resolveAndShow(){
    const st = UI.state;
    GF.resolveTurn(st, UI.picks[0], UI.picks[1]);
    showLog();
  }
  async function showLog(){
    hideCardPreview();
    const st = UI.state, sideIdx = UI.viewSide||0;   // joiner views side 1 as "their" team in MP
    const pre = st._preHp || {};   // pre-resolution HP, for the bar start positions
    render(frameHTML({
      top: topBarHTML(st, 'Resolving — cards fire by speed tier T1 → T4'),
      left: `<div class="sidepanel"><h3>Resolving…</h3>
          <p class="tip">Cards fire in speed-tier order: <b>T1 → T2 → T3 → T4</b>. A card whose fighter was already defeated is cancelled.</p></div>`,
      center: enemyZoneHTML(sideIdx, st, {
        enemy:(f)=>({enemy:true, hp: pre[f.uid]!=null?pre[f.uid]:f.hp})
      }),
      hand: `<div class="arena-slot"><div class="dockwrap"><div class="dock-log" id="docklog"></div></div></div>`,
      you: yourZoneHTML(sideIdx, st, { you:(f)=>({hp: pre[f.uid]!=null?pre[f.uid]:f.hp}) }),
      right: `<div class="sidepanel"><button class="ctrlbtn" data-act="skip">Skip ▶▶</button></div>
        <div class="sidepanel" id="contbox" style="flex:1;display:none"></div>`
    }));
    applyArena('#battle', st);
    const qb=$('[data-act="quit"]'); if(qb) qb.onclick=()=> confirmQuit();

    // reset bars to pre-HP visually (cfighterHTML already rendered them at pre)
    const tl = st.timeline || [];
    let skipped=false, shown=0;
    const skipBtn=$('[data-act="skip"]'); if(skipBtn) skipBtn.onclick=()=>{ skipped=true; };
    const logEl = $('#docklog');
    const TIER_NAMES = {1:'Tier 1 · Instant', 2:'Tier 2 · Fast', 3:'Tier 3 · Normal', 4:'Tier 4 · Heavy'};
    const banner = document.createElement('div'); banner.className='tier-banner';
    const arenaEl = $('#battle'); if(arenaEl) arenaEl.appendChild(banner);
    function showBanner(tierNum){
      banner.textContent = TIER_NAMES[tierNum] || ('Tier '+tierNum);
      banner.classList.remove('show'); void banner.offsetWidth; banner.classList.add('show');
    }

    function renderTier(i){
      const tier = tl[i];
      for(const e of tier.lines){
        if(e.cls==='tier'){ const h=document.createElement('div'); h.className='tierhead'; h.textContent=e.text; logEl.appendChild(h); continue; }
        const row=document.createElement('div'); row.className='logrow';
        const port = e.actorClass
          ? `<div class="lportrait" style="--cls:${classColor(e.actorClass)}"><img src="${portraitFor({className:e.actorClass})}" onerror="this.style.display='none'"></div>`
          : `<div class="lportrait" style="background:transparent;border:0"></div>`;
        row.innerHTML = `${port}<div class="ltext ${e.cls}">${esc(dnText(e.text.trim()))}</div>`;
        logEl.appendChild(row);
      }
      logEl.scrollTop = logEl.scrollHeight;
      shown = i+1;
    }
    function applyTierState(i){
      const tier=tl[i]; const abs=tier.absorbed||{}, neg=tier.negated||{};
      for(const uid in tier.hp) updateFighter(uid, tier.hp[uid], tier.deltas[uid], tier.status[uid], abs[uid]||0, !!neg[uid]);
    }

    for(let i=0;i<tl.length;i++){
      if(skipped) break;
      showBanner(tl[i].tier);
      await sleep(300);                 // beat so you see the tier announce before it resolves
      if(skipped) break;
      renderTier(i); applyTierState(i);
      // audio cues for this tier: block soak, damage thud, KO sweep
      try{
        const tier=tl[i]; let anyHit=false, anyBlock=false;
        for(const uid in (tier.deltas||{})){ if(tier.deltas[uid]<0) anyHit=true; }
        for(const uid in (tier.absorbed||{})){ if((tier.absorbed[uid]||0)>0) anyBlock=true; }
        if(anyBlock) aud('BLOCK');
        if(anyHit) aud('HIT');
        if(tier.lines.some(e=> e.cls==='death')) setTimeout(()=>aud('OPERATIVE_KO'), 140);
      }catch(e){}
      // linger a touch longer when someone died this tier
      const lethal = tl[i].lines.some(e=> e.cls==='death');
      await sleep(lethal ? 900 : 620);
    }
    // finalize (covers Skip): flush remaining log lines, then snap fighters to
    // final state without a pile of floaters.
    for(let i=shown;i<tl.length;i++){ renderTier(i); }
    for(const s of st.sides) for(const f of s.fighters){
      updateFighter(f.uid, f.hp, 0, GF.fighterStatus(f), 0);
    }
    banner.classList.remove('show');
    if(skipBtn) skipBtn.style.display='none';
    // continue prompt, centered in the middle of the battlefield
    const contHTML = `<div class="cont-center">
        <div class="tip" style="margin-bottom:8px">${esc(st.sides[0].name)} ${GF.sumHp(st.sides[0])} HP · ${esc(st.sides[1].name)} ${GF.sumHp(st.sides[1])} HP</div>
        <button class="primary ctrlbtn cont-btn" data-act="cont">${st.over?'See result':'Next round →'}</button>
      </div>`;
    const handArea=$('.bf-hand');                       // full-width middle row → screen-centered
    if(handArea){ handArea.insertAdjacentHTML('beforeend', contHTML); }
    else { const cb=$('#contbox'); if(cb){ cb.style.display=''; cb.innerHTML=contHTML; } }
    const contBtn=$('[data-act="cont"]'); if(contBtn) contBtn.onclick = ()=>{
      if(MP.inMatch){
        if(st.over){ showEnd(); }
        else if(MP.isHost){ st.round++; mpHostRound(); }
        else { mpShowWaiting('Waiting for host to continue…'); }   // joiner advances on the next state-sync
        return;
      }
      if(st.over) showEnd(); else { st.round++; runRound(); }
    };
  }

  /* ---------------- end screen ---------------- */
  function showEnd(){
    if(escRun){ escEnd(); return; }   // Escalation runs route through their own flow
    if(MP.inMatch){ mpStopTimer(); }  // online match over — stop the turn clock
    const st = UI.state, r = st.result;

          <button class="${MP.inMatch?'primary':''}" data-act="menu">Main Menu</button>
        </div>
      </div>`);
    const rm=node.querySelector('[data-act="rematch"]'); if(rm) rm.onclick=()=>{ clearOverlay(); rematch(); };

  /* ---------------- audio wiring (RiftAudio; all guarded, never throws) ---------------- */
  function aud(name){ try{ if(window.RiftAudio) window.RiftAudio.sfx(name); }catch(e){} }
  function music(name){ try{ if(window.RiftAudio) window.RiftAudio.playMusic(name); }catch(e){} }
  (function wireAudio(){
    try{
      // hover blip on buttons (mouse only, so taps don't double with the select blip)
      let lastHover=null;
      document.addEventListener('pointerover', function(e){
        if(e.pointerType && e.pointerType!=='mouse') return;
        const b=e.target.closest && e.target.closest('button'); if(!b) return;
        if(b!==lastHover){ lastHover=b; aud('MENU_HOVER'); }
      });
      // select / lock blip on button clicks (capture so it fires before a re-render detaches the button)
      document.addEventListener('click', function(e){
        const b=e.target.closest && e.target.closest('button'); if(!b) return;
        if(b.id==='audioToggle' || (b.closest && b.closest('#audioPop'))) return;   // audio controls have their own feedback
        if(b.getAttribute('data-act')==='lock'){ aud('LOCK_IN'); return; }
        aud('MENU_SELECT');
      }, true);
      // audio control: speaker button (top-right) → opens a mini volume popout
      const RA=()=> window.RiftAudio;
      const ab=document.createElement('button'); ab.id='audioToggle'; ab.className='audio-toggle'; ab.type='button'; ab.title='Sound';
      const pop=document.createElement('div'); pop.id='audioPop'; pop.className='audio-pop hidden';
      pop.innerHTML =
        '<div class="ap-h">Audio</div>'+
        '<label class="ap-row"><span>Music</span><input type="range" min="0" max="1" step="0.05" id="apMusic"></label>'+
        '<label class="ap-row"><span>Effects</span><input type="range" min="0" max="1" step="0.05" id="apSfx"></label>'+
        '<button class="ap-mute" id="apMute" type="button"></button>';
      document.body.appendChild(ab); document.body.appendChild(pop);
      const apMusic=pop.querySelector('#apMusic'), apSfx=pop.querySelector('#apSfx'), apMute=pop.querySelector('#apMute');
      const syncIcon=()=>{ try{ ab.textContent=(RA()&&RA().isMuted())?'🔇':'🔊'; }catch(e){} };
      const syncPop=()=>{ try{ const m=RA(); if(!m) return; apMusic.value=m.getMusicVolume(); apSfx.value=m.getSfxVolume(); apMute.textContent=m.isMuted()?'Unmute':'Mute'; apMute.classList.toggle('on', m.isMuted()); }catch(e){} };
      ab.onclick=(e)=>{ e.stopPropagation(); pop.classList.toggle('hidden'); if(!pop.classList.contains('hidden')) syncPop(); };
      pop.addEventListener('click', e=> e.stopPropagation());
      apMusic.oninput=function(){ try{ RA().setMusicVolume(parseFloat(this.value)); }catch(e){} };
      apSfx.oninput=function(){ try{ RA().setSfxVolume(parseFloat(this.value)); }catch(e){} };
      apSfx.onchange=function(){ aud('MENU_SELECT'); };   // hear the effects level when you let go
      apMute.onclick=function(){ try{ RA().toggleMute(); }catch(e){} syncIcon(); syncPop(); };
      document.addEventListener('click', ()=>{ if(!pop.classList.contains('hidden')) pop.classList.add('hidden'); });
      syncIcon();
    }catch(e){}
  })();

  /* =====================================================================
     ONLINE MULTIPLAYER  (all additive; every function is a no-op when
     MP.socket is null, so Hotseat / Escalations / standard play are never
     affected). Host is authority: it runs the engine and broadcasts
     authoritative state snapshots; the joiner renders snapshots and sends
     back its pick intentions (it never resolves a turn locally).
     ===================================================================== */

  /* ---- username (stored in rift_player.displayName via loadPlayer/savePlayer) ---- */
  function mpGetUsername(){ try{ return (loadPlayer().displayName||'').trim(); }catch(e){ return ''; } }
  function mpSetUsername(name){ try{ const p=loadPlayer(); p.displayName=String(name||'').slice(0,20); savePlayer(p); }catch(e){} }
  function mpPromptUsername(onDone){
    const node=showOverlay(`<div class="mp-modal"><div class="mp-card">
        <h2>Operative callsign</h2>
        <p class="muted" style="font-size:13px;margin:0">Choose your operative callsign — other operatives will see this.</p>
        <input id="mpName" type="text" maxlength="20" placeholder="Enter username" autocomplete="off">
        <button class="primary" data-act="setname">Set Callsign</button>
      </div></div>`);
    const inp=node.querySelector('#mpName'), btn=node.querySelector('[data-act="setname"]');
    setTimeout(()=>{ try{ inp.focus(); }catch(e){} }, 30);
    const submit=()=>{ const v=(inp.value||'').trim().slice(0,20); if(!v){ try{inp.focus();}catch(e){} return; } mpSetUsername(v); clearOverlay(); onDone(v); };
    btn.onclick=submit; inp.onkeydown=(e)=>{ if(e.key==='Enter') submit(); };
  }
  function mpEnterFlow(){
    const u=mpGetUsername();
    if(u){ MP.username=u; showMultiplayer(); }
    else mpPromptUsername((name)=>{ MP.username=name; showMultiplayer(); });
  }

  /* ---- socket lifecycle (connects only when entering the MP flow) ---- */
  function mpConnect(onReady, onFail){
    if(MP.socket && MP.socket.connected){ onReady && onReady(); return; }
    if(typeof io==='undefined'){ onFail && onFail(); return; }
    let settled=false, s;
    try{ s=io(RIFT_SERVER_URL, {transports:['websocket','polling'], reconnection:false, timeout:8000}); }
    catch(e){ onFail && onFail(); return; }
    MP.socket=s; mpWireSocket(s);
    s.on('connect', ()=>{ if(settled) return; settled=true;
      if(MP.recording){ try{ s.emit('log-record', {enabled:true}); }catch(e){} }
      mpLog('net','connected'); onReady && onReady(); });
    s.on('connect_error', ()=>{ if(settled) return; settled=true; onFail && onFail(); });
    setTimeout(()=>{ if(!settled && !(s && s.connected)){ settled=true; onFail && onFail(); } }, 9000);
  }
  function mpConnectFailed(){ mpLeave(); mpModalNotice('Could not connect to RIFT server. Check your connection.', ()=> showStart()); }
  function mpLeave(){
    mpStopTimer();
    if(MP.socket){ try{ MP.socket.removeAllListeners(); MP.socket.disconnect(); }catch(e){} }
    MP.socket=null; MP.role=null; MP.code=null; MP.screen=null; MP.host=null; MP.joiner=null;
    MP.mapKey=null; MP.timer=null; MP.hostReady=false; MP.joinerReady=false; MP.myTeam=[];
    MP.inMatch=false; MP.opponentName=null; MP.isHost=false;
    MP.chat=[]; MP.unread=0; MP.chatOpen=false; MP.pendingJoinerPicks=null; MP.hostLockedWaiting=false;
    MP.timedOut=false; MP._introPlaying=false; MP._bufSnap=null; MP.deadline=0;
    // MP.recording is a sticky per-session preference — intentionally not reset here.
    UI.viewSide=0; mpRemoveChatFab();
  }
  function mpEmit(action){ if(MP.socket){ try{ MP.socket.emit('game-action', {action}); }catch(e){} } }
  // opt-in session logging: when recording, mirror a line to the server (→ logs/ file) and the console.
  function mpLog(tag, msg, data){
    if(!MP.recording) return;
    try{ if(MP.socket) MP.socket.emit('mp-log', { ts:Date.now(), role:MP.role||'?', name:MP.username||'?', tag:tag||'', msg:String(msg==null?'':msg), data: data===undefined?null:data }); }catch(e){}
    try{ console.log('[MP]', tag, msg, data===undefined?'':data); }catch(e){}
  }
  function mpEmitSelection(){
    if(!MP.socket) return;
    if(MP.role==='host') MP.socket.emit('update-selection', {team:MP.myTeam.slice(), mapKey:MP.mapKey||null, timer:MP.timer});
    else MP.socket.emit('update-selection', {team:MP.myTeam.slice()});
  }
  function mpWireSocket(s){
    s.on('room-created', (d)=>{ try{ MP.code=d.code; MP.role='host'; mpLog('room','created',{code:d.code}); showCreateRoom(); }catch(e){} });
    s.on('player-joined', (d)=>{ try{ mpLog('room','player-joined',d); mpToast(((d&&d.username)||'Operative')+' has joined.'); }catch(e){} });
    s.on('lobby-update', (d)=>{ try{ mpApplyLobby(d); }catch(e){} });
    s.on('join-error', (d)=>{ try{ mpLog('room','join-error',d); mpJoinError((d&&d.message)||'Could not join.'); }catch(e){} });
    s.on('match-started', (d)=>{ try{ mpOnMatchStarted(d); }catch(e){} });
    s.on('game-action', (d)=>{ try{ mpOnGameAction(d&&d.action); }catch(e){} });
    s.on('turn-timer', (d)=>{ try{ mpOnTurnTimer(d); }catch(e){} });
    s.on('turn-timeout', ()=>{ try{ mpOnTurnTimeout(); }catch(e){} });
    s.on('chat-message', (d)=>{ try{ mpOnChat(d); }catch(e){} });
    s.on('player-disconnected', (d)=>{ try{ mpLog('net','player-disconnected',d); mpStopTimer(); mpModalNotice((d&&d.message)||'Your opponent disconnected. Returning to menu.', ()=> showStart()); }catch(e){} });
    s.on('match-abandoned', (d)=>{ try{ mpLog('net','match-abandoned',d); mpStopTimer(); mpCountdownRedirect((d&&d.message)||'Your opponent has disconnected. Returning to menu.'); }catch(e){} });
  }
  function mpApplyLobby(d){
    if(!d) return;

  /* ---- chat ---- */

  /* ---- notices / toasts ---- */

  function mpModalNotice(msg, onOk, okLabel){

  function mpCountdownRedirect(msg){
    let n=3;
    const node=showOverlay(`<div class="mp-modal"><div class="mp-card"><h2>Match abandoned</h2><p style="font-size:14px">${esc(msg)}</p><div class="mp-countdown" id="mpCd">Returning in ${n}…</div></div></div>`);
    const t=setInterval(()=>{ n--; const el=node.querySelector('#mpCd');

  /* ---- match lifecycle (host authority) ---- */
  function mpOnMatchStarted(d){
    MP.inMatch=true; MP.screen='match'; MP.chatOpen=false; MP.unread=0;
    MP.timer=(d&&'timer' in d)?d.timer:MP.timer; MP.mapKey=(d&&d.mapKey)||MP.mapKey;
    MP.host=(d&&d.host)||MP.host; MP.joiner=(d&&d.joiner)||MP.joiner;
    MP.isHost=(MP.role==='host'); UI.viewSide=MP.isHost?0:1;
    MP.opponentName = MP.isHost ? (MP.joiner&&MP.joiner.username) : (MP.host&&MP.host.username);
    UI.mapKey=MP.mapKey; UI.mapBg = MP.mapKey ? zoneBgPath(MP.mapKey) : null;
    music('battle'); mpEnsureChatFab();
    mpLog('match','started',{mapKey:MP.mapKey, timer:MP.timer, isHost:MP.isHost, opponent:MP.opponentName});
    if(MP.isHost){
      const hostTeam=(MP.host&&MP.host.team&&MP.host.team.length===2)?MP.host.team:['Soldier','Arcanist'];
      const joinTeam=(MP.joiner&&MP.joiner.team&&MP.joiner.team.length===2)?MP.joiner.team:['Scout','Drifter'];
      const seed=(Math.floor(Math.random()*2147483647))|0;
      UI.state=GF.newMatch({ seed, sideA:{name:(MP.host&&MP.host.username)||'Host', classes:hostTeam, ai:null},
                                   sideB:{name:(MP.joiner&&MP.joiner.username)||'Joiner', classes:joinTeam, ai:null} });
      MP._introPlaying=true; playIntro(()=>{ MP._introPlaying=false; mpHostRound(); });
    } else {
      MP._introPlaying=true;
      playIntro(()=>{ MP._introPlaying=false;
        if(MP._bufSnap){ const b=MP._bufSnap; MP._bufSnap=null; mpApplyBuffered(b); }
        else mpShowWaiting('Breaching… waiting for host.'); });
    }
  }
  function mpApplyBuffered(b){ if(b.type==='state-sync') mpJoinerSelect(b.snap); else if(b.type==='turn-result') mpJoinerResult(b.snap); }

  function mpOnGameAction(action){
    if(!action || !MP.inMatch) return;
    if(action.type==='state-sync'){ if(MP._introPlaying){ MP._bufSnap={type:'state-sync', snap:action.snapshot}; return; } mpJoinerSelect(action.snapshot); }
    else if(action.type==='turn-result'){ if(MP._introPlaying){ MP._bufSnap={type:'turn-result', snap:action.snapshot}; return; } mpJoinerResult(action.snapshot); }
    else if(action.type==='joiner-turn'){ MP.pendingJoinerPicks=action.picks||[]; if(MP.isHost && MP.hostLockedWaiting) mpHostResolve(); }
    // (turn-timeout is now a dedicated server event, not a relayed game-action)
  }

  // HOST: start a round — advance engine, broadcast selection snapshot, pick side 0.
  function mpHostRound(){
    const st=UI.state; clearOverlay(); mpEnsureChatFab();
    GF.startOfTurn(st);
    if(st.over){ mpResolvedTimer(); mpEmit({type:'turn-result', snapshot:mpSerializeState(st,true)}); UI.viewSide=0; showLog(); return; }
    GF.drawHands(st);
    MP.pendingJoinerPicks=null; MP.hostLockedWaiting=false; MP.timedOut=false;
    mpLog('turn','host round '+st.round+' → state-sync');
    mpEmit({type:'state-sync', snapshot:mpSerializeState(st,false)});
    UI.viewSide=0; UI.picks=[[],[]];
    UI.steps=[ ()=>{ doSelection(0); mpBeginTurnTimer(); }, ()=> mpHostAfterLock() ];
    UI.stepIdx=0; nextStep();
  }
  function mpHostAfterLock(){ mpStopTimer();
    if(MP.pendingJoinerPicks!=null) mpHostResolve();
    else { MP.hostLockedWaiting=true; mpShowWaiting('Waiting for opponent to lock in…'); }
  }
  function mpHostResolve(){
    MP.hostLockedWaiting=false; mpStopTimer(); mpResolvedTimer(); clearOverlay();
    const st=UI.state;
    const jpicks=mpDeserializePicks(MP.pendingJoinerPicks, st); MP.pendingJoinerPicks=null;
    jpicks.forEach(p=>{ if(p.discardHi){ const o=p.discardHi.owner; o.hand=o.hand.filter(x=>x!==p.discardHi); o.deck.discard.push(p.discardHi.card); } });
    UI.picks[1]=jpicks;
    GF.resolveTurn(st, UI.picks[0]||[], UI.picks[1]||[]);
    mpLog('turn','host resolved round '+st.round, { over:st.over, hostHp:GF.sumHp(st.sides[0]), joinerHp:GF.sumHp(st.sides[1]) });
    mpEmit({type:'turn-result', snapshot:mpSerializeState(st,true)});
    UI.viewSide=0; showLog();
  }

  // JOINER: render the host's snapshot, pick side 1, send intentions back.
  function mpJoinerSelect(snap){ if(!MP.inMatch) return;
    mpStopTimer(); clearOverlay(); mpEnsureChatFab();
    UI.state=mpDeserializeState(snap); UI.viewSide=1; UI.picks=[[],[]];
    mpLog('turn','joiner got snapshot, round '+(snap&&snap.round));
    if(UI.state.over){ showLog(); return; }
    // timer display starts when the server's turn-timer event arrives; if it already
    // did (deadline set this round), reflect it now.
    UI.steps=[ ()=>{ doSelection(1); if(MP.deadline>Date.now()) mpStartTimerDisplay(); }, ()=> mpJoinerAfterLock() ];
    UI.stepIdx=0; nextStep();
  }
  function mpJoinerAfterLock(){ mpStopTimer(); mpLog('turn','joiner locked → joiner-turn'); mpEmit({type:'joiner-turn', picks:mpSerializePicks(UI.picks[1]||[])}); mpShowWaiting('Resolving — waiting for host…'); }
  function mpJoinerResult(snap){ if(!MP.inMatch) return;
    mpStopTimer(); clearOverlay(); mpEnsureChatFab();
    UI.state=mpDeserializeState(snap); UI.viewSide=1; showLog();
  }

  /* ---- turn timer (SERVER-authoritative) ----
     The server owns the clock (its timers never throttle), so a backgrounded host
     tab can't stall it. The host asks the server to start the round timer; the
     server broadcasts a `deadline` and fires `turn-timeout` itself. The local
     display is computed from wall-clock (deadline − now), so a throttled tab shows
     the correct time the instant it's refocused — no drift, no client-side ticking
     as the source of truth. */
  function mpFmtTime(s){ s=Math.max(0,s|0); const m=Math.floor(s/60), ss=s%60; return m+':'+(ss<10?'0':'')+ss; }
  function mpBeginTurnTimer(){ if(MP.isHost && MP.socket && typeof MP.timer==='number' && MP.timer>0){ try{ MP.socket.emit('turn-begin'); }catch(e){} } }
  function mpResolvedTimer(){ if(MP.isHost && MP.socket){ try{ MP.socket.emit('turn-resolved'); }catch(e){} } }
  function mpOnTurnTimer(d){ MP.deadline=(d&&d.deadline)||0; mpLog('timer','turn-timer', d); mpStartTimerDisplay(); }
  function mpStartTimerDisplay(){ mpStopTimer(); if(!MP.deadline) return; mpRenderTimer(); MP.timerHandle=setInterval(mpRenderTimer, 250); }
  function mpStopTimer(){ if(MP.timerHandle){ clearInterval(MP.timerHandle); MP.timerHandle=null; } }
  function mpRenderTimer(){ if(!MP.deadline){ return; } const left=Math.max(0, Math.ceil((MP.deadline-Date.now())/1000)); MP.timeLeft=left;
    const el=$('#mpTimer'); if(el){ el.textContent=mpFmtTime(left); el.classList.toggle('low', left<=10); } if(left<=0) mpStopTimer(); }
  function mpOnTurnTimeout(){ mpStopTimer(); MP.deadline=0; mpLog('timer','turn-timeout → auto-lock'); if(UI._lockNow) UI._lockNow(); }   // both sides auto-lock on the server's timeout

  /* ---- state (de)serialization: host-authoritative snapshots ----
     Cards are plain immutable data → JSON-safe as-is. Only Sets need conversion
     (pending.silence, turn.silencedTypes, turn.riposte.attackers). The joiner's
     rebuilt state is render/selection-only (it never resolves), so its rng is a
     no-op stub. */
  function mpSerTurn(t){ t=t||{};
    return { pools:(t.pools||[]).map(p=>({value:p.value,remaining:p.remaining,stopsPierce:!!p.stopsPierce})),
      absorbed:t.absorbed||0, hitThisTurn:!!t.hitThisTurn, reduce:t.reduce||0, incoming:t.incoming||0, outgoing:t.outgoing||0,
      attackBuff:t.attackBuff||0, attackBuffUsed:!!t.attackBuffUsed,
      riposte: t.riposte?{pool:t.riposte.pool,counter:t.riposte.counter,mode:t.riposte.mode,attackers:t.riposte.attackers?Array.from(t.riposte.attackers):[]}:null,
      bluff:t.bluff||null, tripmine:t.tripmine||null, invuln:!!t.invuln,
      redirectTo:t.redirectTo||null, coverFor:t.coverFor||null, tauntTo:t.tauntTo||null,
      silencedTypes:t.silencedTypes?Array.from(t.silencedTypes):null, buffedNoSecondAttack:!!t.buffedNoSecondAttack,
      reconPick:!!t.reconPick, junction:t.junction||null, energyPenalty:t.energyPenalty||0 };
  }
  function mpSerFighter(f){ const pd=f.pending||{};
    return { uid:f.uid, name:f.name, className:f.className, hp:f.hp, maxHp:f.maxHp, alive:f.alive,
      deck:{ draw:(f.deck.draw||[]).slice(), discard:(f.deck.discard||[]).slice(), potionUsed:!!f.deck.potionUsed, signatureUsed:!!f.deck.signatureUsed, bonusDraw:f.deck.bonusDraw||0 },
      hand:(f.hand||[]).map(hi=>hi.card),
      equipReduce:f.equipReduce||0, hasReduceEquip:!!f.hasReduceEquip, sidearm:!!f.sidearm, lightArmor:!!f.lightArmor, reinforced:!!f.reinforced, duster:!!f.duster, dusterUsed:!!f.dusterUsed,
      pending:{ regen:pd.regen||0, incomingNext:pd.incomingNext||0, outgoingNext:pd.outgoingNext||0, energyPenalty:pd.energyPenalty||0, absorbNext:pd.absorbNext||0, burn:pd.burn||0, reconPick:!!pd.reconPick, silence:pd.silence?Array.from(pd.silence):null },
      turn: mpSerTurn(f.turn) };
  }
  function mpSerializeState(st, withTimeline){
    return { round:st.round, over:!!st.over, result:st.result||null, preHp:st._preHp||null,
      sides: st.sides.map(s=>({ name:s.name, fighters:s.fighters.map(mpSerFighter) })),
      timeline: withTimeline ? (st.timeline||[]) : null };
  }
  function mpDeserTurn(t){ t=t||{};
    return { pools:(t.pools||[]).map(p=>({value:p.value,remaining:p.remaining,stopsPierce:!!p.stopsPierce})),
      absorbed:t.absorbed||0, hitThisTurn:!!t.hitThisTurn, reduce:t.reduce||0, incoming:t.incoming||0, outgoing:t.outgoing||0,
      attackBuff:t.attackBuff||0, attackBuffUsed:!!t.attackBuffUsed,
      riposte: t.riposte?{pool:t.riposte.pool,counter:t.riposte.counter,mode:t.riposte.mode,attackers:new Set(t.riposte.attackers||[])}:null,
      bluff:t.bluff||null, tripmine:t.tripmine||null, invuln:!!t.invuln,
      redirectTo:t.redirectTo||null, coverFor:t.coverFor||null, tauntTo:t.tauntTo||null,
      silencedTypes:t.silencedTypes?new Set(t.silencedTypes):null, buffedNoSecondAttack:!!t.buffedNoSecondAttack,
      reconPick:!!t.reconPick, junction:t.junction||null, energyPenalty:t.energyPenalty||0 };
  }
  function mpDeserFighter(sf){ const pd=sf.pending||{};
    return { uid:sf.uid, name:sf.name, className:sf.className, hp:sf.hp, maxHp:sf.maxHp, alive:sf.alive,
      deck:{ draw:(sf.deck.draw||[]).slice(), discard:(sf.deck.discard||[]).slice(), potionUsed:sf.deck.potionUsed, signatureUsed:sf.deck.signatureUsed, bonusDraw:sf.deck.bonusDraw||0 },
      _handCards:(sf.hand||[]).slice(), hand:[],
      equipReduce:sf.equipReduce||0, hasReduceEquip:!!sf.hasReduceEquip, sidearm:!!sf.sidearm, lightArmor:!!sf.lightArmor, reinforced:!!sf.reinforced, duster:!!sf.duster, dusterUsed:!!sf.dusterUsed,
      pending:{ regen:pd.regen||0, incomingNext:pd.incomingNext||0, outgoingNext:pd.outgoingNext||0, energyPenalty:pd.energyPenalty||0, absorbNext:pd.absorbNext||0, burn:pd.burn||0, reconPick:!!pd.reconPick, silence:pd.silence?new Set(pd.silence):null },
      turn: mpDeserTurn(sf.turn) };
  }
  function mpDeserializeState(snap){
    const st={ round:snap.round, over:!!snap.over, result:snap.result||null, _preHp:snap.preHp||null,
      rng:{ shuffle:(a)=>a, int:()=>0, float:()=>0, pick:(a)=> (a&&a.length?a[0]:undefined) },
      log:[], timeline: snap.timeline||[],
      sides: (snap.sides||[]).map(s=>({ name:s.name, fighters:(s.fighters||[]).map(mpDeserFighter) })) };
    for(const side of st.sides) for(const f of side.fighters){ f.hand=(f._handCards||[]).map(card=>({card, owner:f})); delete f._handCards; }
    return st;
  }
  function mpSerializePicks(picks){
    return (picks||[]).map(p=>({ ownerUid:p.owner.uid, handIndex:p.owner.hand.indexOf(p.handItem),
      casterUid:(p.caster||p.owner).uid, targetUid: p.target?p.target.uid:null,
      discardOwnerUid: p.discardHi?p.discardHi.owner.uid:null, discardHandIndex: p.discardHi?p.discardHi.owner.hand.indexOf(p.discardHi):null }));
  }
  function mpDeserializePicks(serPicks, st){
    const byUid={}; for(const side of st.sides) for(const f of side.fighters) byUid[f.uid]=f;
    const out=[];
    for(const sp of (serPicks||[])){
      const owner=byUid[sp.ownerUid]; if(!owner) continue;
      const hi=owner.hand[sp.handIndex]; if(!hi) continue;
      const caster=byUid[sp.casterUid]||owner;
      const target = sp.targetUid!=null ? (byUid[sp.targetUid]||null) : null;
      let discardHi=null;
      if(sp.discardHandIndex!=null){ const dO=byUid[sp.discardOwnerUid]||owner; discardHi=dO.hand[sp.discardHandIndex]||null; }
      out.push({ handItem:hi, card:hi.card, owner, caster, target, discardHi });
    }
    return out;
  }

  // on refocus, snap the (wall-clock) turn timer to the correct value immediately
  try{ document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ try{ mpRenderTimer(); }catch(e){} } }); }catch(e){}

  showStart();
})();
</script>
