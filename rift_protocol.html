      {name:'B', fighters:[makeFighter('B1','Soldier'), makeFighter('B2','Soldier')]},
    ],
  };
  startOfTurn(s); // build fresh turn state
  return s;
}
function pick(card, caster, target){ return {card, caster, target}; }
// synthetic attack fixture for mechanic tests (decoupled from deck composition,
// so card-pool redesigns don't break the engine assertions)
function atk(name, speed, amount, extra){ return Object.assign({cls:'Test', name, type:'Attack', aim:'enemy', kind:'attack', speed, amount}, extra||{}); }

function runTests(report){
  report = report || ((ok,name,extra)=>{ if(!ok) throw new Error('FAIL: '+name+' '+(extra||'')); });
  const results = [];
  const T = (name, fn)=>{
    try{ const msg = fn(); results.push({name, ok:true, msg}); report(true,name,msg); }
    catch(e){ results.push({name, ok:false, msg:e.message}); report(false,name,e.message); }
  };
  const assert=(c,m)=>{ if(!c) throw new Error(m||'assertion failed'); };

  // 1. Focused burst survives: 20 hit by 9+9 = 2 HP
  T('1. Focused burst survives (9+9 → 2 HP)', ()=>{
    const s=bareState(); const tgt=s.sides[1].fighters[0];
    resolveTurn(s, [pick(atk('Heavy Hit',4,9), s.sides[0].fighters[0], tgt),
                    pick(atk('Heavy Hit',4,9), s.sides[0].fighters[1], tgt)], []);
    assert(tgt.hp===2 && tgt.alive, `expected 2 HP alive, got ${tgt.hp} alive=${tgt.alive}`);
    return `HP=${tgt.hp}`;
  });
  // 2. Two-turn kill: 18 then 2 = dead
  T('2. Two-turn kill (18 then 2 → dead)', ()=>{
    const s=bareState(); const tgt=s.sides[1].fighters[0];
    resolveTurn(s, [pick(atk('Heavy Hit',4,9), s.sides[0].fighters[0], tgt),
                    pick(atk('Heavy Hit',4,9), s.sides[0].fighters[1], tgt)], []);
    startOfTurn(s);
    resolveTurn(s, [pick(atk('Jab',2,3), s.sides[0].fighters[0], tgt)], []);
    assert(!tgt.alive && tgt.hp<=0, `expected dead, got hp=${tgt.hp} alive=${tgt.alive}`);
    return 'dead as expected';
  });
  // 3. Block pool depletes: 10-pool vs 6 then 9 = 5 carries
  T('3. Block pool depletes (10 vs 6+9 → 5 to HP)', ()=>{
    const s=bareState(); const tgt=s.sides[1].fighters[0];
    // tgt's ally Braces tgt; attackers hit with a 6 (T3) and a 9 (T4) -> but tiers differ; pool persists across tiers same turn
    resolveTurn(s, [pick(atk('Slash',3,6), s.sides[0].fighters[0], tgt),
                    pick(atk('Heavy Hit',4,9), s.sides[0].fighters[1], tgt)],
                   [pick(findCard('Soldier','Brace',0), s.sides[1].fighters[1], tgt)]);
    assert(tgt.hp===15, `expected 15 (20-5), got ${tgt.hp}`);
    return `HP=${tgt.hp}`;
  });
  // 4. Block never fully stops heavy: 10 vs 18 = 8 leaks
  T('4. Block never stops heavy (10 vs 18 → 8 to HP)', ()=>{
    const s=bareState(); const tgt=s.sides[1].fighters[0];
    resolveTurn(s, [pick(atk('Heavy Hit',4,9), s.sides[0].fighters[0], tgt),
                    pick(atk('Heavy Hit',4,9), s.sides[0].fighters[1], tgt)],
                   [pick(findCard('Soldier','Brace',0), s.sides[1].fighters[1], tgt)]);
    assert(tgt.hp===12, `expected 12 (20-8), got ${tgt.hp}`);
    return `HP=${tgt.hp}`;
  });
  // 5. Pierce ignores block: 4 pierce vs pool = full 4 to HP, pool untouched
  T('5. Pierce ignores block (5 pierce vs 10 pool → 5 to HP)', ()=>{
    const s=bareState(); const tgt=s.sides[1].fighters[0];
    const log=resolveTurn(s, [pick(findCard('Soldier','Piercing Round',0), s.sides[0].fighters[0], tgt)],
                   [pick(findCard('Soldier','Brace',0), s.sides[1].fighters[1], tgt)]);
    assert(tgt.hp===15, `expected 15 (20-5 pierce), got ${tgt.hp}`);
    // pool untouched: a follow-up normal hit should be absorbed fully next... check pool remaining this turn
    const pool=tgt.turn.pools[0];
    return `HP=${tgt.hp}`;
  });
  // 6. Same-tier simultaneity: two T3s that each kill the other -> both die
  T('6. Same-tier simultaneity (mutual kill, both die)', ()=>{
    const s=bareState();
    const a=s.sides[0].fighters[0], b=s.sides[1].fighters[0];
    a.hp=6; b.hp=6;
    resolveTurn(s, [pick(atk('Slash',3,6), a, b)],
                   [pick(atk('Slash',3,6), b, a)]);
    assert(!a.alive && !b.alive, `expected both dead, got a=${a.alive} b=${b.alive}`);
    return 'both dead';
  });
  // 7. Riposte counter: attacker who hits a riposted fighter takes 4 same tier
  T('7. Riposte counter (attacker takes 4)', ()=>{
    const s=bareState();
    const atkr=s.sides[0].fighters[0]; const def=s.sides[1].fighters[0];
    // def plays Counterstance (T2 riposte). atkr plays a T2 attack into def.
    resolveTurn(s, [pick(atk('Jab',2,3), atkr, def)],
                   [pick(findCard('Soldier','Counterstance',0), def, def)]);
    assert(atkr.hp===16, `attacker expected 16 (20-4 counter), got ${atkr.hp}`);
    assert(def.hp===20, `def expected 20 (3 absorbed by riposte pool 5), got ${def.hp}`);
    return `atk=${atkr.hp} def=${def.hp}`;
  });
  // 8. Stacking rule 1 + the energy RAMP (replaced the old flat budget / 2-card limit).
  T('8. Stacking rule 1 + energy ramp (3/4/6/8/10)', ()=>{
    const e=bareState();
    const eb=(r)=>{ e.round=r; return energyBudget(e, e.sides[0]); };
    assert(eb(1)===3 && eb(2)===4 && eb(3)===6 && eb(4)===8 && eb(5)===10,
      `energy ramp wrong: ${[1,2,3,4,5].map(eb)}`);
    const s=bareState();
    const f=s.sides[0].fighters[0], g=s.sides[0].fighters[1], en=s.sides[1].fighters[0];
    const buff=pick(findCard('Soldier','Adrenaline',0), f, f);            // T1 = 1
    const jab =pick(atk('Jab',2,3), f, en);                               // T2 = 2
    const supp=pick(findCard('Soldier','Suppressing Fire',0), f, null);   // T2 = 2 (AoE counts as an attack)
    // buff + 2 attacks on one fighter -> rejected by STACKING RULE 1 (checked before energy)
    const bad = validatePicks(s, 0, [buff, jab, supp]);
    assert(!bad.ok && /Stacking rule 1/.test(bad.reason), `expected stacking rule 1, got: ${bad.reason}`);
    // a 4-energy play: rejected at round 1 (3e), allowed at round 3 (6e)
    const play4 = [buff, pick(findCard('Soldier','Breach Slash',0), f, en)];
    s.round=1; const r1 = validatePicks(s, 0, play4);
    assert(!r1.ok && /energy/i.test(r1.reason), `round 1 (3e) should reject a 4-energy play, got: ${r1.reason}`);
    s.round=3; const r3 = validatePicks(s, 0, play4);
    assert(r3.ok, `round 3 (6e) should allow a 4-energy play, got: ${r3.reason}`);
    // round 5 (10e) allows two T4 (10 energy)
    s.round=5; const two = validatePicks(s, 0, [pick(atk('Heavy Hit',4,9), f, en),
                                                pick(atk('Heavy Hit',4,9), g, en)]);
    assert(two.ok, `round 5 (10e) should allow two T4, got: ${two.reason}`);
    return 'ramp 3/4/6/8/10 + stacking rule 1 enforced';
  });
  // 9. Stacking rule 2: reject second permanent -damage equip
  T('9. Stacking rule 2 (reject 2nd -damage equip)', ()=>{
    const s=bareState();
    const f=s.sides[0].fighters[0];
    addReduceEquip(f, 1); // already has Combat Vest
    const second = validatePicks(s, 0, [pick(findCard('Soldier','Combat Vest',0), f, f)]);
    assert(!second.ok, 'second -damage equip should be rejected');
    return 'rejected as expected';
  });
  // 10. Potion once-per-match: second potion play rejected
  T('10. Potion once-per-match (reject 2nd)', ()=>{
    const s=bareState();
    const f=s.sides[0].fighters[0];
    f.deck.potionUsed = true;
    const again = validatePicks(s, 0, [pick(findCard('Soldier','Field Medkit',0), f, f)]);
    assert(!again.ok, 'second potion should be rejected');
    return 'rejected as expected';
  });
  // 11. Dead fighter's deck stops; the lone survivor refills only to the normal
  //     per-fighter cap (no carry-over balloon, no inheriting the dead operative's cards).
  T("11. Dead deck stops; lone survivor refills to normal cap", ()=>{
    const st = newMatch({seed:7, sideA:{name:'A',classes:['Soldier','Arcanist']},
                                 sideB:{name:'B',classes:['Warden','Scout']}});
    // both alive: each fighter tops up to 4 -> hand of up to 8
    topUpHands(st);
    const both = st.sides[0].fighters.map(f=>f.hand.length);
    assert(both[0]===4 && both[1]===4, `both-alive expected 4+4, got ${both}`);
    // one dies: its deck stops (hand discarded, draws 0); survivor stays at its own cap
    st.sides[0].fighters[1].alive=false; st.sides[0].fighters[1].hp=0;
    topUpHands(st);
    const survivor = st.sides[0].fighters[0].hand.length, dead = st.sides[0].fighters[1].hand.length;
    assert(dead===0, `dead fighter's deck must stop drawing, got ${dead}`);
    assert(survivor===HAND_CAP_SOLO, `lone survivor should refill to its cap (${HAND_CAP_SOLO}), got ${survivor}`);
    return `pair=${both} → survivor=${survivor}, dead=${dead}`;
  });
  // 12. Round-5 tiebreak: MOST ENEMY KILLS first, then total HP, then draw.
  T('12. Round-5 tiebreak (kills first, then HP, then draw)', ()=>{
    // (a) equal kills (0-0) → higher total HP wins
    let s=bareState(); s.round=5;
    s.sides[0].fighters[0].hp=10; s.sides[0].fighters[1].hp=10; // A 20
    s.sides[1].fighters[0].hp=5;  s.sides[1].fighters[1].hp=5;  // B 10
    resolveTurn(s, [], []);
    assert(s.over && s.result.winner===0 && /HP/.test(s.result.reason), `A should win on HP, got ${JSON.stringify(s.result)}`);
    // (b) kills beat HP: A has 1 kill but LESS HP → A still wins
    s=bareState(); s.round=5;
    s.sides[1].fighters[1].alive=false; s.sides[1].fighters[1].hp=0;   // A killed one enemy
    s.sides[0].fighters[0].hp=2; s.sides[0].fighters[1].hp=2;          // A only 4 HP
    s.sides[1].fighters[0].hp=20;                                      // B 20 HP, 0 kills
    resolveTurn(s, [], []);
    assert(s.over && s.result.winner===0 && /kills/.test(s.result.reason),
      `A should win on kills despite less HP, got ${JSON.stringify(s.result)}`);
    // (c) kills equal AND HP equal → draw
    let s2=bareState(); s2.round=5;
    s2.sides[0].fighters[0].hp=7; s2.sides[1].fighters[0].hp=7;
    s2.sides[0].fighters[1].hp=7; s2.sides[1].fighters[1].hp=7;
    resolveTurn(s2, [], []);
    assert(s2.over && s2.result.winner===-1, `expected draw, got ${JSON.stringify(s2.result)}`);
    return 'kills > HP > draw ok';
  });

  const passed = results.filter(r=>r.ok).length;
  return {passed, total:results.length, results};
}

/* =====================================================================
   HEADLESS SIMULATION  (spec §9 step 3): run N full matches with Random AI
   to surface crashes / stuck states across the whole card pool.
   ===================================================================== */
function playMatch(seed, modeA, modeB){
  const classes = Object.keys(DECKLISTS);
  const rng = makeRng(seed);
  const cA = rng.shuffle(classes.slice()).slice(0,2);
  const cB = rng.shuffle(classes.slice()).slice(0,2);
  const st = newMatch({seed, sideA:{name:'A',classes:cA,ai:modeA},
                              sideB:{name:'B',classes:cB,ai:modeB}});
  let guard=0;
  while(!st.over && st.round<=MAX_ROUNDS){
    if(guard++>50) throw new Error('stuck match (too many rounds)');
    startOfTurn(st);
    drawHands(st);
    const pa = aiForMode(modeA)(st,0);
    const pb = aiForMode(modeB)(st,1);
    resolveTurn(st, pa, pb);
    if(st.over) break;
    st.round++;
  }
  if(!st.over){ // hit round cap without end-of-turn tiebreak firing
    const hpA=sumHp(st.sides[0]), hpB=sumHp(st.sides[1]);
    st.result={winner: hpA>hpB?0:hpB>hpA?1:-1, reason:'cap'};
    st.over=true;
  }
  return st;
}
function simulate(n, modeA, modeB){
  modeA=modeA||'random'; modeB=modeB||'random';
  const tally={A:0,B:0,draw:0}; let totalRounds=0; const errors=[];
  for(let i=0;i<n;i++){
    try{
      const st=playMatch(1000+i, modeA, modeB);
      totalRounds += st.round;
      if(st.result.winner===0) tally.A++; else if(st.result.winner===1) tally.B++; else tally.draw++;
    }catch(e){ errors.push({seed:1000+i, err:e.message}); }
  }
  return {n, tally, avgRounds:(totalRounds/n).toFixed(2), errors};
}

/* ---------- exports for Node test harness & for the UI script ---------- */
const GF = {
  CLASSES, CARDS, DECKLISTS,
  makeRng, makeFighter, makeFighterFromClass, newMatch,
  drawHands, topUpHands, buildLegalActions, validatePicks, targetsFor,
  energyBudget, energyCost, energyOf, roundEnergy, ENERGY_BY_ROUND, fighterStatus,
  startOfTurn, resolveTurn, livingFighters, enemyOf, sumHp,
  aiRandom, aiHeuristic, aiCaptain, aiWarden, aiForMode, choosePicks, isAttackCard, cardDamage,
  runTests, simulate, playMatch,
};
if(typeof module!=='undefined' && module.exports) module.exports = GF;
if(typeof globalThis!=='undefined') globalThis.GF = GF;
})();
</script>

<script id="gf-audio">
/* =====================================================================
   RiftAudio — self-contained Web Audio API sound system. No files, no
   libraries: every track and effect is synthesized in code. Safe to load
   anywhere — if Web Audio is unavailable, every method is a silent no-op.
   The AudioContext is created lazily on the first user gesture (never
   before), and resumed on any interaction (iOS/mobile safe).
   ===================================================================== */
(function(){
  var win = (typeof window!=='undefined') ? window : null;
  var AC  = win && (win.AudioContext || win.webkitAudioContext);
  var API = {};
  var supported = !!AC;

  var ctx=null, master=null, musicBus=null, sfxBus=null, noiseBuf=null;
  var muted=false, musicVol=0.5, sfxVol=0.6;   // separate music / SFX levels
  var current=null, desired=null, unlocked=false, gestured=false;   // gestured = any user gesture (lets HTMLAudio play even if Web Audio is unavailable)
  /* ---- file-based music layer (HTMLAudio), selectable per context ---- */
  var FILE_TRACKS = { boss:'music/Boss Bass - The Game.mp3', lofi:'music/VibeDepot - sweet lofi.mp3' };
  var TRACK_LABELS = { synth:'Synth (original)', boss:'Boss Bass', lofi:'Sweet Lofi', off:'Off' };
  var trackPrefs = { menu:'lofi', battle:'boss' };   // defaults = the new tracks
  var fileAudio=null, fileKey=null;                  // current HTMLAudioElement + its key
  function clamp01(v){ v=+v; return v>=0 ? (v<=1 ? v : 1) : 0; }
  // perceptual curve: ears are logarithmic, so map the 0–1 slider to gain via a
  // square (×0.8 ceiling) — low slider positions get genuinely quiet, and the
  // whole mix sits lower than a linear mapping.
  function gainFor(v){ return clamp01(v)*clamp01(v)*0.8; }

  /* ---- persisted settings (localStorage "rift_audio") ---- */
  try{
    var raw = win && win.localStorage && win.localStorage.getItem('rift_audio');
    var saved = raw ? JSON.parse(raw) : {};
    if(saved){
      if(typeof saved.muted==='boolean') muted = saved.muted;
      if(typeof saved.music==='number') musicVol = clamp01(saved.music);
      else if(typeof saved.volume==='number') musicVol = clamp01(saved.volume);   // migrate old single volume
      if(typeof saved.sfx==='number') sfxVol = clamp01(saved.sfx);
      else if(typeof saved.volume==='number') sfxVol = clamp01(saved.volume);
      if(saved.tracks){
        if(typeof saved.tracks.menu==='string')   trackPrefs.menu   = saved.tracks.menu;
        if(typeof saved.tracks.battle==='string') trackPrefs.battle = saved.tracks.battle;
      }
    }
  }catch(e){}
  function save(){ try{ win.localStorage.setItem('rift_audio', JSON.stringify({muted:muted, music:musicVol, sfx:sfxVol, tracks:trackPrefs})); }catch(e){} }

  /* ---- file-track playback helpers ---- */
  function stopFile(){ if(fileAudio){ try{ fileAudio.pause(); }catch(e){} fileAudio=null; fileKey=null; } }
  function startFile(key){
    if(!FILE_TRACKS[key]) return;
    if(fileKey===key && fileAudio){ try{ if(fileAudio.paused) fileAudio.play(); }catch(e){} return; }
    stopFile();
    try{
      var a = new Audio(encodeURI(FILE_TRACKS[key]));
      a.loop=true; a.volume = muted ? 0 : gainFor(musicVol);
      fileAudio=a; fileKey=key;
      var p=a.play(); if(p && p.catch) p.catch(function(){});
    }catch(e){}
  }
  function stopSynth(){ if(current){ var c=current; c.fade(0,0.3); setTimeout(function(){ try{ c.stop(); }catch(e){} }, 350); current=null; } }
  // route a context ('menu'/'battle') to its chosen source
  function applyChoice(name, choice){
    if(choice==='off'){ stopFile(); stopSynth(); return; }
    if(choice==='boss' || choice==='lofi'){ stopSynth(); if(gestured) startFile(choice); return; }
    /* synth */ stopFile(); if(ctx && unlocked) transition(name);   // else starts on unlock via resumeDesired
  }
  function resumeDesired(){
    if(!desired || muted) return;
    if(desired==='victory'){ stopFile(); transition('victory'); return; }
    applyChoice(desired, trackPrefs[desired] || 'synth');
  }

  function ensureCtx(){
    if(!supported) return null;
    if(!ctx){
      try{
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = muted ? 0 : 1;   // master is the mute gate
        var comp = ctx.createDynamicsCompressor();   // tame summed peaks → no clipping
        master.connect(comp); comp.connect(ctx.destination);
        musicBus = ctx.createGain(); musicBus.gain.value = gainFor(musicVol); musicBus.connect(master);
        sfxBus   = ctx.createGain(); sfxBus.gain.value   = gainFor(sfxVol);   sfxBus.connect(master);
      }catch(e){ ctx=null; supported=false; return null; }
    }
    return ctx;
  }
  function T(){ return ctx ? ctx.currentTime : 0; }

  /* ---- gesture unlock: create ctx on first gesture, resume on any ---- */
  function unlock(){
    gestured=true;
    if(supported && ensureCtx()){
      if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
      unlocked=true;
    }
    resumeDesired();   // start whatever's desired via the chosen source (synth needs ctx; file only needs the gesture)
  }
  if(win){
    ['pointerdown','touchstart','mousedown','keydown'].forEach(function(ev){
      try{ win.addEventListener(ev, unlock, {capture:true, passive:true}); }catch(e){ try{ win.addEventListener(ev, unlock, true); }catch(_){} }
    });
  }

  /* ---- synthesis primitives ---- */
  function noise(){
    if(!noiseBuf){ var n=Math.floor(ctx.sampleRate*1); noiseBuf=ctx.createBuffer(1,n,ctx.sampleRate);
      var d=noiseBuf.getChannelData(0); for(var i=0;i<n;i++) d[i]=Math.random()*2-1; }
    return noiseBuf;
  }
  // one oscillator note with an attack/sustain/release gain envelope
  function tone(type, freq, t, dur, peak, dest, opt){
    opt=opt||{};
    var o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(freq, t);
    if(opt.glide){ try{ o.frequency.exponentialRampToValueAtTime(Math.max(20,opt.glide), t+dur); }catch(e){} }
    var g=ctx.createGain();
    var atk=opt.attack!=null?opt.attack:0.008, rel=opt.release!=null?opt.release:0.06;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t+atk);
    g.gain.setValueAtTime(peak, Math.max(t+atk, t+dur-rel));
    g.gain.linearRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(dest||musicBus);
    o.start(t); o.stop(t+dur+0.03);
  }
  // filtered noise burst (optionally sweeping the cutoff from→to)
  function noiseBurst(t, dur, peak, type, from, to, Q, dest){
    var s=ctx.createBufferSource(); s.buffer=noise();
    var f=ctx.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(from, t);
    if(to){ try{ f.frequency.exponentialRampToValueAtTime(Math.max(40,to), t+dur); }catch(e){ f.frequency.linearRampToValueAtTime(to, t+dur); } }
    if(Q!=null) f.Q.value=Q;
    var g=ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t+Math.min(0.02,dur*0.2));
    g.gain.exponentialRampToValueAtTime(0.0008, t+dur);
    s.connect(f); f.connect(g); g.connect(dest||sfxBus);
    s.start(t); s.stop(t+dur+0.03);
  }
  function kick(t, dest){
    noiseBurst(t, 0.13, 0.55, 'lowpass', 220, 60, 1, dest);   // low-pass noise body
    var o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(120,t);
    try{ o.frequency.exponentialRampToValueAtTime(45, t+0.12); }catch(e){}
    var g=ctx.createGain(); g.gain.setValueAtTime(0.6,t); g.gain.exponentialRampToValueAtTime(0.001, t+0.13);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t+0.15);
  }
  function snare(t, dest){ noiseBurst(t, 0.12, 0.4, 'highpass', 1800, 0, 0.7, dest); }

  /* ---- UI sound effects ---- */
  var SFX = {
    MENU_HOVER:   function(t){ tone('sine',880,t,0.05,0.10,sfxBus,{attack:0.004,release:0.02}); },
    MENU_SELECT:  function(t){ tone('square',440,t,0.08,0.16,sfxBus,{attack:0.004,release:0.03}); tone('square',660,t+0.085,0.08,0.16,sfxBus,{attack:0.004,release:0.03}); },
    CARD_STAGE:   function(t){ noiseBurst(t,0.15,0.2,'bandpass',3500,600,2.5,sfxBus); },
    CARD_REMOVE:  function(t){ noiseBurst(t,0.1,0.18,'bandpass',600,3500,2.5,sfxBus); },
    LOCK_IN:      function(t){ tone('square',220,t,0.1,0.4,sfxBus,{attack:0.002,release:0.05}); },
    HIT:          function(t){ tone('triangle',80,t,0.2,0.5,sfxBus,{attack:0.002,release:0.08,glide:40}); },
    BLOCK:        function(t){ noiseBurst(t,0.05,0.3,'highpass',2000,0,1,sfxBus); },
    OPERATIVE_KO: function(t){ tone('square',440,t,0.4,0.4,sfxBus,{attack:0.003,release:0.1,glide:110}); },
    MATCH_WIN:    function(t){ tone('square',523,t,0.1,0.3,sfxBus); tone('square',659,t+0.13,0.1,0.3,sfxBus); tone('square',784,t+0.26,0.12,0.3,sfxBus); },
    MATCH_LOSS:   function(t){ tone('sine',330,t,0.2,0.3,sfxBus,{release:0.06}); tone('sine',220,t+0.22,0.2,0.3,sfxBus,{release:0.06}); }
  };
  API.sfx = function(name){
    try{
      if(!supported || muted || !unlocked) return;
      if(!ensureCtx()) return;
      if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
      var fn=SFX[name]; if(fn) fn(T()+0.001);
    }catch(e){}
  };

  /* ---- chiptune music: lookahead step scheduler ---- */
  // MENU "The Fold" — 72 BPM, A-minor, sparse & atmospheric (16 eighth-notes)
  var mChord = [
    {root:110.00, pad:[220.00,261.63,329.63]},  // Am
    {root:87.31,  pad:[174.61,220.00,261.63]},  // F
    {root:130.81, pad:[261.63,329.63,392.00]},  // C
    {root:98.00,  pad:[196.00,246.94,293.66]}   // G
  ];
  var mLead = [329.63,null,null,261.63, 220.00,null,null,null, 261.63,null,329.63,null, 293.66,null,246.94,null];
  function menuStep(step, t, dest){
    var sd=(60/72)/2;
    if(step%4===0){
      var ch=mChord[(step/4)|0], sus=sd*4*0.95;
      ch.pad.forEach(function(f){ tone('sine', f, t, sus, 0.085, dest, {attack:0.25, release:0.45}); });
      tone('triangle', ch.root, t, sus, 0.16, dest, {attack:0.05, release:0.35});  // bass
    }
    var ld=mLead[step];
    if(ld) tone('square', ld, t, sd*1.4, 0.07, dest, {attack:0.02, release:0.12});  // lead
  }
  // BATTLE "Breach Point" — a multi-SECTION arrangement so it doesn't get old:
  // four sections with different chords, melody, texture, and TEMPO (the BPM
  // fluctuates 128 → 140 → 110 → 132 across one full loop).
  // BATTLE "Breach Point" — slow & HAUNTING. A low triangle drone under detuned,
  // wavering sine pads and a sparse, exposed square lead, over a dark descending
  // progression (Andalusian i–VII–VI–V). No drums. Two sections so it evolves
  // without ever picking up the pace.
  var HCH = {
    Am:{drone:110.00, pad:[220.00,261.63,329.63]},  // A  · A3 C4 E4
    G: {drone:98.00,  pad:[196.00,246.94,293.66]},  // G  · G3 B3 D4
    F: {drone:87.31,  pad:[174.61,220.00,261.63]},  // F  · F3 A3 C4
    E: {drone:82.41,  pad:[164.81,207.65,246.94]},  // E  · E3 G#3 B3  (the G# = the dark pull)
    Dm:{drone:73.42,  pad:[146.83,174.61,220.00]},  // Dm · D3 F3 A3
    Bb:{drone:116.54, pad:[233.08,293.66,349.23]}   // Bb · Bb3 D4 F4  (Phrygian b2)
  };
  function hDrone(f, t, dur, dest){ tone('triangle', f, t, dur, 0.11, dest, {attack:0.35, release:0.7}); }
  function hPad(f, t, dur, g, dest){              // two slightly-detuned sines → a wavering, uneasy texture
    tone('sine', f,        t, dur, g,      dest, {attack:0.5, release:0.9});
    tone('sine', f*1.0055, t, dur, g*0.85, dest, {attack:0.6, release:1.0});
  }
  function hauntSection(bpm, prog, lead, o){
    o=o||{};
    var stepDur=60/bpm, bpb=4, steps=prog.length*bpb;   // one slow quarter-note per step, 1 bar per chord
    return { stepDur:stepDur, steps:steps, render:function(step, t, dest){
      var ch=HCH[prog[Math.floor(step/bpb)%prog.length]], beat=step%bpb;
      if(beat===0){
        var barDur=stepDur*bpb*0.98;
        hDrone(ch.drone, t, barDur, dest);
        ch.pad.forEach(function(f){ hPad(f, t, barDur*0.95, 0.04, dest); });
      }
      var lf=lead[step%lead.length];
      if(lf) tone('square', lf, t, stepDur*1.7, o.leadGain||0.055, dest, {attack:0.1, release:0.5});  // ghostly lead
      if(o.ghost && step%o.ghost.every===o.ghost.at) tone('sine', o.ghost.freq, t, stepDur*0.9, 0.022, dest, {attack:0.02, release:0.6}); // faint high ping
    }};
  }
  function battleSections(){
    // sparse, exposed lead lines; nulls = space. 16 beats (4 bars) per section.
    var leadA=[440.00,null,null,523.25,  493.88,null,null,null,  349.23,null,440.00,null,  415.30,null,329.63,null]; // pulls onto G#→E
    var leadB=[null,440.00,null,null,    349.23,null,null,293.66, 233.08,null,null,null,    207.65,null,164.81,null]; // Bb & G# = dread
    return [
      hauntSection(64, ['Am','G','F','E'],  leadA, {ghost:{freq:1046.50, every:16, at:8}}),  // Andalusian descent
      hauntSection(60, ['Am','F','Dm','E'], leadB, {leadGain:0.05})                          // slower, more dissonant
    ];
  }
  function menuSections(){ return [ { stepDur:(60/72)/2, steps:16, render:menuStep } ]; }

  // Section-aware looping scheduler (each section may carry its own tempo)
  function SectionTrack(name, sections){
    this.name=name; this.sections=sections; this.sec=0; this.step=0; this.next=0; this.timer=null; this.alive=false;
    this.gain=ctx.createGain(); this.gain.gain.value=0; this.gain.connect(musicBus);
  }
  SectionTrack.prototype.start=function(){
    this.alive=true; this.next=T()+0.06; var self=this;
    (function loop(){
      if(!self.alive || !ctx) return;
      while(self.next < T()+0.12){
        var s=self.sections[self.sec];
        try{ s.render(self.step, self.next, self.gain); }catch(e){}
        self.next += s.stepDur; self.step++;
        if(self.step >= s.steps){ self.step=0; self.sec=(self.sec+1)%self.sections.length; }
      }
      self.timer=setTimeout(loop, 25);
    })();
  };
  SectionTrack.prototype.fade=function(to, dur){ try{ var g=this.gain.gain; g.cancelScheduledValues(T()); g.setValueAtTime(g.value, T()); g.linearRampToValueAtTime(to, T()+dur); }catch(e){} };
  SectionTrack.prototype.stop=function(){ this.alive=false; if(this.timer){ clearTimeout(this.timer); this.timer=null; } try{ this.gain.disconnect(); }catch(e){} };
  function makeTrack(name){
    if(name==='menu')   return new SectionTrack('menu', menuSections());
    if(name==='battle') return new SectionTrack('battle', battleSections());
    return null;
  }
  function transition(name){
    if(!ctx) { desired=name; return; }
    if(name==='victory'){ playVictory(); return; }
    if(current && current.name===name && current.alive) return;
    var old=current, t=makeTrack(name); if(!t) return;
    current=t; t.start(); t.fade(1, 1.0);                        // 1s crossfade
    if(old){ old.fade(0, 1.0); setTimeout(function(){ try{ old.stop(); }catch(e){} }, 1100); }
  }
  // VICTORY "Clear" — short ascending fanfare, plays once, then back to TRACK 1
  function playVictory(){
    var old=current; if(old){ old.fade(0,0.4); setTimeout(function(){ try{old.stop();}catch(e){} },450); }
    current=null;
    var t0=T()+0.05, seq=[523.25,659.25,783.99,1046.50], i;
    for(i=0;i<seq.length;i++) tone('square', seq[i], t0+i*0.2, 0.18, 0.3, musicBus, {attack:0.004, release:0.06});
    var ct=t0+seq.length*0.2+0.05;
    [523.25,659.25,783.99].forEach(function(f){ tone('square', f, ct, 1.2, 0.16, musicBus, {attack:0.01, release:0.5}); });
    tone('triangle',130.81,ct,1.2,0.18,musicBus,{attack:0.01,release:0.5});            // resolve
    desired='menu';
    var ms=Math.max(1200, ((ct-T())+1.3)*1000);
    setTimeout(function(){ if(desired==='menu' && !muted) transition('menu'); }, ms);
  }

  /* ---- public music + settings API ---- */
  API.playMusic = function(name){ try{
    desired=name;
    if(name==='victory'){ stopFile(); if(supported && ctx && unlocked && !muted) transition('victory'); return; }
    if(name==='menu' || name==='battle'){
      if(muted) return;                                       // resumes on unmute via resumeDesired
      applyChoice(name, trackPrefs[name] || 'synth');
      return;
    }
    if(!supported || !ctx || !unlocked || muted) return;
    transition(name);
  }catch(e){} };
  API.stopMusic = function(){ try{ stopFile(); stopSynth(); desired=null; }catch(e){} };
  // per-context track selection (context: 'menu'|'battle'; choice: 'synth'|'boss'|'lofi'|'off')
  API.setTrack = function(context, choice){
    if(context!=='menu' && context!=='battle') return;
    trackPrefs[context]=choice; save();
    if(desired===context && !muted) applyChoice(context, choice);   // live-switch if this context is active
  };
  API.getTrack = function(context){ return trackPrefs[context] || 'synth'; };
  API.trackOptions = function(){ return [['synth',TRACK_LABELS.synth],['boss',TRACK_LABELS.boss],['lofi',TRACK_LABELS.lofi],['off',TRACK_LABELS.off]]; };

  API.setMuted = function(m){
    muted=!!m; save();
    // file-track layer (independent of the Web Audio graph)
    try{ if(muted){ if(fileAudio) fileAudio.pause(); } }catch(e){}
    try{
      if(!ctx){ if(!muted) resumeDesired(); return; }          // no ctx yet: still resume file music
      var g=master.gain; g.cancelScheduledValues(T()); g.setValueAtTime(g.value, T());
      if(muted){
        g.linearRampToValueAtTime(0, T()+0.5);               // fade out 0.5s
        setTimeout(function(){ if(muted && current){ current.stop(); current=null; } }, 520);  // pause scheduler
      } else {
        if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
        if(desired && !current && !fileAudio) resumeDesired(); // resume scheduler / file
        else if(fileAudio){ try{ fileAudio.volume=gainFor(musicVol); var p=fileAudio.play(); if(p&&p.catch)p.catch(function(){}); }catch(e){} }
        g.linearRampToValueAtTime(1, T()+0.5);               // fade in 0.5s
      }
    }catch(e){}
  };
  API.toggleMute = function(){ API.setMuted(!muted); return muted; };
  API.isMuted    = function(){ return muted; };
  API.setMusicVolume = function(v){ musicVol=clamp01(v); save();
    try{ if(musicBus){ var g=musicBus.gain; g.cancelScheduledValues(T()); g.setValueAtTime(g.value,T()); g.linearRampToValueAtTime(gainFor(musicVol), T()+0.08); } }catch(e){}
    try{ if(fileAudio && !muted) fileAudio.volume = gainFor(musicVol); }catch(e){} };
  API.getMusicVolume = function(){ return musicVol; };
  API.setSfxVolume = function(v){ sfxVol=clamp01(v); save();
    try{ if(sfxBus){ sfxBus.gain.setValueAtTime(gainFor(sfxVol), T()); } }catch(e){} };
  API.getSfxVolume = function(){ return sfxVol; };
  // back-compat: setVolume/getVolume operate on both channels
  API.setVolume  = function(v){ API.setMusicVolume(v); API.setSfxVolume(v); };
  API.getVolume  = function(){ return (musicVol+sfxVol)/2; };
  API.unlock     = unlock;
  API.isSupported= function(){ return supported; };

  if(win) win.RiftAudio = API;
  if(typeof globalThis!=='undefined') globalThis.RiftAudio = API;
})();
</script>

  /* ---------------- main menu ---------------- */
  const NAV_ICO = {

    characters:`<svg class="mi-ico" viewBox="0 0 16 16"><g fill="currentColor"><circle cx="5.5" cy="5" r="2.4"/><circle cx="11" cy="5.5" r="2"/><path d="M1.5 14 C1.5 10.5 3.3 8.8 5.5 8.8 C7.7 8.8 9.5 10.5 9.5 14 Z"/><path d="M9.6 14 C9.6 11 10.8 9.4 12.6 9.4 C14 9.4 14.8 10.6 14.8 14 Z"/></g></svg>`,

  let wizStack = [];

  function wizMapSelect(){

  /* ================= Escalations (single-player ladder) =================
     Six Escalations across three difficulty tiers, all unlocked. Each is a
     sequence of battles ending in a mirror team of the home class; AI tier is
     drawn from the tier's pool per battle (highest tier on the final). State
     lives in `escRun` (scoped to this flow), serializable for a future save.   */
  const ESC_COUNT = { easy:3, medium:4, hard:5 };
  const ESC_TIERS = {                       // AI-difficulty pool drawn from per battle
    easy:   ['random','heuristic'],
    medium: ['random','heuristic','captain'],
    hard:   ['random','heuristic','captain','warden'],
  };
  const ESC_FINAL = { easy:'heuristic', medium:'captain', hard:'warden' };   // final battle tier
  const ESC_TIER_LABEL = { easy:'Easy', medium:'Medium', hard:'Hard' };
  // homeClass uses the engine class key; its codename renders via dn(), its zone
  // background via zoneBgPath() (which equals the required bg mapping).
  const ESCALATIONS = [
    { id:'radiant_compact', name:'Radiant Compact Vigil',  difficulty:'easy',   homeClass:'Cleric'   },
    { id:'pale_rim',        name:'Pale Rim Circuit',        difficulty:'easy',   homeClass:'Drifter'  },
    { id:'ashfield',        name:'Ashfield Run',            difficulty:'medium', homeClass:'Scout'    },
    { id:'holdfast',        name:'Holdfast Siege',          difficulty:'medium', homeClass:'Warden'   },
    { id:'shatter_court',   name:'Shatter Court Gauntlet',  difficulty:'hard',   homeClass:'Arcanist' },
    { id:'chrome_fold',     name:'Chrome Fold Descent',     difficulty:'hard',   homeClass:'Soldier'  },
  ];
  function escDefById(id){ return ESCALATIONS.find(e=>e.id===id) || null; }
  function pickRand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  // a valid random 2-operative enemy team: two DIFFERENT classes (mirror is reserved for the final).
  function randomEnemyTeam(){ const cs=Object.keys(GF.CLASSES); const a=pickRand(cs); return [a, pickRand(cs.filter(c=>c!==a))]; }

  // Build a fresh, serializable run object for an Escalation + player team.
  function buildEscalationRun(escId, playerTeam){
    const def = escDefById(escId);
    const total = ESC_COUNT[def.difficulty];
    const pool = ESC_TIERS[def.difficulty];
    const battles = [];
    for(let i=0;i<total;i++){
      const isFinal = i===total-1;
      battles.push({
        opponentTeam: isFinal ? [def.homeClass, def.homeClass] : randomEnemyTeam(),
        aiTier: isFinal ? ESC_FINAL[def.difficulty] : pickRand(pool),
        result: null,
      });
    }
    return {
      escalationId: escId,
      difficulty: def.difficulty,
      playerTeam: playerTeam.slice(),
      currentBattle: 0,
      totalBattles: total,
      battles,
    };
  }

  function beginEscalation(escId, playerTeam){
    UI.escSetup = null;
    escRun = buildEscalationRun(escId, playerTeam);
    showInterBattle();
  }

  // Inter-battle brief: battle N of M, upcoming opponent preview, Continue.
  function showInterBattle(){
    clearOverlay();
    music('menu');
    const def = escDefById(escRun.escalationId);
    const idx = escRun.currentBattle, total = escRun.totalBattles;
    const b = escRun.battles[idx];
    const isFinal = idx===total-1;
    const pips = escRun.battles.map((bt,i)=>{
      const cls = i<idx ? 'done' : (i===idx ? 'cur' : '');
      const fin = i===total-1 ? 'final' : '';
      return `<span class="esc-pip ${cls} ${fin}" title="Battle ${i+1}${i===total-1?' · final (mirror)':''}"></span>`;
    }).join('');
    const opHTML = (c)=>`<div class="esc-prev-op" style="--cls:${classColor(c)}">
        <div class="cport"><img src="${portraitFor({className:c})}" alt="" onerror="this.style.display='none'"><span class="ph">${esc(dn(c))}</span></div>
        <div class="nm">${esc(dn(c))}</div>
      </div>`;
    const node = showOverlay(`

  // Launch the current Escalation battle: zone locked to the home zone, AI tier from the battle.
  function startEscalationBattle(){
    const def = escDefById(escRun.escalationId);
    const b = escRun.battles[escRun.currentBattle];
    UI.mode = b.aiTier;                 // aiForMode(UI.mode) in runRound uses this tier
    deployMatch(escRun.playerTeam, b.opponentTeam, def.homeClass);   // mapKey=homeClass → home zone bg
  }

  // Called from showEnd when an Escalation run is active. Player is side 0.
  // Idempotent per match: a stale "See result" button (still in the DOM behind the
  // inter-battle overlay / fight intro) can re-fire showEnd — guard so each match's
  // result is processed exactly once and a finished/empty state can't advance the run.
  function escEnd(){
    const st = UI.state, r = st && st.result;
    const cur = escRun && escRun.battles[escRun.currentBattle];
    if(!st || !r || st._escHandled || !cur) return;
    st._escHandled = true;
    const win = r.winner===0;
    cur.result = win ? 'win' : (r.winner===1 ? 'loss' : 'draw');
    if(win){
      aud('MATCH_WIN');
      escRun.currentBattle++;
      if(escRun.currentBattle >= escRun.totalBattles){ showEscalationClear(); }
      else { showInterBattle(); }
    } else {
      showEscalationFail();
    }
  }

  function showEscalationClear(){
    const def = escDefById(escRun.escalationId);
    aud('MATCH_WIN'); music('victory');
    recordEscalationClear(def.id);
    const node = showOverlay(`

        <h1 class="end-title">Escalation Complete</h1>
        <p class="end-reason">The breaches across <b>${esc(GF.CLASSES[def.homeClass].world)}</b> are sealed. ${esc(def.name)} is secured.</p>
        <p class="end-reason" style="opacity:.7;font-style:italic">Unlock rewards arrive in a future update.</p>
        <div class="row end-actions">
          <button class="primary" data-act="more">Escalations</button>
          <button data-act="menu">Main Menu</button>
        </div>
      </div>`);
    node.querySelector('[data-act="more"]').onclick=()=>{ clearOverlay(); escRun=null; showEscalations(); };
    node.querySelector('[data-act="menu"]').onclick=()=>{ clearOverlay(); showStart(); };

  function showEscalationFail(){
    const def = escDefById(escRun.escalationId);
    aud('MATCH_LOSS'); music('menu');
    const failedId = def.id, team = escRun.playerTeam.slice();
    const reached = escRun.currentBattle+1, total = escRun.totalBattles;

      <div id="end" class="end-screen loss" style="background-image:linear-gradient(rgba(8,8,6,.74),rgba(8,8,6,.92)), url('${zoneBgPath(def.homeClass)}')">
        <div class="end-tag">${esc(def.name)} · ${ESC_TIER_LABEL[def.difficulty]} Escalation</div>
        <h1 class="end-title">Escalation Failed</h1>
        <p class="end-reason">Your cell fell at <b>battle ${reached} of ${total}</b>. There are no mid-Escalation checkpoints — a retry restarts from the first battle.</p>

    node.querySelector('[data-act="abandon"]').onclick=()=>{ clearOverlay(); escRun=null; showEscalations(); };

  // Escalations select screen — 6 cards, 2x3, all unlocked.
  function showEscalations(){

  /* ---------------- save stub (localStorage; foundation only) ----------------
     Lightweight player profile. Read silently / fail gracefully if missing or
     corrupt. Extended later for unlocks + multiplayer identity.                */
  const SAVE_KEY = 'rift_player';
  function loadPlayer(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return { displayName:'', escalationClears:{} };
      const o = JSON.parse(raw) || {};
      return { displayName: o.displayName || '', escalationClears: o.escalationClears || {} };
    }catch(e){ return { displayName:'', escalationClears:{} }; }
  }
  function savePlayer(p){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(p)); }catch(e){} }
  function recordEscalationClear(escId){
    try{ const p = loadPlayer(); p.escalationClears[escId] = true; savePlayer(p); }catch(e){}
  }

  /* ---------------- per-round driver ---------------- */
  function runRound(){
    const st = UI.state;
    GF.startOfTurn(st);
    if(st.over){ showEnd(); return; }   // a burn could finish the match at start of turn
    GF.drawHands(st);
    UI.picks = [[],[]];
    if(UI.mode==='hotseat'){
      UI.steps = [
        ()=> showPass('Player 1', ()=> doSelection(0)),
        ()=> showPass('Player 2', ()=> doSelection(1)),
        ()=> resolveAndShow(),
      ];
    } else {
      UI.steps = [
        ()=> doSelection(0),
        ()=>{ UI.picks[1] = GF.aiForMode(UI.mode)(st,1); resolveAndShow(); },
      ];
    }
    UI.stepIdx = 0; nextStep();
  }
  function nextStep(){ const s = UI.steps[UI.stepIdx++]; if(s) s(); }

  /* ---------------- pass-the-device cover (hotseat) ---------------- */
  function showPass(label, next){
    const node = showOverlay(`
      <div id="cover">
        <div class="muted">Hotseat</div>
        <h1>Pass the device to<br>${esc(label)}</h1>
        <p class="muted">Make sure the previous player isn't looking.</p>
        <button class="primary" data-act="ready">${esc(label)} is ready — tap to continue</button>
      </div>`);
    node.querySelector('[data-act="ready"]').onclick=()=>{ clearOverlay(); next(); };
  }

  /* ---------------- selection screen ---------------- */
  // Hand grouped by living fighter, each group ordered by tier speed (1→4).
  // Two groups when both fighters live (rendered with a gap); one when solo.
  function livingHandGroups(side){
    return side.fighters.filter(f=>f.alive && f.hand && f.hand.length)
      .map(f=>({owner:f, items:f.hand.slice().sort((a,b)=> (a.card.speed-b.card.speed) || a.card.name.localeCompare(b.card.name))}));
  }
  function livingHand(side){ return livingHandGroups(side).flatMap(g=>g.items); }
  // owner-performs: the card is performed by its owner; we only choose the
  // enemy target (attacks) or the ally recipient (ally cards).
  function addablePicks(state, sideIdx, picks, hi){
    const side=state.sides[sideIdx];
    const allies=GF.livingFighters(side);
    const enemies=GF.livingFighters(GF.enemyOf(state,sideIdx));
    const card=hi.card, owner=hi.owner, out=[];
    if(owner.turn.silencedTypes && owner.turn.silencedTypes.has(card.type)) return out;
    let targs;
    if(card.aim==='enemy') targs = enemies;
    else if(card.aim==='ally') targs = allies;          // choose which ally receives it
    else if(card.aim==='self') targs = [owner];
    else targs = [null];                                 // enemyAll / allyAll / none
    for(const t of targs){
      const p={handItem:hi, card, owner, caster:owner, target:t};
      if(GF.validatePicks(state,sideIdx,picks.concat([p])).ok) out.push(p);
    }
    return out;
  }

  // Draw one card from a fighter's own deck into its hand (reshuffling the
  // discard pile if the draw pile is empty). Used by discard-to-redraw.
  function drawOneInto(f, rng){
    if(f.deck.draw.length===0){
      if(f.deck.discard.length===0) return null;     // deck fully exhausted
      f.deck.draw = rng.shuffle(f.deck.discard.slice()); f.deck.discard = [];
    }
    const card = f.deck.draw.shift();
    if(card){ f.hand = f.hand || []; f.hand.push({card, owner:f}); }
    return card;
  }
  // floating full-card preview, shown when hovering a staged ability in the arena
  let _cardPreviewEl=null;
  function showCardPreview(card, anchorEl){
    if(!_cardPreviewEl){ _cardPreviewEl=document.createElement('div'); _cardPreviewEl.className='card-preview'; document.body.appendChild(_cardPreviewEl); }
    _cardPreviewEl.innerHTML = catalogCardHTML(card);
    _cardPreviewEl.style.display='block';
    const r=anchorEl.getBoundingClientRect();
    const pw=_cardPreviewEl.offsetWidth, ph=_cardPreviewEl.offsetHeight;
    let left = Math.max(8, Math.min(window.innerWidth - pw - 8, r.left + r.width/2 - pw/2));
    let top = r.top - ph - 10;                 // prefer above the staged chip
    if(top < 8) top = r.bottom + 10;           // flip below if there's no room
    _cardPreviewEl.style.left = left+'px';
    _cardPreviewEl.style.top = top+'px';
  }
  function hideCardPreview(){ if(_cardPreviewEl) _cardPreviewEl.style.display='none'; }
  // large, easy-to-read card popup pinned to an open corner (bottom-right) while
  // hovering a card in the hand.
  let _handPreviewEl=null;
  // Full expanded card for the top-of-screen popup: name, cost, type, the rules
  // text and the green "how it works" hint. (catalogCardHTML omits the hint.)
  function previewCardHTML(c){
    const cost=GF.energyCost(c);
    return `<div class="catcard" style="--cls:${classColor(c.cls)}">
      <div class="ph"><span class="pn">${esc(c.name)}</span>
        <span class="cost t${c.speed}" title="costs ${cost} energy (T${c.speed})"><span class="ecirc"></span>${cost}</span></div>
      <div class="cardart catcard-art sym-${typeKey(c.type)}" style="--ct:${typeColor(c.type)}">
        <img class="cardart-img" src="${typeArtFor(c.type)}" alt="" onerror="this.style.display='none'">
        <span class="artph">${esc(c.type)}</span></div>
      <div class="pt"><span class="tsym-wrap">${typeSymHTML(c)}</span> <span class="spd t${c.speed}">T${c.speed}</span> ${esc(c.type)}${c.once?' · once':''}</div>
      <div class="pe">${esc(c.text)}</div>
      ${keywordReminders(c)}
      ${c.hint?`<div class="phint">↳ ${esc(c.hint)}</div>`:''}
      ${c.flavor?`<div class="pf">${esc(c.flavor)}</div>`:''}
    </div>`;
  }
  function showHandPreview(card){
    if(!_handPreviewEl){ _handPreviewEl=document.createElement('div'); _handPreviewEl.className='hand-preview'; document.body.appendChild(_handPreviewEl); }
    _handPreviewEl.innerHTML = previewCardHTML(card);
    _handPreviewEl.style.display='block';
  }
  function hideHandPreview(){ if(_handPreviewEl) _handPreviewEl.style.display='none'; }
  function doSelection(sideIdx){
    UI.sel = { sideIdx, picks:[], stage:null, pendingHi:null, discardUsed:false, discardMode:false };
    UI.deckView = null;
    drawSelection();
  }

  function drawSelection(){
    hideCardPreview();
    const st = UI.state, sel = UI.sel, sideIdx = sel.sideIdx;
    const side = st.sides[sideIdx], enemy = GF.enemyOf(st, sideIdx);
    const groups = livingHandGroups(side);          // one per living fighter, tier-sorted
    const hand = groups.flatMap(g=>g.items);         // flat, same order (for indexing/wiring)
    const usedItems = new Set(sel.picks.map(p=>p.handItem));
    const reservedDiscards = new Set(sel.picks.map(p=>p.discardHi).filter(Boolean));  // cards spent as discard-on-play cost
    const budget = GF.energyBudget(st, side), spent = GF.energyOf(sel.picks), remaining = budget - spent;
    const nextEnergy = GF.roundEnergy(st.round+1);
    const addableMap = new Map();
    hand.forEach(hi=>{ if(!usedItems.has(hi) && !reservedDiscards.has(hi)) addableMap.set(hi, addablePicks(st, sideIdx, sel.picks, hi)); });

    // valid click targets for the current stage
    let validEnemy = new Set(), validAlly = new Set();
    if(sel.pendingHi){
      const picksOf = addableMap.get(sel.pendingHi) || [];
      if(sel.stage==='target') picksOf.forEach(p=>{ if(p.target) validEnemy.add(p.target.uid); });
      if(sel.stage==='ally')   picksOf.forEach(p=>{ if(p.target) validAlly.add(p.target.uid); });
    }

    const hint = sel.discardMode ? `Tap a card to <b>discard &amp; redraw</b> it — or tap Discard again to cancel.`
              : sel.stage==='target' ? `Choose the <b>enemy</b> target for <b>${esc(sel.pendingHi.card.name)}</b>.`
              : sel.stage==='ally'   ? `Choose which <b>ally</b> receives <b>${esc(sel.pendingHi.card.name)}</b>.`
              : sel.stage==='discard'? `Choose a card to <b>discard</b> for <b>${esc(sel.pendingHi.card.name)}</b> — click it again to cancel.`
              : remaining<=0 ? `Out of energy — confirm.`
              : `Click a card to play it. <b>${remaining}</b> energy left.`;

    // --- top bar, side panels, staging & dock ---
    const mobile = isMobileViewport();
    const hasStaged = sel.picks.length||sel.pendingHi;
    const pips = Array.from({length:budget}, (_,i)=>`<i class="${i<remaining?'on':''}"></i>`).join('');

    // top bar. Desktop: quit + round + hint. Mobile: Round (left) · Menu (center);
    // Discard is a separate fixed top-right button, energy/Confirm/Undo are side rails.
    const top = mobile
      ? `<span class="top-round">Round ${st.round}<span class="tr-of">/5</span></span>
         <button class="mtop-menu" data-act="gamemenu" title="Menu" aria-label="Menu">☰</button>`
      : topBarHTML(st, hint);

    // center control cluster (desktop only): energy → round → Confirm / Undo / Menu.
    const controls = mobile ? '' : `<div class="ctrl-cluster">
        <div class="energy-box">
          <div class="big"><span class="elabel">Energy:</span> ${remaining} / ${budget}${st.round<5?` <span class="enext">→ ${nextEnergy} next round</span>`:` <span class="enext">max</span>`}</div>
          <div class="pips" aria-hidden="true" title="${remaining} of ${budget} energy available">${pips}</div>
        </div>
        <div class="ctrl-buttons">
          <button class="ctrlbtn confirm-btn" data-act="lock"><span class="cbl">Confirm</span> <span class="cb-sword">⚔</span></button>
          <button class="ctrlbtn undo-btn" data-act="clear" ${hasStaged?'':'disabled'}><span class="cbl">Undo</span></button>
          <button class="ctrlbtn menu-btn" data-act="gamemenu"><span class="cbl">Menu</span></button>
        </div>
      </div>
      <div class="round-badge" title="Round ${st.round} of 5">Round ${st.round}<span class="rb-of">/5</span></div>`;

    // mobile fixed side rails: energy pips (left), Confirm ✓ over Undo ↺ (right).
    const mobileRails = mobile ? `
      <div class="mrail mrail-energy" aria-hidden="true"><div class="me-pips">${pips}</div><div class="me-count">${remaining}/${budget}</div></div>
      <div class="mrail mrail-ctrl">
        <button class="mctrl mctrl-confirm" data-act="lock" title="Confirm" aria-label="Confirm">✓</button>
        <button class="mctrl mctrl-undo" data-act="clear" ${hasStaged?'':'disabled'} title="Undo" aria-label="Undo">↺</button>
      </div>` : '';

    // staging: clicked cards wait in the arena middle, shown in cast order (tier
    // speed). Lock in / Undo all sit directly beneath them, above your portraits.
    // A prominent notice appears here while a target is being chosen.
    const targetNotice = (sel.stage==='target' || sel.stage==='ally')
      ? `<div class="target-notice ${sel.stage==='ally'?'ally':'enemy'}">
           ${sel.stage==='ally' ? 'Choose an <b>ally</b> to receive' : 'Choose an <b>enemy</b> target for'} <b>${esc(sel.pendingHi.card.name)}</b>
           <span class="tn-sub">${sel.stage==='ally'?'click a glowing ally below':'click a glowing enemy above'}</span>
         </div>`
      : '';
    const ordered = sel.picks.map((p,i)=>({p,i})).sort((a,b)=> (a.p.card.speed-b.p.card.speed) || (a.i-b.i));
    const staging = `<div class="staging">
        ${targetNotice}
        <div class="staging-label">${sel.picks.length ? 'Playing this round (cast order) — tap to remove' : ''}</div>
        <div class="staging-row">${ordered.map(o=>stagedCardHTML(o.p,o.i)).join('')}</div>
        ${sel.picks.length||sel.pendingHi ? '' : '<div class="staging-empty">Tap a card below to stage it here</div>'}
      </div>`;

    // card tray: one section per operative, tinted with that operative's class color.
    // `gi` walks the flat `hand` order (groups preserve fighter order), so the
    // data-hand indices stay aligned with the wiring below.
    let gi = 0;
    // mobile viewport → render each operative's hand as compact pill columns.
    const renderCard = mobile ? cardPillHTML : handCardHTML;
    const aliveCount = side.fighters.filter(f=>f.alive).length;
    // only living operatives get a hand section — a lone survivor's hand then
    // centers across the full width instead of sitting in its half.
    const traySecs = side.fighters.filter(f=>f.alive).map(f=>{
      const g = groups.find(gr=>gr.owner===f);     // undefined if this operative has no cards in hand
      let cardsHTML='';
      if(g){
        cardsHTML = g.items.map(hi=>{
          const idx = gi++;                         // absolute index into flat `hand`
          if(usedItems.has(hi) || reservedDiscards.has(hi)) return '';   // queued or spent as discard cost
          const others = hand.some(h=> h!==hi && !usedItems.has(h) && !reservedDiscards.has(h));
          const playable = (addableMap.get(hi)||[]).length>0 && (!hi.card.discardOnPlay || others);
          const unaffordable = !playable && GF.energyCost(hi.card) > remaining;
          return renderCard(hi, idx, false, !playable && !unaffordable, sel.pendingHi===hi, unaffordable, !sel.discardUsed);
        }).join('');
      }
      const label = f.alive ? esc(dn(f.className)) : (esc(dn(f.className)) + " — KO'd");
      const inner = !f.alive ? '<div class="tray-empty">—</div>'
                  : !g       ? '<div class="tray-empty">No cards</div>'
                  : `<div class="hand-fan"><div class="hand-group">${cardsHTML}</div></div>`;
      return `<div class="tray-sec ${f.alive?'':'ko'}" style="--cls:${classColor(f.className)}">
          <div class="tray-label">${label}</div>${inner}</div>`;
    }).join('<div class="tray-div"></div>');
    const handSlot = `<div class="card-tray${mobile?' pills':''}${mobile&&aliveCount===1?' solo':''}${mobile&&sel.discardMode?' discarding':''}">${traySecs}</div>`;

    // deck viewer (opened by clicking a deck in the right rail), contained in the arena
    let deckViewer='', dvCards=[];
    if(UI.deckView!=null){
      const dvF = side.fighters.find(f=>f.uid===UI.deckView);
      if(dvF){ dvCards = dvF.deck.draw.slice().sort((a,b)=>(a.speed-b.speed)||a.name.localeCompare(b.name)); deckViewer = deckViewerHTML(dvF, dvCards); }
      else UI.deckView=null;
    }

    render(frameHTML({
      top, controls,
      center: enemyZoneHTML(sideIdx, st, {
        staging, deckViewer,
        enemy:(f)=>({enemy:true, clickable: validEnemy.has(f.uid), targetKind:'enemy'})
      }),
      hand: `<div class="arena-slot">${handSlot}</div>${mobile?mobileRails+(UI.deckView==null?mobDiscardHTML(sel):''):''}`,
      you: yourZoneHTML(sideIdx, st, {
        decks: deckRailHTML(side),
        you:(f)=>({clickable: validAlly.has(f.uid), targetKind:'ally'})
      })
    }));
    if(sel.stage && $('#battle')) $('#battle').classList.add('targeting');

    // scroll-edge affordance: toggle fade gradients on the hand row when the
    // cards overflow the viewport (so it's clear more hand exists off-screen).
    const tray = $('.card-tray'), traySlot = tray && tray.closest('.arena-slot');
    if(tray && traySlot){
      const updFades=()=>{
        const overflow = tray.scrollWidth - tray.clientWidth;
        traySlot.classList.toggle('tray-more', overflow - tray.scrollLeft > 4);
        traySlot.classList.toggle('tray-less', tray.scrollLeft > 4);
      };
      updFades();
      tray.addEventListener('scroll', updFades, {passive:true});
    }

    // wire hand cards
    $$('.hand-fan .pcard').forEach(el=>{
      const idx=+el.dataset.hand, hi=hand[idx];
      // Expanded card popup (top of screen): hover on desktop, press-and-hold on
      // mobile. The same component for both; a quick tap still plays the card.
      if(hi){
        el.onmouseenter=()=> showHandPreview(hi.card);
        el.onmouseleave=hideHandPreview;
        let _pt=null;
        el.addEventListener('touchstart',()=>{ el._lp=false; _pt=setTimeout(()=>{ el._lp=true; showHandPreview(hi.card); }, 400); }, {passive:true});
        const endTouch=()=>{ if(_pt){ clearTimeout(_pt); _pt=null; } if(el._lp) hideHandPreview(); };
        el.addEventListener('touchend', endTouch); el.addEventListener('touchcancel', endTouch);
        el.addEventListener('touchmove',()=>{ if(_pt){ clearTimeout(_pt); _pt=null; } }, {passive:true});
      }
      const disc=el.querySelector('.disc');
      if(disc) disc.onclick=(ev)=>{ ev.stopPropagation(); doDiscard(hi); };
      // mobile discard mode (armed via the fixed top-right Discard button): tap any
      // card to discard & redraw it. Takes priority over staging.
      if(sel.discardMode){
        el.onclick=()=>{ if(el._lp){ el._lp=false; return; } if(hi) doDiscard(hi); };
        return;
      }
      // during a discard-on-play selection, every card is a discard candidate
      if(sel.stage==='discard'){
        if(hi!==sel.pendingHi) el.classList.add('discardable');
        el.onclick=()=>{
          if(el._lp){ el._lp=false; return; }   // ignore the tap that ends a long-press preview
          if(hi===sel.pendingHi){ resetPending(); drawSelection(); return; }  // click the source again to cancel
          const base=addableMap.get(sel.pendingHi)[0];
          commitPick(Object.assign({}, base, {discardHi:hi}));
        };
        return;
      }
      if(usedItems.has(hi) || (addableMap.get(hi)||[]).length===0) return;
      el.onclick=()=>{
        if(el._lp){ el._lp=false; return; }   // ignore the tap that ends a long-press preview
        const card=hi.card;
        sel.pendingHi=hi;
        if(card.discardOnPlay){ sel.stage='discard'; drawSelection(); }       // pick a card to discard
        else if(card.aim==='enemy'){ sel.stage='target'; drawSelection(); }
        else if(card.aim==='ally'){
          const opts=addableMap.get(hi);
          if(GF.livingFighters(side).length===1 || opts.length===1) commitPick(opts[0]);
          else { sel.stage='ally'; drawSelection(); }
        } else { commitPick(addableMap.get(hi)[0]); }   // self / aoe / team
      };
    });
    // wire fighters
    $$('.cfighter').forEach(el=>{
      const uid=+el.dataset.uid;
      if(validEnemy.has(uid)) el.onclick=()=> commitPick(addableMap.get(sel.pendingHi).find(p=>p.target&&p.target.uid===uid));
      else if(validAlly.has(uid)) el.onclick=()=> commitPick(addableMap.get(sel.pendingHi).find(p=>p.target&&p.target.uid===uid));
    });
    // staged cards (full card face): tap anywhere to unqueue
    $$('.staged[data-pick]').forEach(el=>{
      const pi=+el.dataset.pick;
      el.onclick=()=>{ hideCardPreview(); aud('CARD_REMOVE'); sel.picks.splice(pi,1); resetPending(); drawSelection(); };
    });
    // deck view: single tap toggles the deck viewer — desktop deck rail, or the small
    // deck icon on each ally portrait (mobile). stopPropagation so tapping the icon on a
    // portrait can't also trigger ally-targeting.
    $$('[data-deckview]').forEach(el=> el.onclick=(e)=>{ e.stopPropagation(); const uid=+el.dataset.deckview; UI.deckView=(UI.deckView===uid?null:uid); drawSelection(); });
    if(UI.deckView!=null){
      const pane=$('#dvPreview');
      const cardsEl=$$('.dv-card');
      const showPrev=(el)=>{ if(!pane) return; pane.innerHTML = dvPreviewHTML(dvCards[+el.dataset.dvi]); cardsEl.forEach(x=>x.classList.toggle('active', x===el)); };
      cardsEl.forEach(el=>{ el.onmouseenter=()=> showPrev(el); el.onclick=()=> showPrev(el); });   // hover or tap; preview persists below the list
      const cl=$('[data-act="dvclose"]'); if(cl) cl.onclick=()=>{ UI.deckView=null; drawSelection(); };
      const bd=$('[data-act="dvbackdrop"]'); if(bd) bd.onclick=(e)=>{ if(e.target===bd){ UI.deckView=null; drawSelection(); } };   // tap outside closes
    }
    const quitBtn=$('[data-act="quit"]'); if(quitBtn) quitBtn.onclick=()=> confirmQuit();
    const menuBtn=$('[data-act="gamemenu"]'); if(menuBtn) menuBtn.onclick=()=> openGameMenu();
    // Undo button (desktop cluster / mobile right rail): clear all staged cards
    const clearBtn=$('[data-act="clear"]'); if(clearBtn) clearBtn.onclick=()=>{ sel.picks=[]; resetPending(); aud('CARD_REMOVE'); drawSelection(); };
    // mobile discard button: toggle arm/disarm (once per turn; disabled after use)
    const discBtn=$('[data-act="discard"]');
    if(discBtn) discBtn.onclick=(e)=>{ e.stopPropagation(); if(sel.discardUsed) return; sel.discardMode=!sel.discardMode; resetPending(); drawSelection(); };
    // (mobile deck view is the tap-only deck icon on each portrait — see [data-deckview] above)
    // right-click in battle = Undo (clear all staged cards); first closes the deck viewer if open
    UI.back = ()=>{
      if(UI.deckView!=null){ UI.deckView=null; drawSelection(); return true; }
      if(sel.picks.length || sel.pendingHi){ sel.picks=[]; resetPending(); aud('CARD_REMOVE'); drawSelection(); }
      return true;   // swallow — never let a right-click quit the match
    };
    $('[data-act="lock"]').onclick=()=>{ if(!sel.pendingHi){
      // finalize discard-on-play costs: move reserved discards to their decks
      sel.picks.forEach(p=>{ if(p.discardHi){ const o=p.discardHi.owner; o.hand=o.hand.filter(x=>x!==p.discardHi); o.deck.discard.push(p.discardHi.card); } });
      UI.picks[sideIdx]=sel.picks; nextStep();
    } };
    // auto-lock hook (used only by the multiplayer turn timer): drop any half-made
    // target choice, then lock in whatever is currently staged.
    UI._lockNow = ()=>{ resetPending(); const lb=$('[data-act="lock"]'); if(lb) lb.click(); };
    const tutBtn=$('[data-act="tut"]'); if(tutBtn) tutBtn.onclick=()=>{ UI.tutOpen=!UI.tutOpen; drawSelection(); };
    $$('[data-acc]').forEach(b=> b.onclick=()=>{ const i=+b.dataset.acc; UI.tutSec[i]=!UI.tutSec[i]; drawSelection(); });
    applyArena('#battle', st);
    // Recon tutor: if a living fighter earned a pick this turn, offer it (UI only)
    if(!overlay){ const rf = side.fighters.find(f=>f.alive && f.turn.reconPick); if(rf) showReconPicker(rf); }

    function commitPick(p){ if(!p) return; sel.picks.push({handItem:p.handItem,card:p.card,owner:p.owner,caster:p.caster,target:p.target,discardHi:p.discardHi||null}); aud('CARD_STAGE'); resetPending(); drawSelection(); }
    function resetPending(){ sel.pendingHi=null; sel.stage=null; }
    function doDiscard(hi){
      if(sel.discardUsed) return;
      // remove from any queued pick, from owner's hand, to discard pile, then
      // immediately redraw one card from that same deck to replace it.
      sel.picks = sel.picks.filter(p=>p.handItem!==hi);
      const owner=hi.owner; owner.hand = owner.hand.filter(x=>x!==hi); owner.deck.discard.push(hi.card);
      drawOneInto(owner, UI.state.rng);
      aud('CARD_REMOVE');
      sel.discardUsed=true; sel.discardMode=false; resetPending(); drawSelection();
    }
  }

  const sleep = (ms)=> new Promise(r=> setTimeout(r, ms));
  function floatOn(uid, text, cls){
    const layer=$(`[data-float="${uid}"]`); if(!layer) return;

  function updateFighter(uid, hp, delta, status, absorbed, negated){
    const fill=$(`[data-hp="${uid}"]`), num=$(`[data-hpnum="${uid}"]`), tags=$(`[data-tags="${uid}"]`);
    const card=$(`.cfighter[data-uid="${uid}"]`);
    const max = fill ? (+fill.dataset.max||20) : 20;
    if(fill) fill.style.width = Math.max(0,Math.min(100, hp/max*100))+'%';
    if(num) num.textContent = Math.max(0,hp)+'/'+max;
    if(tags) tags.innerHTML = tagsHTML(status);
    if(card && hp<=0) card.classList.add('dead');
    if(delta<0){ floatOn(uid, ''+delta, 'dmg'); if(card){ card.classList.add('hit'); setTimeout(()=>card.classList.remove('hit'),320); } }
    else if(delta>0){ floatOn(uid, '+'+delta, 'heal'); }
    if(absorbed>0){
      // show the block — especially important when the hit was fully negated (delta 0)
      floatOn(uid, (delta>=0 ? '🛡 blocked '+absorbed : '🛡 '+absorbed), 'block');
      if(card){ card.classList.add('blockflash'); setTimeout(()=>card.classList.remove('blockflash'),360); }
    } else if(negated && delta>=0){
      // an attack landed but defenses reduced it to nothing
      floatOn(uid, 'negated', 'block');
      if(card){ card.classList.add('blockflash'); setTimeout(()=>card.classList.remove('blockflash'),360); }
    }
  }
  /* ---- art wiring (graceful fallback to colored placeholders) ---- */
  const CLASS_COLOR = { Soldier:'#c9a24a', Arcanist:'#9a6cff', Scout:'#46b3c9', Drifter:'#d08a4a', Cleric:'#e6dca0', Warden:'#5fae7e' };

  const WARP_ZONES = {

    Arcanist: { bg:'gf_bg_tempest_v1.webp',  entry:"A storm-wracked ruin of a civilization that burned too bright. Residual arcane discharge from the collapse keeps tearing new breach points faster than they can be closed. Tempest holds primary assignment — the only one who can read the discharge patterns and predict the next tear." },
    Scout:    { bg:'gf_bg_wasteland_v1.jpg', entry:"A dead expanse of irradiated flats where nothing moves that does not want to be seen. The breach here is quiet and wide — the most dangerous kind. Wraith holds primary assignment, and prefers to work it alone." },
    Drifter:  { bg:'gf_bg_western_v1.webp',  entry:"A sun-bleached frontier system on the edge of total stellar collapse. Breach points here open and close unpredictably, demanding long-range threat response before RIFT extraction teams can get close. Longshot holds primary assignment, and does not call for backup." },
    Cleric:   { bg:'gf_bg_shrine_v1.jpg',    entry:"What was once a sanctuary world is now a breach hotspot drawing threats from six adjacent dimensions at once. Beacon holds primary assignment, and has run sustained support operations here longer than any operative has held a single zone." },
    Warden:   { bg:'gf_bg_aegis_v1.webp',    entry:"An orbital station in permanent siege condition, now also a breach magnet for dimensional threats drawn to concentrated structural resistance. Aegis holds primary assignment. The station has not fallen. It will not." },

  function zoneBgPath(cls){ return BG_DIR + (WARP_ZONES[cls] ? WARP_ZONES[cls].bg : ''); }
  function classColor(cls){ return CLASS_COLOR[cls] || '#d8a657'; }
  function portraitFor(f){
    // class portrait; <img onerror> hides a missing file so the placeholder shows.
    // (enemy-specific art keyed by class would slot in here once it exists.)
    return 'artassets/characterportraits/gf_' + f.className.toLowerCase() + '_portrait_v1.jpg';

  // Per-class deck card-back (used for the on-board draw piles). Path derived from
  // the artassets/cardbacks/ naming convention; <img onerror> reveals a color back.
  function cardBackFor(cls){ return 'artassets/cardbacks/gf_card_back_' + String(cls).toLowerCase() + '.webp'; }
  // Per-type card illustration from artassets/skillportraits/. Types without a file
  // (e.g. Equip) fall back to the type-color background behind the <img>.
  const TYPE_COLOR = { attack:'var(--bad)', defend:'var(--t1)', buff:'var(--good)', spell:'var(--pierce)', potion:'var(--t2)', equip:'var(--accent)', signature:'#f2c14e' };
  function typeColor(type){ return TYPE_COLOR[typeKey(type)] || 'var(--accent)'; }
  function typeArtFor(type){ return 'artassets/skillportraits/gf_card_' + typeKey(type) + '.webp'; }
  // try a list of image URLs in order; call onLoad(url) for the first that loads.
  function loadFirst(urls, onLoad){
    let i=0;
    (function next(){ if(i>=urls.length) return; const u=urls[i++]; const img=new Image();
      img.onload=()=>onLoad(u); img.onerror=next; img.src=u; })();
  }
  // best available battle-arena background; if none load, keep the gradient.
  function applyArena(elSelector, st){
    const el = $(elSelector); if(!el) return;
    const urls = [];
    if(UI.mapBg) urls.push(UI.mapBg);              // selected Warp Zone background (random by default)
    // graceful fallbacks: themes drawn from the fighters' classes, then the rest
    const themes = [];
    for(const side of st.sides) for(const f of side.fighters){ const t=CLASS_THEME[f.className]; if(t && !themes.includes(t)) themes.push(t); }
    ['shrine','cyberpunk','wasteland','western'].forEach(t=>{ if(!themes.includes(t)) themes.push(t); });
    themes.forEach(t=>{ urls.push(BG_DIR+'gf_bg_'+t+'_v1.jpg', BG_DIR+'gf_bg_'+t+'_v1.png'); });
    // first that loads wins; if none load, the arena keeps its gradient
    loadFirst(urls, (u)=>{ el.style.setProperty('--arena', `url("${u}")`); el.classList.add('hasbg'); });
  }
  // main-menu key-art: try a dedicated menu bg, fall back to a battle bg.
  function applyMenuBg(){
    const el=$('#menu'); if(!el) return;
    loadFirst(['artassets/Backgrounds/gf_menu_bg.jpg','artassets/Backgrounds/gf_bg_shrine_v1.jpg','artassets/Backgrounds/gf_bg_cyberpunk_v1.jpg'],
      (u)=>{ el.style.setProperty('--menubg', `url("${u}")`); el.classList.add('hasbg'); });
  }
  // Fullscreen muted fight cinematic, played at match start. Cut off after 2s,
  // then renders the battle underneath and fades the overlay out (fade into battle).
  // On error/blocked-autoplay/missing file it skips straight through. Skippable.
  // Never leaves a broken <video> behind.
  function playIntro(onDone){
    let done=false;
    const finish=()=>{
      if(done) return; done=true;
      onDone && onDone();                         // render the battle underneath the overlay
      ov.classList.add('fade-out');               // CSS opacity transition → fades into battle
      setTimeout(()=>{ try{ ov.remove(); }catch(e){} try{ tutSync(); }catch(e){} }, 520);   // resume coachmarks once the cinematic clears
    };
    const ov=document.createElement('div'); ov.className='intro-overlay';
    const v=document.createElement('video'); v.className='intro-video';
    v.muted=true; v.setAttribute('muted',''); v.playsInline=true; v.setAttribute('playsinline','');
    v.src='artassets/animations/gf_menu_intro.mp4';
    v.onerror=finish;   // missing/broken source → skip into battle
    const skip=document.createElement('button'); skip.className='intro-skip'; skip.textContent='Skip ▶';
    skip.onclick=finish;
    ov.appendChild(v); ov.appendChild(skip);
    document.body.appendChild(ov);
    const p=v.play();
    if(p && p.catch) p.catch(()=>finish());       // autoplay blocked or can't play → skip
    setTimeout(finish, 2000);                      // cut the cinematic off after 2s
  }
  // compact hand card for the fan; `canDiscard` shows the 🗑 control.
  function handCardHTML(hi, idx, used, illegal, pending, unaffordable, canDiscard){
    const c=hi.card; const cost=GF.energyCost(c);
    const cls = `pcard ${used?'used':''} ${illegal?'illegal':''} ${pending?'sel':''} ${unaffordable?'cantafford':''}`;
    return `<div class="${cls}" data-hand="${idx}" data-aim="${esc(c.aim||'')}" data-ctype="${typeKey(c.type)}" style="--cls:${classColor(c.cls)}" title="${esc(c.flavor)}">
      ${canDiscard?`<span class="disc" title="Discard &amp; redraw — swap this card for a fresh one from its deck (once per turn)">🔄</span>`:''}
      <span class="qbadge" aria-hidden="true">✓</span>
      <div class="cardart sym-${typeKey(c.type)}" style="--ct:${typeColor(c.type)}">
        <img class="cardart-img" src="${typeArtFor(c.type)}" alt="" onerror="this.style.display='none'">
        <span class="artph">${esc(c.type)}</span>
        <span class="cost-badge cost t${c.speed}" title="costs ${cost} energy (T${c.speed})"><span class="ecirc"></span>${cost}</span>
      </div>
      <div class="pn">${esc(c.name)}</div>
      <div class="pe">${esc(c.text)}</div>
      ${c.hint?`<div class="phint">↳ ${esc(c.hint)}</div>`:''}
      <div class="pt"><span class="tsym-wrap">${typeSymHTML(c)}</span> <span class="spd t${c.speed}">T${c.speed}</span> ${esc(c.type)}</div>
      <span class="qribbon">Queued</span>
    </div>`;
  }
  // Compact type glyph for the mobile pill: sword=Attack, shield=Defend, bolt=everything else.
  function pillTypeIcon(type){
    const k = typeKey(type);
    if(k==='attack') return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/></svg>';
    if(k==='defend') return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';
    return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>';
  }
  // Effect badge for a pill: what the card actually does. Damage → red value + sword,
  // heal → green value + plus, block/defend → teal value + shield; otherwise the plain
  // type glyph (buffs, spells, utility). Reads `kind`/`amount` from the card data.
  function pillEffect(c){
    const t = typeKey(c.type), amt = c.amount;
    const SWORD = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/></svg>';
    const SHIELD = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';
    const PLUS = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
    if(c.kind==='heal' && amt) return `<span class="pill-eff heal">${amt}${PLUS}</span>`;
    if(t==='attack' && amt)    return `<span class="pill-eff dmg">${amt}${SWORD}</span>`;
    if(t==='defend' && amt)    return `<span class="pill-eff def">${amt}${SHIELD}</span>`;
    return `<span class="pill-eff none">${pillTypeIcon(c.type)}</span>`;
  }
  // ---- Keyword glossary (Phase 1) ----
  // The 12 locked mechanic keywords + one-line reminder text. Shown on the big card
  // previews (hover / long-press popup and the deck viewer) for whatever keywords the
  // card's rules text actually uses, so players learn the vocabulary in context.
  const KEYWORD_GLOSSARY = {
    Pierce:"Ignores Block pools. Guard still reduces it.",
    Block:"Shield pool: absorbs the next N damage this turn. Pierce goes through it.",
    Guard:"Every hit on this fighter deals N less. Never runs out; Pierce doesn't skip it.",
    Riposte:"Enemies who attack this fighter this turn take N damage back.",
    Empower:"This fighter's next attack deals +N. An Empowered fighter can't take a second attack.",
    Expose:"Exposed fighters take +N from every attack that hits them.",
    Weaken:"Weakened fighters' attacks deal N less.",
    Burn:"Takes N damage at the start of its next turn.",
    Junction:"Sets your weapon's element this turn: every attack you make carries its effect.",
    Silence:"Next turn, the target can't play the listed card types.",
    Once:"Usable once per match.",
    Flip:"Flip a coin — Heads is the better result; an unstated result does nothing."
  };
  // Return the reminder block for whatever keywords appear on this card (whole-word,
  // case-sensitive — keywords are always capitalized). "Once" lives on the frame badge,
  // not the text, so it's detected from c.once instead.
  function keywordReminders(c){
    const text = (c&&c.text) || '', found = [];
    for(const k of Object.keys(KEYWORD_GLOSSARY)){
      if(k==='Once'){ if(c&&c.once) found.push(k); continue; }
      if(new RegExp('\\b'+k+'\\b').test(text)) found.push(k);
    }
    if(!found.length) return '';
    return `<div class="kw-reminders">${found.map(k=>`<div class="kwr"><span class="kwr-k">${k}</span>${esc(KEYWORD_GLOSSARY[k])}</div>`).join('')}</div>`;
  }
  // Mobile hand card = compact pill: cost circle · name (wraps, never cut) · effect
  // badge (value + icon). Same data-* hooks + classes as handCardHTML, so the existing
  // tap/long-press wiring on `.hand-fan .pcard` applies unchanged. Cost is a plain
  // number (the "Energy: x/y" rail is the only energy indicator). Discard is NOT on the
  // pill — it's the single fixed top-right discard button (arm-then-tap).
  function cardPillHTML(hi, idx, used, illegal, pending, unaffordable, canDiscard){
    const c=hi.card; const cost=GF.energyCost(c);
    const cls = `pcard pill ${used?'used':''} ${illegal?'illegal':''} ${pending?'sel':''} ${unaffordable?'cantafford':''}`;
    return `<div class="${cls}" data-hand="${idx}" data-aim="${esc(c.aim||'')}" data-ctype="${typeKey(c.type)}" style="--cls:${classColor(c.cls)}" title="${esc(c.name)} — ${esc(c.text)}">
      <span class="pill-cost" title="costs ${cost} energy (T${c.speed})">${cost}</span>
      <span class="pill-name">${esc(c.name)}</span>
      ${pillEffect(c)}
    </div>`;
  }
  // Fixed top-right discard control (mobile only): tap to arm → cards highlight →
  // tap a card to discard & redraw it. Once per turn, then disables.
  function mobDiscardHTML(sel){
    const used=sel.discardUsed, armed=sel.discardMode;
    const label = used ? 'Redraw used' : armed ? 'Tap a card' : 'Discard';
    return `<button class="mob-discard ${armed?'armed':''}" data-act="discard" ${used?'disabled':''}
      title="Discard &amp; redraw one card (once per turn)">🔄 <span>${label}</span></button>`;
  }

  /* ---------------- resolution + animated reveal ---------------- */
  function resolveAndShow(){
    const st = UI.state;
    GF.resolveTurn(st, UI.picks[0], UI.picks[1]);
    showLog();
  }
  async function showLog(){
    hideCardPreview();
    const st = UI.state, sideIdx = UI.viewSide||0;   // joiner views side 1 as "their" team in MP
    const pre = st._preHp || {};   // pre-resolution HP, for the bar start positions
    render(frameHTML({
      top: topBarHTML(st, 'Resolving — cards fire by speed tier T1 → T4'),
      center: enemyZoneHTML(sideIdx, st, {
        enemy:(f)=>({enemy:true, hp: pre[f.uid]!=null?pre[f.uid]:f.hp})
      }),
      hand: `<div class="arena-slot"><div class="dockwrap"><div class="dock-log" id="docklog"></div></div></div>`,
      you: yourZoneHTML(sideIdx, st, { you:(f)=>({hp: pre[f.uid]!=null?pre[f.uid]:f.hp}) }),
      controls: `<button class="ctrlbtn skip-btn" data-act="skip">Skip ▶▶</button>
        <div id="contbox" style="display:none"></div>`
    }));
    applyArena('#battle', st);
    const qb=$('[data-act="quit"]'); if(qb) qb.onclick=()=> confirmQuit();

    // reset bars to pre-HP visually (cfighterHTML already rendered them at pre)
    const tl = st.timeline || [];
    captureBattleLog(st, tl);   // feed the help-panel Battle Log tab
    let skipped=false, shown=0;
    const skipBtn=$('[data-act="skip"]'); if(skipBtn) skipBtn.onclick=()=>{ skipped=true; };
    const logEl = $('#docklog');
    const TIER_NAMES = {1:'Tier 1 · Instant', 2:'Tier 2 · Fast', 3:'Tier 3 · Normal', 4:'Tier 4 · Heavy'};
    const banner = document.createElement('div'); banner.className='tier-banner';
    const arenaEl = $('#battle'); if(arenaEl) arenaEl.appendChild(banner);
    function showBanner(tierNum){
      banner.textContent = TIER_NAMES[tierNum] || ('Tier '+tierNum);
      banner.classList.remove('show'); void banner.offsetWidth; banner.classList.add('show');
    }

    function renderTier(i){
      const tier = tl[i];
      for(const e of tier.lines){
        if(e.cls==='tier'){ const h=document.createElement('div'); h.className='tierhead'; h.textContent=e.text; logEl.appendChild(h); continue; }
        const row=document.createElement('div'); row.className='logrow';
        const port = e.actorClass
          ? `<div class="lportrait" style="--cls:${classColor(e.actorClass)}"><img src="${portraitFor({className:e.actorClass})}" onerror="this.style.display='none'"></div>`
          : `<div class="lportrait" style="background:transparent;border:0"></div>`;
        row.innerHTML = `${port}<div class="ltext ${e.cls}">${esc(dnText(e.text.trim()))}</div>`;
        logEl.appendChild(row);
      }
      logEl.scrollTop = logEl.scrollHeight;
      shown = i+1;
    }
    function applyTierState(i){
      const tier=tl[i]; const abs=tier.absorbed||{}, neg=tier.negated||{};
      for(const uid in tier.hp) updateFighter(uid, tier.hp[uid], tier.deltas[uid], tier.status[uid], abs[uid]||0, !!neg[uid]);
    }

    for(let i=0;i<tl.length;i++){
