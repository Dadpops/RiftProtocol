      if(skipped) break;
      showBanner(tl[i].tier);
      await sleep(300);                 // beat so you see the tier announce before it resolves
      if(skipped) break;
      renderTier(i); applyTierState(i);
      // audio cues for this tier: block soak, damage thud, KO sweep
      try{
        const tier=tl[i]; let anyHit=false, anyBlock=false;
        for(const uid in (tier.deltas||{})){ if(tier.deltas[uid]<0) anyHit=true; }
        for(const uid in (tier.absorbed||{})){ if((tier.absorbed[uid]||0)>0) anyBlock=true; }
        if(anyBlock) aud('BLOCK');
        if(anyHit) aud('HIT');
        if(tier.lines.some(e=> e.cls==='death')) setTimeout(()=>aud('OPERATIVE_KO'), 140);
      }catch(e){}
      // linger a touch longer when someone died this tier
      const lethal = tl[i].lines.some(e=> e.cls==='death');
      await sleep(lethal ? 900 : 620);
    }
    // finalize (covers Skip): flush remaining log lines, then snap fighters to
    // final state without a pile of floaters.
    for(let i=shown;i<tl.length;i++){ renderTier(i); }
    for(const s of st.sides) for(const f of s.fighters){
      updateFighter(f.uid, f.hp, 0, GF.fighterStatus(f), 0);
    }
    banner.classList.remove('show');
    if(skipBtn) skipBtn.style.display='none';
    // continue prompt, centered in the middle of the battlefield
    const contHTML = `<div class="cont-center">
        <div class="tip" style="margin-bottom:8px">${esc(st.sides[0].name)} ${GF.sumHp(st.sides[0])} HP · ${esc(st.sides[1].name)} ${GF.sumHp(st.sides[1])} HP</div>
        <button class="primary ctrlbtn cont-btn" data-act="cont">${st.over?'See result':'Next round →'}</button>
      </div>`;
    const handArea=$('.bf-hand');                       // full-width middle row → screen-centered
    if(handArea){ handArea.insertAdjacentHTML('beforeend', contHTML); }
    else { const cb=$('#contbox'); if(cb){ cb.style.display=''; cb.innerHTML=contHTML; } }
    const contBtn=$('[data-act="cont"]'); if(contBtn) contBtn.onclick = ()=>{
      if(MP.inMatch){
        if(st.over){ showEnd(); }
        else if(MP.isHost){ st.round++; mpHostRound(); }
        else { mpShowWaiting('Waiting for host to continue…'); }   // joiner advances on the next state-sync
        return;
      }
      if(st.over) showEnd(); else { st.round++; runRound(); }
    };
  }

  /* ---------------- end screen ---------------- */
  function showEnd(){
    if(escRun){ escEnd(); return; }   // Escalation runs route through their own flow
    if(MP.inMatch){ mpStopTimer(); }  // online match over — stop the turn clock
    const st = UI.state, r = st.result;
    const mySide = UI.viewSide||0;    // joiner is side 1; "you" is the local player's side
    const you=st.sides[mySide], foe=st.sides[1-mySide];
    const win = r.winner===mySide, draw = r.winner===-1;
    const title = draw ? 'Draw' : (win ? 'Victory' : 'Defeat');
    // audio: win → fanfare track + win sting; otherwise back to menu theme
    if(win){ aud('MATCH_WIN'); music('victory'); }
    else if(!draw){ aud('MATCH_LOSS'); music('menu'); }
    else { music('menu'); }
    const opHTML=(f)=>`
      <div class="end-op ${f.alive?'':'ko'}" style="--cls:${classColor(f.className)}">
        <div class="cport"><img src="${portraitFor({className:f.className})}" alt="" onerror="this.style.display='none'"></div>
        <div class="end-op-name">${esc(dn(f.className))}</div>
        <div class="end-op-hp">${f.alive ? f.hp+' / '+f.maxHp+' HP' : 'Neutralized'}</div>
      </div>`;
    const bgStyle = UI.mapBg ? `style="background-image:linear-gradient(rgba(8,8,6,.74),rgba(8,8,6,.9)), url('${UI.mapBg}')"` : '';
    const node = showOverlay(`
      <div id="end" class="end-screen ${win?'win':(draw?'draw':'loss')}" ${bgStyle}>
        <div class="end-tag">Deployment complete · Round ${st.round} of 5</div>
        <h1 class="end-title">${title}</h1>
        <p class="end-reason">${esc(r.reason)}</p>
        <div class="end-teams">
          <div class="end-team">
            <div class="end-team-label">Your operatives · ${GF.sumHp(you)} HP</div>
            <div class="end-row">${you.fighters.map(opHTML).join('')}</div>
          </div>
          <div class="end-vs">VS</div>
          <div class="end-team">
            <div class="end-team-label">Hostiles · ${GF.sumHp(foe)} HP</div>
            <div class="end-row">${foe.fighters.map(opHTML).join('')}</div>
          </div>
        </div>
        <div class="row end-actions">
          ${MP.inMatch ? '' : '<button class="primary" data-act="rematch">Rematch</button>'}
          <button class="${MP.inMatch?'primary':''}" data-act="menu">Main Menu</button>
        </div>
      </div>`);
    const rm=node.querySelector('[data-act="rematch"]'); if(rm) rm.onclick=()=>{ clearOverlay(); rematch(); };
    node.querySelector('[data-act="menu"]').onclick=()=>{ clearOverlay(); showStart(); };  // showStart() calls mpLeave()
    if(TUT.active) tutFinish();   // first-time onboarding: thank the tester, then never show again
  }

  /* ---------------- audio wiring (RiftAudio; all guarded, never throws) ---------------- */
  function aud(name){ try{ if(window.RiftAudio) window.RiftAudio.sfx(name); }catch(e){} }
  function music(name){ try{ if(window.RiftAudio) window.RiftAudio.playMusic(name); }catch(e){} }
  (function wireAudio(){
    try{
      // hover blip on buttons (mouse only, so taps don't double with the select blip)
      let lastHover=null;
      document.addEventListener('pointerover', function(e){
        if(e.pointerType && e.pointerType!=='mouse') return;
        const b=e.target.closest && e.target.closest('button'); if(!b) return;
        if(b!==lastHover){ lastHover=b; aud('MENU_HOVER'); }
      });
      // select / lock blip on button clicks (capture so it fires before a re-render detaches the button)
      document.addEventListener('click', function(e){
        const b=e.target.closest && e.target.closest('button'); if(!b) return;
        if(b.id==='audioToggle' || (b.closest && b.closest('#audioPop'))) return;   // audio controls have their own feedback
        if(b.getAttribute('data-act')==='lock'){ aud('LOCK_IN'); return; }
        aud('MENU_SELECT');
      }, true);
      // audio control: speaker button (top-right) → opens a mini volume popout
      const RA=()=> window.RiftAudio;
      const ab=document.createElement('button'); ab.id='audioToggle'; ab.className='audio-toggle'; ab.type='button'; ab.title='Sound';
      const pop=document.createElement('div'); pop.id='audioPop'; pop.className='audio-pop hidden';
      pop.innerHTML =
        '<div class="ap-h">Audio</div>'+
        '<label class="ap-row"><span>Music</span><input type="range" min="0" max="1" step="0.05" id="apMusic"></label>'+
        '<label class="ap-row"><span>Effects</span><input type="range" min="0" max="1" step="0.05" id="apSfx"></label>'+
        '<div class="ap-h" style="margin-top:9px">Music track</div>'+
        '<label class="ap-row"><span>Menu</span><select class="ap-sel" id="apMenuTrack"></select></label>'+
        '<label class="ap-row"><span>Battle</span><select class="ap-sel" id="apBattleTrack"></select></label>'+
        '<button class="ap-mute" id="apMute" type="button"></button>';
      document.body.appendChild(ab); document.body.appendChild(pop);
      const apMusic=pop.querySelector('#apMusic'), apSfx=pop.querySelector('#apSfx'), apMute=pop.querySelector('#apMute');
      const apMenuTrack=pop.querySelector('#apMenuTrack'), apBattleTrack=pop.querySelector('#apBattleTrack');
      // populate the track selectors once
      try{ const opts=(RA()&&RA().trackOptions)?RA().trackOptions():[['synth','Synth']];
        const fill=(sel)=>{ sel.innerHTML=opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join(''); };
        fill(apMenuTrack); fill(apBattleTrack);
      }catch(e){}
      apMenuTrack.onchange=function(){ try{ RA().setTrack('menu', this.value); aud('MENU_SELECT'); }catch(e){} };
      apBattleTrack.onchange=function(){ try{ RA().setTrack('battle', this.value); aud('MENU_SELECT'); }catch(e){} };
      const syncIcon=()=>{ try{ ab.textContent=(RA()&&RA().isMuted())?'🔇':'🔊'; }catch(e){} };
      const syncPop=()=>{ try{ const m=RA(); if(!m) return; apMusic.value=m.getMusicVolume(); apSfx.value=m.getSfxVolume();
        if(m.getTrack){ apMenuTrack.value=m.getTrack('menu'); apBattleTrack.value=m.getTrack('battle'); }
        apMute.textContent=m.isMuted()?'Unmute':'Mute'; apMute.classList.toggle('on', m.isMuted()); }catch(e){} };
      ab.onclick=(e)=>{ e.stopPropagation(); pop.classList.toggle('hidden'); if(!pop.classList.contains('hidden')) syncPop(); };
      pop.addEventListener('click', e=> e.stopPropagation());
      apMusic.oninput=function(){ try{ RA().setMusicVolume(parseFloat(this.value)); }catch(e){} };
      apSfx.oninput=function(){ try{ RA().setSfxVolume(parseFloat(this.value)); }catch(e){} };
      apSfx.onchange=function(){ aud('MENU_SELECT'); };   // hear the effects level when you let go
      apMute.onclick=function(){ try{ RA().toggleMute(); }catch(e){} syncIcon(); syncPop(); };
      document.addEventListener('click', ()=>{ if(!pop.classList.contains('hidden')) pop.classList.add('hidden'); });
      syncIcon();
    }catch(e){}
  })();

  /* =====================================================================
     ONLINE MULTIPLAYER  (all additive; every function is a no-op when
     MP.socket is null, so Hotseat / Escalations / standard play are never
     affected). Host is authority: it runs the engine and broadcasts
     authoritative state snapshots; the joiner renders snapshots and sends
     back its pick intentions (it never resolves a turn locally).
     ===================================================================== */

  /* ---- username (stored in rift_player.displayName via loadPlayer/savePlayer) ---- */
  function mpGetUsername(){ try{ return (loadPlayer().displayName||'').trim(); }catch(e){ return ''; } }
  function mpSetUsername(name){ try{ const p=loadPlayer(); p.displayName=String(name||'').slice(0,20); savePlayer(p); }catch(e){} }
  function mpPromptUsername(onDone){
    const node=showOverlay(`<div class="mp-modal"><div class="mp-card">
        <h2>Operative callsign</h2>
        <p class="muted" style="font-size:13px;margin:0">Choose your operative callsign — other operatives will see this.</p>
        <input id="mpName" type="text" maxlength="20" placeholder="Enter username" autocomplete="off">
        <button class="primary" data-act="setname">Set Callsign</button>
      </div></div>`);
    const inp=node.querySelector('#mpName'), btn=node.querySelector('[data-act="setname"]');
    setTimeout(()=>{ try{ inp.focus(); }catch(e){} }, 30);
    const submit=()=>{ const v=(inp.value||'').trim().slice(0,20); if(!v){ try{inp.focus();}catch(e){} return; } mpSetUsername(v); clearOverlay(); onDone(v); };
    btn.onclick=submit; inp.onkeydown=(e)=>{ if(e.key==='Enter') submit(); };
  }
  function mpEnterFlow(){
    const u=mpGetUsername();
    if(u){ MP.username=u; showMultiplayer(); }
    else mpPromptUsername((name)=>{ MP.username=name; showMultiplayer(); });
  }

  /* ---- socket lifecycle (connects only when entering the MP flow) ---- */
  function mpConnect(onReady, onFail){
    if(MP.socket && MP.socket.connected){ onReady && onReady(); return; }
    if(typeof io==='undefined'){ onFail && onFail(); return; }
    let settled=false, s;
    try{ s=io(RIFT_SERVER_URL, {transports:['websocket','polling'], reconnection:false, timeout:8000}); }
    catch(e){ onFail && onFail(); return; }
    MP.socket=s; mpWireSocket(s);
    s.on('connect', ()=>{ if(settled) return; settled=true;
      if(MP.recording){ try{ s.emit('log-record', {enabled:true}); }catch(e){} }
      mpLog('net','connected'); onReady && onReady(); });
    s.on('connect_error', ()=>{ if(settled) return; settled=true; onFail && onFail(); });
    setTimeout(()=>{ if(!settled && !(s && s.connected)){ settled=true; onFail && onFail(); } }, 9000);
  }
  function mpConnectFailed(){ mpLeave(); mpModalNotice('Could not connect to RIFT server. Check your connection.', ()=> showStart()); }
  function mpLeave(){
    mpStopTimer();
    if(MP.socket){ try{ MP.socket.removeAllListeners(); MP.socket.disconnect(); }catch(e){} }
    MP.socket=null; MP.role=null; MP.code=null; MP.screen=null; MP.host=null; MP.joiner=null;
    MP.mapKey=null; MP.timer=null; MP.hostReady=false; MP.joinerReady=false; MP.myTeam=[];
    MP.inMatch=false; MP.opponentName=null; MP.isHost=false;
    MP.chat=[]; MP.unread=0; MP.chatOpen=false; MP.pendingJoinerPicks=null; MP.hostLockedWaiting=false;
    MP.timedOut=false; MP._introPlaying=false; MP._bufSnap=null; MP.deadline=0;
    // MP.recording is a sticky per-session preference — intentionally not reset here.
    UI.viewSide=0; mpRemoveChatFab();
  }
  function mpEmit(action){ if(MP.socket){ try{ MP.socket.emit('game-action', {action}); }catch(e){} } }
  // opt-in session logging: when recording, mirror a line to the server (→ logs/ file) and the console.
  function mpLog(tag, msg, data){
    if(!MP.recording) return;
    try{ if(MP.socket) MP.socket.emit('mp-log', { ts:Date.now(), role:MP.role||'?', name:MP.username||'?', tag:tag||'', msg:String(msg==null?'':msg), data: data===undefined?null:data }); }catch(e){}
    try{ console.log('[MP]', tag, msg, data===undefined?'':data); }catch(e){}
  }
  function mpEmitSelection(){
    if(!MP.socket) return;
    if(MP.role==='host') MP.socket.emit('update-selection', {team:MP.myTeam.slice(), mapKey:MP.mapKey||null, timer:MP.timer});
    else MP.socket.emit('update-selection', {team:MP.myTeam.slice()});
  }
  function mpWireSocket(s){
    s.on('room-created', (d)=>{ try{ MP.code=d.code; MP.role='host'; mpLog('room','created',{code:d.code}); showCreateRoom(); }catch(e){} });
    s.on('player-joined', (d)=>{ try{ mpLog('room','player-joined',d); mpToast(((d&&d.username)||'Operative')+' has joined.'); }catch(e){} });
    s.on('lobby-update', (d)=>{ try{ mpApplyLobby(d); }catch(e){} });
    s.on('join-error', (d)=>{ try{ mpLog('room','join-error',d); mpJoinError((d&&d.message)||'Could not join.'); }catch(e){} });
    s.on('match-started', (d)=>{ try{ mpOnMatchStarted(d); }catch(e){} });
    s.on('game-action', (d)=>{ try{ mpOnGameAction(d&&d.action); }catch(e){} });
    s.on('turn-timer', (d)=>{ try{ mpOnTurnTimer(d); }catch(e){} });
    s.on('turn-timeout', ()=>{ try{ mpOnTurnTimeout(); }catch(e){} });
    s.on('chat-message', (d)=>{ try{ mpOnChat(d); }catch(e){} });
    s.on('player-disconnected', (d)=>{ try{ mpLog('net','player-disconnected',d); mpStopTimer(); mpModalNotice((d&&d.message)||'Your opponent disconnected. Returning to menu.', ()=> showStart()); }catch(e){} });
    s.on('match-abandoned', (d)=>{ try{ mpLog('net','match-abandoned',d); mpStopTimer(); mpCountdownRedirect((d&&d.message)||'Your opponent has disconnected. Returning to menu.'); }catch(e){} });
  }
  function mpApplyLobby(d){
    if(!d) return;
    MP.host=d.host||null; MP.joiner=d.joiner||null; MP.mapKey=d.mapKey||null; MP.timer=(d.timer===undefined?MP.timer:d.timer);
    MP.hostReady=!!d.hostReady; MP.joinerReady=!!d.joinerReady;
    MP.opponentName = MP.role==='host' ? (MP.joiner&&MP.joiner.username) : (MP.host&&MP.host.username);
    if(MP.inMatch) return;
    const haveJoiner=!!MP.joiner;
    if(MP.screen!=='lobby' && haveJoiner){ MP.screen='lobby'; showLobby(); }
    else if(MP.screen==='lobby'){ mpRenderLobbyGrid(); }
  }

  /* ---- entry / create / join screens ---- */
  function showMultiplayer(){
    MP.screen='entry';
    render(`<div class="cscreen mp-wrap">
      <div class="bar"><h1 style="margin:0">RIFT PROTOCOL — Online</h1><button data-act="back">← Deploy</button></div>
      <p class="muted">Connect with another operative.</p>
      <div class="mp-entry">
        <button class="mp-btn primary" data-act="create">Create Room</button>
        <button class="mp-btn" data-act="join">Join Room</button>
        <label class="mp-reclog"><input type="checkbox" id="mpRecLog"> Record session logs <span class="muted">(saved to <code>logs/</code> on the server)</span></label>
      </div></div>`);
    $('[data-act="back"]').onclick=()=>{ mpLeave(); showStart(); };
    $('[data-act="create"]').onclick=()=> mpConnect(()=>{ MP.role='host'; MP.myTeam=[]; MP.socket.emit('create-room',{username:MP.username}); }, mpConnectFailed);
    $('[data-act="join"]').onclick=()=> showJoinRoom();
    const rl=$('#mpRecLog'); if(rl){ rl.checked=!!MP.recording; rl.onchange=()=>{ MP.recording=rl.checked;
      if(MP.socket && MP.socket.connected){ try{ MP.socket.emit('log-record',{enabled:MP.recording}); }catch(e){} } }; }
  }
  function showJoinRoom(){
    MP.screen='join';
    render(`<div class="cscreen mp-wrap">
      <div class="bar"><h1 style="margin:0">Join Room</h1><button data-act="back">← Online</button></div>
      <p class="muted">Enter the 4-character room code from your host.</p>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px">
        <input class="mp-input" id="mpJoinCode" maxlength="4" placeholder="XXXX" autocomplete="off">
        <button class="mp-btn primary" data-act="join">Join</button>
        <div class="mp-err" id="mpJoinErr"></div>
      </div></div>`);
    const inp=$('#mpJoinCode');
    inp.oninput=()=>{ inp.value=inp.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4); };
    setTimeout(()=>{ try{inp.focus();}catch(e){} }, 30);
    const go=()=>{ const code=(inp.value||'').toUpperCase().trim(); if(code.length!==4){ mpJoinError('Enter a 4-character code.'); return; }
      mpConnect(()=>{ MP.role='joiner'; MP.myTeam=[]; MP.socket.emit('join-room',{code, username:MP.username}); }, mpConnectFailed); };
    $('[data-act="join"]').onclick=go;
    inp.onkeydown=(e)=>{ if(e.key==='Enter') go(); };
    $('[data-act="back"]').onclick=()=> showMultiplayer();
  }
  function mpJoinError(msg){ const e=$('#mpJoinErr'); if(e) e.textContent=msg; }
  function showCreateRoom(){
    MP.screen='create';
    render(`<div class="cscreen mp-wrap">
      <div class="bar"><h1 style="margin:0">Room Created</h1><button data-act="back">← Online</button></div>
      <p class="muted" id="mpWaitMsg">Waiting for operative…</p>
      <div class="mp-code-row"><span class="mp-code">${esc(MP.code||'----')}</span><button class="mp-copy" data-act="copy">Copy</button></div>
      <div class="mp-field"><span class="lbl">Your operatives</span><div id="mpHostTeam"></div></div>
      <div class="mp-field"><span class="lbl">Warp Zone</span><div id="mpHostZones"></div></div>
      <div class="mp-field"><span class="lbl">Turn timer</span><div class="mp-timer-row" id="mpHostTimer"></div></div>
    </div>`);
    $('[data-act="back"]').onclick=()=>{ mpLeave(); showMultiplayer(); };
    const copy=$('[data-act="copy"]'); if(copy) copy.onclick=()=> mpCopyCode(copy);
    mpRenderTeamPicker($('#mpHostTeam'), mpEmitSelection);
    mpRenderZoneGrid($('#mpHostZones'));
    mpRenderTimerPicker($('#mpHostTimer'));
  }
  function mpCopyCode(btn){
    const code=MP.code||'';
    const done=()=>{ btn.textContent='Copied'; btn.classList.add('ok'); setTimeout(()=>{ btn.textContent='Copy'; btn.classList.remove('ok'); },1500); };
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(done,()=>mpFallbackCopy(code,done)); } else mpFallbackCopy(code,done); }
    catch(e){ mpFallbackCopy(code,done); }
  }
  function mpFallbackCopy(text,done){ try{ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done&&done(); }catch(e){} }

  /* ---- lobby ---- */
  function showLobby(){ MP.screen='lobby'; mpStopTimer();
    render(`<div class="cscreen mp-wrap" style="max-width:960px">
      <div class="bar"><h1 style="margin:0">Lobby</h1><button data-act="back">← Leave</button></div>
      <div class="mp-lobby" id="mpLobbyGrid"></div></div>`);
    $('[data-act="back"]').onclick=()=>{ mpLeave(); showStart(); };
    mpRenderLobbyGrid();
  }
  function mpTeamDisplay(team){
    if(!team||!team.length) return '<div class="muted">Selecting…</div>';
    return '<div class="mp-teamrow">'+team.map(c=>`<div class="cport" style="--cls:${classColor(c)}" title="${esc(dn(c))}"><img src="${portraitFor({className:c})}" onerror="this.style.display='none'"></div>`).join('')+'</div>';
  }
  function mpTimerLabel(t){ return (typeof t==='number') ? (t+'s') : 'No Limit'; }
  function mpReadyBtn(){ const r = MP.role==='host'?MP.hostReady:MP.joinerReady; return `<div><button class="mp-btn ${r?'primary':''}" data-act="ready">${r?'Cancel Ready':'Ready'}</button></div>`; }
  function mpCanStart(){ return !!(MP.hostReady && MP.joinerReady && MP.host && MP.host.team && MP.host.team.length===2 && MP.joiner && MP.joiner.team && MP.joiner.team.length===2); }
  function mpToggleReady(){
    const cur = MP.role==='host'?MP.hostReady:MP.joinerReady;
    if(!cur && (!MP.myTeam || MP.myTeam.length!==2)){ mpToast('Select two operatives first.'); return; }
    if(MP.socket) MP.socket.emit('player-ready', {ready:!cur});
  }
  function mpRenderLobbyGrid(){
    const grid=$('#mpLobbyGrid'); if(!grid) return;
    const amHost = MP.role==='host';
    const prevInput=$('#mpChatInput'); const prevVal=prevInput?prevInput.value:''; const hadFocus=prevInput && document.activeElement===prevInput;
    const hostTeam=(MP.host&&MP.host.team)||[], joinTeam=(MP.joiner&&MP.joiner.team)||[], mapKey=MP.mapKey;
    grid.innerHTML = `
      <div class="mp-col">
        <div class="mp-name">${esc((MP.host&&MP.host.username)||'Host')}<span class="mp-badge host">Host</span></div>
        <div class="mp-field"><span class="lbl">Operatives</span>${amHost?'<div id="mpMyTeam"></div>':mpTeamDisplay(hostTeam)}</div>
        <div class="mp-field"><span class="lbl">Warp Zone</span>${amHost?'<div id="mpMyZones"></div>':('<div>'+(mapKey?esc(GF.CLASSES[mapKey].world):'Selecting…')+'</div>')}</div>
        <div class="mp-field"><span class="lbl">Turn timer</span>${amHost?'<div class="mp-timer-row" id="mpMyTimer"></div>':('<div>'+mpTimerLabel(MP.timer)+'</div>')}</div>
        <div class="mp-ready ${MP.hostReady?'on':''}">${MP.hostReady?'READY':'NOT READY'}</div>
        ${amHost?mpReadyBtn():''}
      </div>
      <div class="mp-col">
        <div class="mp-name">${esc((MP.joiner&&MP.joiner.username)||'Waiting…')}<span class="mp-badge">Joiner</span></div>
        <div class="mp-field"><span class="lbl">Operatives</span>${!amHost?'<div id="mpMyTeam"></div>':mpTeamDisplay(joinTeam)}</div>
        <div class="mp-ready ${MP.joinerReady?'on':''}">${MP.joinerReady?'READY':'NOT READY'}</div>
        ${!amHost?mpReadyBtn():''}
      </div>
      <div class="mp-mappreview" style="${mapKey?`background-image:url('${zoneBgPath(mapKey)}')`:''}">
        ${mapKey?`<span class="mp-mapname">${esc(GF.CLASSES[mapKey].world)}</span>`:'<span class="mp-mapwait">Awaiting map selection…</span>'}
      </div>
      ${amHost?`<div style="grid-column:1/-1;text-align:center;margin-top:4px"><button class="mp-startbtn ${mpCanStart()?'primary':''}" data-act="start" ${mpCanStart()?'':'disabled'}>${mpCanStart()?'Deploy →':'Waiting for both operatives…'}</button></div>`:''}
      <div class="mp-chat">
        <div class="mp-log" id="mpChatLog"></div>
        <div class="mp-row"><input id="mpChatInput" type="text" maxlength="200" placeholder="Message…" autocomplete="off"><button class="primary" data-act="chatsend">Send</button></div>
      </div>`;
    if(amHost){ mpRenderTeamPicker($('#mpMyTeam'), mpEmitSelection); mpRenderZoneGrid($('#mpMyZones')); mpRenderTimerPicker($('#mpMyTimer')); }
    else mpRenderTeamPicker($('#mpMyTeam'), mpEmitSelection);
    const rb=$('[data-act="ready"]'); if(rb) rb.onclick=mpToggleReady;
    const sb=$('[data-act="start"]'); if(sb) sb.onclick=()=>{ if(mpCanStart() && MP.socket) MP.socket.emit('start-match',{}); };
    const ci=$('#mpChatInput'), cs=$('[data-act="chatsend"]');
    const sendChat=()=>{ if(!ci) return; mpSendChatRaw(ci.value); ci.value=''; try{ci.focus();}catch(e){} };
    if(cs) cs.onclick=sendChat; if(ci) ci.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); sendChat(); } };
    mpRenderChatInto($('#mpChatLog'));
    if(ci){ ci.value=prevVal; if(hadFocus){ try{ ci.focus(); ci.setSelectionRange(prevVal.length, prevVal.length); }catch(e){} } }
  }

  /* ---- selection pickers (team / zone / timer) ---- */
  function mpRenderTeamPicker(container, onChange){
    if(!container) return;
    const classes=Object.keys(GF.CLASSES);
    const draw=()=>{
      container.innerHTML = `<div class="classgrid" style="gap:8px">`+
        classes.map(c=>{ const sel=MP.myTeam.includes(c);
          return `<div class="card classcard ${sel?'sel':''}" data-mpc="${c}" style="--cls:${classColor(c)}">
            <div class="cport"><img src="${portraitFor({className:c})}" onerror="this.style.display='none'"><span class="ph">${esc(dn(c))}</span></div>
            <div class="cbody"><div class="cname">${dn(c)}</div></div></div>`; }).join('')+
        `</div><div class="muted" style="font-size:12px;margin-top:4px">${MP.myTeam.length}/2 selected</div>`;
      container.querySelectorAll('[data-mpc]').forEach(el=> el.onclick=()=>{
        const c=el.dataset.mpc, i=MP.myTeam.indexOf(c);
        if(i>=0) MP.myTeam.splice(i,1); else if(MP.myTeam.length<2) MP.myTeam.push(c);
        draw(); onChange && onChange();
      });
    };
    draw();
  }
  function mpRenderZoneGrid(container){
    if(!container) return; container.className='mp-zonegrid';
    const classes=Object.keys(GF.CLASSES);
    const draw=()=>{
      container.innerHTML = classes.map(c=>{ const sel=MP.mapKey===c;
        return `<div class="mp-zone ${sel?'sel':''}" data-mpz="${c}" style="background-image:url('${zoneBgPath(c)}')">
          ${sel?'<span class="z-sel">Selected</span>':''}<span class="z-name">${esc(GF.CLASSES[c].world)}</span></div>`; }).join('');
      container.querySelectorAll('[data-mpz]').forEach(el=> el.onclick=()=>{ MP.mapKey=el.dataset.mpz; draw(); mpEmitSelection(); });
    };
    draw();
  }
  function mpRenderTimerPicker(container){
    if(!container) return;
    const opts=[['30','30s'],['60','60s'],['90','90s'],['0','No Limit']];
    const draw=()=>{
      container.innerHTML = opts.map(([v,lbl])=>{ const val=v==='0'?null:parseInt(v,10);
        const sel=(MP.timer===val)||(v==='0'&&MP.timer==null);
        return `<button class="ms-chip ${sel?'sel':''}" data-mptimer="${v}">${lbl}</button>`; }).join('');
      container.querySelectorAll('[data-mptimer]').forEach(b=> b.onclick=()=>{ const v=b.dataset.mptimer; MP.timer=v==='0'?null:parseInt(v,10); draw(); mpEmitSelection(); });
    };
    draw();
  }

  /* ---- chat ---- */
  function mpSendChatRaw(text){ text=String(text||'').trim(); if(!text) return; if(text.length>200) text=text.slice(0,200); if(MP.socket){ try{ MP.socket.emit('chat-message',{message:text}); }catch(e){} } }
  function mpOnChat(d){ if(!d) return;
    MP.chat.push({username:d.username, message:d.message, ts:d.timestamp}); if(MP.chat.length>200) MP.chat.shift();
    const log=$('#mpChatLog'); if(log) mpRenderChatInto(log);
    const plog=$('#mpChatPanelLog'); if(plog) mpRenderChatInto(plog);
    if(MP.inMatch && !MP.chatOpen){ MP.unread++; mpUpdateChatFab(); }
  }
  function mpRenderChatInto(el){ if(!el) return;
    el.innerHTML = MP.chat.map(m=>`<div class="mp-msg"><span class="ts">${mpClock(m.ts)}</span><span class="who">${esc(m.username)}:</span> ${esc(m.message)}</div>`).join('');
    el.scrollTop=el.scrollHeight;
  }
  function mpClock(ts){ try{ const d=new Date(ts||Date.now()); const h=(''+d.getHours()).padStart(2,'0'), m=(''+d.getMinutes()).padStart(2,'0'); return h+':'+m; }catch(e){ return ''; } }
  function mpEnsureChatFab(){ if(!MP.inMatch || $('#mpChatFab')) return;
    const fab=document.createElement('button'); fab.id='mpChatFab'; fab.className='mp-chat-fab'; fab.type='button'; fab.innerHTML='💬'; fab.title='Chat';
    fab.onclick=(e)=>{ e.stopPropagation(); mpToggleChatPanel(); };
    document.body.appendChild(fab); mpUpdateChatFab();
  }
  function mpUpdateChatFab(){ const fab=$('#mpChatFab'); if(!fab) return; let dot=fab.querySelector('.dot');
    if(MP.unread>0 && !MP.chatOpen){ if(!dot){ dot=document.createElement('span'); dot.className='dot'; fab.appendChild(dot);} } else if(dot){ dot.remove(); } }
  function mpToggleChatPanel(){
    MP.chatOpen=!MP.chatOpen; let p=$('#mpChatPanel');
    if(MP.chatOpen){
      if(!p){ p=document.createElement('div'); p.id='mpChatPanel'; p.className='mp-chat-panel';
        p.innerHTML='<div class="mp-log" id="mpChatPanelLog"></div><div class="mp-row"><input id="mpChatPanelInput" type="text" maxlength="200" placeholder="Message…" autocomplete="off"><button class="primary" data-act="send">Send</button></div>';
        document.body.appendChild(p);
        const send=()=>{ const i=p.querySelector('#mpChatPanelInput'); mpSendChatRaw(i.value); i.value=''; try{i.focus();}catch(e){} };
        p.querySelector('[data-act="send"]').onclick=send;
        p.querySelector('#mpChatPanelInput').onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } };
        p.addEventListener('click', e=> e.stopPropagation());
        document.addEventListener('click', mpChatOutside);
      }
      mpRenderChatInto(p.querySelector('#mpChatPanelLog')); MP.unread=0; mpUpdateChatFab();
    } else if(p){ p.remove(); document.removeEventListener('click', mpChatOutside); }
  }
  function mpChatOutside(e){ const p=$('#mpChatPanel'), f=$('#mpChatFab'); if(p && !p.contains(e.target) && f && !f.contains(e.target)) mpToggleChatPanel(); }
  function mpRemoveChatFab(){ const f=$('#mpChatFab'); if(f) f.remove(); const p=$('#mpChatPanel'); if(p) p.remove(); document.removeEventListener('click', mpChatOutside); }

  /* ---- notices / toasts ---- */
  function mpToast(msg){ const t=document.createElement('div');
    t.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:70;background:rgba(18,17,13,.96);border:1px solid var(--accent);color:var(--ink);padding:8px 16px;border-radius:999px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.5)';
    t.textContent=msg; document.body.appendChild(t); setTimeout(()=>{ try{t.remove();}catch(e){} }, 2600);
  }
  function mpShowWaiting(msg){ showOverlay(`<div id="cover" class="confirmbox"><h1 style="font-size:22px">${esc(msg)}</h1><p class="muted">Synchronizing with the other operative…</p></div>`); }
  function mpModalNotice(msg, onOk, okLabel){
    const node=showOverlay(`<div class="mp-modal"><div class="mp-card"><h2>RIFT</h2><p style="font-size:14px">${esc(msg)}</p><button class="primary" data-act="ok">${esc(okLabel||'Return to Menu')}</button></div></div>`);
    node.querySelector('[data-act="ok"]').onclick=()=>{ clearOverlay(); if(onOk) onOk(); };
  }
  function mpCountdownRedirect(msg){
    let n=3;
    const node=showOverlay(`<div class="mp-modal"><div class="mp-card"><h2>Match abandoned</h2><p style="font-size:14px">${esc(msg)}</p><div class="mp-countdown" id="mpCd">Returning in ${n}…</div></div></div>`);
    const t=setInterval(()=>{ n--; const el=node.querySelector('#mpCd');
      if(n>0){ if(el) el.textContent='Returning in '+n+'…'; } else { clearInterval(t); clearOverlay(); showStart(); } }, 1000);
  }

  /* ---- match lifecycle (host authority) ---- */
  function mpOnMatchStarted(d){
    MP.inMatch=true; MP.screen='match'; MP.chatOpen=false; MP.unread=0; UI.battleLog=[];
    MP.timer=(d&&'timer' in d)?d.timer:MP.timer; MP.mapKey=(d&&d.mapKey)||MP.mapKey;
    MP.host=(d&&d.host)||MP.host; MP.joiner=(d&&d.joiner)||MP.joiner;
    MP.isHost=(MP.role==='host'); UI.viewSide=MP.isHost?0:1;
    MP.opponentName = MP.isHost ? (MP.joiner&&MP.joiner.username) : (MP.host&&MP.host.username);
    UI.mapKey=MP.mapKey; UI.mapBg = MP.mapKey ? zoneBgPath(MP.mapKey) : null;
    music('battle'); mpEnsureChatFab();
    mpLog('match','started',{mapKey:MP.mapKey, timer:MP.timer, isHost:MP.isHost, opponent:MP.opponentName});
    if(MP.isHost){
      const hostTeam=(MP.host&&MP.host.team&&MP.host.team.length===2)?MP.host.team:['Soldier','Arcanist'];
      const joinTeam=(MP.joiner&&MP.joiner.team&&MP.joiner.team.length===2)?MP.joiner.team:['Scout','Drifter'];
      const seed=(Math.floor(Math.random()*2147483647))|0;
      UI.state=GF.newMatch({ seed, sideA:{name:(MP.host&&MP.host.username)||'Host', classes:hostTeam, ai:null},
                                   sideB:{name:(MP.joiner&&MP.joiner.username)||'Joiner', classes:joinTeam, ai:null} });
      MP._introPlaying=true; playIntro(()=>{ MP._introPlaying=false; mpHostRound(); });
    } else {
      MP._introPlaying=true;
      playIntro(()=>{ MP._introPlaying=false;
        if(MP._bufSnap){ const b=MP._bufSnap; MP._bufSnap=null; mpApplyBuffered(b); }
        else mpShowWaiting('Breaching… waiting for host.'); });
    }
  }
  function mpApplyBuffered(b){ if(b.type==='state-sync') mpJoinerSelect(b.snap); else if(b.type==='turn-result') mpJoinerResult(b.snap); }

  function mpOnGameAction(action){
    if(!action || !MP.inMatch) return;
    if(action.type==='state-sync'){ if(MP._introPlaying){ MP._bufSnap={type:'state-sync', snap:action.snapshot}; return; } mpJoinerSelect(action.snapshot); }
    else if(action.type==='turn-result'){ if(MP._introPlaying){ MP._bufSnap={type:'turn-result', snap:action.snapshot}; return; } mpJoinerResult(action.snapshot); }
    else if(action.type==='joiner-turn'){ MP.pendingJoinerPicks=action.picks||[]; if(MP.isHost && MP.hostLockedWaiting) mpHostResolve(); }
    // (turn-timeout is now a dedicated server event, not a relayed game-action)
  }

  // HOST: start a round — advance engine, broadcast selection snapshot, pick side 0.
  function mpHostRound(){
    const st=UI.state; clearOverlay(); mpEnsureChatFab();
    GF.startOfTurn(st);
    if(st.over){ mpResolvedTimer(); mpEmit({type:'turn-result', snapshot:mpSerializeState(st,true)}); UI.viewSide=0; showLog(); return; }
    GF.drawHands(st);
    MP.pendingJoinerPicks=null; MP.hostLockedWaiting=false; MP.timedOut=false;
    mpLog('turn','host round '+st.round+' → state-sync');
    mpEmit({type:'state-sync', snapshot:mpSerializeState(st,false)});
    UI.viewSide=0; UI.picks=[[],[]];
    UI.steps=[ ()=>{ doSelection(0); mpBeginTurnTimer(); }, ()=> mpHostAfterLock() ];
    UI.stepIdx=0; nextStep();
  }
  function mpHostAfterLock(){ mpStopTimer();
    if(MP.pendingJoinerPicks!=null) mpHostResolve();
    else { MP.hostLockedWaiting=true; mpShowWaiting('Waiting for opponent to confirm…'); }
  }
  function mpHostResolve(){
    MP.hostLockedWaiting=false; mpStopTimer(); mpResolvedTimer(); clearOverlay();
    const st=UI.state;
    const jpicks=mpDeserializePicks(MP.pendingJoinerPicks, st); MP.pendingJoinerPicks=null;
    jpicks.forEach(p=>{ if(p.discardHi){ const o=p.discardHi.owner; o.hand=o.hand.filter(x=>x!==p.discardHi); o.deck.discard.push(p.discardHi.card); } });
    UI.picks[1]=jpicks;
    GF.resolveTurn(st, UI.picks[0]||[], UI.picks[1]||[]);
    mpLog('turn','host resolved round '+st.round, { over:st.over, hostHp:GF.sumHp(st.sides[0]), joinerHp:GF.sumHp(st.sides[1]) });
    mpEmit({type:'turn-result', snapshot:mpSerializeState(st,true)});
    UI.viewSide=0; showLog();
  }

  // JOINER: render the host's snapshot, pick side 1, send intentions back.
  function mpJoinerSelect(snap){ if(!MP.inMatch) return;
    mpStopTimer(); clearOverlay(); mpEnsureChatFab();
    UI.state=mpDeserializeState(snap); UI.viewSide=1; UI.picks=[[],[]];
    mpLog('turn','joiner got snapshot, round '+(snap&&snap.round));
    if(UI.state.over){ showLog(); return; }
    // timer display starts when the server's turn-timer event arrives; if it already
    // did (deadline set this round), reflect it now.
    UI.steps=[ ()=>{ doSelection(1); if(MP.deadline>Date.now()) mpStartTimerDisplay(); }, ()=> mpJoinerAfterLock() ];
    UI.stepIdx=0; nextStep();
  }
  function mpJoinerAfterLock(){ mpStopTimer(); mpLog('turn','joiner locked → joiner-turn'); mpEmit({type:'joiner-turn', picks:mpSerializePicks(UI.picks[1]||[])}); mpShowWaiting('Resolving — waiting for host…'); }
  function mpJoinerResult(snap){ if(!MP.inMatch) return;
    mpStopTimer(); clearOverlay(); mpEnsureChatFab();
    UI.state=mpDeserializeState(snap); UI.viewSide=1; showLog();
  }

  /* ---- turn timer (SERVER-authoritative) ----
     The server owns the clock (its timers never throttle), so a backgrounded host
     tab can't stall it. The host asks the server to start the round timer; the
     server broadcasts a `deadline` and fires `turn-timeout` itself. The local
     display is computed from wall-clock (deadline − now), so a throttled tab shows
     the correct time the instant it's refocused — no drift, no client-side ticking
     as the source of truth. */
  function mpFmtTime(s){ s=Math.max(0,s|0); const m=Math.floor(s/60), ss=s%60; return m+':'+(ss<10?'0':'')+ss; }
  function mpBeginTurnTimer(){ if(MP.isHost && MP.socket && typeof MP.timer==='number' && MP.timer>0){ try{ MP.socket.emit('turn-begin'); }catch(e){} } }
  function mpResolvedTimer(){ if(MP.isHost && MP.socket){ try{ MP.socket.emit('turn-resolved'); }catch(e){} } }
  function mpOnTurnTimer(d){ MP.deadline=(d&&d.deadline)||0; mpLog('timer','turn-timer', d); mpStartTimerDisplay(); }
  function mpStartTimerDisplay(){ mpStopTimer(); if(!MP.deadline) return; mpRenderTimer(); MP.timerHandle=setInterval(mpRenderTimer, 250); }
  function mpStopTimer(){ if(MP.timerHandle){ clearInterval(MP.timerHandle); MP.timerHandle=null; } }
  function mpRenderTimer(){ if(!MP.deadline){ return; } const left=Math.max(0, Math.ceil((MP.deadline-Date.now())/1000)); MP.timeLeft=left;
    const el=$('#mpTimer'); if(el){ el.textContent=mpFmtTime(left); el.classList.toggle('low', left<=10); } if(left<=0) mpStopTimer(); }
  function mpOnTurnTimeout(){ mpStopTimer(); MP.deadline=0; mpLog('timer','turn-timeout → auto-lock'); if(UI._lockNow) UI._lockNow(); }   // both sides auto-lock on the server's timeout

  /* ---- state (de)serialization: host-authoritative snapshots ----
     Cards are plain immutable data → JSON-safe as-is. Only Sets need conversion
     (pending.silence, turn.silencedTypes, turn.riposte.attackers). The joiner's
     rebuilt state is render/selection-only (it never resolves), so its rng is a
     no-op stub. */
  function mpSerTurn(t){ t=t||{};
    return { pools:(t.pools||[]).map(p=>({value:p.value,remaining:p.remaining,stopsPierce:!!p.stopsPierce})),
      absorbed:t.absorbed||0, hitThisTurn:!!t.hitThisTurn, reduce:t.reduce||0, incoming:t.incoming||0, outgoing:t.outgoing||0,
      attackBuff:t.attackBuff||0, attackBuffUsed:!!t.attackBuffUsed,
      riposte: t.riposte?{pool:t.riposte.pool,counter:t.riposte.counter,mode:t.riposte.mode,attackers:t.riposte.attackers?Array.from(t.riposte.attackers):[]}:null,
      bluff:t.bluff||null, tripmine:t.tripmine||null, invuln:!!t.invuln,
      redirectTo:t.redirectTo||null, coverFor:t.coverFor||null, tauntTo:t.tauntTo||null,
      silencedTypes:t.silencedTypes?Array.from(t.silencedTypes):null, buffedNoSecondAttack:!!t.buffedNoSecondAttack,
      reconPick:!!t.reconPick, junction:t.junction||null, energyPenalty:t.energyPenalty||0 };
  }
  function mpSerFighter(f){ const pd=f.pending||{};
    return { uid:f.uid, name:f.name, className:f.className, hp:f.hp, maxHp:f.maxHp, alive:f.alive,
      deck:{ draw:(f.deck.draw||[]).slice(), discard:(f.deck.discard||[]).slice(), potionUsed:!!f.deck.potionUsed, signatureUsed:!!f.deck.signatureUsed, bonusDraw:f.deck.bonusDraw||0 },
      hand:(f.hand||[]).map(hi=>hi.card),
      equipReduce:f.equipReduce||0, hasReduceEquip:!!f.hasReduceEquip, sidearm:!!f.sidearm, lightArmor:!!f.lightArmor, reinforced:!!f.reinforced, duster:!!f.duster, dusterUsed:!!f.dusterUsed,
      pending:{ regen:pd.regen||0, incomingNext:pd.incomingNext||0, outgoingNext:pd.outgoingNext||0, energyPenalty:pd.energyPenalty||0, absorbNext:pd.absorbNext||0, burn:pd.burn||0, reconPick:!!pd.reconPick, silence:pd.silence?Array.from(pd.silence):null },
      turn: mpSerTurn(f.turn) };
  }
  function mpSerializeState(st, withTimeline){
    return { round:st.round, over:!!st.over, result:st.result||null, preHp:st._preHp||null,
      sides: st.sides.map(s=>({ name:s.name, fighters:s.fighters.map(mpSerFighter) })),
      timeline: withTimeline ? (st.timeline||[]) : null };
  }
  function mpDeserTurn(t){ t=t||{};
    return { pools:(t.pools||[]).map(p=>({value:p.value,remaining:p.remaining,stopsPierce:!!p.stopsPierce})),
      absorbed:t.absorbed||0, hitThisTurn:!!t.hitThisTurn, reduce:t.reduce||0, incoming:t.incoming||0, outgoing:t.outgoing||0,
      attackBuff:t.attackBuff||0, attackBuffUsed:!!t.attackBuffUsed,
      riposte: t.riposte?{pool:t.riposte.pool,counter:t.riposte.counter,mode:t.riposte.mode,attackers:new Set(t.riposte.attackers||[])}:null,
      bluff:t.bluff||null, tripmine:t.tripmine||null, invuln:!!t.invuln,
      redirectTo:t.redirectTo||null, coverFor:t.coverFor||null, tauntTo:t.tauntTo||null,
      silencedTypes:t.silencedTypes?new Set(t.silencedTypes):null, buffedNoSecondAttack:!!t.buffedNoSecondAttack,
      reconPick:!!t.reconPick, junction:t.junction||null, energyPenalty:t.energyPenalty||0 };
  }
  function mpDeserFighter(sf){ const pd=sf.pending||{};
    return { uid:sf.uid, name:sf.name, className:sf.className, hp:sf.hp, maxHp:sf.maxHp, alive:sf.alive,
      deck:{ draw:(sf.deck.draw||[]).slice(), discard:(sf.deck.discard||[]).slice(), potionUsed:sf.deck.potionUsed, signatureUsed:sf.deck.signatureUsed, bonusDraw:sf.deck.bonusDraw||0 },
      _handCards:(sf.hand||[]).slice(), hand:[],
      equipReduce:sf.equipReduce||0, hasReduceEquip:!!sf.hasReduceEquip, sidearm:!!sf.sidearm, lightArmor:!!sf.lightArmor, reinforced:!!sf.reinforced, duster:!!sf.duster, dusterUsed:!!sf.dusterUsed,
      pending:{ regen:pd.regen||0, incomingNext:pd.incomingNext||0, outgoingNext:pd.outgoingNext||0, energyPenalty:pd.energyPenalty||0, absorbNext:pd.absorbNext||0, burn:pd.burn||0, reconPick:!!pd.reconPick, silence:pd.silence?new Set(pd.silence):null },
      turn: mpDeserTurn(sf.turn) };
  }
  function mpDeserializeState(snap){
    const st={ round:snap.round, over:!!snap.over, result:snap.result||null, _preHp:snap.preHp||null,
      rng:{ shuffle:(a)=>a, int:()=>0, float:()=>0, pick:(a)=> (a&&a.length?a[0]:undefined) },
      log:[], timeline: snap.timeline||[],
      sides: (snap.sides||[]).map(s=>({ name:s.name, fighters:(s.fighters||[]).map(mpDeserFighter) })) };
    for(const side of st.sides) for(const f of side.fighters){ f.hand=(f._handCards||[]).map(card=>({card, owner:f})); delete f._handCards; }
    return st;
  }
  function mpSerializePicks(picks){
    return (picks||[]).map(p=>({ ownerUid:p.owner.uid, handIndex:p.owner.hand.indexOf(p.handItem),
      casterUid:(p.caster||p.owner).uid, targetUid: p.target?p.target.uid:null,
      discardOwnerUid: p.discardHi?p.discardHi.owner.uid:null, discardHandIndex: p.discardHi?p.discardHi.owner.hand.indexOf(p.discardHi):null }));
  }
  function mpDeserializePicks(serPicks, st){
    const byUid={}; for(const side of st.sides) for(const f of side.fighters) byUid[f.uid]=f;
    const out=[];
    for(const sp of (serPicks||[])){
      const owner=byUid[sp.ownerUid]; if(!owner) continue;
      const hi=owner.hand[sp.handIndex]; if(!hi) continue;
      const caster=byUid[sp.casterUid]||owner;
      const target = sp.targetUid!=null ? (byUid[sp.targetUid]||null) : null;
      let discardHi=null;
      if(sp.discardHandIndex!=null){ const dO=byUid[sp.discardOwnerUid]||owner; discardHi=dO.hand[sp.discardHandIndex]||null; }
      out.push({ handItem:hi, card:hi.card, owner, caster, target, discardHi });
    }
    return out;
  }

  // on refocus, snap the (wall-clock) turn timer to the correct value immediately
  try{ document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ try{ mpRenderTimer(); }catch(e){} } }); }catch(e){}

  /* ===================== Feedback (server-proxied; additive, isolated) =====================
     Shared form used by both the standalone Feedback modal and the Help panel's
     Feedback tab. Class-based selectors so multiple instances coexist. Submits raw
     fields to our own /api/feedback endpoint (never to Discord directly) — the
     server validates, rate-limits, and forwards using a server-side-only webhook.
     A failed send can't crash or freeze the game. */
  let _fbEl=null, _fbEsc=null;
  const FB_AREAS=['Gameplay / Cards','Escalations','Multiplayer','Audio','UI / Visual','Lore / Text','Other'];
  function fbFormHTML(){
    return `<div class="fb-form">
        <div class="fb-field"><label>Type</label>
          <select class="fbType"><option value="">Select a type…</option><option value="Bug Report">Bug Report</option><option value="Feature Request">Feature Request</option></select>
          <div class="fb-err fbErrType"></div></div>
        <div class="fb-field"><label>Area</label>
          <select class="fbArea"><option value="">Select an area…</option>${FB_AREAS.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('')}</select>
          <div class="fb-err fbErrArea"></div></div>
        <div class="fb-field"><label>Name</label>
          <input class="fbName" type="text" maxlength="60" placeholder="Your name (optional)" autocomplete="off"></div>
        <div class="fb-field"><label>Email</label>
          <input class="fbEmail" type="text" maxlength="100" placeholder="Your email (optional)" autocomplete="off"></div>
        <div class="fb-field"><label>Message</label>
          <textarea class="fbMsg" maxlength="1000" placeholder="Describe the bug or feature request... (30 characters minimum)"></textarea>
          <div class="fb-count short fbCount">0 / 1000</div>
          <div class="fb-err fbErrMsg"></div></div>
        <input class="fbHp" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0" placeholder="Leave this field empty">
        <button class="fb-send primary fbSend" disabled>Send Feedback</button>
        <div class="fb-err fbErrSend" style="text-align:center"></div>
      </div>`;
  }
  function fbWire(form, onClose){
    if(!form) return;
    const q=(s)=>form.querySelector(s);
    const typeEl=q('.fbType'), areaEl=q('.fbArea'), msgEl=q('.fbMsg'), countEl=q('.fbCount'), sendEl=q('.fbSend');
    form._sending=false;
    const refresh=()=>{ const raw=(msgEl.value||'').length; countEl.textContent=raw+' / 1000';
      countEl.classList.toggle('short', raw<30); sendEl.disabled=!(typeEl.value && areaEl.value && raw>=30); };
    typeEl.onchange=()=>{ q('.fbErrType').textContent=''; refresh(); };
    areaEl.onchange=()=>{ q('.fbErrArea').textContent=''; refresh(); };
    msgEl.oninput=()=>{ q('.fbErrMsg').textContent=''; refresh(); };
    sendEl.onclick=()=> fbDoSubmit(form, onClose);
    refresh();
  }
  function fbDoSubmit(form, onClose){
    if(form._sending) return;
    const q=(s)=>form.querySelector(s);
    const type=q('.fbType').value, area=q('.fbArea').value;
    const name=(q('.fbName').value||'').trim(), email=(q('.fbEmail').value||'').trim();
    const msg=(q('.fbMsg').value||'').trim();
    let bad=false;
    q('.fbErrType').textContent = type ? '' : 'Please select a feedback type.'; if(!type) bad=true;
    q('.fbErrArea').textContent = area ? '' : 'Please select an area.'; if(!area) bad=true;
    q('.fbErrMsg').textContent  = (msg.length>=30) ? '' : 'Message must be at least 30 characters.'; if(msg.length<30) bad=true;
    q('.fbErrSend').textContent='';
    if(bad) return;
    form._sending=true;
    const sendEl=q('.fbSend'); sendEl.disabled=true; sendEl.textContent='Sending…';
    // Send raw fields to our server, which builds the Discord embed itself. The
    // honeypot (.fbHp) should always be empty for a real user.
    const hpEl=q('.fbHp');
    const payload={ type, area, name, email, message: msg, version: GAME_VERSION, hp: hpEl?hpEl.value:'' };
    (async()=>{
      try{
        const res = await fetch(FEEDBACK_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
        if(res && res.ok) fbOk(form, onClose);
        else if(res && res.status===429) fbBad(form, 'Too many submissions — please try again in a few minutes.');
        else if(res && res.status===503) fbBad(form, 'Feedback is temporarily unavailable. Please try again later.');
        else fbBad(form);
      }catch(e){ fbBad(form); }
    })();
  }
  function fbOk(form, onClose){
    form._sending=false;
    form.innerHTML = `<div class="fb-ok"><div class="ic">✓</div><h2>Feedback received.</h2>
      <p class="fb-sub" style="margin-top:4px">Thanks for helping improve RIFT PROTOCOL.</p>
      <button class="fb-send primary fbDone" style="max-width:180px;margin:12px auto 0">Close</button></div>`;
    const b=form.querySelector('.fbDone'); if(b) b.onclick=()=>{ if(onClose) onClose(); };
  }
  function fbBad(form, msg){
    form._sending=false;
    const s=form.querySelector('.fbSend'); if(s){ s.disabled=false; s.textContent='Send Feedback'; }
    const e=form.querySelector('.fbErrSend'); if(e) e.textContent=msg||'Something went wrong. Please try again.';
  }
  function openFeedback(){
    if(_fbEl) return;
    const ov=document.createElement('div'); ov.className='fb-modal'; _fbEl=ov;
    ov.innerHTML = `<div class="fb-card" role="dialog" aria-modal="true">
        <div class="fb-head"><h2>Feedback</h2><button class="fb-close" data-fb="close" aria-label="Close">✕</button></div>
        <div class="fb-sub">Help us improve RIFT PROTOCOL.</div>
        ${fbFormHTML()}
      </div>`;
    document.body.appendChild(ov);
    ov.querySelector('[data-fb="close"]').onclick=()=> closeFeedback();
    ov.addEventListener('mousedown', (e)=>{ if(e.target===ov) closeFeedback(); });
    _fbEsc=(e)=>{ if(e.key==='Escape') closeFeedback(); };
    document.addEventListener('keydown', _fbEsc);
    fbWire(ov.querySelector('.fb-form'), closeFeedback);
    setTimeout(()=>{ try{ ov.querySelector('.fbType').focus(); }catch(e){} }, 30);
  }
  function closeFeedback(){
    if(_fbEsc){ document.removeEventListener('keydown', _fbEsc); _fbEsc=null; }
    if(_fbEl){ _fbEl.remove(); _fbEl=null; }
  }
  function mountFeedbackButton(){
    if(document.getElementById('fbBtn')) return;
    const b=document.createElement('button'); b.id='fbBtn'; b.className='fb-btn'; b.type='button';
    b.textContent='Feedback'; b.setAttribute('aria-label','Send feedback');
    b.onclick=(e)=>{ e.stopPropagation(); openFeedback(); };
    document.body.appendChild(b);
  }

  /* ===================== Help panel (How to Play / Battle Log / Feedback / Credits) ===================== */
  let _helpEl=null, _helpEsc=null;
  function mountHelpButton(){
    if(document.getElementById('helpBtn')) return;
    const b=document.createElement('button'); b.id='helpBtn'; b.className='help-btn'; b.type='button';
    b.textContent='?'; b.setAttribute('aria-label','Help');
    b.onclick=(e)=>{ e.stopPropagation(); openHelp('howto'); };
    document.body.appendChild(b);
  }
  function openHelp(tab){
    closeHelp();
    const ov=document.createElement('div'); ov.className='help-modal'; _helpEl=ov;
    ov.innerHTML = `<div class="help-card" role="dialog" aria-modal="true">
        <div class="help-head">
          <div class="help-tabs">
            <button class="help-tab" data-tab="howto">How to Play</button>
            <button class="help-tab" data-tab="cardlang">Card Language</button>
            <button class="help-tab" data-tab="log">Battle Log</button>
            <button class="help-tab" data-tab="feedback">Feedback</button>
            <button class="help-tab" data-tab="credits">Credits</button>
          </div>
          <button class="help-close" data-help="close" aria-label="Close">✕</button>
        </div>
        <div class="help-body" id="helpBody"></div>
      </div>`;
    document.body.appendChild(ov);
    ov.querySelector('[data-help="close"]').onclick=()=> closeHelp();
    ov.addEventListener('mousedown', (e)=>{ if(e.target===ov) closeHelp(); });
    _helpEsc=(e)=>{ if(e.key==='Escape') closeHelp(); };
    document.addEventListener('keydown', _helpEsc);
    ov.querySelectorAll('.help-tab').forEach(b=> b.onclick=()=> helpShowTab(b.dataset.tab));
    helpShowTab(tab||'howto');
  }
  function closeHelp(){
    if(_helpEsc){ document.removeEventListener('keydown', _helpEsc); _helpEsc=null; }
    if(_helpEl){ _helpEl.remove(); _helpEl=null; }
  }
  function helpShowTab(tab){
    const ov=_helpEl; if(!ov) return;
    ov.querySelectorAll('.help-tab').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
    const body=ov.querySelector('#helpBody'); if(!body) return;
    if(tab==='howto'){ body.innerHTML = helpHowToHTML(); body.scrollTop=0; }
    else if(tab==='cardlang'){ body.innerHTML = helpCardLangHTML(); body.scrollTop=0; }
    else if(tab==='log'){ body.innerHTML = helpBattleLogHTML(); const f=body.querySelector('.bl-feed'); if(f) f.scrollTop=f.scrollHeight; }
    else if(tab==='credits'){ body.innerHTML = helpCreditsHTML(); body.scrollTop=0; }
    else if(tab==='feedback'){ body.innerHTML = `<div class="fb-sub" style="margin-bottom:12px">Help us improve RIFT PROTOCOL.</div>`+fbFormHTML(); fbWire(body.querySelector('.fb-form'), closeHelp); body.scrollTop=0; }
  }
  // The card-language legend: the 12 mechanic keywords + reminder text. Shown as a help
  // tab and auto-opened once per profile (see maybeShowCardLangLegend).
  function helpCardLangHTML(){
    const kwRows = Object.keys(KEYWORD_GLOSSARY).map(k=>`<div class="cl-row"><span class="cl-kw">${esc(k)}</span><span class="cl-desc">${esc(KEYWORD_GLOSSARY[k])}</span></div>`).join('');
    return `<div class="help-sec"><h3>Keywords</h3><p>Capitalized words on cards are keywords — shared mechanics with one meaning. Hover a card on desktop, or press and hold on mobile, to see these reminders in context.</p><div class="cl-list">${kwRows}</div></div>`;
  }
  // Show-once card-language legend for new profiles. Deferred + guarded so it never
  // collides with the splash, the first-run onboarding coach, or another open modal.
  // (Phase 2's versioned profile can later absorb this flag into its first-run flow.)
  function cardLangSeen(){ try{ return localStorage.getItem('rift_cardlang_seen')==='1'; }catch(e){ return true; } }
  function maybeShowCardLangLegend(){
    if(cardLangSeen() || TUT.active) return;
    if(document.getElementById('splash') || _helpEl || _fbEl) return;
    if(document.querySelector('.lore-modal-backdrop')) return;
    try{ localStorage.setItem('rift_cardlang_seen','1'); }catch(e){}
    openHelp('cardlang');
  }
  function helpRefreshLogIfOpen(){
    if(!_helpEl) return; const act=_helpEl.querySelector('.help-tab.active');
    if(act && act.dataset.tab==='log') helpShowTab('log');
  }
  function helpSec(title, body, callout){
    return `<div class="help-sec"><h3>${title}</h3><p>${body}</p>${callout?`<div class="help-callout">${callout}</div>`:''}</div>`;
  }
  function helpHowToHTML(){
    return [
      helpSec('What is RIFT PROTOCOL?', 'You command two RIFT operatives pulled from folding worlds and deployed to breach points across six Warp Zones. Each match is 5 rounds. The team that deals the most kills wins — tiebreak goes to total HP remaining, then a draw.', 'Most kills wins. Tiebreak: total HP remaining, then a draw.'),
      helpSec('Picking your operatives', 'Choose two operative classes before each match. Each class has a unique deck of 20 cards and a distinct combat identity. You can pick two of the same class. Your team shares a hand of cards during the match.'),
      helpSec('How a round works', 'Each round you have an <span class="ecirc"></span> energy pool (the <span class="ecirc"></span> token marks energy on cards and your pool; starts at 3, grows each round: 3-4-6-8-10). Stage cards from your hand by clicking them, then assign targets. When ready, click Confirm. Both teams resolve simultaneously in tier order: T1 first, then T2, T3, T4. Higher tiers can interrupt lower tiers if the operative is knocked out mid-resolution.', 'Resolution order: T1 → T2 → T3 → T4 — both teams at once, interrupts on KO.'),
      helpSec('Energy', 'Every card has an energy cost shown in the badge at the top left. You can play multiple cards per round as long as you have energy. Unused energy does not carry over. Next round\'s energy is shown in the top right panel.'),
      helpSec('Card types', 'Attack cards deal damage to enemy operatives. Defend cards protect your operatives from incoming damage. Some cards have special effects — read the description carefully. The italic flavor text at the bottom of each card is lore only and has no gameplay effect.'),
      helpSec('The Breachblade Junction mechanic', 'The Breachblade class has a unique Junction system. Play a Junction card (Fire, Frost, or Thunder) to set your weapon element. Then play flurry cards to deal cascading elemental hits. Setting a new Junction element overwrites the previous one.', 'Junction sets your element; flurry cards ride it. A new Junction overwrites the old.'),
      helpSec('Redraw', 'Once per round, each operative can discard one of their cards and immediately draw a replacement from their deck. Click the trashcan icon on a card while hovering to trigger a redraw. The trashcan greys out after use and resets at the start of the next round.'),
      helpSec('AI difficulty', 'When playing against AI, choose your difficulty from the Deploy menu.', '<b>Recruit</b> — random plays · <b>Clasher</b> — basic heuristic · <b>Captain</b> — reads HP and hand · <b>Warden</b> — class-aware, plays around your threats.'),
      helpSec('Escalations', 'Escalations are single-player challenge runs. Pick an Escalation, choose your operative team, and fight through a series of battles against escalating AI. The final battle of every Escalation is always a mirror team — two of the home zone\'s operative class. Health resets between each battle.', 'Easy = 3 battles · Medium = 4 · Hard = 5. The final battle is always a mirror team.'),
      helpSec('Multiplayer', 'Create a room to get a 4-character code. Share it with a friend. The host picks the map and turn timer. Both players pick their operative teams in the lobby, ready up, then the host starts the match. Turn timer auto-locks your staged cards when it hits zero. Chat is available in the lobby and during the match via the chat icon.'),
    ].join('');
  }
  function helpBattleLogHTML(){
    if(!UI.battleLog || !UI.battleLog.length) return `<div class="bl-empty">No active match. Battle log appears here during a match.</div>`;
    const rounds = UI.battleLog.map(r=>`<div class="bl-round"><div class="bl-rhead">Round ${r.round} of 5</div>${
      r.items.map(it=>`<div class="bl-line ${esc(it.cls||'')}"${it.actorClass?` style="color:${classColor(it.actorClass)}"`:''}>${esc(it.text)}</div>`).join('')
    }</div>`).join('');
    return `<div class="bl-feed">${rounds}</div>`;
  }
  function helpCreditsHTML(){
    return `<div class="help-credits">
        <h2 class="help-credit-title">RIFT PROTOCOL</h2>
        <p class="help-credit-by">Designed and built by Kit Cabena</p>
        <p><a class="help-link" href="https://github.com/kitcabena" target="_blank" rel="noopener noreferrer">GitHub</a></p>
        <p class="help-ver">v${GAME_VERSION}</p>
        <div class="help-music-credits">
          <h3>Music</h3>
          <p>&ldquo;The Game&rdquo; by <b>Boss Bass</b><br>
            Source: <a class="help-link" href="https://freemusicarchive.org/" target="_blank" rel="noopener noreferrer">Free Music Archive</a>
            · License: <a class="help-link" href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-NC-SA 4.0</a></p>
          <p>&ldquo;Sweet Lofi&rdquo; by <b>VibeDepot</b><br>
            Source: <a class="help-link" href="https://freemusicarchive.org/" target="_blank" rel="noopener noreferrer">Free Music Archive</a>
            · License: <a class="help-link" href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-NC-SA 4.0</a></p>
        </div>
        <p class="help-credit-foot">Built with the Web Audio API, Socket.io, and a lot of sims.</p>
      </div>`;
  }
  function captureBattleLog(st, tl){
    try{
      if(!UI.battleLog) UI.battleLog=[];
      if(UI.battleLog.length && UI.battleLog[UI.battleLog.length-1].round===st.round) return;  // captured already
      const items=[];
      for(const tier of (tl||[])){
        for(const e of (tier.lines||[])){
          if(e.cls==='tier') continue;
          items.push({ text: dnText((e.text||'').trim()), cls:e.cls, actorClass:e.actorClass||null });
        }
      }
      UI.battleLog.push({ round: st.round, items });
      helpRefreshLogIfOpen();
    }catch(e){}
  }

  /* ===================== Splash screen (shown once per page load) ===================== */
  function showSplash(){
    const ov=document.createElement('div'); ov.id='splash';
    ov.innerHTML = `<div class="splash-inner"><h1 class="title">RIFT PROTOCOL</h1><div class="splash-sub">click to continue</div></div>`;
    document.body.appendChild(ov);
    let done=false;
    const dismiss=()=>{ if(done) return; done=true;
      try{ if(window.RiftAudio && window.RiftAudio.unlock) window.RiftAudio.unlock(); }catch(e){}   // Web Audio user-gesture init
      document.removeEventListener('click', dismiss, true);
      document.removeEventListener('keydown', dismiss, true);
      ov.classList.add('fade-out');
      setTimeout(()=>{ try{ ov.remove(); }catch(e){} try{ tutSync(); }catch(e){} }, 340);   // resume coachmarks once the splash is gone
      showStart();
    };
    document.addEventListener('click', dismiss, true);
    document.addEventListener('keydown', dismiss, true);
  }

  /* ===================== Right-click = Back / Undo =====================
     Right-click acts as a universal Back button across every menu/mode/tab,
     and as an Undo (clear staged cards) inside a battle. Priority: close the
     topmost dismissable modal → in-battle undo (UI.back) → the current screen's
     own Back button. Native context menu is preserved inside editable fields.  */
  function handleGlobalBack(){
    if(_helpEl){ closeHelp(); return; }
    if(_fbEl){ closeFeedback(); return; }
    const lm=document.querySelector('.lore-modal-backdrop');
    if(lm){ const x=lm.querySelector('[data-act="lmclose"]'); if(x) x.click(); else { try{ lm.remove(); }catch(e){} } return; }
    if(overlay){ const cn=overlay.querySelector && overlay.querySelector('[data-act="cancel"]'); if(cn) cn.click(); return; }  // cancel a quit dialog; flow overlays keep their own controls
    if(typeof UI.back==='function'){ if(UI.back()!==false) return; }
    const back=app.querySelector('[data-act="back"]'); if(back) back.click();
  }
  document.addEventListener('contextmenu', function(e){
    if(e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
    e.preventDefault();
    try{ handleGlobalBack(); }catch(err){}
  });

  /* ---- persistent right-click hint (auto-updates per screen) ---- */
  function mountRcHint(){
    if(document.getElementById('rcHint')) return;
    const el=document.createElement('div'); el.id='rcHint'; el.className='hidden'; document.body.appendChild(el);
  }
  function updateRcHint(){
    const el=document.getElementById('rcHint'); if(!el) return;
    let txt=null;
    if(app.querySelector('.card-tray')) txt='Undo';                       // battle selection
    else if(app.querySelector('[data-act="back"]') || app.querySelector('#menu')) txt='Back';
    if(txt){ el.innerHTML=`<span class="rc-mouse">🖱</span> Right-click: ${txt}`; el.classList.remove('hidden'); }
    else el.classList.add('hidden');
  }

  /* ===================== First-time onboarding (guided, non-blocking) =====================
     A coach overlay (glow ring + arrow + left explanation panel) walks a new
     player through their first deployment and match. It never blocks input —
     clicks pass straight through to the game — and the phase is derived from the
     live DOM/state each render via tutSync(), so it self-corrects if the player
     wanders. Shown once; a localStorage flag (or Skip Tutorial) retires it.       */
  const TUT = { active:false, tour:null, tourDone:false, coreDone:false, logDone:false, helpShown:false, mapDone:false };
  const TUT_KEY = 'rift_onboarded';
  function tutSeen(){ try{ return localStorage.getItem(TUT_KEY)==='1'; }catch(e){ return true; } }
  function tutMarkSeen(){ TUT.active=false; try{ localStorage.setItem(TUT_KEY,'1'); }catch(e){} }
  function mountCoach(){
    if(document.getElementById('tutCoach')) return;
    const c=document.createElement('div'); c.id='tutCoach'; c.className='hidden';
    c.innerHTML='<div class="tut-ring" style="display:none"></div><div class="tut-arrow" style="display:none">▶</div><div class="tut-panel"></div>';
    document.body.appendChild(c);
  }
  function tutHide(){ const c=document.getElementById('tutCoach'); if(c){ c.classList.add('hidden'); c.classList.remove('scrim'); } }
  // Render the coach for one step. targetSel = element to ring/arrow (null → centered panel).
  function tutPlace(targetSel, opts){
    opts=opts||{};
    const c=document.getElementById('tutCoach'); if(!c) return;
    const ring=c.querySelector('.tut-ring'), arrow=c.querySelector('.tut-arrow'), panel=c.querySelector('.tut-panel');
    c.classList.remove('hidden');
    c.classList.toggle('scrim', !!opts.center);
    panel.classList.toggle('center', !!opts.center);
    if(opts.center){ panel.style.top=''; panel.style.left=''; panel.style.bottom=''; panel.style.transform=''; }  // let CSS .center take over
    panel.innerHTML =
      (opts.eyebrow?`<div class="tp-eyebrow">${esc(opts.eyebrow)}</div>`:'')+
      (opts.title?`<div class="tp-title">${opts.title}</div>`:'')+
      `<div class="tp-body">${opts.html||''}</div>`+
      ((opts.actions&&opts.actions.length)?`<div class="tp-actions">${opts.actions.map((a,i)=>`<button data-tpa="${i}" class="${a.primary?'primary':''}">${esc(a.label)}</button>`).join('')}</div>`:'')+
      (opts.noSkip?'':`<button class="tp-skip" data-tpa="skip">Skip tutorial</button>`);
    (opts.actions||[]).forEach((a,i)=>{ const b=panel.querySelector(`[data-tpa="${i}"]`); if(b) b.onclick=a.onClick; });
    const sk=panel.querySelector('[data-tpa="skip"]'); if(sk) sk.onclick=()=>{ tutMarkSeen(); tutHide(); if(app.querySelector('#menu')) showStart(); };
    // remember the target so a light reposition loop can track it through menu
    // slide-in animations, layout shifts, and resizes.
    TUT._sel = (opts.center) ? null : targetSel;
    tutReposition();
  }
  // (re)position the ring + arrow around the current step's target. Cheap; safe to
  // call repeatedly. Hides the ring when there's no target (centered steps).
  function tutReposition(){
    const c=document.getElementById('tutCoach'); if(!c || c.classList.contains('hidden')) return;
    const ring=c.querySelector('.tut-ring'), arrow=c.querySelector('.tut-arrow');
    const tgt = TUT._sel ? (app.querySelector(TUT._sel)||document.querySelector(TUT._sel)) : null;
    if(!tgt){ ring.style.display='none'; arrow.style.display='none'; return; }
    const r=tgt.getBoundingClientRect(), pad=8;
    if(r.width===0 && r.height===0){ ring.style.display='none'; arrow.style.display='none'; return; }
    ring.style.display='block';
    ring.style.left=(r.left-pad)+'px'; ring.style.top=(r.top-pad)+'px';
    ring.style.width=(r.width+pad*2)+'px'; ring.style.height=(r.height+pad*2)+'px';
    arrow.style.display='block'; arrow.textContent='▶';
    arrow.style.left=(r.left-pad-36)+'px';
    arrow.style.top=(r.top + r.height/2 - 18)+'px';
    // keep the explanation panel clear of the highlighted element: drop it to the
    // top when the target sits in the lower half of the screen (e.g. the hand).
    const panel=c.querySelector('.tut-panel');
    if(panel && !panel.classList.contains('center')){
      const cy=r.top + r.height/2;
      panel.style.left='24px'; panel.style.bottom='auto';
      if(cy > window.innerHeight*0.55){ panel.style.top='14px'; panel.style.transform='none'; }
      else { panel.style.top='50%'; panel.style.transform='translateY(-50%)'; }
    }
  }
  // Battlefield tour: a short Next-driven walk through the four regions (round 1 only).
  const TUT_TOUR=[
    ['.enemy-side','Hostiles','The two enemy operatives — most of your cards target them. Neutralize <b>both</b> to win the breach.'],
    ['.your-side','Your operatives','Your pair, down here. Keep them standing — if both fall, the breach is lost.'],
    ['.card-tray','Your hand','The cards your operatives can play this round. You stage them from here.'],
    ['.ctrl-cluster','Energy & Confirm','<b>Energy</b> caps how many cards you can play (it grows each round). <b>Confirm</b> locks your picks and resolves the round.'],
  ];
  function tutBattleTour(){
    if(TUT.tour==null) TUT.tour=0;
    if(TUT.tour>=TUT_TOUR.length){ TUT.tourDone=true; tutSync(); return; }
    const i=TUT.tour, last=i>=TUT_TOUR.length-1, t=TUT_TOUR[i];
    tutPlace(t[0], {eyebrow:`Battlefield tour · ${i+1}/${TUT_TOUR.length}`, title:t[1], html:t[2],
      actions:[{label: last?'Start playing ›':'Next ›', primary:true, onClick:()=>{ if(last) TUT.tourDone=true; else TUT.tour++; tutSync(); }}]});
  }
  // Derive the current onboarding step from the live screen and render its coachmark.
  function tutSync(){
    if(!TUT.active){ tutHide(); return; }
    // pause behind the splash / fight cinematic / any blocking overlay or modal
    if(document.getElementById('splash') || document.querySelector('.intro-overlay')){ tutHide(); return; }
    if(overlay || _helpEl || _fbEl || document.querySelector('.lore-modal-backdrop')){ tutHide(); return; }
    // --- main menu ---
    if(app.querySelector('#menu')){
      const fs=app.querySelector('#fightsub');
      if(fs && fs.classList.contains('hidden')){
        tutPlace('[data-nav="fight"]', {eyebrow:'Welcome, operative', title:'Run your first deployment',
          html:'RIFT sends operatives through breaches in pairs. Let’s deploy your first cell.<br><br>Click <b>Deploy</b> to begin.'});
      } else {
        tutPlace('[data-mode="random"]', {eyebrow:'Step 1 · Clearance', title:'Choose the enemy clearance',
          html:'This sets the AI difficulty. For your first run, pick <b>Recruit</b> — the gentlest opponent.'});
      }
      return;
    }
    // --- class select (standard deploy only) ---
    if(app.querySelector('.classgrid') && app.querySelector('.team-slots') && !UI.escSetup){
      const filled=app.querySelectorAll('.team-slot.filled').length;
      if(filled<2){
        tutPlace('.classgrid', {eyebrow:'Step 2 · Your cell', title:`Pick two operatives (${filled}/2)`,
          html:'Each operative fights with their home world’s style and a 20-card deck. <b>Click two portraits</b> to form your pair.'});
      } else if(!TUT.mapDone && !app.querySelector('.ms-chip.ms-img.sel')){
        tutPlace('.map-select', {eyebrow:'Step 3 · Warp Zone', title:'Choose where to fight',
          html:'Pick a Warp Zone — the world you’ll breach into — or leave it on <b>Random</b>.',
          actions:[{label:'Next ›', primary:true, onClick:()=>{ TUT.mapDone=true; tutSync(); }}]});
      } else {
        tutPlace('[data-act="go"]', {eyebrow:'Step 4 · Deploy', title:'Confirm your team',
          html:'Your cell is ready. Click <b>Confirm team</b> to drop into the breach.'});
      }
      return;
    }
    // --- battle: card selection ---
    if(app.querySelector('.card-tray')){
      if(!TUT.tourDone){ tutBattleTour(); return; }
      if(!TUT.coreDone){
        const sel=UI.sel;
        const stage = sel && sel.stage;
        if(stage==='target'){                                   // picking an enemy to attack — the target row is glowing
          tutPlace('#battle .cfighter.targetable', {eyebrow:'Pick a target', title:'Choose who to hit',
            html:'Now click a <b>glowing enemy</b> up top to aim your attack at them.'});
        } else if(stage==='ally'){                               // a support card that needs an ally
          tutPlace('#battle .cfighter.targetable', {eyebrow:'Pick an ally', title:'Choose who receives it',
            html:'Click a <b>glowing operative</b> to receive this card.'});
        } else if(stage==='discard'){
          tutPlace('.card-tray', {eyebrow:'Discard cost', title:'Pick a card to discard',
            html:'This card asks you to discard another first — click any highlighted card.'});
        } else {
          const staged = !!(sel && sel.picks && sel.picks.length);
          // Prefer to point at a real attack card so the guided path is unambiguous
          // (attacks then ask for an enemy target). Fall back to the whole tray.
          const atkSel = '#battle .hand-fan .pcard[data-aim="enemy"]:not(.used):not(.illegal):not(.cantafford)';
          const hasAtk = !!app.querySelector(atkSel);
          if(!staged){
            tutPlace(hasAtk ? atkSel : '.card-tray', {eyebrow:'Your hand', title:'Play a card',
              html: hasAtk
                ? 'Click this <b>attack card</b> to play it — cards cost <b>energy</b> and resolve by speed tier (T1→T4). It’ll then ask you to pick a target.'
                : 'Click a card to stage it for this round. Cards cost <b>energy</b> and resolve by speed tier (T1→T4).'});
          } else {
            tutPlace('[data-act="lock"]', {eyebrow:'Lock it in', title:'Confirm the round',
              html:'Your pick is staged. Click <b>Confirm</b> — both teams reveal and resolve at once.<br><br><span style="opacity:.82">Tip: <b>right-click</b> clears your staged cards.</span>'});
          }
        }
      } else { tutHide(); }
      return;
    }
    // --- battle: resolution / log ---
    if(app.querySelector('.dock-log')){
      if(!TUT.logDone){
        tutPlace('#docklog', {eyebrow:'The battle log', title:'Read what happened',
          html:'Every hit, block, and KO is reported here as cards fire by tier.',
          actions:[{label:'Got it ›', primary:true, onClick:()=>{ TUT.logDone=true; tutSync(); }}]});
      } else if(!TUT.helpShown){
        tutPlace('#helpBtn', {eyebrow:'Need the rules?', title:'Your reference is here',
          html:'The <b>?</b> button (bottom-right) has <b>How to Play</b>, the full <b>Battle Log</b>, and credits — open it any time.',
          actions:[{label:'Got it ›', primary:true, onClick:()=>{ TUT.helpShown=true; TUT.coreDone=true; tutHide(); }}]});
      } else { tutHide(); }
      return;
    }
    tutHide();
  }
  // Called from showEnd on the first match: thank the tester and retire the tutorial.
  function tutFinish(){
    tutMarkSeen();
    tutPlace(null, {center:true, noSkip:true, eyebrow:'Onboarding complete', title:'Thank you for testing RIFT PROTOCOL!',
      html:'That’s the core loop — deploy a pair, play cards by tier, and close the breach.<br><br>Remember: <b>right-click</b> is Back across the menus and Undo in battle. Explore Escalations, Lore, and the deck library whenever you’re ready.',
      actions:[{label:'Finish', primary:true, onClick:()=> tutHide()}]});
  }
  window.addEventListener('resize', ()=>{ try{ if(TUT.active) tutSync(); }catch(e){} });
  window.addEventListener('scroll', ()=>{ try{ if(TUT.active) tutReposition(); }catch(e){} }, true);
  // keep the ring glued to its target through menu slide-ins / layout shifts
  setInterval(()=>{ try{ if(TUT.active) tutReposition(); }catch(e){} }, 250);

  // Floating in-game Feedback button removed (per design slide); feedback still
  // lives in the Help panel's Feedback tab. mountFeedbackButton() kept for reuse.
  mountRcHint();
  mountCoach();
  // The guided onboarding coach is desktop-only: on a phone the centered panel
  // sits over the play area and gets in the way, so skip it on narrow viewports.
  // (The standalone How-to-Play / Rift Cards menu pages remain available to all.)
  const isMobileViewport = ()=> window.matchMedia('(max-width:760px)').matches;
  if(!tutSeen() && !isMobileViewport()) TUT.active=true;
  mountHelpButton();
  showSplash();
})();
</script>
</body>
</html>
