<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIFT PROTOCOL</title>
<!-- Socket.io client (online multiplayer only; the game runs fully offline without it) -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root{
    --bg:#15140f; --panel:#22211b; --panel2:#2c2c24; --ink:#ece7d8; --muted:#9c9684;
    --line:#3a392f; --accent:#d8a657; --good:#7fae5e; --bad:#d06b56; --pierce:#c77dff;
    --t1:#5e9bd6; --t2:#5ec8c0; --t3:#d8a657; --t4:#d06b56;
    --energy:#6fd6c8;   /* energy accent = teal, matching the active-energy token art */
    --font-display:'Asimovian','Segoe UI',system-ui,sans-serif;
    --font-body:'Barlow Condensed','Segoe UI',system-ui,sans-serif;
  }
  /* ---- custom fonts (TTF in artassets/fonts) ---- */
  @font-face{font-family:'Asimovian';src:url("artassets/fonts/Asimovian/Asimovian-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
  @font-face{font-family:'Barlow Condensed';src:url("artassets/fonts/Barlow_Condensed/BarlowCondensed-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
  @font-face{font-family:'Barlow Condensed';src:url("artassets/fonts/Barlow_Condensed/BarlowCondensed-SemiBold.ttf") format("truetype");font-weight:600;font-display:swap}
  *{box-sizing:border-box}
  /* energy glyph — the active-energy token art, shown everywhere energy appears
     (card costs, HUD readout, How-to-Play). Sized small; scales on mobile. */
  .ecirc{display:inline-block;width:clamp(11px,3vw,13px);height:clamp(11px,3vw,13px);
    background:url("artassets/uiUpdate1/opt/gf_energy_active.png") center/contain no-repeat;
    vertical-align:-2px;flex:0 0 auto}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);}
  /* ---- font roles (family swap only; sizes/colours unchanged) ----
     display = Asimovian on names, labels, round, buttons, headers, titles;
     body = Barlow Condensed on descriptions, stats, helper text, general body. */
  h1,h2,h3,h4,.title,.end-title,.help-credit-title,
  button,.menu-item,.mp-btn,.mp-startbtn,.fb-send,.mp-copy,
  .round-badge,
  .pn,.dv-name,.dv-prev-name,.catname,
  .cname,.tray-label,.slot-name,.end-op-name,.classpill,.arena-side .label,
  .ap-h,.rail-label,.dv-head,.staging-label,.help-tab,.menu-tab,
  .esc-card .esc-name,.lore-tab{font-family:var(--font-display)}
  #app{max-width:1080px;margin:0 auto;padding:16px;}
  h1{font-size:30px;letter-spacing:1px;margin:.2em 0;color:var(--accent)}
  h2{font-size:20px;margin:.6em 0 .3em}
  .sub{color:var(--muted);margin:0 0 16px}
  /* All buttons share the ornate metal frame art (border-image). The center is
     the button's own background colour; primary buttons get a warm accent tint.
     Icon/round/close buttons opt out via .btn-plain (see UI-art section). */
  button{font:inherit;color:var(--ink);background:rgba(16,14,9,.55);
    border:10px solid transparent;border-radius:0;padding:5px 14px;cursor:pointer;
    border-image:url("artassets/uiUpdate1/opt/gf_btn_confirm.png") 19% 9% stretch}
  button:hover:not(:disabled){border-color:transparent;color:var(--accent);background:rgba(36,29,15,.62)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:color-mix(in srgb,var(--accent) 26%,#0a0a08);color:#f3e6c8;font-weight:800}
  button.primary:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 40%,#0a0a08);color:#fff}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .hidden{display:none !important}
  .muted{color:var(--muted)}
  .center{text-align:center}

  /* class select */
  .classgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:760px){ .classgrid{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:480px){ .classgrid{grid-template-columns:1fr} }
  .classcard{cursor:pointer;transition:border-color .1s}
  .classcard .cname{font-size:18px;font-weight:700;color:var(--accent)}
  .classcard .ctag{color:var(--muted);font-size:13px}
  .classcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .classcard .budget{margin-top:6px;font-size:12px;color:var(--muted)}

  /* match board + arena background */
  .board{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;position:relative;
    border-radius:12px;padding:12px;background:radial-gradient(120% 120% at 50% 0%, #20201a, #131210)}
  .board.hasbg{background-image:linear-gradient(rgba(15,14,11,.74),rgba(15,14,11,.86)), var(--arena);
    background-size:cover;background-position:center}
  .team h2{display:flex;justify-content:space-between;align-items:baseline}
  /* fighter card: class-color stripe + portrait + meta */
  .fighter{display:flex;gap:10px;border:1px solid var(--line);border-left:4px solid var(--cls,var(--accent));
    border-radius:10px;padding:8px;margin-bottom:8px;background:rgba(34,33,27,.86)}
  .fighter.dead{opacity:.45;filter:grayscale(.6)}
  .fighter.targetable{cursor:pointer;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .fighter.seltarget{box-shadow:0 0 0 2px var(--accent) inset}
  .fmeta{flex:1;min-width:0}
  .portrait{width:64px;height:64px;flex:0 0 64px;border-radius:8px;overflow:hidden;position:relative;
    background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 55%, #1b1a14), #14130f);
    border:1px solid color-mix(in srgb, var(--cls) 40%, var(--line))}
  .portrait .pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .portrait .portph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;letter-spacing:.5px;color:rgba(255,255,255,.55);text-transform:uppercase}
  .portrait.enemyart .pimg{transform:scaleX(-1);filter:saturate(.85) brightness(.92)}
  .fname{font-weight:700}
  .fclass{color:var(--muted);font-size:12px}
  .hpbar{height:10px;background:#000;border-radius:6px;overflow:hidden;margin:6px 0}
  .hpfill{height:100%;background:linear-gradient(90deg,var(--good),var(--accent))}
  /* energy meter */
  .energy{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border:1px solid var(--accent);
    border-radius:20px;color:var(--accent);font-weight:700;font-size:13px}
  .energy .pips{display:inline-flex;gap:3px}
  .energy .pips i{width:9px;height:9px;border-radius:50%;background:#000;border:1px solid var(--line)}
  .energy .pips i.on{background:var(--energy);border-color:var(--energy);box-shadow:0 0 4px var(--energy)}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
  .tag{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .tag.block{color:var(--t1);border-color:var(--t1)}
  .tag.buff{color:var(--good);border-color:var(--good)}
  .tag.debuff{color:var(--bad);border-color:var(--bad)}
  .tag.equip{color:var(--accent);border-color:var(--accent)}

  /* hand */
  .hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .pcard{cursor:pointer;border:1px solid var(--line);border-top:3px solid var(--cls,var(--line));
    border-radius:9px;background:var(--panel);padding:0 8px 0;position:relative;overflow:hidden;
    display:flex;flex-direction:column}
  .pcard:hover{border-color:var(--accent)}
  .pcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .pcard.illegal,.pcard.cantafford{opacity:.4;cursor:not-allowed}
  .pcard.used{opacity:.5;cursor:default}
  /* card illustration panel: type art image over a type-color fallback */
  .cardart{position:relative;overflow:hidden;flex:0 0 auto;height:54px;margin:0 -8px 6px;display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(135deg, color-mix(in srgb, var(--ct,var(--line)) 38%, #14130f), #16150f)}
  .cardart-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cardart .artph{font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.5);text-transform:uppercase}
  /* energy cost badge — top-left corner over the card art */
  .cardart .cost-badge{position:absolute;top:4px;left:4px;z-index:2;font-size:13.5px;font-weight:800;
    padding:1px 7px;border-radius:10px;color:var(--energy);background:rgba(8,8,6,.85);
    border:1px solid color-mix(in srgb,var(--energy) 45%,#000);box-shadow:0 1px 5px rgba(0,0,0,.6)}
  .catcard-art{height:58px;margin:6px -11px;border-top:1px solid var(--line)}
  .pcard .ph{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .pcard .pn{font-weight:700;font-size:15px;line-height:1.2}
  /* energy cost pill — black bg + green so it reads over any card art (tier is shown by the T# badge) */
  .cost{font-size:13px;font-weight:700;padding:1px 7px;border-radius:10px;color:var(--energy);
    background:rgba(8,8,6,.85);border:1px solid color-mix(in srgb,var(--energy) 45%,#000);
    display:inline-flex;align-items:center;gap:3px;line-height:1.5}
  /* type/tier/symbol footer pinned to the bottom of the card */
  .pcard .pt{font-size:13px;color:var(--muted);margin-top:auto;padding:5px 0;display:flex;align-items:center;gap:5px;border-top:1px solid var(--line)}
  .pcard .pe{font-size:14px;color:var(--ink);margin-top:4px}
  .pcard .phint{font-size:13px;color:var(--good);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pcard .pf{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:4px}
  .spd{font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:4px;color:#11100b}
  .spd.t1{background:var(--t1)} .spd.t2{background:var(--t2)} .spd.t3{background:var(--t3)} .spd.t4{background:var(--t4)}
  .classpill{font-size:10px;color:var(--muted)}

  /* log */
  #log{background:#100f0b;border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:320px;overflow:auto;font:13px/1.5 "Consolas",monospace}
  #log .le{margin:1px 0}
  #log .tier{color:var(--accent);font-weight:700;margin-top:6px}
  #log .dmg{color:var(--bad)} #log .heal{color:var(--good)} #log .blk{color:var(--t1)}
  #log .pie{color:var(--pierce)} #log .death{color:#fff;background:#5a1f1f;padding:0 4px;border-radius:3px}
  #log .sys{color:var(--muted)}
  #log .flip{color:#e9c46a;font-weight:700}
  #log .cancel{color:#8c8676;text-decoration:line-through;font-style:italic}

  .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 12px}
  .pill{padding:4px 10px;border:1px solid var(--line);border-radius:20px;color:var(--muted)}

  /* pass-device cover */
  #cover{position:fixed;inset:0;background:#0c0b08;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50}
  #cover h1{font-size:34px}
  /* endscreen */
  #end{position:fixed;inset:0;background:rgba(8,8,6,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:60}
  .assignhint{color:var(--accent);min-height:20px;margin:4px 0}
  footer{color:var(--muted);font-size:12px;margin-top:18px;text-align:center}
  a{color:var(--accent)}

  /* ============ MAIN MENU ============ */
  #menu{position:relative;min-height:calc(100dvh - 32px);display:flex;flex-direction:column;justify-content:center;
    align-items:center;text-align:center;
    border-radius:16px;padding:34px;background:radial-gradient(120% 90% at 50% 0%, #26241c, #100f0b)}
  /* full-screen menu background (fixed layer like the other screens), not boxed to #app */
  #menu.hasbg{background:transparent;overflow:visible}
  #menu.hasbg::before{content:"";position:fixed;inset:0;z-index:-1;
    background-image:linear-gradient(rgba(13,12,9,.62),rgba(13,12,9,.9)), var(--menubg);
    background-size:cover;background-position:center}
  #menu .title{font-size:clamp(54px,8vw,84px);letter-spacing:3px;margin:0;color:var(--accent);text-shadow:0 4px 22px #000}
  #menu .tagline{color:var(--ink);opacity:.85;margin:4px 0 22px;max-width:560px}
  #menu .modes{display:flex;gap:12px;flex-wrap:wrap}
  #menu .howto{margin-top:22px;max-width:620px;background:rgba(18,17,13,.72);border:1px solid var(--line);border-radius:12px;padding:14px 16px}

  /* ============ CLASS SELECT PORTRAITS ============ */
  .classcard{display:flex;gap:12px;align-items:flex-start}
  .classcard .cport{width:64px;height:64px;flex:0 0 64px;border-radius:8px;overflow:hidden;position:relative;
    border:1px solid color-mix(in srgb, var(--cls) 45%, var(--line));
    background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 55%, #1b1a14), #14130f)}
  .classcard .cport img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .classcard .cport .ph{display:none}
  .classcard .cbody{flex:1;min-width:0}
  /* class-select team slots — two blank card shapes that fill as you pick */
  .team-slots{display:flex;gap:18px;justify-content:center;margin:18px 0 6px}
  .team-slot{width:118px;height:152px;border-radius:12px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;position:relative}
  .team-slot.empty{border:2px dashed var(--line);color:var(--muted)}
  .team-slot.empty .slot-hint{font-size:11px;text-transform:uppercase;letter-spacing:1px}
  .team-slot.filled{border:1px solid var(--cls);background:rgba(20,19,15,.7);cursor:pointer;
    box-shadow:0 0 0 1px var(--cls) inset, 0 6px 16px rgba(0,0,0,.4)}
  .team-slot.filled:hover{box-shadow:0 0 0 2px var(--cls) inset, 0 6px 16px rgba(0,0,0,.5)}
  .team-slot .cport{width:88px;height:88px;border-radius:10px;overflow:hidden;position:relative;
    background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 55%, #1b1a14), #14130f)}
  .team-slot .cport img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .team-slot .cport .ph{display:none}
  .team-slot .slot-name{font-weight:700;font-size:13px;color:var(--cls)}
  .team-slot .slot-x{position:absolute;top:5px;right:7px;color:var(--bad);font-weight:800;font-size:13px}

  /* ============ NO-SCROLL BATTLE FRAME ============ */
  #battle{position:fixed;inset:0;height:100dvh;display:grid;gap:8px;padding:8px 8px clamp(20px,4.5vh,54px);box-sizing:border-box;overflow:hidden;
    grid-template-columns:minmax(0,1fr);   /* full-width arena, no side rail */
    grid-template-rows:auto minmax(0,1fr) auto minmax(0,1fr) auto;   /* top · enemy half · controls(middle) · hand half · your team */
    background:radial-gradient(120% 90% at 50% 0%, #20201a, #100f0b)}
  /* the Warp Zone background now stretches across the whole battle screen */
  #battle.hasbg{background-image:linear-gradient(rgba(13,12,9,.5),rgba(13,12,9,.82)), var(--arena);background-size:cover;background-position:center}
  .bf-top{position:relative;grid-column:1 / -1;grid-row:1;display:flex;align-items:center;justify-content:center;gap:14px;min-height:0}
  /* centered control cluster (energy → round → confirm/undo) sitting above the hands */
  .bf-controls{grid-column:1 / -1;grid-row:3;display:flex;justify-content:center;align-items:center;min-height:0;
    position:relative;z-index:12}   /* always above the staging row so Confirm/Undo stay clickable */
  .ctrl-cluster{display:flex;align-items:center;justify-content:space-between;gap:clamp(74px,13vw,140px);
    width:min(620px,94vw);background:rgba(18,17,13,.82);border:1px solid var(--line);
    border-radius:14px;padding:8px 20px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .ctrl-cluster .energy-box{flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap;max-width:220px}
  .ctrl-cluster .energy-box .tip{margin:0}
  .ctrl-buttons{display:flex;gap:10px}
  .ctrl-buttons .ctrlbtn{width:auto;min-width:108px;font-size:16px}
  .ctrl-buttons .menu-btn{display:none}   /* mobile-only: appears in the bottom control cluster */
  .top-round{display:none}                /* mobile-only: round counter shown in the top glance bar */
  .skip-btn{width:auto;min-width:120px;font-size:16px}
  /* Confirm/Undo colours + frame art are defined in the UI-art section below. */
  .quit-btn{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:12px}
  /* staging area — clicked cards wait in the middle of the arena */
  .arena-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:0;overflow:visible;z-index:6}
  .staging{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;min-height:0}
  .staging-label{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
  /* staged cards = compact pills (the full card opens in the hover/press-hold popup).
     Short, so they never clip in the staging strip; wrap + center when there are many. */
  .staging-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:min(94vw,1000px);padding:2px}
  .staged{position:relative;display:flex;flex-direction:row;align-items:center;gap:8px;width:auto;cursor:pointer;
    border:1px solid var(--accent);border-left:4px solid var(--cls,var(--accent));border-radius:10px;
    background:rgba(20,19,15,.94);box-shadow:0 4px 12px rgba(0,0,0,.5);padding:7px 12px;transition:transform .1s}
  .staged:hover{transform:translateY(-2px);background:rgba(40,33,20,.95)}
  .staged.pcard .cardart,.staged.pcard .pn,.staged.pcard .pe,.staged.pcard .pt{display:none}
  .staged .compact-cost{display:inline-flex;align-items:center;gap:3px;order:1;font-size:13px;font-weight:700;padding:1px 7px;border-radius:9px}
  .staged .compact-name{display:inline;order:2;font-weight:800;font-size:14.5px}
  .staged .staged-tgt{order:3;padding:0;color:var(--muted);font-weight:600;font-size:12px}
  .staged .staged-x{position:static;order:4;color:var(--bad);font-weight:800;font-size:15px;background:none}
  .staging-empty{font-size:11.5px;color:var(--muted);opacity:.55}
  /* prominent middle-of-screen prompt while choosing a target */
  .target-notice{font-size:16px;font-weight:800;letter-spacing:.4px;padding:9px 20px;border-radius:11px;text-align:center;
    background:rgba(10,9,6,.9);border:2px solid var(--tn,var(--accent));color:var(--ink);
    animation:noticePulse 1s ease-in-out infinite}
  .target-notice.enemy{--tn:var(--bad)} .target-notice.ally{--tn:var(--good)}
  .target-notice b{color:var(--tn,var(--accent))}
  .target-notice .tn-sub{display:block;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-top:2px}
  @keyframes noticePulse{
    0%,100%{box-shadow:0 0 14px color-mix(in srgb,var(--tn) 40%,transparent)}
    50%{box-shadow:0 0 34px color-mix(in srgb,var(--tn) 90%,transparent)}}
  /* row 2 arena: enemy team + staging/lock-in (full width; left sidebar removed) */
  .bf-center{grid-column:1 / -1;grid-row:2;position:relative;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;padding:4px 10px;min-height:0}
  /* hand row: FULL WIDTH so cards are never clipped */
  .bf-hand{grid-column:1 / -1;grid-row:4;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  /* your team: full-width row pinned to the bottom; decks tuck into the bottom-left corner */
  .bf-you{grid-column:1 / -1;grid-row:5;position:relative;display:flex;justify-content:center;align-items:flex-end}
  .deck-corner{position:absolute;left:4px;bottom:2px;z-index:5;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
  .deck-corner .deck-rail{justify-content:flex-start;gap:12px}
  .deck-corner .rail-label{font-size:13px}
  .deck-corner .deck-back{width:90px;height:126px}
  .deck-corner .deck-count{font-size:13px}
  .arena-slot{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:center}
  /* top bar: round counter (and turn hint) across the top of the screen */
  .top-hint{font-size:14.5px;color:var(--ink)}

  .arena-side{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
  .arena-side .label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:640px;flex-shrink:0}
  /* enemy team — larger & centered, so buffs/debuffs/armor read clearly (per design slide) */
  .enemy-side{margin:0 auto}
  .enemy-side .pair{max-width:760px;gap:20px}
  .enemy-side .label{font-size:12px}
  .enemy-side .cfighter{padding:9px 12px;gap:14px}
  .enemy-side .cfighter .cport{width:134px;height:134px;flex:0 0 134px;min-width:134px;min-height:134px}
  .enemy-side .cfighter .cname{font-size:19.5px}
  .enemy-side .cfighter .ctag{font-size:12.5px;padding:1px 6px}
  /* the operative rows never participate in the battle-log's reflow: lock their size
     so the end-of-turn log (its own grid row) can't compress portraits. Size stays
     viewport-driven only. */
  .bf-center,.bf-you{flex-shrink:0}
  /* fighter card (larger, to balance the deck backs) */
  /* operative display: subtle original backdrop (just enough separation from the
     arena — no decorative panel graphic). */
  .cfighter{position:relative;display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:11px;
    background:rgba(20,19,15,.72);border:1px solid var(--line);border-top:3px solid var(--cls,var(--accent));
    box-shadow:0 5px 13px rgba(0,0,0,.32)}
  .cfighter.dead{opacity:.4;filter:grayscale(.7)}
  /* valid targets pulse — color-coded: enemies red, allies green */
  .cfighter.targetable{cursor:pointer;border-color:var(--tgl,var(--accent));z-index:3;
    animation:targetpulse .95s ease-in-out infinite}
  .cfighter.target-enemy{--tgl:var(--bad)}
  .cfighter.target-ally{--tgl:var(--good)}
  @keyframes targetpulse{
    0%,100%{box-shadow:0 0 0 2px var(--tgl),0 0 16px 3px color-mix(in srgb,var(--tgl) 55%,transparent),0 6px 14px rgba(0,0,0,.4);transform:scale(1)}
    50%{box-shadow:0 0 0 4px var(--tgl),0 0 40px 10px color-mix(in srgb,var(--tgl) 95%,transparent),0 6px 14px rgba(0,0,0,.4);transform:scale(1.04)}}
  .cfighter.seltarget{box-shadow:0 0 0 2px var(--accent) inset}
  /* during target selection, fade fighters that can't be chosen */
  #battle.targeting .cfighter:not(.targetable){opacity:.35}
  .cfighter .cport{width:118px;height:118px;flex:0 0 118px;flex-shrink:0;min-width:118px;min-height:118px;border-radius:9px;overflow:hidden;position:relative;
    background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 55%, #1b1a14), #14130f)}   /* original portrait backdrop */
  .cfighter .cport img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cfighter .cport.enemyart img{transform:scaleX(-1);filter:saturate(.85) brightness(.92)}
  .cfighter .cport .ph{display:none}
  .cfighter .cmeta{flex:1;min-width:0}
  .cfighter .cname{font-weight:700;font-size:19px;display:flex;justify-content:space-between;gap:6px}
  .cfighter .chpwrap{display:flex;align-items:center;gap:7px;margin:7px 0}
  .chpbar{flex:1;height:12px;background:#000;border-radius:6px;overflow:hidden}
  .chpfill{height:100%;background:linear-gradient(90deg,var(--good),var(--accent));transition:width .42s ease}
  .chpnum{font-size:15px;color:var(--muted);min-width:50px;text-align:right}
  .ctags{display:flex;gap:4px;flex-wrap:wrap}
  .ctag{font-size:12.5px;padding:1px 6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);line-height:1.5}
  .ctag.block{color:var(--t1);border-color:var(--t1)} .ctag.buff{color:var(--good);border-color:var(--good)}
  .ctag.debuff{color:var(--bad);border-color:var(--bad)} .ctag.equip{color:var(--accent);border-color:var(--accent)}
  .floatlayer{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .floatnum{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-weight:800;font-size:18px;
    text-shadow:0 2px 6px #000;animation:floatup 1s ease-out forwards}
  .floatnum.dmg{color:#ff8a6b} .floatnum.heal{color:#9ad17a}
  .floatnum.block{color:#7fc4ff;font-size:13px;top:26px;text-transform:uppercase;letter-spacing:.5px}
  @keyframes floatup{0%{opacity:0;transform:translate(-50%,4px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px) scale(1.1)}}
  .cfighter.hit{animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .cfighter.blockflash{box-shadow:0 0 0 2px #7fc4ff, 0 0 14px #7fc4ff inset}
  /* tier banner during the resolution animation */
  .tier-banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:8;
    pointer-events:none;font-size:30px;font-weight:800;letter-spacing:2px;color:#fff;opacity:0;
    text-shadow:0 3px 16px #000, 0 0 22px rgba(216,166,87,.6);background:rgba(12,11,8,.45);
    padding:6px 22px;border-radius:12px;border:1px solid var(--accent);white-space:nowrap}
  .tier-banner.show{animation:tierpop 1.1s ease-out}
  @keyframes tierpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}

  /* player's class decks (draw piles) — flank the portraits on the outside */
  .your-row{display:flex;align-items:center;justify-content:center;gap:16px}
  .deck{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto}
  .deck-back{width:64px;height:90px;border-radius:7px;overflow:hidden;position:relative;
    border:1px solid color-mix(in srgb, var(--cls) 50%, var(--line));
    background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 60%, #1b1a14), #14130f);
    box-shadow:0 4px 12px rgba(0,0,0,.5)}
  .deck-back img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .deck-back .deck-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;letter-spacing:.4px;color:rgba(255,255,255,.65);text-transform:uppercase;
    text-align:center;padding:3px;line-height:1.05;overflow-wrap:anywhere;word-break:break-word}
  .deck-count{font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap}
  .deck.deckdead{opacity:.38;filter:grayscale(.7)}
  .deck.deckdead .deck-count{color:var(--muted)}
  .deck:hover .deck-back{outline:2px solid var(--accent);outline-offset:1px}
  /* deck rail in the right column (under Lock in / Undo) */
  .rail-label{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .deck-rail{display:flex;gap:10px;justify-content:center}
  .deck-rail .deck{cursor:pointer}
  .deck-rail .deck-back{width:52px;height:74px}
  .deck-rail .deck-count{font-size:10px}
  /* deck viewer — centered modal: header · scrollable pill list · divider · full-width preview below */
  .dv-backdrop{position:fixed;inset:0;z-index:40;background:rgba(6,5,3,.55);display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box}
  .deck-viewer{width:min(560px,92vw);max-height:80vh;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;
    background:rgba(10,9,6,.97);border:1px solid var(--accent);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  .dv-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;position:sticky;top:0;z-index:2;
    background:rgba(10,9,6,.98);border-bottom:1px solid var(--line);font-weight:700;color:var(--accent);font-size:13px;letter-spacing:.4px}
  .dv-close{font-size:12px;padding:3px 9px}
  /* base pill grid (shared with the Recon picker); deck-viewer scopes its own height */
  .dv-grid{display:flex;flex-wrap:wrap;gap:7px;padding:10px;align-content:flex-start;overflow-y:auto}
  .deck-viewer .dv-grid{flex:0 0 auto;max-height:32vh}
  .dv-card{display:inline-flex;align-items:center;gap:6px;height:fit-content;padding:5px 9px;border-radius:8px;cursor:pointer;
    background:rgba(20,19,15,.92);border:1px solid var(--line);border-left:3px solid var(--cls,var(--accent));font-size:12px}
  .dv-card:hover,.dv-card.active{border-color:var(--accent);background:rgba(44,32,18,.95)}
  .dv-cost{font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px}
  .dv-name{font-weight:600}
  .dv-divider{height:1px;background:var(--line);margin:0 12px;flex:0 0 auto}
  .dv-preview{flex:1 0 auto;min-height:200px;display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box}
  .dv-hint{font-size:13px;color:var(--muted);text-align:center}
  .dv-prev-card{width:100%;max-width:340px}
  .dv-prev-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px}
  .dv-prev-name{font-size:19px;font-weight:800;color:var(--cls,var(--accent));line-height:1.15}
  .dv-prev-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted);justify-content:flex-end}
  .dv-prev-art{height:auto;aspect-ratio:16/9;width:100%;max-width:320px;margin:0 auto 10px;border-radius:10px;border-bottom:0}
  .dv-prev-text{font-size:15px;line-height:1.5;color:var(--ink)}
  .dv-prev-flavor{font-size:13px;font-style:italic;color:var(--muted);margin-top:8px}
  /* discard-on-play: candidate cards during a Recon/Ante Up discard choice */
  .hand-fan .pcard.discardable{cursor:pointer;outline:2px dashed var(--bad);outline-offset:-2px}
  .hand-fan .pcard.discardable:hover{outline-style:solid;box-shadow:0 0 14px color-mix(in srgb,var(--bad) 60%,transparent)}
  /* Recon tutor picker (over the #cover dialog) */
  .reconpick .reconpick-grid{max-width:720px;max-height:52vh;overflow-y:auto;justify-content:center;border:1px solid var(--line);border-radius:10px}
  .reconpick .dv-card{cursor:pointer}
  .staged-disc{color:var(--bad);font-size:11px}

  /* fullscreen fight cinematic overlay (fades in on appear, fades into battle) */
  .intro-overlay{position:fixed;inset:0;z-index:80;background:#000;display:flex;align-items:center;justify-content:center;
    opacity:1;transition:opacity .5s ease;animation:introIn .35s ease}
  @keyframes introIn{from{opacity:0}to{opacity:1}}
  .intro-overlay.fade-out{opacity:0}
  .intro-video{width:100%;height:100%;object-fit:cover}
  .intro-skip{position:absolute;right:18px;bottom:18px;z-index:81}

  /* right-margin controls — teal energy text PLUS a row of pips (visual complement) */
  .energy-box{display:flex;flex-direction:column;gap:4px;align-items:flex-start;flex-wrap:wrap}
  .energy-box .big{font-size:21px;font-weight:800;color:var(--energy);white-space:nowrap}
  .energy-box .big .enext{font-size:13px;font-weight:600;color:var(--muted)}
  /* energy pips: filled = available, dim = spent. Colour tracks the energy token. */
  .energy-box .pips{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;line-height:1}
  .energy-box .pips i{width:9px;height:9px;border-radius:50%;background:#0a0a08;
    border:1px solid var(--line);box-sizing:border-box;transition:background .18s ease,box-shadow .18s ease}
  .energy-box .pips i.on{background:var(--energy);border-color:var(--energy);
    box-shadow:0 0 5px color-mix(in srgb,var(--energy) 65%,transparent)}
  .ctrlbtn{width:100%}

  /* ============ HAND (fan + hover focus) — now in the arena, above your team ============ */
  .dockwrap{height:100%;display:flex;flex-direction:column;min-height:0}
  /* hand groups: one per living fighter, ordered by tier within the group.
     A visible gap separates the two fighters' groups; a lone fighter = no gap. */
  /* responsive fan: card width & overlap scale with viewport so cards never
     pile on top of each other on smaller screens */
  .hand-fan{flex:1;display:flex;justify-content:center;align-items:flex-end;gap:clamp(14px,2.6vw,38px);padding:6px 18px 2px;min-height:0}
  .hand-group{display:flex;align-items:flex-end;min-width:0;justify-content:center}
  .hand-fan .pcard{width:clamp(124px,12.5vw,172px);flex:0 0 auto;margin-left:clamp(-62px,-3.6vw,-30px);
    height:auto;cursor:pointer;
    transition:transform .16s ease, margin .16s ease, opacity .16s ease;transform-origin:bottom center}
  /* uniform height for the full (non-pill) hand cards so every card matches */
  .hand-fan .pcard:not(.pill){height:192px}
  .hand-group .pcard:first-child{margin-left:0}
  .hand-fan:hover .pcard{opacity:.8}
  .hand-fan .pcard:hover{opacity:1;transform:translateY(-22px) scale(1.12);z-index:6;margin-left:20px;margin-right:34px}
  .hand-group:has(.pcard:hover) .pcard:hover ~ .pcard{transform:translateX(40px)}
  @media (max-width:900px){ .hand-fan .pcard{width:clamp(92px,12vw,120px)} }
  .pcard.cantafford,.pcard.illegal{opacity:.4 !important;cursor:not-allowed}
  /* queued: the card stays visible, lifts, brightens, and gets a ✓ badge */
  .pcard.used{opacity:1 !important;cursor:default;border-color:var(--accent);
    box-shadow:0 0 0 2px var(--accent), 0 0 16px rgba(216,166,87,.55);
    transform:translateY(-12px) scale(1.03)}
  .hand-fan:hover .pcard.used{opacity:1}
  .pcard.used:hover{transform:translateY(-12px) scale(1.03)}
  .pcard.used .cardart{filter:brightness(.62) saturate(.55)}
  .pcard.used .disc{display:none}
  .pcard .qbadge{display:none}
  .pcard.used .qbadge{display:flex;position:absolute;top:4px;right:4px;z-index:5;
    width:21px;height:21px;border-radius:50%;background:var(--accent);color:#1c1a12;
    font-weight:800;font-size:13px;align-items:center;justify-content:center;
    box-shadow:0 1px 5px rgba(0,0,0,.55)}
  .pcard.used .qribbon{display:block;position:absolute;bottom:0;left:0;right:0;z-index:4;
    text-align:center;font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
    color:#1c1a12;background:var(--accent);padding:1px 0}
  .pcard .qribbon{display:none}
  .pcard .disc{position:absolute;top:3px;left:3px;z-index:3;font-size:11px;line-height:1;padding:2px 4px;border-radius:5px;
    background:rgba(0,0,0,.55);border:1px solid var(--line);color:var(--muted);cursor:pointer;opacity:0;transition:opacity .15s}
  .pcard:hover .disc{opacity:1}
  .pcard .disc:hover{color:var(--bad);border-color:var(--bad)}
  .pcard .pe{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  /* dock resolution log (portrait-annotated, tier grouped) */
  .dock-log{flex:1;overflow-y:auto;padding:6px 10px;font:13px/1.5 "Consolas",monospace}
  .dock-log .tierhead{color:var(--accent);font-weight:700;margin:6px 0 2px;font-size:13px;font-family:"Segoe UI",sans-serif;letter-spacing:.5px}
  .dock-log .logrow{display:flex;align-items:center;gap:8px;padding:1px 0;animation:fadein .3s}
  @keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1}}
  .dock-log .lportrait{width:24px;height:24px;flex:0 0 24px;border-radius:5px;overflow:hidden;position:relative;
    background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 55%, #1b1a14), #14130f)}
  .dock-log .lportrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .dock-log .ltext{flex:1;min-width:0}
  .dock-log .dmg{color:var(--bad)} .dock-log .heal{color:var(--good)} .dock-log .pie{color:var(--pierce)}
  .dock-log .flip{color:#e9c46a;font-weight:700} .dock-log .cancel{color:#8c8676;text-decoration:line-through;font-style:italic}
  .dock-log .blk{color:#7fc4ff} /* hit negated by a block/reduction */
  .dock-log .sys{color:var(--muted)}
  .dock-log .death{color:#fff;background:#5a1f1f;padding:0 4px;border-radius:3px;display:inline-block}

  /* ============ CARD TYPE SYMBOLS (color-coded, inline SVG) ============ */
  .tsym{width:13px;height:13px;vertical-align:-2px;display:inline-block}
  .tsym-wrap{display:inline-flex;align-items:center;gap:3px}
  .sym-attack{color:var(--bad)} .sym-defend{color:var(--t1)} .sym-buff{color:var(--good)}
  .sym-spell{color:var(--pierce)} .sym-potion{color:var(--t2)} .sym-equip{color:var(--accent)}
  .sym-signature{color:#f2c14e;filter:drop-shadow(0 0 3px rgba(242,193,78,.6))}
  .sym-debuff{color:var(--bad)}
  .tsym-debuff{width:11px;height:11px;vertical-align:-1px;margin-left:1px}

  /* ============ COLLAPSIBLE IN-MATCH TUTORIAL ============ */
  .tut-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;
    background:transparent;border:0;padding:0;font-weight:700;color:var(--accent);
    font-size:13px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer}
  .tut-toggle:hover{border-color:transparent;color:var(--ink)}
  .tut-toggle .chev{font-size:11px;color:var(--muted)}
  .tut-body{margin-top:8px}
  .tut-body .k{color:var(--ink);font-weight:700}
  /* per-feature accordion inside the How-to-play panel */
  .acc-item{border-top:1px solid var(--line)}
  .acc-item:first-child{border-top:0}
  .acc-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;
    background:transparent;border:0;padding:6px 0;cursor:pointer;text-align:left;
    font-size:11.5px;font-weight:700;color:var(--ink)}
  .acc-head:hover{border-color:transparent;color:var(--accent)}
  .acc-head .chev{font-size:10px;color:var(--muted);flex:0 0 auto}
  .acc-body{font-size:11.5px;color:var(--muted);line-height:1.45;margin:0 0 8px;padding-left:2px}
  .acc-body .k{color:var(--ink);font-weight:700}

  /* ============ MAIN MENU NAV + DEV CREDIT ============ */
  #menu .menu-deck-row{display:flex;flex-direction:row;align-items:flex-start;justify-content:center;gap:22px}
  #menu .menu-nav{display:flex;flex-direction:column;gap:10px;max-width:300px}
  @media(max-width:640px){ #menu .menu-deck-row{flex-direction:column;align-items:center} }
  .menu-item{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;
    padding:13px 18px;border-radius:11px;background:rgba(20,19,14,.78);
    border:1px solid var(--line);text-align:left;backdrop-filter:blur(2px)}
  .menu-item .mi-ico{width:20px;height:20px;flex:0 0 20px;color:var(--accent)}
  .menu-item:hover{border-color:var(--accent);transform:translateX(3px);transition:transform .12s}
  .menu-item.primary{background:var(--accent);color:#1c1a12}
  .menu-item.primary .mi-ico{color:#1c1a12}
  #menu .fight-sub{margin-top:0;width:300px;max-width:340px;text-align:left;background:rgba(14,13,9,.82);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  @media(max-width:640px){ #menu .fight-sub{margin-top:12px} }
  #menu .fight-sub .fs-h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  #menu .fight-sub .row{flex-direction:column;gap:8px}
  #menu .fight-sub button{width:100%;text-align:left;line-height:1.25}
  #menu .fight-sub button b{display:block;font-size:14px}
  #menu .fight-sub .fs-sub{display:block;font-size:11px;color:var(--muted);font-weight:400}
  #menu .fight-sub button.primary .fs-sub{color:rgba(28,26,18,.7)}
  .devcredit{position:absolute;right:18px;bottom:14px;z-index:3;font-size:12px;text-decoration:none;
    color:var(--muted);background:rgba(12,11,8,.6);border:1px solid var(--line);
    border-radius:20px;padding:5px 13px;backdrop-filter:blur(2px)}
  .devcredit b{color:var(--ink)}
  .devcredit:hover{color:var(--accent);border-color:var(--accent)}
  .devcredit:hover b{color:var(--accent)}

  /* ============ CHARACTERS ROSTER + DETAIL + CARD CATALOG ============ */
  .char-roster .classcard{cursor:pointer}
  .char-roster .classcard .viewlink{font-size:12px;color:var(--accent);margin-top:6px;font-weight:700}
  .statline{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
  .statchip{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--panel2);
    border:1px solid var(--line);color:var(--muted)}
  .statchip b{color:var(--ink)}
  .char-hero{display:flex;gap:18px;align-items:flex-start;margin:8px 0 16px}
  .char-hero .cport{width:140px;height:140px;flex:0 0 140px;border-radius:12px;overflow:hidden;position:relative;
    border:1px solid color-mix(in srgb, var(--cls) 45%, var(--line));
    background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 55%, #1b1a14), #14130f)}
  .char-hero .cport img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .char-hero .cport .ph{display:none}
  .char-hero .hero-body{flex:1;min-width:0}
  .char-hero .hero-name{font-size:26px;font-weight:800;color:var(--cls,var(--accent))}
  .char-hero .hero-tag{color:var(--ink);opacity:.85;margin:2px 0 2px}
  .char-hero .hero-blurb{color:var(--muted);font-size:13px}
  .char-hero .hp-badge{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--good);
    border:1px solid var(--good);border-radius:20px;padding:3px 12px}
  .catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  /* Fixed height so every catalog card is identical + readable at a glance.
     Text and flavor are line-clamped so nothing overflows the uniform box. */
  .catcard{border:1px solid var(--line);border-top:3px solid var(--cls,var(--line));border-radius:9px;
    background:var(--panel);padding:9px 11px;height:200px;display:flex;flex-direction:column;overflow:hidden}
  .catcard .ph{display:flex;justify-content:space-between;align-items:center;gap:6px;flex:0 0 auto}
  .catcard .pn{font-weight:700;font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .catcard .pt{font-size:11px;color:var(--muted);margin:3px 0;flex:0 0 auto}
  .catcard .pe{font-size:12px;color:var(--ink);margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .catcard .pf{font-size:11px;color:var(--muted);font-style:italic;margin-top:auto;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ============ STANDALONE TUTORIAL PAGE ============ */
  .tut-page{max-width:820px}
  .tut-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .tut-card h3{margin:0 0 6px;font-size:15px;color:var(--accent)}
  .tut-card p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 6px}
  .tut-card .k{color:var(--ink);font-weight:700}

  /* ============ OPERATIVE DOSSIER FIELDS (Characters detail) ============ */
  .char-hero .dossier{margin:8px 0 2px;display:flex;flex-direction:column;gap:5px;max-width:560px}
  .char-hero .dfield{display:flex;gap:8px;align-items:baseline;font-size:13px}
  .char-hero .dlabel{flex:0 0 110px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .char-hero .dval{color:var(--ink)}

  /* ============ LORE PAGE ============ */
  .lore-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
  .lore-tab{font-weight:700;font-size:13px;padding:7px 16px;border-radius:20px;
    background:var(--panel);border:1px solid var(--line);color:var(--muted);cursor:pointer}
  .lore-tab:hover{border-color:var(--accent);color:var(--ink)}
  .lore-tab.active{background:var(--accent);color:#1c1a12;border-color:var(--accent)}
  /* lore content sits in a translucent panel over the menu background, larger text */
  .lore-body{max-width:900px;margin:0 auto;background:rgba(10,9,7,.6);border:1px solid var(--line);
    border-radius:14px;padding:18px 24px;text-align:left}
  .lore-body>p{font-size:18px;line-height:1.65;color:var(--ink);max-width:780px;margin:0 0 14px}
  .lore-body .sub{color:var(--muted);font-size:16px}
  /* clickable image tiles (operatives / warp zones) → open a modal */
  .lore-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
  .lore-tile{position:relative;height:158px;border-radius:12px;overflow:hidden;cursor:pointer;padding:0;
    background-size:cover;background-position:center;color:#fff;text-align:left;
    border:1px solid color-mix(in srgb,var(--cls) 45%,var(--line));border-image:none;
    display:flex;align-items:flex-end;transition:transform .12s}
  .lore-tile:hover{border-color:var(--cls,var(--accent));box-shadow:0 8px 22px rgba(0,0,0,.55);transform:translateY(-3px)}
  .lore-tile .lt-text{width:100%;padding:10px 13px;display:flex;flex-direction:column;gap:2px}
  .lore-tile .lt-text b{font-size:20px;text-shadow:0 1px 4px #000}
  .lore-tile .lt-role{font-size:12.5px;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.4px}
  /* lore detail modal */
  .lore-modal-backdrop{position:fixed;inset:0;z-index:60;background:rgba(6,5,3,.8);display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box}
  .lore-modal{width:min(680px,94vw);max-height:90vh;overflow-y:auto;position:relative;text-align:left;
    background:rgba(12,11,8,.98);border:1px solid var(--accent);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.72)}
  .lore-modal .lm-close{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;
    border-image:none;border:1px solid var(--line);background:rgba(8,8,6,.8);color:var(--ink);font-size:15px;padding:0}
  .lore-modal .lm-close:hover{border-color:var(--bad);color:var(--bad)}
  .lore-modal .lm-hero{height:230px;overflow:hidden;position:relative;border-bottom:2px solid var(--cls,var(--accent));background:#14130f}
  .lore-modal .lm-hero img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
  .lore-modal .lm-hero-wide img{object-position:center}
  .lore-modal .lm-body{padding:18px 26px 26px;font-size:18px;line-height:1.66;color:var(--ink)}
  .lore-modal .lm-body h2{font-size:30px;margin:0 0 2px;letter-spacing:.5px}
  .lore-modal .lm-role{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:12px}
  .lore-modal .lm-meta{font-size:14.5px;color:var(--muted);margin:0 0 14px}
  .lore-modal .lm-body p{margin:0 0 14px}
  @media(max-width:600px){ .lore-modal .lm-hero{height:170px} .lore-modal .lm-body{font-size:16px} .lore-modal .lm-body h2{font-size:24px} }
  /* lore detail-modal meta line (used by the operative/zone modals) */
  .lore-note{max-width:780px;margin-top:14px;border-left:3px solid var(--accent);background:rgba(216,166,87,.1);
    padding:13px 18px;border-radius:0 8px 8px 0;font-size:16.5px;line-height:1.6;color:var(--ink)}
  .lore-note b{color:var(--accent)}
  .lore-k{text-transform:uppercase;letter-spacing:.4px;color:var(--cls,var(--accent));font-weight:700;margin-right:4px}
  .lore-dot{margin:0 7px;opacity:.5}
  /* Operative dossier — roster card mini-fields + detail backstory */
  .dossier-mini{margin:6px 0;display:flex;flex-direction:column;gap:3px}
  .dossier-mini .dm-row{display:flex;gap:7px;align-items:baseline;font-size:12px}
  .dossier-mini .dlabel{flex:0 0 92px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .dossier-mini .dval{color:var(--ink)}
  .char-hero .dossier-back{max-width:600px;margin:8px 0 2px;font-size:13px;line-height:1.55;color:var(--muted)}
  /* Warp Zone selector on class-select */
  .map-select{margin:14px 0 4px}
  .map-select .ms-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:7px;text-align:center}
  .map-select .ms-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:760px;margin:0 auto}
  .ms-chip{font-size:13px;font-weight:700;padding:7px 14px;border-radius:10px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--muted)}
  .ms-chip:hover{border-color:var(--cls,var(--accent));color:var(--ink)}
  .ms-chip.sel{border-color:var(--cls,var(--accent));box-shadow:0 0 0 2px var(--cls,var(--accent))}
  /* map picker: image thumbnails with the warp-zone art + name overlay */
  .ms-chip.ms-img{position:relative;width:128px;height:74px;padding:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;
    background-size:cover;background-position:center;color:#fff}
  .ms-chip.ms-img .ms-name{font-size:12.5px;font-weight:800;padding:4px 6px;text-shadow:0 1px 4px #000;text-align:center;width:100%}
  .ms-chip.ms-rand{width:128px;height:74px;display:flex;align-items:center;justify-content:center}
  .ms-chip.ms-img.sel{color:#fff}
  @media(max-width:600px){ .ms-chip.ms-img,.ms-chip.ms-rand{width:104px;height:60px} }

  /* centered continue prompt in the middle of the battlefield after combat */
  .cont-center{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
  .cont-center .cont-btn{font-size:16px;padding:11px 30px}
  /* floating full-card preview when hovering a staged ability */
  .card-preview{position:fixed;z-index:95;width:232px;pointer-events:none;display:none;
    filter:drop-shadow(0 12px 28px rgba(0,0,0,.7))}
  .card-preview .catcard{margin:0;background:var(--panel)}
  /* big, easy-to-read card popup over the MIDDLE/HUD area (energy/confirm/round) —
     never covers the hand. Triggered by hover (desktop) or press-and-hold (mobile) */
  .hand-preview{position:fixed;bottom:50vh;left:50%;transform:translateX(-50%);z-index:95;width:clamp(280px,28vw,380px);
    pointer-events:none;display:none;filter:drop-shadow(0 14px 32px rgba(0,0,0,.85))}
  .hand-preview .catcard{margin:0;background:var(--panel);border-width:2px}
  .hand-preview .catcard .pn{font-size:21px}
  .hand-preview .catcard .cost{font-size:15px}
  .hand-preview .catcard .pe{font-size:16px;line-height:1.55}
  .hand-preview .catcard .phint{font-size:14.5px;line-height:1.5}
  .hand-preview .catcard .pt{font-size:14px}
  .hand-preview .catcard .cardart{height:104px}
  .hand-preview .catcard .pf{font-size:13.5px}

  /* centered content screens (Rift Cards / How to Play / Lore) */
  .cscreen{display:flex;flex-direction:column;align-items:center;text-align:center}
  /* full-bleed screen backdrops (behind the centered content) */
  .screen-bg-menu,.screen-bg-mp{position:relative}
  .screen-bg-menu::before{content:"";position:fixed;inset:0;z-index:-1;
    background:linear-gradient(rgba(13,12,9,.62),rgba(13,12,9,.9)), url("artassets/Backgrounds/gf_menu_bg.jpg") center/cover no-repeat}
  .screen-bg-mp::before{content:"";position:fixed;inset:0;z-index:-1;
    background:linear-gradient(rgba(10,9,14,.6),rgba(10,9,14,.82)), url("artassets/Backgrounds/gf_bg_multiplayer_v1.jpg") center/cover no-repeat}
  .cscreen>*{width:100%}
  .cscreen .bar{justify-content:center;position:relative}
  .cscreen .bar h1{margin:0}
  .cscreen .bar>button{position:absolute;left:0;top:50%;transform:translateY(-50%)}
  /* persistent audio mute toggle — fixed top-right on every screen */
  .audio-toggle{position:fixed;top:10px;right:12px;z-index:201;width:38px;height:34px;
    display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;line-height:1;padding:0;
    background:rgba(12,11,8,.72);border:1px solid var(--line);border-radius:9px;color:var(--ink);backdrop-filter:blur(2px)}
  .audio-toggle:hover{border-color:var(--accent);color:var(--accent)}
  /* mini volume popout (Music + Effects sliders) */
  .audio-pop{position:fixed;top:50px;right:12px;z-index:201;width:212px;padding:11px 13px;
    background:rgba(14,13,9,.95);border:1px solid var(--line);border-radius:11px;backdrop-filter:blur(3px);
    box-shadow:0 10px 28px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:9px}
  .audio-pop.hidden{display:none}
  .audio-pop .ap-h{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .audio-pop .ap-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink)}
  .audio-pop .ap-row span{flex:0 0 52px}
  .audio-pop input[type=range]{flex:1;min-width:0;accent-color:var(--accent);cursor:pointer}
  .audio-pop .ap-sel{flex:1;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:3px 5px;font-size:11.5px;font-family:inherit;cursor:pointer}
  .audio-pop .ap-sel:focus{outline:none;border-color:var(--accent)}
  .audio-pop .ap-mute{width:100%;font-size:12px;padding:5px;border-radius:7px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--ink)}
  .audio-pop .ap-mute:hover{border-color:var(--accent);color:var(--accent)}
  .audio-pop .ap-mute.on{background:var(--bad);border-color:var(--bad);color:#fff}

  /* end / results screen — Victory / Defeat over the match background */
  .end-screen{background-size:cover;background-position:center;padding:24px}
  .end-screen .end-tag{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
  .end-screen .end-title{font-size:clamp(48px,9vw,76px);font-weight:800;letter-spacing:4px;margin:2px 0 0;text-shadow:0 4px 26px #000}
  .end-screen.win .end-title{color:var(--good)} .end-screen.loss .end-title{color:var(--bad)} .end-screen.draw .end-title{color:var(--accent)}
  .end-screen .end-reason{color:var(--ink);opacity:.85;max-width:540px;text-align:center;margin:2px 0 6px}
  .end-teams{display:flex;align-items:center;justify-content:center;gap:clamp(14px,4vw,40px);flex-wrap:wrap;margin:6px 0}
  .end-team-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:center;margin-bottom:9px}
  .end-row{display:flex;gap:14px;justify-content:center}
  .end-op{width:98px;text-align:center}
  .end-op .cport{width:88px;height:88px;border-radius:11px;overflow:hidden;position:relative;margin:0 auto;
    border:2px solid var(--cls,var(--line));background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 50%, #15140f), #100f0b)}
  .end-op .cport img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .end-op.ko .cport{filter:grayscale(1) brightness(.45)}
  .end-op.ko .cport::after{content:'KO';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--bad);font-weight:800;font-size:22px;text-shadow:0 1px 4px #000}
  .end-op-name{font-size:13px;font-weight:700;margin-top:6px;color:var(--cls,var(--ink))}
  .end-op-hp{font-size:11px;color:var(--muted)}
  .end-vs{font-weight:800;color:var(--muted);font-size:13px;letter-spacing:1px}
  .end-actions{margin-top:10px}
  .cscreen .lore-tabs{justify-content:center}
  .cscreen .tut-page,.cscreen .lore-body{margin-left:auto;margin-right:auto}
  .cscreen .classgrid,.cscreen .char-roster,.cscreen .catalog,.cscreen .tut-grid,.cscreen .lore-grid{justify-content:center;margin-left:auto;margin-right:auto}
  .cscreen .char-roster,.cscreen .catalog{max-width:920px}
  /* keep card/paragraph internals left-aligned for readability */
  .cscreen .classcard,.cscreen .catcard,.cscreen .lore-card,.cscreen .warp-body,
  .cscreen .char-hero,.cscreen .hero-body,.cscreen .lore-note,.cscreen .acc-item,
  .cscreen .tut-card,.cscreen .dossier-mini,.cscreen .lore-body>p{text-align:left}
  /* ---- Escalations mode ---- */
  .esc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:920px;margin:6px auto 0}
  @media(max-width:760px){ .esc-grid{grid-template-columns:repeat(2,1fr)} }
  .esc-card{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;
    border:1px solid var(--line);min-height:172px;background:#15140f center/cover no-repeat;
    box-shadow:0 6px 18px rgba(0,0,0,.4);transition:transform .12s,box-shadow .12s,border-color .12s}
  .esc-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.55);border-color:var(--cls,var(--accent))}
  .esc-card::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,6,.25) 0%,rgba(8,8,6,.62) 45%,rgba(8,8,6,.92) 100%)}
  .esc-card>*{position:relative;z-index:1}
  .esc-card .esc-tier{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;
    padding:3px 9px;border-radius:999px;background:rgba(8,8,6,.7);border:1px solid var(--cls,var(--line));color:var(--cls,var(--ink))}
  .esc-card .esc-port{position:absolute;top:8px;right:10px;width:52px;height:52px;border-radius:10px;overflow:hidden;
    border:2px solid var(--cls,var(--line));background:linear-gradient(150deg,color-mix(in srgb,var(--cls) 45%,#15140f),#100f0b);display:flex;align-items:flex-end;justify-content:center}
  .esc-card .esc-port img{width:100%;height:100%;object-fit:cover}
  .esc-card .esc-port .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--cls,var(--muted));opacity:.6}
  .esc-card .esc-foot{position:absolute;left:14px;right:14px;bottom:12px}
  .esc-card .esc-name{font-size:17px;font-weight:800;letter-spacing:.4px;text-shadow:0 2px 10px #000;line-height:1.15}
  .esc-card .esc-zone{font-size:11px;color:var(--muted);margin-top:2px}
  .esc-card .esc-count{display:inline-block;margin-top:7px;font-size:11px;font-weight:700;color:var(--cls,var(--accent));
    background:rgba(8,8,6,.55);border:1px solid var(--cls,var(--line));border-radius:999px;padding:2px 9px}
  .esc-prog{display:flex;gap:10px;justify-content:center;align-items:center;margin:14px 0}
  .esc-pip{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);background:#15140f}
  .esc-pip.done{background:var(--good);border-color:var(--good)}
  .esc-pip.cur{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
  .esc-pip.final{border-radius:3px}
  .esc-preview{display:flex;gap:14px;justify-content:center;align-items:center;margin:8px 0 4px}
  .esc-prev-op{width:96px;text-align:center}
  .esc-prev-op .cport{width:80px;height:80px;border-radius:11px;overflow:hidden;position:relative;margin:0 auto;
    border:2px solid var(--cls,var(--line));background:linear-gradient(150deg,color-mix(in srgb,var(--cls) 50%,#15140f),#100f0b)}
  .esc-prev-op .cport img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .esc-prev-op .nm{font-size:13px;font-weight:700;margin-top:6px;color:var(--cls,var(--ink))}
  .esc-final-flag{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--bad);font-weight:800;margin-top:4px}
  /* ---- Multiplayer (online) ---- */
  .mp-wrap{max-width:760px;margin:0 auto;position:relative}
  /* full-bleed lobby backdrop (sits behind the centered MP content) */
  .mp-wrap::before{content:"";position:fixed;inset:0;z-index:-1;
    background:linear-gradient(rgba(10,9,14,.66),rgba(10,9,14,.84)),
      url("artassets/Backgrounds/gf_bg_multiplayer_v1.jpg") center/cover no-repeat}
  .mp-entry{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:18px}
  .mp-entry .mp-btn{min-width:240px;font-size:16px;padding:14px 18px}
  .mp-reclog{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);margin-top:6px;cursor:pointer}
  .mp-reclog code{font-size:12px;color:var(--accent)}
  .mp-btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 30%,#1a1812),#15140f);border-color:var(--accent);color:var(--accent);font-weight:800}
  .mp-sub{color:var(--muted);font-size:13px;margin-top:-4px}
  .mp-code{font-size:clamp(40px,9vw,72px);font-weight:900;letter-spacing:10px;color:var(--accent);text-shadow:0 4px 24px #000;font-family:"Consolas",monospace}
  .mp-code-row{display:flex;align-items:center;gap:12px;justify-content:center;margin:6px 0}
  .mp-copy{font-size:13px;padding:6px 12px}
  .mp-copy.ok{border-color:var(--good);color:var(--good)}
  .mp-input{font-size:22px;letter-spacing:6px;text-align:center;text-transform:uppercase;padding:12px 14px;border-radius:10px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink);max-width:240px;font-family:"Consolas",monospace}
  .mp-err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
  .mp-timer-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .mp-timer-row .ms-chip.sel{border-color:var(--accent);color:var(--accent)}
  /* lobby */
  .mp-lobby{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:920px;margin:0 auto}
  @media(max-width:720px){ .mp-lobby{grid-template-columns:1fr} }
  .mp-col{background:rgba(18,17,13,.82);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left}
  .mp-col .mp-name{font-weight:800;font-size:18px;color:var(--accent)}
  .mp-badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
  .mp-badge.host{border-color:var(--accent);color:var(--accent)}
  .mp-field{margin-top:10px;font-size:13px}
  .mp-field .lbl{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:3px}
  .mp-teamrow{display:flex;gap:8px}
  .mp-teamrow .cport{width:46px;height:46px;border-radius:8px;overflow:hidden;position:relative;border:2px solid var(--cls,var(--line));background:linear-gradient(150deg,color-mix(in srgb,var(--cls) 45%,#15140f),#100f0b)}
  .mp-teamrow .cport img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .mp-ready{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-top:8px}
  .mp-ready.on{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
  .mp-mappreview{grid-column:1/-1;position:relative;min-height:150px;border-radius:12px;overflow:hidden;border:1px solid var(--line);

  .mp-zone{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;min-height:74px;border:1px solid var(--line);

  .mp-zone::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,6,.15),rgba(8,8,6,.85))}

  /* chat */
  .mp-chat{grid-column:1/-1;background:rgba(12,11,8,.85);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;margin-top:4px}

  .mp-chat .mp-row input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px;font-size:13px}
  .mp-startbtn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 32%,#1a1812),#15140f);border-color:var(--accent);color:var(--accent);font-weight:800}

  /* username modal + generic mp modal */

    background:rgba(18,17,13,.92);border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .mp-chat-fab .dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .mp-chat-panel{position:fixed;left:12px;bottom:66px;z-index:46;width:min(280px,86vw);max-height:50vh;display:flex;flex-direction:column;
    background:rgba(12,11,8,.96);border:1px solid var(--accent);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.6)}

  .mp-timer{font-size:14px;font-weight:800;letter-spacing:.5px;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:5px 12px;background:rgba(12,11,8,.5)}
  .mp-timer.low{color:var(--bad);border-color:var(--bad)}
  /* ---- Feedback (bug report / feature request) ---- */
  .fb-btn{position:fixed;right:16px;bottom:70px;z-index:100;font-size:12px;font-weight:600;letter-spacing:.3px;
    padding:7px 13px;border-radius:8px;background:rgba(18,17,13,.92);border:1px solid var(--line);color:var(--muted);
    cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.45)}
  .fb-btn:hover{border-color:var(--accent);color:var(--accent)}
  /* circular ? help button, bottom-right; feedback button sits just above it (no overlap) */
  .help-btn{position:fixed;right:16px;bottom:16px;z-index:120;width:44px;height:44px;border-radius:50%;

  /* on small screens, stack both under the top-right audio control so they never overlap the card tray */

  }
  .fb-modal{position:fixed;inset:0;z-index:210;background:rgba(6,5,3,.7);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  .fb-card{background:var(--panel);border:1px solid var(--accent);border-radius:14px;width:min(480px,92vw);max-height:90vh;
    overflow-y:auto;padding:20px;box-sizing:border-box;box-shadow:0 18px 50px rgba(0,0,0,.6)}
  .fb-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .fb-head h2{margin:0;font-size:20px}
  .fb-sub{color:var(--muted);font-size:13px;margin:2px 0 14px}
  .fb-close{font-size:15px;line-height:1;padding:4px 9px;border-radius:7px;background:var(--bg);border:1px solid var(--line);color:var(--muted);cursor:pointer}
  .fb-close:hover{border-color:var(--bad);color:var(--bad)}
  .fb-field{margin-bottom:12px}
  .fb-field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:5px}
  .fb-field select,.fb-field input,.fb-field textarea{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);
    border-radius:9px;color:var(--ink);padding:10px 11px;font-size:14px;font-family:inherit}
  .fb-field textarea{resize:vertical;min-height:96px;line-height:1.45}
  .fb-field select:focus,.fb-field input:focus,.fb-field textarea:focus{outline:none;border-color:var(--accent)}
  .fb-count{font-size:11px;color:var(--muted);text-align:right;margin-top:4px}
  .fb-count.short{color:var(--bad)}
  .fb-err{color:var(--bad);font-size:12px;margin-top:4px;min-height:14px}
  .fb-send.primary{width:100%;margin-top:6px;padding:11px;border-radius:9px;font-weight:800;cursor:pointer;
    background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 30%,#1a1812),#15140f);border:1px solid var(--accent);color:var(--accent)}
  .fb-send:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.4)}
  .fb-ok{text-align:center;padding:16px 6px}
  .fb-ok .ic{font-size:44px;line-height:1;color:var(--good)}
  .fb-ok h2{margin:10px 0 2px;font-size:20px}
  /* ---- Help panel ---- */
  .help-modal{position:fixed;inset:0;z-index:210;background:rgba(6,5,3,.72);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  .help-card{background:var(--panel);border:1px solid var(--accent);border-radius:14px;width:min(640px,94vw);max-height:88vh;
    display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.6);overflow:hidden}
  .help-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .help-tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
  .help-tab{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);cursor:pointer}
  .help-tab:hover{border-color:var(--accent);color:var(--ink)}
  .help-tab.active{background:color-mix(in srgb,var(--accent) 26%,#1a1812);border-color:var(--accent);color:var(--accent)}
  .help-close{flex:0 0 auto;font-size:15px;line-height:1;padding:5px 10px;border-radius:7px;background:var(--bg);border:1px solid var(--line);color:var(--muted);cursor:pointer}
  .help-close:hover{border-color:var(--bad);color:var(--bad)}
  .help-body{padding:16px 18px;overflow-y:auto}
  .help-sec{margin-bottom:16px}
  .help-sec h3{margin:0 0 5px;font-size:15px;color:var(--accent)}
  .help-sec p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink)}
  .help-callout{margin-top:8px;background:rgba(12,11,8,.6);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
    padding:8px 12px;font-size:12.5px;color:var(--muted);line-height:1.45}
  .help-callout b{color:var(--ink)}
  /* battle log tab */
  .bl-empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 10px}
  .bl-feed{display:flex;flex-direction:column;gap:12px}
  .bl-round .bl-rhead{font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--accent);margin-bottom:4px;text-transform:uppercase}
  .bl-line{font:12.5px/1.5 "Consolas",monospace;color:var(--ink);padding:1px 0}
  .bl-line.dmg{color:var(--bad)} .bl-line.pie{color:var(--pierce)} .bl-line.heal{color:var(--good)}
  .bl-line.cancel{color:#8c8676;text-decoration:line-through;font-style:italic} .bl-line.death{font-weight:700}
  /* credits tab */
  .help-credits{text-align:center;padding:18px 6px}
  .help-credit-title{margin:0 0 14px;font-size:24px;color:var(--accent);letter-spacing:2px}
  .help-credit-by{margin:0 0 12px;color:var(--ink);font-size:15px}
  .help-link{color:var(--accent);text-decoration:none;font-size:14px} .help-link:hover{text-decoration:underline}
  .help-ver{margin:14px 0 0;color:var(--muted);font-size:13px}
  .help-credit-foot{margin:6px 0 0;color:var(--muted);font-style:italic;font-size:13px}
  .help-music-credits{margin:16px auto 0;max-width:420px;border-top:1px solid var(--line);padding-top:12px}
  .help-music-credits h3{margin:0 0 8px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
  .help-music-credits p{margin:0 0 8px;font-size:13px;line-height:1.5;color:var(--ink)}
  /* ---- Splash screen ---- */
  #splash{position:fixed;inset:0;z-index:300;background:#0a0612;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:splashIn .6s ease}
  #splash.fade-out{opacity:0;transition:opacity .3s ease;pointer-events:none}

  #splash .splash-sub{margin-top:16px;font-size:14px;color:var(--muted);letter-spacing:.12em;text-transform:lowercase}
  @keyframes splashIn{from{opacity:0}to{opacity:1}}
  /* ---- Card tray (per-operative sections, tinted by class color) ---- */
  .card-tray{display:flex;align-items:stretch;justify-content:center;width:100%;box-sizing:border-box;
    background:rgba(10,6,20,0.88);border-top:0.5px solid rgba(255,255,255,0.08);padding:10px 14px}
  .tray-sec{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
  .tray-label{font-size:9px;font-weight:500;letter-spacing:.06em;color:var(--cls,var(--muted))}
  .tray-sec.ko .tray-label{opacity:.5}
  .tray-empty{font-size:10px;color:var(--muted);padding:24px 0}
  .tray-div{width:1px;background:rgba(255,255,255,0.12);align-self:stretch;margin:6px 4px}
  .card-tray .hand-fan{padding:2px 4px 0}
  .card-tray .tray-cards{display:flex;justify-content:center}
  /* tint each card with its operative's class color (the card already carries --cls) */
  .card-tray .pcard{background:color-mix(in srgb, var(--cls) 10%, #14130f);border-color:color-mix(in srgb, var(--cls) 35%, transparent)}
  .card-tray .pcard .cost-badge{background:rgba(8,8,6,.85);color:var(--energy)}
  .card-tray .pcard .pn{color:color-mix(in srgb, var(--cls) 70%, #ffffff)}
  /* tray cards show what the ability does (rules text), but the combo/tip hint and
     flavor are hover-only (they appear in the popup) */
  .card-tray .pcard .phint,.card-tray .pcard .pf{display:none}
  /* mobile: each section scrolls its cards horizontally if they overflow */
  @media(max-width:760px){ .card-tray .hand-fan{overflow-x:auto;justify-content:flex-start} }

  /* =========================================================================
     MOBILE / PHONE PASS — keep the whole battle inside a narrow portrait
     viewport: fighter cards shrink so two fit per row, the HUD wraps, the
     hand becomes one horizontal swipe-row, decks tuck under the team.
     ========================================================================= */
  @media (max-width:600px){
    /* fighter cards: let the 2-col grid shrink below content + smaller portraits */
    .pair{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;max-width:100%}
    .cfighter{min-width:0;padding:7px 8px;gap:8px;border-radius:9px}
    .cfighter .cport{width:64px;height:64px;flex:0 0 64px;min-width:64px;min-height:64px}
    .cfighter .cname{font-size:14px}
    .cfighter .chpwrap{margin:4px 0;gap:5px}
    .chpnum{font-size:11.5px;min-width:38px}
    .ctags{gap:3px}
    .ctag{font-size:10px;padding:0 4px;line-height:1.45}
    /* enemy team slightly larger than yours but still compact */
    .enemy-side{margin:0 auto}
    .enemy-side .pair{gap:8px;max-width:100%}
    .enemy-side .cfighter .cport{width:72px;height:72px;flex:0 0 72px;min-width:72px;min-height:72px}
    .enemy-side .cfighter .cname{font-size:15px}
    .enemy-side .cfighter .ctag{font-size:10.5px;padding:0 4px}
    .arena-side .label{font-size:9.5px}
    .bf-center{padding:2px 6px;gap:6px}

    /* HUD: round badge on its own centered line ABOVE the energy+buttons row
       (avoids overlap on a narrow screen while staying screen-centered) */
    .bf-controls{flex-direction:column-reverse;gap:5px}
    .round-badge{position:static;transform:none}
    .ctrl-cluster{flex-wrap:nowrap;justify-content:center;gap:14px;padding:6px 10px;width:auto;max-width:100%}
    .energy-box .big{font-size:18px}
    .energy-box .big .enext{display:none}   /* hide "→ next round" on narrow screens */
    .ctrl-buttons{gap:8px}
    .ctrl-buttons .ctrlbtn{min-width:84px;padding:8px 10px}

    /* hand: one horizontal swipe-row holding BOTH operatives' cards. Extra right
       pad lets the last card peek in from the edge instead of butting the frame. */
    .card-tray{overflow-x:auto;justify-content:flex-start;padding:6px 8px 6px;scroll-padding-right:24px;
      -webkit-overflow-scrolling:touch}
    .card-tray .hand-fan{overflow:visible}
    .tray-sec{flex:0 0 auto}
    .tray-sec:last-child{padding-right:14px}   /* trailing peek space so cards aren't flush-clipped */
    .hand-fan .pcard{width:118px;height:auto;margin-left:-6px}
    .hand-group .pcard:first-child{margin-left:0}

    /* scroll-edge affordance: gradient fades appear only when there is more hand
       off-screen in that direction (toggled by JS: .tray-more / .tray-less). */
    .arena-slot:has(.card-tray){position:relative}
    .arena-slot:has(.card-tray)::before,
    .arena-slot:has(.card-tray)::after{content:"";position:absolute;top:0;bottom:0;width:30px;
      pointer-events:none;z-index:7;opacity:0;transition:opacity .2s ease}
    .arena-slot:has(.card-tray)::before{left:0;background:linear-gradient(to right,rgba(10,6,20,.92),transparent)}
    .arena-slot:has(.card-tray)::after{right:0;background:linear-gradient(to left,rgba(10,6,20,.92),transparent)}
    .arena-slot.tray-less::before{opacity:1}
    .arena-slot.tray-more::after{opacity:1}

    /* decks: compact row tucked under the team (no longer overlapping it) */
    .bf-you{flex-direction:column-reverse;gap:4px;align-items:center}
    /* decks stacked vertically (deck 1 on top, deck 2 below) — both visible, no swipe */
    .deck-corner{position:static;flex-direction:column;align-items:flex-start;gap:4px}
    .deck-corner .rail-label{display:none}

  /* very short screens: keep it from clipping vertically */

  /* =========================================================================
     MOBILE THUMB-ZONE BATTLE LAYOUT (≤768px). One-handed portrait: read-only
     info up top (round · enemy · your team), every required tap in the bottom
     (pill columns · full-width Confirm · Undo/Menu). Grid reorders the frame
     rows; the hand renders as two per-operative pill columns, each its own
     bounded scroller. Classes (.card-tray.pills / .pcard.pill / .mob-discard)
