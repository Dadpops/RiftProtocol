<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIFT PROTOCOL</title>
<!-- Socket.io client (online multiplayer only; the game runs fully offline without it) -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root{
    --bg:#15140f; --panel:#22211b; --panel2:#2c2c24; --ink:#ece7d8; --muted:#9c9684;
    --line:#3a392f; --accent:#d8a657; --good:#7fae5e; --bad:#d06b56; --pierce:#c77dff;
    --t1:#5e9bd6; --t2:#5ec8c0; --t3:#d8a657; --t4:#d06b56;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif;}
  #app{max-width:1080px;margin:0 auto;padding:16px;}
  h1{font-size:30px;letter-spacing:1px;margin:.2em 0;color:var(--accent)}
  h2{font-size:20px;margin:.6em 0 .3em}
  .sub{color:var(--muted);margin:0 0 16px}
  button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:9px 14px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--accent);color:#1c1a12;border-color:var(--accent);font-weight:700}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .hidden{display:none !important}
  .muted{color:var(--muted)}
  .center{text-align:center}

  /* class select */
  .classgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .classcard{cursor:pointer;transition:border-color .1s}
  .classcard .cname{font-size:18px;font-weight:700;color:var(--accent)}
  .classcard .ctag{color:var(--muted);font-size:13px}
  .classcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .classcard .budget{margin-top:6px;font-size:12px;color:var(--muted)}

  /* match board + arena background */
  .board{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;position:relative;
    border-radius:12px;padding:12px;background:radial-gradient(120% 120% at 50% 0%, #20201a, #131210)}
  .board.hasbg{background-image:linear-gradient(rgba(15,14,11,.74),rgba(15,14,11,.86)), var(--arena);
    background-size:cover;background-position:center}
  .team h2{display:flex;justify-content:space-between;align-items:baseline}
  /* fighter card: class-color stripe + portrait + meta */
  .fighter{display:flex;gap:10px;border:1px solid var(--line);border-left:4px solid var(--cls,var(--accent));
    border-radius:10px;padding:8px;margin-bottom:8px;background:rgba(34,33,27,.86)}
  .fighter.dead{opacity:.45;filter:grayscale(.6)}
  .fighter.targetable{cursor:pointer;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .fighter.seltarget{box-shadow:0 0 0 2px var(--accent) inset}
  .fmeta{flex:1;min-width:0}
  .portrait{width:64px;height:64px;flex:0 0 64px;border-radius:8px;overflow:hidden;position:relative;
    background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 55%, #1b1a14), #14130f);
    border:1px solid color-mix(in srgb, var(--cls) 40%, var(--line))}
  .portrait .pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .portrait .portph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;letter-spacing:.5px;color:rgba(255,255,255,.55);text-transform:uppercase}
  .portrait.enemyart .pimg{transform:scaleX(-1);filter:saturate(.85) brightness(.92)}
  .fname{font-weight:700}
  .fclass{color:var(--muted);font-size:12px}
  .hpbar{height:10px;background:#000;border-radius:6px;overflow:hidden;margin:6px 0}
  .hpfill{height:100%;background:linear-gradient(90deg,var(--good),var(--accent))}
  /* energy meter */
  .energy{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border:1px solid var(--accent);
    border-radius:20px;color:var(--accent);font-weight:700;font-size:13px}
  .energy .pips{display:inline-flex;gap:3px}
  .energy .pips i{width:9px;height:9px;border-radius:50%;background:#000;border:1px solid var(--line)}
  .energy .pips i.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 4px var(--accent)}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
  .tag{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .tag.block{color:var(--t1);border-color:var(--t1)}
  .tag.buff{color:var(--good);border-color:var(--good)}
  .tag.debuff{color:var(--bad);border-color:var(--bad)}
  .tag.equip{color:var(--accent);border-color:var(--accent)}

  /* hand */
  .hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .pcard{cursor:pointer;border:1px solid var(--line);border-top:3px solid var(--cls,var(--line));
    border-radius:9px;background:var(--panel);padding:0 8px 0;position:relative;overflow:hidden;
    display:flex;flex-direction:column}
  .pcard:hover{border-color:var(--accent)}
  .pcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .pcard.illegal,.pcard.cantafford{opacity:.4;cursor:not-allowed}
  .pcard.used{opacity:.5;cursor:default}
  /* card illustration panel: type art image over a type-color fallback */
  .cardart{position:relative;overflow:hidden;flex:0 0 auto;height:54px;margin:0 -8px 6px;display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(135deg, color-mix(in srgb, var(--ct,var(--line)) 38%, #14130f), #16150f)}
  .cardart-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cardart .artph{font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.5);text-transform:uppercase}
  /* energy cost badge — top-left corner over the card art */
  .cardart .cost-badge{position:absolute;top:4px;left:4px;z-index:2;font-size:12px;font-weight:800;
    padding:1px 7px;border-radius:10px;color:#11100b;box-shadow:0 1px 5px rgba(0,0,0,.55)}
  .catcard-art{height:58px;margin:6px -11px;border-top:1px solid var(--line)}
  .pcard .ph{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .pcard .pn{font-weight:700;font-size:13px;line-height:1.2}
  .pcard .cost{font-size:11px;font-weight:700;padding:1px 6px;border-radius:10px;color:#11100b}
  .cost.t1{background:var(--t1)} .cost.t2{background:var(--t2)} .cost.t3{background:var(--t3)} .cost.t4{background:var(--t4)}
  /* type/tier/symbol footer pinned to the bottom of the card */
  .pcard .pt{font-size:11px;color:var(--muted);margin-top:auto;padding:5px 0;display:flex;align-items:center;gap:5px;border-top:1px solid var(--line)}
  .pcard .pe{font-size:12px;color:var(--ink);margin-top:4px}
  .pcard .phint{font-size:11px;color:var(--good);margin-top:4px}
  .pcard .pf{font-size:11px;color:var(--muted);font-style:italic;margin-top:4px}
  .spd{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;color:#11100b}
  .spd.t1{background:var(--t1)} .spd.t2{background:var(--t2)} .spd.t3{background:var(--t3)} .spd.t4{background:var(--t4)}
  .classpill{font-size:10px;color:var(--muted)}

  /* log */
  #log{background:#100f0b;border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:320px;overflow:auto;font:13px/1.5 "Consolas",monospace}
  #log .le{margin:1px 0}
  #log .tier{color:var(--accent);font-weight:700;margin-top:6px}
  #log .dmg{color:var(--bad)} #log .heal{color:var(--good)} #log .blk{color:var(--t1)}
  #log .pie{color:var(--pierce)} #log .death{color:#fff;background:#5a1f1f;padding:0 4px;border-radius:3px}
  #log .sys{color:var(--muted)}
  #log .flip{color:#e9c46a;font-weight:700}
  #log .cancel{color:#8c8676;text-decoration:line-through;font-style:italic}

  .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 12px}
  .pill{padding:4px 10px;border:1px solid var(--line);border-radius:20px;color:var(--muted)}

  /* pass-device cover */
  #cover{position:fixed;inset:0;background:#0c0b08;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50}
  #cover h1{font-size:34px}
  /* endscreen */
  #end{position:fixed;inset:0;background:rgba(8,8,6,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:60}
  .assignhint{color:var(--accent);min-height:20px;margin:4px 0}
  footer{color:var(--muted);font-size:12px;margin-top:18px;text-align:center}
  a{color:var(--accent)}

  /* ============ MAIN MENU ============ */
  #menu{position:relative;min-height:calc(100dvh - 32px);display:flex;flex-direction:column;justify-content:center;
    align-items:center;text-align:center;
    border-radius:16px;overflow:hidden;padding:34px;background:radial-gradient(120% 90% at 50% 0%, #26241c, #100f0b)}
  #menu.hasbg{background-image:linear-gradient(rgba(13,12,9,.62),rgba(13,12,9,.9)), var(--menubg);background-size:cover;background-position:center}
  #menu .title{font-size:clamp(54px,8vw,84px);letter-spacing:3px;margin:0;color:var(--accent);text-shadow:0 4px 22px #000}
  #menu .tagline{color:var(--ink);opacity:.85;margin:4px 0 22px;max-width:560px}
  #menu .modes{display:flex;gap:12px;flex-wrap:wrap}
  #menu .howto{margin-top:22px;max-width:620px;background:rgba(18,17,13,.72);border:1px solid var(--line);border-radius:12px;padding:14px 16px}

  /* ============ CLASS SELECT PORTRAITS ============ */
  .classcard{display:flex;gap:12px;align-items:flex-start}
  .classcard .cport{width:64px;height:64px;flex:0 0 64px;border-radius:8px;overflow:hidden;position:relative;
    border:1px solid color-mix(in srgb, var(--cls) 45%, var(--line));
    background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 55%, #1b1a14), #14130f)}
  .classcard .cport img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .classcard .cport .ph{display:none}
  .classcard .cbody{flex:1;min-width:0}
  /* class-select team slots — two blank card shapes that fill as you pick */
  .team-slots{display:flex;gap:18px;justify-content:center;margin:18px 0 6px}
  .team-slot{width:118px;height:152px;border-radius:12px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;position:relative}
  .team-slot.empty{border:2px dashed var(--line);color:var(--muted)}
  .team-slot.empty .slot-hint{font-size:11px;text-transform:uppercase;letter-spacing:1px}
  .team-slot.filled{border:1px solid var(--cls);background:rgba(20,19,15,.7);cursor:pointer;
    box-shadow:0 0 0 1px var(--cls) inset, 0 6px 16px rgba(0,0,0,.4)}
  .team-slot.filled:hover{box-shadow:0 0 0 2px var(--cls) inset, 0 6px 16px rgba(0,0,0,.5)}
  .team-slot .cport{width:88px;height:88px;border-radius:10px;overflow:hidden;position:relative;
    background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 55%, #1b1a14), #14130f)}
  .team-slot .cport img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .team-slot .cport .ph{display:none}
  .team-slot .slot-name{font-weight:700;font-size:13px;color:var(--cls)}
  .team-slot .slot-x{position:absolute;top:5px;right:7px;color:var(--bad);font-weight:800;font-size:13px}

  /* ============ NO-SCROLL BATTLE FRAME ============ */
  #battle{position:fixed;inset:0;height:100dvh;display:grid;gap:8px;padding:8px;box-sizing:border-box;overflow:hidden;
    grid-template-columns:minmax(140px,200px) minmax(0,1fr) minmax(140px,200px);
    grid-template-rows:auto auto minmax(0,1fr) auto;   /* top · enemy+staging · hand (full width) · your team */
    background:radial-gradient(120% 90% at 50% 0%, #20201a, #100f0b)}
  /* the Warp Zone background now stretches across the whole battle screen */
  #battle.hasbg{background-image:linear-gradient(rgba(13,12,9,.5),rgba(13,12,9,.82)), var(--arena);background-size:cover;background-position:center}
  .bf-top{position:relative;grid-column:1 / -1;grid-row:1;display:flex;align-items:center;justify-content:center;gap:14px;min-height:0}
  .quit-btn{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:12px;padding:6px 12px}
  .quit-btn:hover{border-color:var(--bad);color:var(--bad)}
  /* staging area — clicked cards wait in the middle of the arena */
  .arena-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;z-index:6}
  .staging{display:flex;flex-direction:column;align-items:center;gap:6px}
  .staging-label{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
  .staging-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:700px}
  .staged{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;cursor:pointer;
    background:rgba(20,19,15,.92);border:1px solid var(--accent);border-left:3px solid var(--cls,var(--accent));
    box-shadow:0 4px 12px rgba(0,0,0,.5);font-size:12.5px;transition:transform .1s}
  .staged:hover{transform:translateY(-2px);background:rgba(44,32,18,.95)}
  .staged .staged-name{font-weight:700}
  .staged .staged-tgt{color:var(--muted);font-size:11px}
  .staged .staged-cost{font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;color:#11100b}
  .staged .staged-x{color:var(--bad);font-weight:800;margin-left:2px}
  .staging-empty{font-size:11.5px;color:var(--muted);opacity:.55}
  /* prominent middle-of-screen prompt while choosing a target */
  .target-notice{font-size:16px;font-weight:800;letter-spacing:.4px;padding:9px 20px;border-radius:11px;text-align:center;
    background:rgba(10,9,6,.9);border:2px solid var(--tn,var(--accent));color:var(--ink);
    animation:noticePulse 1s ease-in-out infinite}
  .target-notice.enemy{--tn:var(--bad)} .target-notice.ally{--tn:var(--good)}
  .target-notice b{color:var(--tn,var(--accent))}
  .target-notice .tn-sub{display:block;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-top:2px}
  @keyframes noticePulse{
    0%,100%{box-shadow:0 0 14px color-mix(in srgb,var(--tn) 40%,transparent)}
    50%{box-shadow:0 0 34px color-mix(in srgb,var(--tn) 90%,transparent)}}
  .bf-left{grid-column:1;grid-row:2;overflow-y:auto;overflow-x:hidden;max-height:46vh}
  /* row 2 center: enemy team + staging/lock-in (side panels flank it) */
  .bf-center{grid-column:2;grid-row:2;position:relative;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;gap:8px;padding:4px 10px;min-height:0}
  .bf-right{grid-column:3;grid-row:2;display:flex;flex-direction:column;gap:8px;overflow:hidden}
  /* hand row: FULL WIDTH so cards are never clipped by the narrow side columns */
  .bf-hand{grid-column:1 / -1;grid-row:3;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  /* your team: full-width row pinned to the bottom */
  .bf-you{grid-column:1 / -1;grid-row:4;display:flex;justify-content:center;align-items:flex-end}
  .arena-slot{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:center}
  /* top bar: round counter (and turn hint) across the top of the screen */
  .round-pill{font-size:14px;font-weight:800;letter-spacing:.5px;color:var(--accent);
    border:1px solid var(--accent);border-radius:20px;padding:5px 16px;background:rgba(12,11,8,.5)}
  .top-hint{font-size:12.5px;color:var(--ink)}
  .sidepanel{background:rgba(18,17,13,.82);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .sidepanel h3{margin:0 0 6px;font-size:13px;color:var(--accent);letter-spacing:.5px;text-transform:uppercase}
  .sidepanel .tip{font-size:11.5px;color:var(--muted);line-height:1.45;margin:0 0 6px}

  .arena-side{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
  .arena-side .label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:640px;flex-shrink:0}
  /* the operative rows never participate in the battle-log's reflow: lock their size
     so the end-of-turn log (its own grid row) can't compress portraits. Size stays
     viewport-driven only. */
  .bf-center,.bf-you{flex-shrink:0}
  /* fighter card (larger, to balance the deck backs) */
  .cfighter{position:relative;display:flex;gap:11px;align-items:center;padding:10px 13px;border-radius:11px;
    background:rgba(20,19,15,.82);border:1px solid var(--line);border-top:3px solid var(--cls,var(--accent));
    box-shadow:0 6px 14px rgba(0,0,0,.35)}
  .cfighter.dead{opacity:.4;filter:grayscale(.7)}
  /* valid targets pulse — color-coded: enemies red, allies green */
  .cfighter.targetable{cursor:pointer;border-color:var(--tgl,var(--accent));z-index:3;
    animation:targetpulse .95s ease-in-out infinite}
  .cfighter.target-enemy{--tgl:var(--bad)}
  .cfighter.target-ally{--tgl:var(--good)}
  @keyframes targetpulse{
    0%,100%{box-shadow:0 0 0 2px var(--tgl),0 0 16px 3px color-mix(in srgb,var(--tgl) 55%,transparent),0 6px 14px rgba(0,0,0,.4);transform:scale(1)}
    50%{box-shadow:0 0 0 4px var(--tgl),0 0 40px 10px color-mix(in srgb,var(--tgl) 95%,transparent),0 6px 14px rgba(0,0,0,.4);transform:scale(1.04)}}
  .cfighter.seltarget{box-shadow:0 0 0 2px var(--accent) inset}
  /* during target selection, fade fighters that can't be chosen */
  #battle.targeting .cfighter:not(.targetable){opacity:.35}
  .cfighter .cport{width:80px;height:80px;flex:0 0 80px;flex-shrink:0;min-width:80px;min-height:80px;border-radius:9px;overflow:hidden;position:relative;
    background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 55%, #1b1a14), #14130f)}
  .cfighter .cport img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cfighter .cport.enemyart img{transform:scaleX(-1);filter:saturate(.85) brightness(.92)}
  .cfighter .cport .ph{display:none}
  .cfighter .cmeta{flex:1;min-width:0}
  .cfighter .cname{font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:6px}
  .cfighter .chpwrap{display:flex;align-items:center;gap:6px;margin:5px 0}
  .chpbar{flex:1;height:8px;background:#000;border-radius:4px;overflow:hidden}
  .chpfill{height:100%;background:linear-gradient(90deg,var(--good),var(--accent));transition:width .42s ease}
  .chpnum{font-size:12px;color:var(--muted);min-width:44px;text-align:right}
  .ctags{display:flex;gap:3px;flex-wrap:wrap}
  .ctag{font-size:9.5px;padding:0 4px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);line-height:1.5}
  .ctag.block{color:var(--t1);border-color:var(--t1)} .ctag.buff{color:var(--good);border-color:var(--good)}
  .ctag.debuff{color:var(--bad);border-color:var(--bad)} .ctag.equip{color:var(--accent);border-color:var(--accent)}
  .floatlayer{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .floatnum{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-weight:800;font-size:18px;
    text-shadow:0 2px 6px #000;animation:floatup 1s ease-out forwards}
  .floatnum.dmg{color:#ff8a6b} .floatnum.heal{color:#9ad17a}
  .floatnum.block{color:#7fc4ff;font-size:13px;top:26px;text-transform:uppercase;letter-spacing:.5px}
  @keyframes floatup{0%{opacity:0;transform:translate(-50%,4px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px) scale(1.1)}}
  .cfighter.hit{animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .cfighter.blockflash{box-shadow:0 0 0 2px #7fc4ff, 0 0 14px #7fc4ff inset}
  /* tier banner during the resolution animation */
  .tier-banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:8;
    pointer-events:none;font-size:30px;font-weight:800;letter-spacing:2px;color:#fff;opacity:0;
    text-shadow:0 3px 16px #000, 0 0 22px rgba(216,166,87,.6);background:rgba(12,11,8,.45);
    padding:6px 22px;border-radius:12px;border:1px solid var(--accent);white-space:nowrap}
  .tier-banner.show{animation:tierpop 1.1s ease-out}
  @keyframes tierpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}

  /* player's class decks (draw piles) — flank the portraits on the outside */
  .your-row{display:flex;align-items:center;justify-content:center;gap:16px}
  .deck{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto}
  .deck-back{width:64px;height:90px;border-radius:7px;overflow:hidden;position:relative;
    border:1px solid color-mix(in srgb, var(--cls) 50%, var(--line));
    background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 60%, #1b1a14), #14130f);
    box-shadow:0 4px 12px rgba(0,0,0,.5)}
  .deck-back img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .deck-back .deck-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;letter-spacing:.4px;color:rgba(255,255,255,.65);text-transform:uppercase;text-align:center;padding:3px}
  .deck-count{font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap}
  .deck.deckdead{opacity:.38;filter:grayscale(.7)}
  .deck.deckdead .deck-count{color:var(--muted)}
  .deck:hover .deck-back{outline:2px solid var(--accent);outline-offset:1px}
  /* deck rail in the right column (under Lock in / Undo) */
  .rail-label{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .deck-rail{display:flex;gap:10px;justify-content:center}
  .deck-rail .deck{cursor:pointer}
  .deck-rail .deck-back{width:52px;height:74px}
  .deck-rail .deck-count{font-size:10px}
  /* deck viewer — centered modal: header · scrollable pill list · divider · full-width preview below */
  .dv-backdrop{position:fixed;inset:0;z-index:40;background:rgba(6,5,3,.55);display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box}
  .deck-viewer{width:min(560px,92vw);max-height:80vh;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;
    background:rgba(10,9,6,.97);border:1px solid var(--accent);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  .dv-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;position:sticky;top:0;z-index:2;
    background:rgba(10,9,6,.98);border-bottom:1px solid var(--line);font-weight:700;color:var(--accent);font-size:13px;letter-spacing:.4px}
  .dv-close{font-size:12px;padding:3px 9px}
  /* base pill grid (shared with the Recon picker); deck-viewer scopes its own height */
  .dv-grid{display:flex;flex-wrap:wrap;gap:7px;padding:10px;align-content:flex-start;overflow-y:auto}
  .deck-viewer .dv-grid{flex:0 0 auto;max-height:32vh}
  .dv-card{display:inline-flex;align-items:center;gap:6px;height:fit-content;padding:5px 9px;border-radius:8px;cursor:pointer;
    background:rgba(20,19,15,.92);border:1px solid var(--line);border-left:3px solid var(--cls,var(--accent));font-size:12px}
  .dv-card:hover,.dv-card.active{border-color:var(--accent);background:rgba(44,32,18,.95)}
  .dv-cost{font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;color:#11100b}
  .dv-name{font-weight:600}
  .dv-divider{height:1px;background:var(--line);margin:0 12px;flex:0 0 auto}
  .dv-preview{flex:1 0 auto;min-height:200px;display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box}
  .dv-hint{font-size:13px;color:var(--muted);text-align:center}
  .dv-prev-card{width:100%;max-width:340px}
  .dv-prev-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px}
  .dv-prev-name{font-size:19px;font-weight:800;color:var(--cls,var(--accent));line-height:1.15}
  .dv-prev-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted);justify-content:flex-end}
  .dv-prev-art{height:auto;aspect-ratio:16/9;width:100%;max-width:320px;margin:0 auto 10px;border-radius:10px;border-bottom:0}
  .dv-prev-text{font-size:15px;line-height:1.5;color:var(--ink)}
  .dv-prev-flavor{font-size:13px;font-style:italic;color:var(--muted);margin-top:8px}
  /* discard-on-play: candidate cards during a Recon/Ante Up discard choice */
  .hand-fan .pcard.discardable{cursor:pointer;outline:2px dashed var(--bad);outline-offset:-2px}
  .hand-fan .pcard.discardable:hover{outline-style:solid;box-shadow:0 0 14px color-mix(in srgb,var(--bad) 60%,transparent)}
  /* Recon tutor picker (over the #cover dialog) */
  .reconpick .reconpick-grid{max-width:720px;max-height:52vh;overflow-y:auto;justify-content:center;border:1px solid var(--line);border-radius:10px}
  .reconpick .dv-card{cursor:pointer}
  .staged-disc{color:var(--bad);font-size:11px}

  /* fullscreen fight cinematic overlay (fades in on appear, fades into battle) */
  .intro-overlay{position:fixed;inset:0;z-index:80;background:#000;display:flex;align-items:center;justify-content:center;
    opacity:1;transition:opacity .5s ease;animation:introIn .35s ease}
  @keyframes introIn{from{opacity:0}to{opacity:1}}
  .intro-overlay.fade-out{opacity:0}
  .intro-video{width:100%;height:100%;object-fit:cover}
  .intro-skip{position:absolute;right:18px;bottom:18px;z-index:81}

  /* right-margin controls */
  .energy-box{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .energy-box .big{font-size:15px;font-weight:800;color:var(--accent)}
  .energy-box .pips{display:flex;gap:4px}
  .energy-box .pips i{width:11px;height:11px;border-radius:50%;background:#000;border:1px solid var(--line)}
  .energy-box .pips i.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 5px var(--accent)}
  .ctrlbtn{width:100%}

  /* ============ HAND (fan + hover focus) — now in the arena, above your team ============ */
  .dockwrap{height:100%;display:flex;flex-direction:column;min-height:0}
  /* hand groups: one per living fighter, ordered by tier within the group.
     A visible gap separates the two fighters' groups; a lone fighter = no gap. */
  /* responsive fan: card width & overlap scale with viewport so cards never
     pile on top of each other on smaller screens */
  .hand-fan{flex:1;display:flex;justify-content:center;align-items:flex-end;gap:clamp(14px,2.6vw,38px);padding:6px 18px 2px;min-height:0}
  .hand-group{display:flex;align-items:flex-end;min-width:0;justify-content:center}
  .hand-fan .pcard{width:clamp(100px,10vw,140px);flex:0 0 auto;margin-left:clamp(-30px,-1.4vw,-12px);
    height:clamp(150px,22vh,210px);cursor:pointer;
    transition:transform .16s ease, margin .16s ease, opacity .16s ease;transform-origin:bottom center}
  .hand-group .pcard:first-child{margin-left:0}
  .hand-fan:hover .pcard{opacity:.82}
  .hand-fan .pcard:hover{opacity:1;transform:translateY(-16px) scale(1.07);z-index:6;margin-right:18px}
  .hand-group:has(.pcard:hover) .pcard:hover ~ .pcard{transform:translateX(20px)}
  @media (max-width:900px){ .hand-fan .pcard{width:clamp(92px,12vw,120px)} }
  .pcard.cantafford,.pcard.illegal{opacity:.4 !important;cursor:not-allowed}
  /* queued: the card stays visible, lifts, brightens, and gets a ✓ badge */
  .pcard.used{opacity:1 !important;cursor:default;border-color:var(--accent);
    box-shadow:0 0 0 2px var(--accent), 0 0 16px rgba(216,166,87,.55);
    transform:translateY(-12px) scale(1.03)}
  .hand-fan:hover .pcard.used{opacity:1}
  .pcard.used:hover{transform:translateY(-12px) scale(1.03)}
  .pcard.used .cardart{filter:brightness(.62) saturate(.55)}
  .pcard.used .disc{display:none}
  .pcard .qbadge{display:none}
  .pcard.used .qbadge{display:flex;position:absolute;top:4px;right:4px;z-index:5;
    width:21px;height:21px;border-radius:50%;background:var(--accent);color:#1c1a12;
    font-weight:800;font-size:13px;align-items:center;justify-content:center;
    box-shadow:0 1px 5px rgba(0,0,0,.55)}
  .pcard.used .qribbon{display:block;position:absolute;bottom:0;left:0;right:0;z-index:4;
    text-align:center;font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
    color:#1c1a12;background:var(--accent);padding:1px 0}
  .pcard .qribbon{display:none}
  .pcard .disc{position:absolute;top:3px;left:3px;z-index:3;font-size:11px;line-height:1;padding:2px 4px;border-radius:5px;
    background:rgba(0,0,0,.55);border:1px solid var(--line);color:var(--muted);cursor:pointer;opacity:0;transition:opacity .15s}
  .pcard:hover .disc{opacity:1}
  .pcard .disc:hover{color:var(--bad);border-color:var(--bad)}
  .pcard .pe{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  /* dock resolution log (portrait-annotated, tier grouped) */
  .dock-log{flex:1;overflow-y:auto;padding:6px 10px;font:13px/1.5 "Consolas",monospace}
  .dock-log .tierhead{color:var(--accent);font-weight:700;margin:6px 0 2px;font-size:13px;font-family:"Segoe UI",sans-serif;letter-spacing:.5px}
  .dock-log .logrow{display:flex;align-items:center;gap:8px;padding:1px 0;animation:fadein .3s}
  @keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1}}
  .dock-log .lportrait{width:24px;height:24px;flex:0 0 24px;border-radius:5px;overflow:hidden;position:relative;
    background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 55%, #1b1a14), #14130f)}
  .dock-log .lportrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .dock-log .ltext{flex:1;min-width:0}
  .dock-log .dmg{color:var(--bad)} .dock-log .heal{color:var(--good)} .dock-log .pie{color:var(--pierce)}
  .dock-log .flip{color:#e9c46a;font-weight:700} .dock-log .cancel{color:#8c8676;text-decoration:line-through;font-style:italic}
  .dock-log .blk{color:#7fc4ff} /* hit negated by a block/reduction */
  .dock-log .sys{color:var(--muted)}
  .dock-log .death{color:#fff;background:#5a1f1f;padding:0 4px;border-radius:3px;display:inline-block}

  /* ============ CARD TYPE SYMBOLS (color-coded, inline SVG) ============ */
  .tsym{width:13px;height:13px;vertical-align:-2px;display:inline-block}
  .tsym-wrap{display:inline-flex;align-items:center;gap:3px}
  .sym-attack{color:var(--bad)} .sym-defend{color:var(--t1)} .sym-buff{color:var(--good)}
  .sym-spell{color:var(--pierce)} .sym-potion{color:var(--t2)} .sym-equip{color:var(--accent)}
  .sym-signature{color:#f2c14e;filter:drop-shadow(0 0 3px rgba(242,193,78,.6))}
  .sym-debuff{color:var(--bad)}
  .tsym-debuff{width:11px;height:11px;vertical-align:-1px;margin-left:1px}

  /* ============ COLLAPSIBLE IN-MATCH TUTORIAL ============ */
  .tut-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;
    background:transparent;border:0;padding:0;font-weight:700;color:var(--accent);
    font-size:13px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer}
  .tut-toggle:hover{border-color:transparent;color:var(--ink)}
  .tut-toggle .chev{font-size:11px;color:var(--muted)}
  .tut-body{margin-top:8px}
  .tut-body .k{color:var(--ink);font-weight:700}
  /* per-feature accordion inside the How-to-play panel */
  .acc-item{border-top:1px solid var(--line)}
  .acc-item:first-child{border-top:0}
  .acc-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;
    background:transparent;border:0;padding:6px 0;cursor:pointer;text-align:left;
    font-size:11.5px;font-weight:700;color:var(--ink)}
  .acc-head:hover{border-color:transparent;color:var(--accent)}
  .acc-head .chev{font-size:10px;color:var(--muted);flex:0 0 auto}
  .acc-body{font-size:11.5px;color:var(--muted);line-height:1.45;margin:0 0 8px;padding-left:2px}
  .acc-body .k{color:var(--ink);font-weight:700}

  /* ============ MAIN MENU NAV + DEV CREDIT ============ */
  #menu .menu-nav{display:flex;flex-direction:column;gap:10px;max-width:300px}
  .menu-item{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;
    padding:13px 18px;border-radius:11px;background:rgba(20,19,14,.78);
    border:1px solid var(--line);text-align:left;backdrop-filter:blur(2px)}
  .menu-item .mi-ico{width:20px;height:20px;flex:0 0 20px;color:var(--accent)}
  .menu-item:hover{border-color:var(--accent);transform:translateX(3px);transition:transform .12s}
  .menu-item.primary{background:var(--accent);color:#1c1a12}
  .menu-item.primary .mi-ico{color:#1c1a12}
  #menu .fight-sub{margin-top:12px;max-width:340px;background:rgba(14,13,9,.82);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  #menu .fight-sub .fs-h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  #menu .fight-sub .row{flex-direction:column;gap:8px}
  #menu .fight-sub button{width:100%;text-align:left;line-height:1.25}
  #menu .fight-sub button b{display:block;font-size:14px}
  #menu .fight-sub .fs-sub{display:block;font-size:11px;color:var(--muted);font-weight:400}
  #menu .fight-sub button.primary .fs-sub{color:rgba(28,26,18,.7)}
  .devcredit{position:absolute;right:18px;bottom:14px;z-index:3;font-size:12px;text-decoration:none;
    color:var(--muted);background:rgba(12,11,8,.6);border:1px solid var(--line);
    border-radius:20px;padding:5px 13px;backdrop-filter:blur(2px)}
  .devcredit b{color:var(--ink)}
  .devcredit:hover{color:var(--accent);border-color:var(--accent)}
  .devcredit:hover b{color:var(--accent)}

  /* ============ CHARACTERS ROSTER + DETAIL + CARD CATALOG ============ */
  .char-roster .classcard{cursor:pointer}
  .char-roster .classcard .viewlink{font-size:12px;color:var(--accent);margin-top:6px;font-weight:700}
  .statline{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
  .statchip{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--panel2);
    border:1px solid var(--line);color:var(--muted)}
  .statchip b{color:var(--ink)}
  .char-hero{display:flex;gap:18px;align-items:flex-start;margin:8px 0 16px}
  .char-hero .cport{width:140px;height:140px;flex:0 0 140px;border-radius:12px;overflow:hidden;position:relative;
    border:1px solid color-mix(in srgb, var(--cls) 45%, var(--line));
    background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 55%, #1b1a14), #14130f)}
  .char-hero .cport img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .char-hero .cport .ph{display:none}
  .char-hero .hero-body{flex:1;min-width:0}
  .char-hero .hero-name{font-size:26px;font-weight:800;color:var(--cls,var(--accent))}
  .char-hero .hero-tag{color:var(--ink);opacity:.85;margin:2px 0 2px}
  .char-hero .hero-blurb{color:var(--muted);font-size:13px}
  .char-hero .hp-badge{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--good);
    border:1px solid var(--good);border-radius:20px;padding:3px 12px}
  .catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .catcard{border:1px solid var(--line);border-top:3px solid var(--cls,var(--line));border-radius:9px;
    background:var(--panel);padding:9px 11px}
  .catcard .ph{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .catcard .pn{font-weight:700;font-size:13px}
  .catcard .pt{font-size:11px;color:var(--muted);margin:3px 0}
  .catcard .pe{font-size:12px;color:var(--ink);margin-top:3px}
  .catcard .pf{font-size:11px;color:var(--muted);font-style:italic;margin-top:4px}

  /* ============ STANDALONE TUTORIAL PAGE ============ */
  .tut-page{max-width:820px}
  .tut-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .tut-card h3{margin:0 0 6px;font-size:15px;color:var(--accent)}
  .tut-card p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 6px}
  .tut-card .k{color:var(--ink);font-weight:700}

  /* ============ OPERATIVE DOSSIER FIELDS (Characters detail) ============ */
  .char-hero .dossier{margin:8px 0 2px;display:flex;flex-direction:column;gap:5px;max-width:560px}
  .char-hero .dfield{display:flex;gap:8px;align-items:baseline;font-size:13px}
  .char-hero .dlabel{flex:0 0 110px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .char-hero .dval{color:var(--ink)}

  /* ============ LORE PAGE ============ */
  .lore-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
  .lore-tab{font-weight:700;font-size:13px;padding:7px 16px;border-radius:20px;
    background:var(--panel);border:1px solid var(--line);color:var(--muted);cursor:pointer}
  .lore-tab:hover{border-color:var(--accent);color:var(--ink)}
  .lore-tab.active{background:var(--accent);color:#1c1a12;border-color:var(--accent)}
  .lore-body{max-width:880px}
  .lore-body>p{font-size:14px;line-height:1.6;color:var(--ink);max-width:680px}
  .lore-body .sub{color:var(--muted)}
  .lore-stub{color:var(--muted);font-size:13px}
  .lore-tbd{color:var(--accent);font-style:italic;opacity:.85}
  .lore-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:10px}
  .lore-card{border:1px solid var(--line);border-left:4px solid var(--cls,var(--accent));border-radius:10px;
    background:var(--panel);padding:11px 13px}
  .lore-card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
  .lore-card-h b{font-size:16px;color:var(--cls,var(--accent))}
  .lore-role{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .lore-origin{font-size:13px;color:var(--ink);margin:2px 0 6px;line-height:1.45}
  .lore-card .lore-stub{margin:0;line-height:1.45}
  .lore-note{max-width:680px;margin-top:14px;border-left:3px solid var(--accent);background:rgba(216,166,87,.08);
    padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px;line-height:1.55;color:var(--ink)}
  .lore-note b{color:var(--accent)}
  .lore-meta{font-size:12px;color:var(--muted);margin:0 0 6px}
  .lore-k{text-transform:uppercase;letter-spacing:.4px;color:var(--cls,var(--accent));font-weight:700;margin-right:4px}
  .lore-dot{margin:0 7px;opacity:.5}
  .lore-back{font-size:12.5px;color:var(--muted);font-style:italic;margin:0;line-height:1.5}
  /* operative portrait header in the Lore › Operatives cards */
  .lore-card .op-head{display:flex;gap:12px;align-items:center;margin-bottom:8px}
  .lore-card .op-port{width:62px;height:62px;flex:0 0 62px;border-radius:8px;overflow:hidden;position:relative;
    border:1px solid color-mix(in srgb, var(--cls) 45%, var(--line));
    background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 55%, #1b1a14), #14130f)}
  .lore-card .op-port img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .lore-card .op-head-text{min-width:0}
  .lore-card .op-head-text b{display:block;font-size:16px;color:var(--cls,var(--accent))}
  .lore-card .op-head-text .lore-role{display:block;margin-top:2px}
  /* Warp Zone cards — background banner + report */
  .warp-grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .warp-card{padding:0;overflow:hidden}
  .warp-bg{position:relative;height:118px;background:linear-gradient(150deg, color-mix(in srgb, var(--cls) 40%, #14130f), #100f0b)}
  .warp-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .warp-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(13,12,9,.1), rgba(13,12,9,.85))}
  .warp-body{padding:10px 14px 13px}
  /* Operative dossier — roster card mini-fields + detail backstory */
  .dossier-mini{margin:6px 0;display:flex;flex-direction:column;gap:3px}
  .dossier-mini .dm-row{display:flex;gap:7px;align-items:baseline;font-size:12px}
  .dossier-mini .dlabel{flex:0 0 92px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .dossier-mini .dval{color:var(--ink)}
  .char-hero .dossier-back{max-width:600px;margin:8px 0 2px;font-size:13px;line-height:1.55;color:var(--muted)}
  /* Warp Zone selector on class-select */
  .map-select{margin:14px 0 4px}
  .map-select .ms-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:7px;text-align:center}
  .map-select .ms-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* =====================================================================
   GENRE FIGHTERS — single-file demo
   This <script> is the pure game core: card data, rules engine, AIs,
   the 12 spec test assertions, and a headless simulation loop.
   It is environment-agnostic (no DOM access) so it can be unit-tested
   under Node by extracting and eval'ing this script. The UI lives in a
   separate <script id="gf-ui"> below and is the only DOM-touching code.

   FUTURE PHASES (not built — architected for, per spec): online/networked
   play, accounts, persistence, animations, sound, card art. The turn loop
   is split into (selection -> lock-in -> deterministic resolveTurn) so a
   network layer could feed remote picks into resolveTurn without a rewrite.
   ===================================================================== */
(function(){
'use strict';

/* ---------- deterministic RNG (so tests & sims are reproducible) ------ */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seed){
  const r = mulberry32(seed);
  return {
    next:r,
    int:(n)=>Math.floor(r()*n),
    pick:(arr)=>arr[Math.floor(r()*arr.length)],
    coin:()=> r() < 0.5,          // heads = true
    shuffle:(arr)=>{ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; },
  };
}

// keys stay for art/decklist/test stability). title = role · clearance = RIFT
// rank flavor · world = world-of-origin NAME · worldDesc = abstract description ·
// backstory = 2-sentence dossier. No real-world IP in any of these strings.
const CLASSES = {
  Soldier:  { display:"Breachblade", title:"Junction Vanguard", clearance:"Frontline Extraction Asset", world:"The Chrome Fold", worldDesc:"A collapsed military megastructure where soldiers fused weapons with living elemental cores to survive.", backstory:"Pulled from the last standing tower of the Chrome Fold before it went dark. Carries the Junction technique as muscle memory from a war that no longer has a battlefield.", budget:"Dmg 7 · Spd 6 · Dur 7 · Sup 3 · Dis 5",  blurb:"Set your weapon's element, then flurry small hits into a cascading finish." },
  Arcanist: { display:"Tempest",     title:"Glass-Cannon Evoker", clearance:"Volatile Field Asset", world:"The Shatter Court", worldDesc:"A high-sorcery civilization that burned itself out trading longevity for raw arcane yield.", backstory:"One of the last practitioners before the Shatter Court consumed itself. The RIFT extracted her mid-collapse — and she has not stopped casting since.", budget:"Dmg 12 · Spd 4 · Dur 2 · Sup 2 · Dis 10", blurb:"Explosive, fragile. Top damage and disruption." },

// index by class
const DECKLISTS = {};
for(const c of CARDS){ (DECKLISTS[c.cls] = DECKLISTS[c.cls]||[]).push(c); }

/* =====================================================================
   ENGINE
   ===================================================================== */

let _fid = 0;
function makeFighter(name, className, hp){
  _fid++;
  const H = (hp==null?20:hp);
  return {
    uid:_fid, name, className,
    hp: H, maxHp: H, alive:true,
    deck:{ draw:[], discard:[], potionUsed:false, signatureUsed:false, bonusDraw:0 },
    hand:[],
    // permanent equip state:
    equipReduce:0,          // permanent -damage (stacking rule 2: at most one)
    hasReduceEquip:false,
    sidearm:false,          // +1 to own T2 attacks
    lightArmor:false,       // +1 to own reduce effects
    reinforced:false,       // unused bulwark +2
    duster:false, dusterUsed:false,
    // pending (carry to NEXT turn):
    pending:{ regen:0, incomingNext:0, outgoingNext:0, energyPenalty:0, silence:null, absorbNext:0, burn:0, reconPick:false },
    // rebuilt each turn:
    turn:freshTurn(),
  };
}
function freshTurn(){
  return {
    pools:[],            // [{value, remaining, stopsPierce}]
    absorbed:0,          // total dmg absorbed by pools this turn (capped, spec §3)
    hitThisTurn:false,   // took HP damage this turn (Double Tap reads this)
    reduce:0,            // flat -dmg from attacks this turn
    incoming:0,          // +dmg taken this turn (Mark/Curse/...)
    outgoing:0,          // -dmg this fighter deals this turn
    attackBuff:0,        // +dmg on this fighter's (single) attack this turn
    attackBuffUsed:false,
    riposte:null,        // {pool, counter, mode, attackers:Set}
    bluff:null,          // {dmg}
    tripmine:null,       // {dmg, fired:false}
    invuln:false,        // Phase Out
    redirectTo:null,     // fighter uid attacks on me get redirected to (Cover): set on protector
    coverFor:null,
    tauntTo:null,        // all enemy attacks must hit this uid
    silencedTypes:null,  // Set of types this fighter cannot play THIS turn
    buffedNoSecondAttack:false, // received an attack buff this turn (stacking rule 1)
    reconPick:false,     // Recon: owner may tutor a card at the start of this turn (UI)
    junction:null,       // Soldier gunblade element this turn: {plus,burn,pierce,slow,label}
  };
}

// Per-class starting HP (mirrors each class's Durability budget): tanks soak
// more, glass cannons less. Math-only tests use makeFighter's default 20.
const CLASS_HP = { Warden:17, Soldier:15, Cleric:17, Drifter:17, Scout:15, Arcanist:15 };
function makeFighterFromClass(name, className){
  const f = makeFighter(name, className, CLASS_HP[className]!=null?CLASS_HP[className]:20);
  f.deck.draw = DECKLISTS[className].slice();
  return f;
}

function newMatch(opts){
  // opts: { seed, sideA:{name, classes:[c,c], ai}, sideB:{...} }
  const rng = makeRng(opts.seed|0 || 1);
  function buildSide(s){
    // Name fighters by their class (unique within a team) for readable logs.
    const fighters = s.classes.map((cls)=> makeFighterFromClass(cls, cls));
    fighters.forEach(f=>{ rng.shuffle(f.deck.draw); f._sideLabel = s.name; });
    return { name:s.name, ai:s.ai||null, fighters };
  }
  const state = {
    rng, round:1, over:false, result:null, log:[],
    sides:[ buildSide(opts.sideA), buildSide(opts.sideB) ],
  };
  return state;
}

function livingFighters(side){ return side.fighters.filter(f=>f.alive); }
function enemyOf(state, sideIdx){ return state.sides[1-sideIdx]; }

/* ---- drawing ----
   Hands PERSIST across turns: unplayed cards carry over. Each turn we top each
   living fighter's hand up to its cap (4 when both fighters live → up to 8 in
   hand, 10 for a lone survivor so the hand stays full), plus any bonus draw. A
   dead fighter's deck stops generating cards; its leftover hand is discarded. */
const HAND_CAP_PAIR = 4, HAND_CAP_SOLO = 10;
function drawN(f, n, rng){
  const out = [];
  for(let i=0;i<n;i++){
    if(f.deck.draw.length===0){
      if(f.deck.discard.length===0) break;       // deck fully exhausted
      f.deck.draw = rng.shuffle(f.deck.discard.slice());
      f.deck.discard = [];
    }
    out.push(f.deck.draw.shift());
  }
  return out;
}
function topUpHands(state){
  for(const side of state.sides){
    const living = livingFighters(side).length;
    const cap = (living<=1 ? HAND_CAP_SOLO : HAND_CAP_PAIR);
    for(const f of side.fighters){
      if(!f.alive){                              // dead deck stops; dump its hand
        for(const hi of (f.hand||[])) f.deck.discard.push(hi.card);
        f.hand = []; continue;
      }
      f.hand = f.hand || [];
      const need = Math.max(0, cap - f.hand.length) + (f.deck.bonusDraw||0);
      f.deck.bonusDraw = 0;
      const drawn = drawN(f, need, state.rng).map(card=>({card, owner:f}));
      f.hand = f.hand.concat(drawn);
    }
  }
}
// back-compat alias (UI / sim / tests may call either name)
const drawHands = topUpHands;

/* ---- legal move enumeration ----
   A "pick" = { handItem, card, owner, caster, target }
   - owner  = the fighter whose deck the card came from. The card is ALWAYS
              performed by its owner (abilities belong to a specific fighter);
              owner also governs once-per-match tracking + discard destination.
   - caster = owner (the performer).
   - target = the enemy fighter for aim 'enemy'; the chosen ally recipient for
              aim 'ally'; the owner for aim 'self'; null for aoe/allyAll/none. */
function buildLegalActions(state, sideIdx){
  const side = state.sides[sideIdx];
  const enemies = livingFighters(enemyOf(state, sideIdx));
  const allies  = livingFighters(side);
  const actions = [];
  for(const owner of side.fighters){
    if(!owner.alive) continue;
    for(const hi of owner.hand){
      const card = hi.card;
      // silence blocks the owner (performer) from playing the named types
      if(owner.turn.silencedTypes && owner.turn.silencedTypes.has(card.type)) continue;
      // once-per-match resource gating is per ORIGINATING deck
      if(card.type==='Potion' && owner.deck.potionUsed) continue;
      if(card.type==='Signature' && owner.deck.signatureUsed) continue;
      const caster = owner;
      if(card.aim==='enemy'){
        for(const t of (enemies.length?enemies:[null])) actions.push({handItem:hi, card, owner, caster, target:t});
      } else if(card.aim==='ally'){          // heal/buff/block "a fighter" — pick which ally
        for(const a of allies) actions.push({handItem:hi, card, owner, caster, target:a});
      } else if(card.aim==='self'){          // "this fighter" — the owner
        actions.push({handItem:hi, card, owner, caster, target:owner});
      } else {                               // enemyAll, allyAll, none
        actions.push({handItem:hi, card, owner, caster, target:null});
      }
    }
  }
  return actions;
}
function targetsFor(card, caster, allies, enemies){
  switch(card.aim){
    case 'enemy':    return enemies.length?enemies:[null];
    case 'enemyAll': return [null];
    case 'ally':     return allies.length?allies:[caster];
    case 'allyAll':  return [null];
    case 'self':     return [caster];
    case 'none':     return [null];
    default:         return [null];
  }
}

/* ---- validate a chosen set of <=2 picks for one side (stacking rules) ---- */
function validatePicks(state, sideIdx, picks){
  const side = state.sides[sideIdx];
  // per-pick gating: no replayed hand card, resources, silence
  const usedItems = new Set();
  for(const p of picks){
    if(p.handItem){                       // real hand cards can't be played twice
      if(usedItems.has(p.handItem)) return {ok:false, reason:'A card cannot be played twice.'};
      usedItems.add(p.handItem);
    }
    const odeck = (p.owner||p.caster).deck;
    if(p.card.type==='Potion' && odeck.potionUsed) return {ok:false, reason:'Potion already used this match.'};
    if(p.card.type==='Signature' && odeck.signatureUsed) return {ok:false, reason:'Signature already used this match.'};
    if(p.caster.turn.silencedTypes && p.caster.turn.silencedTypes.has(p.card.type))
      return {ok:false, reason:`${p.caster.name} is silenced and cannot play ${p.card.type}.`};
  }
  // one potion / one signature per ORIGINATING deck per turn (blocks two copies)
  const usedPotionDecks=new Set(), usedSigDecks=new Set();
  for(const p of picks){
    const od=(p.owner||p.caster).deck;
    if(p.card.type==='Potion'){ if(usedPotionDecks.has(od)) return {ok:false,reason:'One potion per deck per turn.'}; usedPotionDecks.add(od); }
    if(p.card.type==='Signature'){ if(usedSigDecks.has(od)) return {ok:false,reason:'One signature per deck per turn.'}; usedSigDecks.add(od); }
  }
  // Stacking rule 1: a fighter that receives an attack-boosting buff this turn
  //   cannot also be assigned a 2nd attack this turn (prevents buff + burst > 18).
  // Stacking rule 2: only one permanent -damage equip active per fighter.
  // (Checked before the play-count cap so the rule is genuinely exercised even
  //  if a future effect ever granted a 3rd play.)
  for(const f of side.fighters){
    const buffedHere   = picks.some(p=> isAttackBuff(p.card) && p.target===f);
    const buffedAlready= f.turn.buffedNoSecondAttack;
    const attacksOnF   = picks.filter(p=> p.caster===f && isAttackCard(p.card)).length;
    if((buffedHere||buffedAlready) && attacksOnF >= 2)
      return {ok:false, reason:`Stacking rule 1: ${f.name} is buffed and cannot also be assigned a second attack.`};
    const newReduceEquips = picks.filter(p=> p.caster===f && p.card.kind==='equipReduce').length;
    if(f.hasReduceEquip && newReduceEquips>=1)
      return {ok:false, reason:`Stacking rule 2: ${f.name} already has a permanent -damage equip.`};
    if(newReduceEquips>=2)
      return {ok:false, reason:'Stacking rule 2: only one permanent -damage equip per fighter.'};
  }
  // energy budget last (ramps by round; replaces the old fixed play-count cap)
  const budget = energyBudget(state, side);
  const spent = energyOf(picks);
  if(spent > budget) return {ok:false, reason:`Not enough energy: needs ${spent}, have ${budget}.`};
  return {ok:true};
}
function isAttackCard(c){ return c.kind==='attack' || c.kind==='aoe' ||
  (c.special && ['renzokuken','high_noon','drain','double_tap','fan_hammer','ghost_protocol','concussive','siege','fire_burn','firaga'].includes(c.special)); }
function isAttackBuff(c){ return c.kind==='buffAttack' || c.special==='lucky_coin' || c.special==='lucky_streak' || c.special==='stim_pack'; }
// Energy RAMPS by round: 3, 4, 6, 8, 10 (then holds at 10). Reduced by any
// Sleep energy-drain on a living fighter.
const ENERGY_BY_ROUND = {1:3, 2:4, 3:6, 4:8, 5:10};
function roundEnergy(round){ return ENERGY_BY_ROUND[round] || 10; }
function energyBudget(state, side){
  const base = roundEnergy(state && state.round ? state.round : 1);
  const drain = Math.max(0, ...side.fighters.filter(f=>f.alive).map(f=>f.turn.energyPenalty||0), 0);
  return Math.max(0, base - drain);
}
// energy cost by speed tier: T1=1, T2=2, T3=3, T4=5
const ENERGY_COST = {1:1, 2:2, 3:3, 4:5};
function energyCost(card){ return ENERGY_COST[card.speed] || 1; }
function energyOf(picks){ return picks.reduce((s,p)=> s + energyCost(p.card), 0); }

/* =====================================================================
   TURN RESOLUTION  (the deterministic, unit-tested core — spec §4)
   ===================================================================== */

function startOfTurn(state){
  // apply pending next-turn effects into this turn's fresh state
  for(const side of state.sides){
    for(const f of side.fighters){
      f.turn = freshTurn();
      if(!f.alive) continue;
      const pd = f.pending;
      if(pd.burn>0){ f.hp = Math.max(0, f.hp - pd.burn); pd.burn = 0; if(f.hp<=0) f.alive=false; }  // burn DoT ticks first
      if(!f.alive) continue;
      if(pd.regen>0){ heal(state, f, pd.regen, 'Regen'); pd.regen = 0; }
      if(pd.incomingNext>0){ f.turn.incoming += pd.incomingNext; pd.incomingNext = 0; }
      if(pd.outgoingNext>0){ f.turn.outgoing += pd.outgoingNext; pd.outgoingNext = 0; }
      if(pd.absorbNext>0){ f.turn.pools.push({value:pd.absorbNext, remaining:pd.absorbNext}); pd.absorbNext = 0; }
      if(pd.energyPenalty>0){ f.turn.energyPenalty = pd.energyPenalty; pd.energyPenalty = 0; }
      if(pd.silence){ f.turn.silencedTypes = pd.silence; pd.silence = null; }
      if(pd.reconPick){ f.turn.reconPick = true; pd.reconPick = false; }   // Recon tutor available this turn
      // permanent equip reductions are reflected at compute time, not here
    }
  }
  // a burn could finish a fighter at the start of the turn → check for a win
  const aDead = state.sides[0].fighters.every(f=>!f.alive), bDead = state.sides[1].fighters.every(f=>!f.alive);
  if(aDead||bDead){ state.over=true; state.result = (aDead&&bDead)?{winner:-1,reason:'Both teams fell — draw.'}:{winner:aDead?1:0, reason:'All enemy fighters defeated (burn).'}; }
}

// public: resolve one locked turn. picksBySide = [picksA, picksB].
function resolveTurn(state, picksA, picksB){
  const log = state.log = [];
  const allPicks = [];
  picksA.forEach(p=> allPicks.push(Object.assign({sideIdx:0}, p)));
  picksB.forEach(p=> allPicks.push(Object.assign({sideIdx:1}, p)));
  // effective speed (mutable, for Haste/Disrupt)
  allPicks.forEach(p=> p.eff = p.card.speed);
  state._allPicks = allPicks;   // specials (Double Tap focus-fire) consult this

  // CARD MEMORY: record what each class reveals this turn. The class-aware
  // Warden AI consults this to weight plays against an enemy class's remaining
  // threats. Harmless to the engine/tests (pure side-tally, never read here).
  state.cardMemory = state.cardMemory || {};
  for(const p of allPicks){
    const cls = p.caster.className;
    const mem = state.cardMemory[cls] = state.cardMemory[cls] || { names:{}, count:0 };
    mem.names[p.card.name] = (mem.names[p.card.name]||0) + 1;
    mem.count++;
  }

  logLine(log,'sys',`— Round ${state.round} resolution —`);

  // additive trace for the animated UI replay (no effect on resolution logic)
  state.timeline = [];
  state._preHp = snapHp(state);
  let prevHp = state._preHp, prevLen = log.length;

  for(let tier=1; tier<=4; tier++){
    const atTier   = allPicks.filter(p=> p.eff===tier);
    if(atTier.length===0) continue;
    const tierPicks = atTier.filter(p=> p.caster.alive);
    const cancelled = atTier.filter(p=> !p.caster.alive);   // caster died earlier this turn
    logLine(log,'tier',`Tier ${tier} — ${({1:'instant',2:'fast',3:'normal',4:'heavy'})[tier]}`);

    // INTERRUPT ON KILL: a card whose performer was defeated in an earlier tier
    // is cancelled and does nothing (wasted) — shown explicitly so it reads as a rule.
    for(const p of cancelled){
      logLine(log,'cancel',`  T${p.card.speed} ${p.card.name} (${fname(p.caster)}): CANCELLED — ${p.caster.className} was defeated before it resolved.`, p.caster);
    }

    // ---- Phase 1: non-attack state effects of this tier ----
    for(const p of tierPicks){
      if(isResolvedAsAttack(p.card)) continue;
      applyStateEffect(state, p, allPicks, log);
    }
    // ---- Phase 2: compute all attacks of this tier simultaneously ----
    const packets = []; // {target, amount, pierce, srcPick}
    for(const p of tierPicks){
      if(!isResolvedAsAttack(p.card)) continue;
      computeAttack(state, p, packets, log);
    }
    // ---- Phase 3: apply packets (pools then HP), riposte counters already queued ----
    applyPackets(state, packets, log, tier);
    // ---- Phase 4: deaths checked only at END of tier ----
    checkDeaths(state, log);

    // record this tier in the timeline (post-tier HP, deltas, absorbed, status, log slice)
    const hpNow = snapHp(state), deltas = {};
    for(const k in hpNow) deltas[k] = hpNow[k] - prevHp[k];
    state.timeline.push({ tier, lines: log.slice(prevLen), hp: hpNow, deltas,
      absorbed: Object.assign({}, state._tierAbsorbed||{}), negated: Object.assign({}, state._tierNegated||{}),
      status: snapStatus(state) });
    prevHp = hpNow; prevLen = log.length;

    if(state.over) break;
  }

  endOfTurn(state, allPicks, log);
  return log;
}

function isResolvedAsAttack(card){
  if(card.kind==='attack'||card.kind==='aoe') return true;
  if(card.special && ['renzokuken','high_noon','drain','double_tap','fan_hammer',
      'ghost_protocol','concussive','siege','fire_burn','firaga','solid_barrel'].includes(card.special)) return true;
  return false;
}

/* ---- Phase 1: state effects ---- */
function applyStateEffect(state, p, allPicks, log){
  const c = p.card, caster = p.caster, target = p.target;
  consumeResource(p);
  switch(c.kind){
    case 'heal':       heal(state, target||caster, c.amount, c.name, c.once); break;
    case 'block':      addPool(target||caster, c.amount); logTag(log,c,caster,`+${c.amount} bulwark`); break;
    case 'blockBoth':  for(const f of livingFighters(state.sides[p.sideIdx])) addPool(f, c.amount);
                       logTag(log,c,caster,`+${c.amount} bulwark to both`); break;
    case 'riposte':    caster.turn.riposte = {pool:c.amount, remaining:c.amount, counter:c.counter, mode:c.mode, attackers:[]};
                       addPool(caster, c.amount, {riposte:true}); logTag(log,c,caster,`riposte ${c.amount}/${c.counter}`); break;
    case 'reduce':     { let amt=c.amount + (caster.lightArmor && (target||caster)===caster?1:0);
                         (target||caster).turn.reduce += amt; logTag(log,c,caster,`-${amt} incoming`); } break;
    case 'reduceBoth': for(const f of livingFighters(state.sides[p.sideIdx])) f.turn.reduce += c.amount;
                       logTag(log,c,caster,`-${c.amount} incoming to both`); break;
    case 'buffAttack': applyAttackBuff(target||caster, c.amount); logTag(log,c,caster,`+${c.amount} next attack`); break;
    case 'debuff':     if(target){ target.turn.incoming += c.amount; logTag(log,c,caster,`${target.name} +${c.amount} taken`);} break;
    case 'equipReduce':addReduceEquip(caster, c.amount); logTag(log,c,caster,`equip -${c.amount} (permanent)`); break;
    case 'special':    (SPECIALS[c.special]||(()=>{})).call(null, {state,p,c,caster,target,allPicks,log,phase:'state'}); break;
    default: break;
  }
}

function applyAttackBuff(f, amount){
  f.turn.attackBuff += amount;
  f.turn.buffedNoSecondAttack = true;
}

/* ---- Phase 2: attack computation ---- */
function computeAttack(state, p, packets, log){
  const c = p.card;
  consumeResource(p);
  // junction flat bonus is ONCE PER CARD: arm it here, queueDamage consumes it on
  // the card's first hit (so multi-hit cards don't multiply the +damage).
  const jx = p.caster.turn.junction;
  if(jx && jx.plus) p.caster.turn._jxArmed = jx.plus;
  if(c.special){ (SPECIALS[c.special]||(()=>{})).call(null,{state,p,c,caster:p.caster,target:p.target,packets,log,phase:'attack'}); return; }
  if(c.kind==='attack'){
    const tgt = resolveTarget(state, p, p.target);
    if(!tgt){ logLine(log,'sys',`  ${c.name}: no valid target`); return; }
    queueDamage(state, packets, p.caster, tgt, c.amount, {pierce:!!c.pierce, card:c, log});
  } else if(c.kind==='aoe'){
    for(const tgt of livingFighters(enemyOf(state, p.sideIdx))){
      queueDamage(state, packets, p.caster, tgt, c.amount, {pierce:!!c.pierce, card:c, log, aoe:true});
    }
  }
}

// figure out the actual fighter an attack lands on (taunt / cover redirects)
function resolveTarget(state, p, intended){
  if(!intended || !intended.alive){
    // retarget to any living enemy if intended is gone
    const enemies = livingFighters(enemyOf(state, p.sideIdx));
    intended = enemies[0]||null;
    if(!intended) return null;
  }
  const enemySide = enemyOf(state, p.sideIdx);
  // Taunt: a living taunter on the defending side forces all attacks onto it
  const taunter = enemySide.fighters.find(f=> f.alive && f.turn.tauntTo===f.uid);
  if(taunter) return taunter;
  // Cover: if intended is covered, redirect to the protector
  const protector = enemySide.fighters.find(f=> f.alive && f.turn.coverFor===intended.uid);
  if(protector) return protector;
  return intended;
}

// queue a damage packet after applying buffs/reductions (spec §3 order).
// `mods` records each adjustment so the reveal log can explain why a hit landed
// soft (or got fully negated).
function queueDamage(state, packets, attacker, target, base, opt){
  let dmg = base; const mods = [];
  // attacker's single-attack buff: consumed once, and only on a single-target
  // attack (applying it per-target on an AoE would break the 5/target AoE cap).
  if(!opt.aoe && !attacker.turn.attackBuffUsed && attacker.turn.attackBuff>0){
    dmg += attacker.turn.attackBuff; mods.push(`+${attacker.turn.attackBuff} buff`); attacker.turn.attackBuffUsed = true;
  }
  if(attacker.sidearm && opt.card && opt.card.speed===2){ dmg += 1; mods.push('+1 sidearm'); }
  // gunblade junction (Soldier): the weapon element modifies every hit this turn
  const jx = attacker.turn.junction;
  if(jx){
    if(attacker.turn._jxArmed){ dmg += attacker.turn._jxArmed; mods.push(`+${attacker.turn._jxArmed} ${jx.label}`); attacker.turn._jxArmed = 0; }  // once per card
    if(jx.pierce){ opt.pierce = true; }
    if(jx.burn){ target.pending.burn = Math.max(target.pending.burn||0, jx.burn); }
    if(jx.slow){ target.pending.outgoingNext = Math.min((target.pending.outgoingNext||0) + jx.slow, jx.slowCap||3); }
  }
  if(attacker.turn.outgoing>0){ dmg -= attacker.turn.outgoing; mods.push(`−${attacker.turn.outgoing} suppressed`); }
  const inc = target.turn.incoming + (target._permIncoming||0);
  if(inc>0){ dmg += inc; mods.push(`+${inc} marked`); }
  const red = target.turn.reduce + target.equipReduce;
  if(red>0){ dmg -= red; mods.push(`−${red} ${target.equipReduce>0&&target.turn.reduce===0?'armor':'reduced'}`); }
  if(dmg < 0) dmg = 0;
  packets.push({attacker, target, base, amount:dmg, mods, pierce:!!opt.pierce, card:opt.card, aoe:!!opt.aoe, log:opt.log});
  // riposte / bluff / trip-mine reactions (counter happens same tier)
  registerReaction(state, packets, attacker, target, opt);
}
function registerReaction(state, packets, attacker, target, opt){
  const t = target.turn;
  if(t.riposte){
    if(t.riposte.mode==='all') t.riposte.attackers.push(attacker);
    else if(t.riposte.mode==='one' && !t.riposte.fired && t.riposte.attackers.length===0) t.riposte.attackers.push(attacker);
  }
  if(t.bluff){ packets.push({attacker:target, target:attacker, amount:t.bluff.dmg, pierce:false, special:'bluff', log:opt.log}); }
  if(t.tripmine && !t.tripmine.fired){ t.tripmine.fired=true; packets.push({attacker:target, target:attacker, amount:t.tripmine.dmg, pierce:false, special:'tripmine', log:opt.log}); }
}

/* ---- Phase 3: apply packets to pools then HP ---- */
function applyPackets(state, packets, log, tier){
  state._tierAbsorbed = {};   // uid -> damage blocked this tier (for the animation)
  state._tierNegated = {};    // uid -> took an attack that was fully reduced to 0 (no block)
  // queue riposte counters generated this tier
  for(const side of state.sides) for(const f of side.fighters){
    const rip = f.turn.riposte;
    if(rip && rip.attackers && rip.attackers.length){
      const list = rip.mode==='all' ? rip.attackers : rip.attackers.slice(0,1);
      for(const atk of list){
        if(atk && atk.alive) packets.push({attacker:f, target:atk, amount:rip.counter, pierce:false, special:'riposte', log});
      }
      if(rip.mode==='one') rip.fired = true;  // Counter-Sniper: a single counter the whole turn
      rip.attackers = []; // 'all' mode re-arms per tier for each attack instance
    }
  }
  // group by target
  const byTarget = new Map();
  for(const pk of packets){
    if(!pk.target || !pk.target.alive) continue;
    if(pk.target.turn.invuln) { logLine(log,'sys',`  ${fname(pk.target)} is untouchable this turn (0 dmg)`); continue; }
    if(!byTarget.has(pk.target)) byTarget.set(pk.target, []);
    byTarget.get(pk.target).push(pk);
  }
  for(const [target, pks] of byTarget){
    const hadBulwark = target.turn.pools.some(p=> p.value>0 && !p.riposte);
    for(const pk of pks){
      const before = target.hp;
      let toAbsorb = pk.amount, absorbed=0;
      // spec §3: blocks may NEVER fully cover an 18 focused burst. Cap total
      // pool absorption per fighter per turn at MAX_BLOCK_ABSORB (< 18), so a
      // focused heavy always leaks through even when block pools stack.
      let cap = Math.max(0, MAX_BLOCK_ABSORB - target.turn.absorbed);
      for(const pool of target.turn.pools){
        if(cap<=0) break;
        if(pool.remaining<=0) continue;
        if(pk.pierce && !pool.stopsPierce) continue;   // pierce skips normal pools
        const a = Math.min(pool.remaining, toAbsorb, cap);
        pool.remaining-=a; toAbsorb-=a; absorbed+=a; cap-=a;
      }
      // Reinforced Plating: first time this fighter's bulwark breaks, absorb 2 more.
      if(!pk.pierce && toAbsorb>0 && cap>0 && hadBulwark && target.reinforced && !target.reinforcedUsed){
        const a = Math.min(2, toAbsorb, cap);
        toAbsorb-=a; absorbed+=a; cap-=a; target.reinforcedUsed=true;
        if(a>0) logLine(log,'sys',`  ${fname(target)}'s Reinforced Plating absorbs ${a} more`);
      }
      target.turn.absorbed += absorbed;
      state._tierAbsorbed[target.uid] = (state._tierAbsorbed[target.uid]||0) + absorbed;
      // a real attack reduced to 0 with no block absorbing it → "negated" by reductions
      if(pk.base>0 && toAbsorb===0 && absorbed===0) state._tierNegated[target.uid] = true;
      if(toAbsorb>0) target.turn.hitThisTurn = true;   // took HP damage
      target.hp -= toAbsorb;
      logDamage(log, pk, before, target, absorbed);
    }
    if(target.hp<0) target.hp = 0;
  }
}
const MAX_BLOCK_ABSORB = 17;   // < the 18 focused-burst ceiling (spec §3)

/* ---- Phase 4: deaths only at end of tier ---- */
function checkDeaths(state, log){
  for(const side of state.sides) for(const f of side.fighters){
    if(f.alive && f.hp<=0){
      // Worn Duster save: first lethal hit leaves them at 1, then +2 taken for the match
      if(f.duster && !f.dusterUsed){
        f.dusterUsed = true; f.hp = 1;
        f._permIncoming = (f._permIncoming||0) + 2;
        logLine(log,'sys',`  ${fname(f)}'s Worn Duster holds them at 1 HP! (now takes +2 from attacks)`);
        continue;
      }
      f.alive = false; f.hp = 0;
      logLine(log,'death',`  ✖ ${fname(f)} is down.`);
    }
  }
  // win check
  const aDead = state.sides[0].fighters.every(f=>!f.alive);
  const bDead = state.sides[1].fighters.every(f=>!f.alive);
  if(aDead||bDead){
    state.over = true;
    if(aDead&&bDead) state.result = {winner:-1, reason:'Both teams fell — draw.'};
    else state.result = {winner: aDead?1:0, reason:'All enemy fighters defeated.'};
  }
}

/* ---- end of turn cleanup ---- */
function endOfTurn(state, allPicks, log){
  // discard only the cards that were PLAYED (incl. cancelled ones — they were
  // committed/wasted). Unplayed cards carry over to next turn's hand.
  const playedItems = new Set((allPicks||[]).map(p=>p.handItem).filter(Boolean));
  for(const side of state.sides) for(const f of side.fighters){
    if(!f.hand) { f.hand=[]; continue; }
    const keep = [];
    for(const hi of f.hand){
      if(playedItems.has(hi)) hi.owner.deck.discard.push(hi.card);
      else keep.push(hi);
    }
    f.hand = keep;
  }
  // clear per-turn state. `pending` is a separate property (carries to next turn);
  // permanent state (_permIncoming, equips) lives on the fighter and persists.
  for(const side of state.sides) for(const f of side.fighters){
    f.turn = freshTurn();
  }
  if(!state.over && state.round>=MAX_ROUNDS){
    // end-of-match tiebreak: MOST ENEMY FIGHTERS KILLED first, then total HP, then draw.
    const a=state.sides[0], b=state.sides[1];
    const killsA = killsBy(state,0), killsB = killsBy(state,1);   // enemy fighters each side has downed
    const hpA = sumHp(a), hpB = sumHp(b);
    const tag = `Round ${MAX_ROUNDS} reached`;
    state.over = true;
    if(killsA!==killsB)
      state.result = killsA>killsB
        ? {winner:0, reason:`${tag} — ${a.name} wins on kills (${killsA} vs ${killsB}).`}
        : {winner:1, reason:`${tag} — ${b.name} wins on kills (${killsB} vs ${killsA}).`};
    else if(hpA!==hpB)
      state.result = hpA>hpB
        ? {winner:0, reason:`${tag} — kills tied ${killsA}-${killsB}; ${a.name} wins on HP (${hpA} vs ${hpB}).`}
        : {winner:1, reason:`${tag} — kills tied ${killsA}-${killsB}; ${b.name} wins on HP (${hpB} vs ${hpA}).`};
    else
      state.result = {winner:-1, reason:`${tag} — kills ${killsA}-${killsB} and HP ${hpA}-${hpB} both tied. Draw.`};
  }
}
const MAX_ROUNDS = 5;
function sumHp(side){ return side.fighters.reduce((s,f)=> s + (f.alive?f.hp:0), 0); }
// how many ENEMY fighters side `sideIdx` has killed (i.e. dead fighters on the other side)
function killsBy(state, sideIdx){ return state.sides[1-sideIdx].fighters.filter(f=>!f.alive).length; }

/* ---- primitives ---- */
function heal(state, f, amount, src, once){
  if(!f || !f.alive) return;
  const before=f.hp; f.hp=Math.min(f.maxHp, f.hp+amount);
  if(state.log) logLine(state.log,'heal',`  ${src||'Heal'} → ${fname(f)}: +${f.hp-before} HP (${before}→${f.hp})`);
}
function addPool(f, value, opt){ f.turn.pools.push({value, remaining:value, stopsPierce:!!(opt&&opt.stopsPierce), riposte:!!(opt&&opt.riposte)}); }
function addReduceEquip(f, amount){
  if(f.hasReduceEquip) return; // rule 2 safety
  f.hasReduceEquip = true; f.equipReduce += amount;
}
function consumeResource(p){
  if(p._consumed) return; p._consumed=true;
  const odeck = (p.owner||p.caster).deck;   // once-per-match is per originating deck
  if(p.card.type==='Potion') odeck.potionUsed = true;
  if(p.card.type==='Signature') odeck.signatureUsed = true;
}

/* =====================================================================
   SPECIAL HANDLERS (the weird 20%)
   Each receives a ctx; `phase` is 'state' or 'attack'.
   ===================================================================== */
const SPECIALS = {
  cover(ctx){ ctx.caster.turn.coverFor = pickAllyUid(ctx); logTag(ctx.log,ctx.c,ctx.caster,'covering ally'); },
  taunt(ctx){ ctx.caster.turn.tauntTo = ctx.caster.uid; logTag(ctx.log,ctx.c,ctx.caster,'taunting'); },
  bluff(ctx){ ctx.caster.turn.bluff = {dmg:3}; logTag(ctx.log,ctx.c,ctx.caster,'bluffing'); },
  trip_mine(ctx){ ctx.caster.turn.tripmine = {dmg:4, fired:false}; logTag(ctx.log,ctx.c,ctx.caster,'trip mine set'); },
  reload(ctx){ ctx.caster.deck.bonusDraw += 1; logTag(ctx.log,ctx.c,ctx.caster,'+1 draw next turn'); },
  ante_up(ctx){ ctx.caster.deck.bonusDraw += 2; logTag(ctx.log,ctx.c,ctx.caster,'+2 draw next turn'); },
  recon(ctx){ ctx.caster.pending.reconPick = true; logTag(ctx.log,ctx.c,ctx.caster,'recon — tutor a card next turn'); },
  // Soldier gunblade junctions: set the weapon element for the WHOLE turn (state phase,
  // resolves at T1 before attacks, so it modifies every hit this turn via queueDamage).
  junction_fire(ctx){ ctx.caster.turn.junction = {plus:1, burn:2, label:'fire'}; logTag(ctx.log,ctx.c,ctx.caster,'weapon junctioned: FIRE (+1 once & burn)'); },
  junction_thunder(ctx){ ctx.caster.turn.junction = {pierce:true, label:'thunder'}; logTag(ctx.log,ctx.c,ctx.caster,'weapon junctioned: THUNDER (pierce)'); },
  junction_blizzard(ctx){ ctx.caster.turn.junction = {slow:1, slowCap:2, label:'blizzard'}; logTag(ctx.log,ctx.c,ctx.caster,'weapon junctioned: BLIZZARD (slow)'); },
  haste(ctx){ retime(ctx, 4, 2); },
  disrupt(ctx){ retime(ctx, 4, 3, true); },
  sleep(ctx){ if(ctx.target){ ctx.target.pending.energyPenalty = Math.max(ctx.target.pending.energyPenalty,2); logTag(ctx.log,ctx.c,ctx.caster,`${fname(ctx.target)} drowsy (-2 energy next turn)`);} },
  silence_magic(ctx){ if(ctx.target){ ctx.target.pending.silence = new Set(['Spell','Signature']); logTag(ctx.log,ctx.c,ctx.caster,`${ctx.target.name} silenced`);} },
  silence_spell(ctx){ if(ctx.target){ ctx.target.pending.silence = new Set(['Spell']); logTag(ctx.log,ctx.c,ctx.caster,`${ctx.target.name} silenced`);} },
  regen(ctx){ const n=ctx.c.amount||2; heal(ctx.state, ctx.target||ctx.caster, n, 'Regen'); (ctx.target||ctx.caster).pending.regen += n; },
  whiskey(ctx){ heal(ctx.state, ctx.target||ctx.caster, 4, 'Whiskey'); (ctx.target||ctx.caster).pending.incomingNext += 1; },
  sanctuary(ctx){ for(const f of livingFighters(ctx.state.sides[ctx.p.sideIdx])){ heal(ctx.state,f,1,'Sanctuary'); f.turn.reduce += 1; } },
  stim_pack(ctx){ applyAttackBuff(ctx.target||ctx.caster, 3); (ctx.target||ctx.caster).turn.incoming += 1; logTag(ctx.log,ctx.c,ctx.caster,'+3 attack, +1 taken'); },
  lucky_coin(ctx){ const heads=ctx.state.rng.coin(); if(heads) applyAttackBuff(ctx.target||ctx.caster,4);
    logLine(ctx.log,'flip',`  ⊙ Lucky Coin (${fname(ctx.caster)}): flip = ${heads?'HEADS, +4 to next attack':'TAILS, +0'}`, ctx.caster); },
  lucky_streak(ctx){ const heads=ctx.state.rng.coin(); const amt=heads?4:2; applyAttackBuff(ctx.target||ctx.caster, amt);
    logLine(ctx.log,'flip',`  ⊙ Lucky Streak (${fname(ctx.caster)}): flip = ${heads?'HEADS, +4':'TAILS, +2'} to next attack`, ctx.caster); },
  suppress(ctx){ if(ctx.target){ ctx.target.turn.outgoing += 3; logTag(ctx.log,ctx.c,ctx.caster,`${ctx.target.name} deals -3`);} },
  standoff(ctx){ ctx.caster.turn.outgoing += 2; if(ctx.target) ctx.target.turn.outgoing += 2; logTag(ctx.log,ctx.c,ctx.caster,'standoff -2 both'); },
  dispel(ctx){ const t=ctx.target; if(!t) return; t.turn.reduce=0; t.turn.attackBuff=0; t.turn.incoming=Math.max(0,t.turn.incoming);
    t.hasReduceEquip=false; t.equipReduce=0; t.sidearm=false; t.lightArmor=false; t.reinforced=false; t.duster=false;
    logTag(ctx.log,ctx.c,ctx.caster,`dispelled ${t.name}`); },
  sacrifice(ctx){ const side=ctx.state.sides[ctx.p.sideIdx]; const fs=livingFighters(side);
    if(fs.length<2){ return; }
    // move up to 6 HP from the higher-HP ally to the lower — never below 1 (must not kill the donor)
    let from=fs[0],to=fs[1]; if(from.hp<to.hp){ [from,to]=[to,from]; }
    const real=Math.min(6, from.hp-1, to.maxHp-to.hp);
    if(real<=0){ logTag(ctx.log,ctx.c,ctx.caster,'no HP to move'); return; }
    from.hp-=real; to.hp+=real;
    logTag(ctx.log,ctx.c,ctx.caster,`moved ${real} HP ${fname(from)}→${fname(to)}`); },
  divine(ctx){ for(const f of livingFighters(ctx.state.sides[ctx.p.sideIdx])){ addPool(f,10,{stopsPierce:true}); } logTag(ctx.log,ctx.c,ctx.caster,'divine shield'); },
  equip_sidearm(ctx){ ctx.caster.sidearm=true; logTag(ctx.log,ctx.c,ctx.caster,'sidearm equipped'); },
  equip_lightarmor(ctx){ ctx.caster.lightArmor=true; logTag(ctx.log,ctx.c,ctx.caster,'light armor equipped'); },
  equip_reinforced(ctx){ ctx.caster.reinforced=true; logTag(ctx.log,ctx.c,ctx.caster,'reinforced plating equipped'); },
  equip_duster(ctx){ ctx.caster.duster=true; logTag(ctx.log,ctx.c,ctx.caster,'worn duster equipped'); },

  // ---- attack-phase specials ----
  renzokuken(ctx){ const tgt=resolveTarget(ctx.state,ctx.p,ctx.target); if(!tgt) return;
    // a flurry of 3 small hits (3 each = 9); each hit carries the active junction
    for(let i=0;i<3;i++) queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, 3, {card:ctx.c, log:ctx.log}); },
  solid_barrel(ctx){ const tgt=resolveTarget(ctx.state,ctx.p,ctx.target); if(!tgt) return;
    const n=ctx.c.amount||2; queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, n, {card:ctx.c, log:ctx.log});
    queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, n, {card:ctx.c, log:ctx.log}); },
  high_noon(ctx){ const tgt=resolveTarget(ctx.state,ctx.p,ctx.target); if(!tgt) return;
    let dmg = (ctx.caster.hp < ctx.caster.maxHp/2) ? 10 : (ctx.c.amount||8);   // floor from card data
    queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, dmg, {card:ctx.c, log:ctx.log}); },
  drain(ctx){ const tgt=resolveTarget(ctx.state,ctx.p,ctx.target); if(!tgt) return;
    queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, 3, {card:ctx.c, log:ctx.log});
    heal(ctx.state, ctx.caster, 3, 'Drain'); },
  double_tap(ctx){ const tgt=resolveTarget(ctx.state,ctx.p,ctx.target); if(!tgt) return;
    // "then 1 more if they were hit this turn": already took HP damage in a prior
    // tier, OR another of your attacks this turn also targets them (focus fire).
    const focusFire = (ctx.state._allPicks||[]).some(pp=> pp!==ctx.p && pp.caster.alive &&
      isResolvedAsAttack(pp.card) && pp.target===tgt);
    let dmg = 3 + ((tgt.turn.hitThisTurn || focusFire) ? 1 : 0);
    queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, dmg, {card:ctx.c, log:ctx.log}); },
  fan_hammer(ctx){ const tgt=resolveTarget(ctx.state,ctx.p,ctx.target); if(!tgt) return;
    const base=ctx.c.amount||4; const heads=ctx.state.rng.coin(); const dmg=base+(heads?3:0);
    logLine(ctx.log,'flip',`  ⊙ Fan The Hammer (${fname(ctx.caster)}): flip = ${heads?'HEADS, +3 bonus damage':'TAILS, no bonus'}`, ctx.caster);
