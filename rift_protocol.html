     after the phone pass so these overrides win same-specificity ties.
     ========================================================================= */
  @media (max-width:768px){
    /* frame reorder: top(round·menu) · enemy+staged · HAND(dominant) · allies · controls.
       Energy and Confirm/Undo are pulled out into fixed side rails (below), so the hand
       gets the whole middle of the screen. */
    #battle{grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:5px;
      padding:6px 6px max(6px,env(safe-area-inset-bottom))}
    .bf-top{grid-row:1;position:relative;justify-content:center;gap:8px;padding:0 4px;min-height:40px}
    .bf-center{grid-row:2;padding:2px 6px;gap:3px;justify-content:flex-start}
    .bf-hand{grid-row:3}
    .bf-you{grid-row:4;flex-direction:column;gap:2px;align-items:center;justify-content:flex-end}
    .bf-controls{grid-row:5}

    /* top bar: Round pinned left · Menu centered · (Discard is the fixed top-right button) */
    .quit-btn{display:none}
    .bf-controls .round-badge{display:none}
    .top-round{position:absolute;left:6px;top:50%;transform:translateY(-50%);
      display:inline-flex;align-items:baseline;font-weight:800;font-size:15px;color:#fff;
      white-space:nowrap;text-shadow:0 1px 4px #000}
    .top-round .tr-of{font-size:11px;color:var(--muted);margin-left:1px}
    .mtop-menu{border-image:none;border:1px solid var(--line);border-radius:10px;background:rgba(18,17,13,.94);
      color:var(--ink);font-size:18px;line-height:1;padding:6px 13px}

    /* fighter panels (glance) */
    .pair{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;max-width:100%}
    .cfighter{min-width:0;padding:6px 8px;gap:8px;border-radius:9px}
    .cfighter .cname{font-size:14px}
    .cfighter .chpwrap{margin:3px 0;gap:5px}
    .chpnum{font-size:11.5px;min-width:38px}
    .ctag{font-size:10px;padding:0 4px;line-height:1.45}
    .arena-side .label{font-size:9.5px}
    .enemy-side .pair{gap:8px;max-width:100%}
    .enemy-side .cfighter .cport{width:64px;height:64px;flex:0 0 64px;min-width:64px;min-height:64px}
    .enemy-side .cfighter .cname{font-size:15px}
    .your-side .cfighter{position:relative}
    .your-side .cfighter .cport{width:56px;height:56px;flex:0 0 56px;min-width:56px;min-height:56px}
    /* tap-to-view-deck icon on each ally portrait (single tap; no long-press) */
    .cdeck-btn{position:absolute;top:3px;right:3px;z-index:4;width:26px;height:26px;border-radius:7px;
      border:1px solid var(--line);background:rgba(10,8,5,.92);color:var(--accent);
      display:flex;align-items:center;justify-content:center;padding:0;
      touch-action:manipulation;user-select:none;-webkit-user-select:none}

    /* compact staged area: one row, no big empty placeholder */
    .arena-mid{min-height:0}
    .staging{gap:3px}
    .staging-label{font-size:9.5px}
    .staging-empty{display:none}
    .target-notice{font-size:14px;padding:6px 12px}

    /* ---- HAND dominates the middle; two per-operative pill columns, bottom-anchored
       (hug the portraits, grow upward), centered, using nearly the full width (the
       side rails sit higher up, out of the hand's band). ---- */
    .card-tray.pills{flex-direction:row;justify-content:center;align-items:flex-end;
      height:100%;gap:12px;overflow:visible;padding:0 10px 4px;background:none;border-top:0}
    .card-tray.pills.solo{justify-content:center}
    .card-tray.pills .tray-div{display:none}
    .card-tray.pills .tray-sec{flex:1 1 0;max-width:49%;min-width:0;max-height:100%;justify-content:flex-end;gap:3px}
    .card-tray.pills.solo .tray-sec{flex-basis:auto;min-width:60%;max-width:80%}
    .card-tray.pills .tray-label{font-size:10px;align-self:center;flex:0 0 auto;padding-bottom:1px}
    .card-tray.pills .hand-fan{flex:0 1 auto;flex-direction:column;align-items:stretch;justify-content:flex-end;
      width:100%;min-height:0;overflow-y:auto;overflow-x:hidden;gap:6px;padding:2px 2px 0;-webkit-overflow-scrolling:touch}
    .card-tray.pills .hand-group{flex-direction:column;align-items:stretch;width:100%;gap:6px}
    /* no hover motion on touch — pills stay put (the press-hold popup is the preview) */
    .card-tray.pills .pcard,
    .card-tray.pills .hand-group:has(.pcard:hover) .pcard,
    .card-tray.pills .hand-fan:hover .pcard{transform:none !important;transition:none}
    .card-tray.pills .hand-fan:hover .pcard:not(.cantafford):not(.illegal){opacity:1}

    .pcard.pill{flex-direction:row;align-items:center;gap:8px;width:100%;box-sizing:border-box;flex:0 0 auto;
      min-height:56px;height:auto;margin:0;padding:6px 9px;border-radius:10px;overflow:hidden;
      border:1.5px solid var(--cls,var(--accent));background:color-mix(in srgb,var(--cls) 16%,#14130f);
      box-shadow:0 2px 8px rgba(0,0,0,.42)}
    .pcard.pill .pill-cost{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
      width:24px;height:24px;border-radius:50%;font-size:13px;font-weight:800;color:var(--energy);
      background:rgba(8,8,6,.9);border:1px solid color-mix(in srgb,var(--cls) 45%,transparent)}
    /* name wraps to two lines so it is never cut mid-word */
    .pcard.pill .pill-name{flex:1 1 auto;min-width:0;font-size:14px;font-weight:700;color:#fff;line-height:1.12;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;word-break:break-word}
    /* effect badge: value + icon (damage=sword/red, heal=plus/green, block=shield/teal) */
    .pcard.pill .pill-eff{flex:0 0 auto;display:inline-flex;align-items:center;gap:2px;font-size:14px;font-weight:800;line-height:1}
    .pcard.pill .pill-eff.dmg{color:var(--bad)}
    .pcard.pill .pill-eff.heal{color:var(--good)}
    .pcard.pill .pill-eff.def{color:var(--t1)}
    .pcard.pill .pill-eff.none{color:color-mix(in srgb,var(--cls) 60%,var(--muted))}
    /* Keyword reminders on the big card previews */
    .kw-reminders{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
    .kwr{font-size:11.5px;line-height:1.35;color:var(--muted);padding:3px 6px;border-left:2px solid color-mix(in srgb,var(--cls,#8aa) 55%,transparent);background:rgba(255,255,255,.03);border-radius:0 4px 4px 0}
    .kwr-k{font-weight:800;color:color-mix(in srgb,var(--cls,#cde) 70%,var(--ink));margin-right:.4em;letter-spacing:.02em}
    /* Card-language legend (help tab) */
    .cl-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
    .cl-row{display:grid;grid-template-columns:6.2em 1fr;align-items:baseline;gap:10px;padding:5px 8px;background:rgba(255,255,255,.03);border-radius:6px}
    .cl-kw{font-weight:800;color:var(--t1);letter-spacing:.02em}
    .cl-desc{font-size:13px;line-height:1.4;color:var(--ink)}
    .pcard.pill.sel{outline:2px solid var(--accent);outline-offset:1px;box-shadow:0 0 0 1px var(--accent) inset}
    .pcard.pill.illegal,.pcard.pill.cantafford{opacity:.4}
    .card-tray.pills.discarding .pcard.pill{outline:2px dashed var(--bad);outline-offset:1px;opacity:1;
      animation:targetpulse 1s ease-in-out infinite}

    /* ---- fixed side rails, raised above the hand's band so the cards get the full width.
       LEFT = vertical energy pip stack; RIGHT = Confirm (check) over Undo (arrow). ---- */
    .mrail{position:fixed;top:40%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;
      align-items:center}
    .mrail-energy{left:6px;gap:4px;padding:7px 5px;border-radius:14px;background:rgba(10,8,16,.72);
      border:1px solid rgba(255,255,255,.1);box-shadow:0 3px 12px rgba(0,0,0,.4)}
    .me-pips{display:flex;flex-direction:column-reverse;gap:4px}
    .me-pips i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.14);display:block}
    .me-pips i.on{background:var(--energy);box-shadow:0 0 6px color-mix(in srgb,var(--energy) 70%,transparent)}
    .me-count{font-size:10px;font-weight:800;color:var(--energy);letter-spacing:.3px}

    .mrail-ctrl{right:8px;gap:12px}
    .mctrl{border-image:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
      padding:0;font-weight:800;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.5);touch-action:manipulation}
    .mctrl-confirm{width:58px;height:58px;font-size:27px;background:color-mix(in srgb,var(--accent) 32%,#0a0a08);
      color:#fff;border:2px solid var(--accent)}
    .mctrl-confirm:active{background:color-mix(in srgb,var(--accent) 48%,#0a0a08)}
    .mctrl-undo{width:44px;height:44px;font-size:22px;background:rgba(16,14,9,.94);color:var(--ink);
      border:1px solid var(--line)}
    .mctrl-undo[disabled]{opacity:.35}

    /* controls row (bottom): empty during selection; Skip/Continue during resolution */
    .skip-btn{width:auto;min-width:150px;min-height:48px;font-size:17px}

    /* fixed discard button (top-right, safe-area aware) */
    .mob-discard{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:60;
      display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;font-size:13px;
      font-weight:700;color:var(--ink);background:rgba(18,17,13,.94);border:1px solid var(--line);
      box-shadow:0 3px 10px rgba(0,0,0,.5)}
    .mob-discard[disabled]{opacity:.4}
    .mob-discard.armed{border-color:var(--bad);color:var(--bad);
      box-shadow:0 0 0 2px var(--bad),0 3px 10px rgba(0,0,0,.5)}

    /* fold the floating ? / sound / feedback into the in-game Menu on the battle screen */
    body:has(#battle) #helpBtn,
    body:has(#battle) #audioToggle,
    body:has(#battle) #audioPop,
    body:has(#battle) #fbBtn{display:none !important}
  }
  /* in-game Menu modal sound sliders (reuses .mp-modal / .mp-card backdrop) */
  .gm-item{width:100%;padding:11px;border-radius:9px;margin-top:8px;font-weight:700;cursor:pointer}
  .gm-item.danger{color:var(--bad)}
  .gm-sound{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;text-align:left}
  .gm-sound .gm-h{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-bottom:6px}
  .gm-slider{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);margin:4px 0}
  .gm-slider input{flex:1}

  /* ===== Mobile menu wizard (one decision per page) — rendered only ≤768px ===== */
  #app:has(.wiz){padding:0;max-width:none}
  .wiz{min-height:100dvh;display:flex;flex-direction:column;box-sizing:border-box;
    padding:max(8px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
  .wiz-top{display:flex;align-items:center;gap:10px;min-height:46px;flex:0 0 auto}
  .wiz-back{width:42px;height:42px;flex:0 0 auto;border-image:none;border:1px solid var(--line);border-radius:11px;
    background:rgba(18,17,13,.92);color:var(--ink);font-size:22px;line-height:1;display:flex;align-items:center;
    justify-content:center;padding:0;touch-action:manipulation}
  .wiz-back:hover{color:var(--accent)}
  .wiz-back-spacer{width:42px;flex:0 0 auto}
  .wiz-title{flex:1;text-align:center;font-family:var(--font-display,inherit);font-size:19px;font-weight:800;color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px #000}
  .wiz-body{flex:1;min-height:0;overflow-y:auto;padding:12px 2px;-webkit-overflow-scrolling:touch}
  .wiz-foot{flex:0 0 auto;padding-top:10px}

  .wiz-home{align-items:center;justify-content:center;text-align:center}
  .wiz-logo{font-family:var(--font-display,inherit);font-size:clamp(34px,9vw,52px);color:var(--accent);
    margin:0 0 26px;text-shadow:0 3px 18px #000;letter-spacing:2px}
  .wiz-menu{display:flex;flex-direction:column;gap:11px;width:min(340px,90vw)}
  .wiz-item{width:100%;padding:15px;font-size:17px;font-weight:800;color:var(--ink);text-align:center}

  .wiz-list{display:flex;flex-direction:column;gap:11px;max-width:420px;margin:0 auto}
  .wiz-opt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;padding:14px 18px;color:var(--ink);text-align:left}
  .wiz-opt b{font-size:17px} .wiz-opt span{font-size:12px;color:var(--muted)}
  .wiz-sep{text-align:center;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin:6px 0 2px}

  .wiz-classgrid{display:flex;flex-direction:column;gap:11px;max-width:460px;margin:0 auto}
  .wiz-class{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;
    border:1px solid var(--line);border-left:4px solid var(--cls);background:rgba(20,19,15,.85);color:var(--ink);text-align:left}
  .wiz-class.sel{box-shadow:0 0 0 2px var(--cls) inset;background:rgba(36,30,18,.9)}
  .wc-port{width:64px;height:64px;flex:0 0 64px;border-radius:9px;overflow:hidden;position:relative;
    background:linear-gradient(150deg,color-mix(in srgb,var(--cls) 55%,#1b1a14),#14130f)}
  .wc-port img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover} .wc-port .ph{display:none}
  .wc-meta{flex:1;min-width:0} .wc-name{font-weight:800;font-size:17px;color:var(--cls)} .wc-title{font-size:12px;color:var(--muted)}
  .wc-check{position:absolute;top:8px;right:10px;color:var(--good);font-weight:900;font-size:20px}

  .wiz-maps{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:460px;margin:0 auto}
  .wiz-map{height:82px;border-radius:12px;border:1px solid var(--line);background-size:cover;background-position:center;
    color:#fff;display:flex;align-items:flex-end;justify-content:center;padding:8px;background-color:#14130f}
  .wiz-map.sel{box-shadow:0 0 0 3px var(--accent)} .wm-name{font-weight:800;font-size:13px;text-shadow:0 1px 4px #000}

  .wiz-esc-grid{display:flex;flex-direction:column;gap:11px;max-width:460px;margin:0 auto}
  .wiz-esc{position:relative;min-height:92px;border-radius:14px;border:1px solid var(--line);border-left:5px solid var(--cls);
    background-size:cover;background-position:center;background-color:#14130f;color:#fff;display:flex;flex-direction:column;
    align-items:flex-start;justify-content:flex-end;gap:2px;padding:12px 14px;text-align:left}
  .wiz-esc .esc-tier{position:absolute;top:8px;right:10px;font-size:11px;font-weight:800;background:rgba(8,8,6,.7);padding:2px 8px;border-radius:9px}
  .we-name{font-weight:800;font-size:17px;text-shadow:0 1px 4px #000} .we-zone{font-size:12px;opacity:.92;text-shadow:0 1px 3px #000}

  .wiz-foot-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .wiz-count{font-size:13px;color:var(--muted)}
  .wiz-confirm{flex:0 0 auto;padding:14px 22px;font-size:17px;font-weight:800;color:#fff;
    background:color-mix(in srgb,var(--accent) 30%,#0a0a08)}
  .wiz-confirm[disabled]{opacity:.4}
  .wiz-foot>.wiz-confirm{width:100%}

  /* =========================================================================
     RIFT PROTOCOL — UI ART OVERLAYS (artassets/uiUpdate1)
     Frames/panels/buttons have FILLED centers, so they are applied as
     border-image: the ornate ring frames the live content while the center
     slice is dropped, so the underlying portrait/stats/label stay visible and
     interactive. The tray panel, energy tokens and round badge use
     background-image. Nothing is placed over an interactive target — art is
     either a backdrop (behind content) or a border ring around the real
     control. (gf_btn_undo was never exported → Undo reuses gf_btn_confirm;
     gf_match_bg is intentionally skipped.)
     ========================================================================= */

  /* ---- Card tray: no panel behind the cards — they sit on the arena directly. ---- */
  .card-tray{background:none;border-top:0}

  /* ---- Operative portrait frame — kept ONLY on the browsing screens (character
       select, escalations, RIFT cards, lore). The fight screen has no frame. ---- */
  .classcard .cport,.team-slot .cport,.char-hero .cport,.esc-card .esc-port{
    border-style:solid;border-color:transparent;border-radius:0;
    border-image:url("artassets/uiUpdate1/opt/gf_portrait_frame.png") 13% stretch}
  .classcard .cport{border-width:7px}
  .team-slot .cport{border-width:9px}
  .char-hero .cport{border-width:13px}
  .esc-card .esc-port{border-width:6px}

  /* round counter: plain white text styled like the energy number, no frame art;
     absolutely pinned to the exact horizontal centre of the controls row */
  .round-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:13;
    display:flex;align-items:baseline;line-height:1;font-size:21px;font-weight:800;color:#fff;text-shadow:0 1px 4px #000}
  .round-badge .rb-of{font-size:13px;font-weight:600;color:rgba(255,255,255,.7);margin-left:1px}

  /* ---- Confirm / Undo: inherit the shared button frame; no green/red now.
       Confirm keeps a subtle accent tint as the primary action. ---- */
  .confirm-btn,.undo-btn{min-width:118px;max-width:210px}
  .confirm-btn{background:color-mix(in srgb,var(--accent) 26%,#0a0a08);color:#f3e6c8}
  .confirm-btn:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 40%,#0a0a08);color:#fff}
  .undo-btn{background:rgba(16,14,9,.5);color:var(--ink)}
  .cb-sword{font-size:14px;vertical-align:-1px}

  /* ---- Menu (quit) button uses the dedicated square menu-frame art ---- */
  .quit-btn{border:9px solid transparent;border-radius:0;background:rgba(10,9,6,.4);color:var(--ink);
    border-image:url("artassets/uiUpdate1/opt/gf_btn_menu.png") 15% stretch;padding:3px 8px}
  .quit-btn:hover{color:var(--accent);border-color:transparent}

  /* ---- Icon / round / close buttons opt OUT of the metal frame (it would break
       their shape). Restored to a simple bordered look. ---- */
  .audio-toggle,.help-btn{border-image:none;border:1px solid var(--line);border-radius:50%;background:rgba(18,17,13,.92)}
  .fb-close,.dv-close,.ap-mute,.help-close,.mp-close,.fb-btn,.intro-skip{
    border-image:none;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
  .audio-toggle:hover,.help-btn:hover,.fb-close:hover,.dv-close:hover{border-color:var(--accent);background:rgba(18,17,13,.92)}

  /* ---- Button variants that define their own border/bg must also adopt the
       frame so the look is consistent everywhere. ---- */
  .menu-item,.mp-btn,.mp-startbtn,.fb-send,.mp-copy{
    border:10px solid transparent;border-radius:0;background:rgba(16,14,9,.6);color:var(--ink);
    border-image:url("artassets/uiUpdate1/opt/gf_btn_confirm.png") 19% 9% stretch}
  .menu-item.primary,.mp-btn.primary,.mp-startbtn.primary,.fb-send.primary{
    background:color-mix(in srgb,var(--accent) 26%,#0a0a08);color:#f3e6c8;font-weight:800}
  .menu-item.primary .mi-ico{color:var(--accent)}
  .menu-item:hover{border-color:transparent;background:rgba(36,29,15,.7)}
  .mp-btn:hover:not(:disabled),.mp-startbtn:hover:not(:disabled),.fb-send:hover:not(:disabled){
    border-color:transparent;background:rgba(36,29,15,.7);color:var(--accent)}

  /* responsive border thinning so the frames don't swallow small elements */
  @media (max-width:600px){
    .confirm-btn,.undo-btn{min-width:90px}
    button{border-width:8px}
    .quit-btn{border-width:7px;padding:2px 6px}
    /* round counter moves to its own centered line above the energy+buttons row */
    .bf-controls{flex-direction:column-reverse;gap:5px}
    .round-badge{position:static;transform:none}
  }

  /* ===================== Right-click hint + onboarding coachmarks ===================== */
  /* subtle persistent indicator that right-click = back / undo */
  #rcHint{position:fixed;left:12px;bottom:12px;z-index:60;pointer-events:none;
    font-family:var(--font-body,inherit);font-size:11px;letter-spacing:.04em;color:var(--muted,#9aa4bf);
    background:rgba(10,8,18,.6);border:1px solid rgba(140,160,210,.22);border-radius:8px;padding:3px 9px;
    opacity:.72;display:flex;align-items:center;gap:5px}
  #rcHint.hidden{display:none}
  #rcHint .rc-mouse{font-size:12px;opacity:.9}
  @media (max-width:600px){ #rcHint{display:none} }   /* no right-click on touch — hide entirely */

  /* onboarding coach overlay (guided, non-blocking: clicks pass through) */
  #tutCoach{position:fixed;inset:0;z-index:205;pointer-events:none}
  #tutCoach.hidden{display:none}
  #tutCoach.scrim{background:rgba(6,4,12,.55)}
  .tut-ring{position:fixed;border-radius:14px;pointer-events:none;z-index:205;
    outline:3px solid #8fd0ff;box-shadow:0 0 0 9999px rgba(6,4,12,.55), 0 0 16px 4px #5bd;
    transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease;
    animation:tutpulse 1.4s ease-in-out infinite}
  @keyframes tutpulse{
    0%,100%{outline-color:#7cc8ff;box-shadow:0 0 0 9999px rgba(6,4,12,.55),0 0 12px 3px #4ad}
    50%{outline-color:#d4efff;box-shadow:0 0 0 9999px rgba(6,4,12,.48),0 0 28px 9px #8df}}
  .tut-arrow{position:fixed;z-index:207;pointer-events:none;font-size:34px;line-height:1;color:#9fdcff;
    text-shadow:0 0 12px #2af,0 2px 4px #000;animation:tutbounce 1s ease-in-out infinite}
  @keyframes tutbounce{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
  .tut-panel{position:fixed;left:24px;top:50%;transform:translateY(-50%);z-index:207;pointer-events:auto;
    width:min(310px,84vw);box-sizing:border-box;color:#e8ecf5;font-family:var(--font-body,inherit);
    background:linear-gradient(180deg,rgba(22,16,36,.98),rgba(13,9,22,.98));
    border:1px solid rgba(150,185,255,.4);border-radius:14px;padding:15px 16px 12px;
    box-shadow:0 16px 54px rgba(0,0,0,.6);
    /* never taller than the (chrome-adjusted) viewport — scroll if content exceeds it,
       so the action buttons/skip link stay reachable on a small phone screen */
    max-height:calc(100svh - 24px);overflow-y:auto;overscroll-behavior:contain}
  .tut-panel.center{left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,90vw);text-align:center;
    max-height:calc(100svh - 24px);overflow-y:auto}
  .tut-panel .tp-eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#7fbfff;opacity:.85}
  .tut-panel .tp-title{font-family:var(--font-display,inherit);font-size:19px;color:#cfe6ff;margin:3px 0 7px}
  .tut-panel .tp-body{font-size:14px;line-height:1.5;opacity:.95}
  .tut-panel .tp-body b{color:#bfe0ff}
  .tut-panel .tp-actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
  .tut-panel .tp-actions button{flex:1;min-width:96px;padding:8px 10px;border-radius:9px;cursor:pointer;
    font-family:var(--font-body,inherit);font-size:13px;font-weight:700;
    background:rgba(60,80,130,.4);border:1px solid rgba(150,185,255,.4);color:#dce6ff}
  .tut-panel .tp-actions button.primary{background:linear-gradient(180deg,#3d6fd6,#2b53b0);border-color:#6fa0ff;color:#fff}
  .tut-panel .tp-actions button:hover{filter:brightness(1.12)}
  .tut-panel .tp-skip{display:block;width:100%;margin-top:9px;background:none;border:0;cursor:pointer;
    color:#9aa4bf;font-size:11.5px;text-decoration:underline;font-family:var(--font-body,inherit)}
  .tut-panel .tp-skip:hover{color:#cdd6ee}
  /* Skip-tutorial button on the first-launch menu */
  .skip-tut-btn{margin-top:14px;background:rgba(20,16,30,.5);border:1px solid rgba(150,160,190,.3);
    color:var(--muted,#9aa4bf);font-size:12.5px;letter-spacing:.04em;padding:7px 16px;border-radius:9px;cursor:pointer;
    font-family:var(--font-body,inherit)}
  .skip-tut-btn:hover{color:#fff;border-color:rgba(180,190,220,.6)}

</style>

<body>
<div id="app">
  <!-- screens injected by UI -->
</div>

<script id="gf-core">
/* =====================================================================
   GENRE FIGHTERS — single-file demo
   This <script> is the pure game core: card data, rules engine, AIs,
   the 12 spec test assertions, and a headless simulation loop.
   It is environment-agnostic (no DOM access) so it can be unit-tested
   under Node by extracting and eval'ing this script. The UI lives in a

/* ---------- deterministic RNG (so tests & sims are reproducible) ------ */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seed){
  const r = mulberry32(seed);
  return {
    next:r,
    int:(n)=>Math.floor(r()*n),
    pick:(arr)=>arr[Math.floor(r()*arr.length)],
    coin:()=> r() < 0.5,          // heads = true
    shuffle:(arr)=>{ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; },
  };
}

// index by class
const DECKLISTS = {};
for(const c of CARDS){ (DECKLISTS[c.cls] = DECKLISTS[c.cls]||[]).push(c); }

/* =====================================================================
   ENGINE
   ===================================================================== */

let _fid = 0;
function makeFighter(name, className, hp){
  _fid++;
  const H = (hp==null?20:hp);
  return {
    uid:_fid, name, className,
    hp: H, maxHp: H, alive:true,
    deck:{ draw:[], discard:[], potionUsed:false, signatureUsed:false, bonusDraw:0 },
    hand:[],
    // permanent equip state:
    equipReduce:0,          // permanent -damage (stacking rule 2: at most one)
    hasReduceEquip:false,
    sidearm:false,          // +1 to own T2 attacks
    lightArmor:false,       // +1 to own reduce effects
    reinforced:false,       // unused bulwark +2
    duster:false, dusterUsed:false,
    // pending (carry to NEXT turn):
    pending:{ regen:0, incomingNext:0, outgoingNext:0, energyPenalty:0, silence:null, absorbNext:0, burn:0, reconPick:false },
    // rebuilt each turn:
    turn:freshTurn(),
  };
}
function freshTurn(){
  return {
    pools:[],            // [{value, remaining, stopsPierce}]
    absorbed:0,          // total dmg absorbed by pools this turn (capped, spec §3)
    hitThisTurn:false,   // took HP damage this turn (Double Tap reads this)
    reduce:0,            // flat -dmg from attacks this turn
    incoming:0,          // +dmg taken this turn (Mark/Curse/...)
    outgoing:0,          // -dmg this fighter deals this turn
    attackBuff:0,        // +dmg on this fighter's (single) attack this turn
    attackBuffUsed:false,
    riposte:null,        // {pool, counter, mode, attackers:Set}
    bluff:null,          // {dmg}
    tripmine:null,       // {dmg, fired:false}
    invuln:false,        // Phase Out
    redirectTo:null,     // fighter uid attacks on me get redirected to (Cover): set on protector
    coverFor:null,
    tauntTo:null,        // all enemy attacks must hit this uid
    silencedTypes:null,  // Set of types this fighter cannot play THIS turn
    buffedNoSecondAttack:false, // received an attack buff this turn (stacking rule 1)
    reconPick:false,     // Recon: owner may tutor a card at the start of this turn (UI)
    junction:null,       // Soldier gunblade element this turn: {plus,burn,pierce,slow,label}
  };
}

// Per-class starting HP (mirrors each class's Durability budget): tanks soak
// more, glass cannons less. Math-only tests use makeFighter's default 20.
const CLASS_HP = { Warden:17, Soldier:15, Cleric:17, Drifter:17, Scout:15, Arcanist:15 };
function makeFighterFromClass(name, className){
  const f = makeFighter(name, className, CLASS_HP[className]!=null?CLASS_HP[className]:20);
  f.deck.draw = DECKLISTS[className].slice();
  return f;
}

function newMatch(opts){
  // opts: { seed, sideA:{name, classes:[c,c], ai}, sideB:{...} }
  const rng = makeRng(opts.seed|0 || 1);
  function buildSide(s){
    // Name fighters by their class (unique within a team) for readable logs.
    const fighters = s.classes.map((cls)=> makeFighterFromClass(cls, cls));
    fighters.forEach(f=>{ rng.shuffle(f.deck.draw); f._sideLabel = s.name; });
    return { name:s.name, ai:s.ai||null, fighters };
  }
  const state = {
    rng, round:1, over:false, result:null, log:[],
    sides:[ buildSide(opts.sideA), buildSide(opts.sideB) ],
  };
  return state;
}

function livingFighters(side){ return side.fighters.filter(f=>f.alive); }
function enemyOf(state, sideIdx){ return state.sides[1-sideIdx]; }

/* ---- drawing ----
   Hands PERSIST across turns: unplayed cards carry over. Each turn we top each
   living fighter's hand up to its cap (4 per fighter, whether paired or a lone
   survivor — the survivor does NOT inherit the dead operative's cards, it just
   refills from its own deck), plus any bonus draw. A dead fighter's deck stops
   generating cards; its leftover hand is discarded. */
const HAND_CAP_PAIR = 4, HAND_CAP_SOLO = 4;   // lone survivor keeps a normal hand (draws ~2/round); no carry-over balloon
function drawN(f, n, rng){
  const out = [];
  for(let i=0;i<n;i++){
    if(f.deck.draw.length===0){
      if(f.deck.discard.length===0) break;       // deck fully exhausted
      f.deck.draw = rng.shuffle(f.deck.discard.slice());
      f.deck.discard = [];
    }
    out.push(f.deck.draw.shift());
  }
  return out;
}
function topUpHands(state){
  for(const side of state.sides){
    const living = livingFighters(side).length;
    const cap = (living<=1 ? HAND_CAP_SOLO : HAND_CAP_PAIR);
    for(const f of side.fighters){
      if(!f.alive){                              // dead deck stops; dump its hand
        for(const hi of (f.hand||[])) f.deck.discard.push(hi.card);
        f.hand = []; continue;
      }
      f.hand = f.hand || [];
      const need = Math.max(0, cap - f.hand.length) + (f.deck.bonusDraw||0);
      f.deck.bonusDraw = 0;
      const drawn = drawN(f, need, state.rng).map(card=>({card, owner:f}));
      f.hand = f.hand.concat(drawn);
    }
  }
}
// back-compat alias (UI / sim / tests may call either name)
const drawHands = topUpHands;

/* ---- legal move enumeration ----
   A "pick" = { handItem, card, owner, caster, target }
   - owner  = the fighter whose deck the card came from. The card is ALWAYS
              performed by its owner (abilities belong to a specific fighter);
              owner also governs once-per-match tracking + discard destination.
   - caster = owner (the performer).
   - target = the enemy fighter for aim 'enemy'; the chosen ally recipient for
              aim 'ally'; the owner for aim 'self'; null for aoe/allyAll/none. */
function buildLegalActions(state, sideIdx){
  const side = state.sides[sideIdx];
  const enemies = livingFighters(enemyOf(state, sideIdx));
  const allies  = livingFighters(side);
  const actions = [];
  for(const owner of side.fighters){
    if(!owner.alive) continue;
    for(const hi of owner.hand){
      const card = hi.card;
      // silence blocks the owner (performer) from playing the named types
      if(owner.turn.silencedTypes && owner.turn.silencedTypes.has(card.type)) continue;
      // once-per-match resource gating is per ORIGINATING deck
      if(card.type==='Potion' && owner.deck.potionUsed) continue;
      if(card.type==='Signature' && owner.deck.signatureUsed) continue;
      const caster = owner;
      if(card.aim==='enemy'){
        for(const t of (enemies.length?enemies:[null])) actions.push({handItem:hi, card, owner, caster, target:t});
      } else if(card.aim==='ally'){          // heal/buff/block "a fighter" — pick which ally
        for(const a of allies) actions.push({handItem:hi, card, owner, caster, target:a});
      } else if(card.aim==='self'){          // "this fighter" — the owner
        actions.push({handItem:hi, card, owner, caster, target:owner});
      } else {                               // enemyAll, allyAll, none
        actions.push({handItem:hi, card, owner, caster, target:null});
      }
    }
  }
  return actions;
}
function targetsFor(card, caster, allies, enemies){
  switch(card.aim){
    case 'enemy':    return enemies.length?enemies:[null];
    case 'enemyAll': return [null];
    case 'ally':     return allies.length?allies:[caster];
    case 'allyAll':  return [null];
    case 'self':     return [caster];
    case 'none':     return [null];
    default:         return [null];
  }
}

/* ---- validate a chosen set of <=2 picks for one side (stacking rules) ---- */
function validatePicks(state, sideIdx, picks){
  const side = state.sides[sideIdx];
  // per-pick gating: no replayed hand card, resources, silence
  const usedItems = new Set();
  for(const p of picks){
    if(p.handItem){                       // real hand cards can't be played twice
      if(usedItems.has(p.handItem)) return {ok:false, reason:'A card cannot be played twice.'};
      usedItems.add(p.handItem);
    }
    const odeck = (p.owner||p.caster).deck;
    if(p.card.type==='Potion' && odeck.potionUsed) return {ok:false, reason:'Potion already used this match.'};
    if(p.card.type==='Signature' && odeck.signatureUsed) return {ok:false, reason:'Signature already used this match.'};
    if(p.caster.turn.silencedTypes && p.caster.turn.silencedTypes.has(p.card.type))
      return {ok:false, reason:`${p.caster.name} is silenced and cannot play ${p.card.type}.`};
  }
  // one potion / one signature per ORIGINATING deck per turn (blocks two copies)
  const usedPotionDecks=new Set(), usedSigDecks=new Set();
  for(const p of picks){
    const od=(p.owner||p.caster).deck;
    if(p.card.type==='Potion'){ if(usedPotionDecks.has(od)) return {ok:false,reason:'One potion per deck per turn.'}; usedPotionDecks.add(od); }
    if(p.card.type==='Signature'){ if(usedSigDecks.has(od)) return {ok:false,reason:'One signature per deck per turn.'}; usedSigDecks.add(od); }
  }
  // Stacking rule 1: a fighter that receives an attack-boosting buff this turn
  //   cannot also be assigned a 2nd attack this turn (prevents buff + burst > 18).
  // Stacking rule 2: only one permanent -damage equip active per fighter.
  // (Checked before the play-count cap so the rule is genuinely exercised even
  //  if a future effect ever granted a 3rd play.)
  for(const f of side.fighters){
    const buffedHere   = picks.some(p=> isAttackBuff(p.card) && p.target===f);
    const buffedAlready= f.turn.buffedNoSecondAttack;
    const attacksOnF   = picks.filter(p=> p.caster===f && isAttackCard(p.card)).length;
    if((buffedHere||buffedAlready) && attacksOnF >= 2)
      return {ok:false, reason:`Stacking rule 1: ${f.name} is buffed and cannot also be assigned a second attack.`};
    const newReduceEquips = picks.filter(p=> p.caster===f && p.card.kind==='equipReduce').length;
    if(f.hasReduceEquip && newReduceEquips>=1)
      return {ok:false, reason:`Stacking rule 2: ${f.name} already has a permanent -damage equip.`};
    if(newReduceEquips>=2)
      return {ok:false, reason:'Stacking rule 2: only one permanent -damage equip per fighter.'};
  }
  // energy budget last (ramps by round; replaces the old fixed play-count cap)
  const budget = energyBudget(state, side);
  const spent = energyOf(picks);
  if(spent > budget) return {ok:false, reason:`Not enough energy: needs ${spent}, have ${budget}.`};
  return {ok:true};
}
function isAttackCard(c){ return c.kind==='attack' || c.kind==='aoe' ||
  (c.special && ['renzokuken','high_noon','drain','double_tap','fan_hammer','ghost_protocol','concussive','siege','fire_burn','firaga'].includes(c.special)); }
function isAttackBuff(c){ return c.kind==='buffAttack' || c.special==='lucky_coin' || c.special==='lucky_streak' || c.special==='stim_pack'; }
// Energy RAMPS by round: 3, 4, 6, 8, 10 (then holds at 10). Reduced by any
// Sleep energy-drain on a living fighter.
const ENERGY_BY_ROUND = {1:3, 2:4, 3:6, 4:8, 5:10};
function roundEnergy(round){ return ENERGY_BY_ROUND[round] || 10; }
function energyBudget(state, side){
  const base = roundEnergy(state && state.round ? state.round : 1);
  const drain = Math.max(0, ...side.fighters.filter(f=>f.alive).map(f=>f.turn.energyPenalty||0), 0);
  return Math.max(0, base - drain);
}
// energy cost by speed tier: T1=1, T2=2, T3=3, T4=5
const ENERGY_COST = {1:1, 2:2, 3:3, 4:5};
function energyCost(card){ return ENERGY_COST[card.speed] || 1; }
function energyOf(picks){ return picks.reduce((s,p)=> s + energyCost(p.card), 0); }

/* =====================================================================
   TURN RESOLUTION  (the deterministic, unit-tested core — spec §4)
   ===================================================================== */

function startOfTurn(state){
  // apply pending next-turn effects into this turn's fresh state
  for(const side of state.sides){
    for(const f of side.fighters){
      f.turn = freshTurn();
      if(!f.alive) continue;
      const pd = f.pending;
      if(pd.burn>0){ f.hp = Math.max(0, f.hp - pd.burn); pd.burn = 0; if(f.hp<=0) f.alive=false; }  // burn DoT ticks first
      if(!f.alive) continue;
      if(pd.regen>0){ heal(state, f, pd.regen, 'Regen'); pd.regen = 0; }
      if(pd.incomingNext>0){ f.turn.incoming += pd.incomingNext; pd.incomingNext = 0; }
      if(pd.outgoingNext>0){ f.turn.outgoing += pd.outgoingNext; pd.outgoingNext = 0; }
      if(pd.absorbNext>0){ f.turn.pools.push({value:pd.absorbNext, remaining:pd.absorbNext}); pd.absorbNext = 0; }
      if(pd.energyPenalty>0){ f.turn.energyPenalty = pd.energyPenalty; pd.energyPenalty = 0; }
      if(pd.silence){ f.turn.silencedTypes = pd.silence; pd.silence = null; }
      if(pd.reconPick){ f.turn.reconPick = true; pd.reconPick = false; }   // Recon tutor available this turn
      // permanent equip reductions are reflected at compute time, not here
    }
  }
  // a burn could finish a fighter at the start of the turn → check for a win
  const aDead = state.sides[0].fighters.every(f=>!f.alive), bDead = state.sides[1].fighters.every(f=>!f.alive);
  if(aDead||bDead){ state.over=true; state.result = (aDead&&bDead)?{winner:-1,reason:'Both teams fell — draw.'}:{winner:aDead?1:0, reason:'All enemy fighters defeated (burn).'}; }
}

// public: resolve one locked turn. picksBySide = [picksA, picksB].
function resolveTurn(state, picksA, picksB){
  const log = state.log = [];
  const allPicks = [];
  picksA.forEach(p=> allPicks.push(Object.assign({sideIdx:0}, p)));
  picksB.forEach(p=> allPicks.push(Object.assign({sideIdx:1}, p)));
  // effective speed (mutable, for Haste/Disrupt)
  allPicks.forEach(p=> p.eff = p.card.speed);
  state._allPicks = allPicks;   // specials (Double Tap focus-fire) consult this

  // CARD MEMORY: record what each class reveals this turn. The class-aware
  // Warden AI consults this to weight plays against an enemy class's remaining
  // threats. Harmless to the engine/tests (pure side-tally, never read here).
  state.cardMemory = state.cardMemory || {};
  for(const p of allPicks){
    const cls = p.caster.className;
    const mem = state.cardMemory[cls] = state.cardMemory[cls] || { names:{}, count:0 };
    mem.names[p.card.name] = (mem.names[p.card.name]||0) + 1;
    mem.count++;
  }

  logLine(log,'sys',`— Round ${state.round} resolution —`);

  // additive trace for the animated UI replay (no effect on resolution logic)
  state.timeline = [];
  state._preHp = snapHp(state);
  let prevHp = state._preHp, prevLen = log.length;

  for(let tier=1; tier<=4; tier++){
    const atTier   = allPicks.filter(p=> p.eff===tier);
    if(atTier.length===0) continue;
    const tierPicks = atTier.filter(p=> p.caster.alive);
    const cancelled = atTier.filter(p=> !p.caster.alive);   // caster died earlier this turn
    logLine(log,'tier',`Tier ${tier} — ${({1:'instant',2:'fast',3:'normal',4:'heavy'})[tier]}`);

    // INTERRUPT ON KILL: a card whose performer was defeated in an earlier tier
    // is cancelled and does nothing (wasted) — shown explicitly so it reads as a rule.
    for(const p of cancelled){
      logLine(log,'cancel',`  T${p.card.speed} ${p.card.name} (${fname(p.caster)}): CANCELLED — ${p.caster.className} was defeated before it resolved.`, p.caster);
    }

    // ---- Phase 1: non-attack state effects of this tier ----
    for(const p of tierPicks){
      if(isResolvedAsAttack(p.card)) continue;
      applyStateEffect(state, p, allPicks, log);
    }
    // ---- Phase 2: compute all attacks of this tier simultaneously ----
    const packets = []; // {target, amount, pierce, srcPick}
    for(const p of tierPicks){
      if(!isResolvedAsAttack(p.card)) continue;
      computeAttack(state, p, packets, log);
    }
    // ---- Phase 3: apply packets (pools then HP), riposte counters already queued ----
    applyPackets(state, packets, log, tier);
    // ---- Phase 4: deaths checked only at END of tier ----
    checkDeaths(state, log);

    // record this tier in the timeline (post-tier HP, deltas, absorbed, status, log slice)
    const hpNow = snapHp(state), deltas = {};
    for(const k in hpNow) deltas[k] = hpNow[k] - prevHp[k];
    state.timeline.push({ tier, lines: log.slice(prevLen), hp: hpNow, deltas,
      absorbed: Object.assign({}, state._tierAbsorbed||{}), negated: Object.assign({}, state._tierNegated||{}),
      status: snapStatus(state) });
    prevHp = hpNow; prevLen = log.length;

    if(state.over) break;
  }

  endOfTurn(state, allPicks, log);
  return log;
}

function isResolvedAsAttack(card){
  if(card.kind==='attack'||card.kind==='aoe') return true;
  if(card.special && ['renzokuken','high_noon','drain','double_tap','fan_hammer',
      'ghost_protocol','concussive','siege','fire_burn','firaga','solid_barrel'].includes(card.special)) return true;
  return false;
}

/* ---- Phase 1: state effects ---- */
function applyStateEffect(state, p, allPicks, log){
  const c = p.card, caster = p.caster, target = p.target;
  consumeResource(p);
  switch(c.kind){
    case 'heal':       heal(state, target||caster, c.amount, c.name, c.once); break;
    case 'block':      addPool(target||caster, c.amount); logTag(log,c,caster,`+${c.amount} bulwark`); break;
    case 'blockBoth':  for(const f of livingFighters(state.sides[p.sideIdx])) addPool(f, c.amount);
                       logTag(log,c,caster,`+${c.amount} bulwark to both`); break;
    case 'riposte':    caster.turn.riposte = {pool:c.amount, remaining:c.amount, counter:c.counter, mode:c.mode, attackers:[]};
                       addPool(caster, c.amount, {riposte:true}); logTag(log,c,caster,`riposte ${c.amount}/${c.counter}`); break;
    case 'reduce':     { let amt=c.amount + (caster.lightArmor && (target||caster)===caster?1:0);
                         (target||caster).turn.reduce += amt; logTag(log,c,caster,`-${amt} incoming`); } break;
    case 'reduceBoth': for(const f of livingFighters(state.sides[p.sideIdx])) f.turn.reduce += c.amount;
                       logTag(log,c,caster,`-${c.amount} incoming to both`); break;
    case 'buffAttack': applyAttackBuff(target||caster, c.amount); logTag(log,c,caster,`+${c.amount} next attack`); break;
    case 'debuff':     if(target){ target.turn.incoming += c.amount; logTag(log,c,caster,`${target.name} +${c.amount} taken`);} break;
    case 'equipReduce':addReduceEquip(caster, c.amount); logTag(log,c,caster,`equip -${c.amount} (permanent)`); break;
    case 'special':    (SPECIALS[c.special]||(()=>{})).call(null, {state,p,c,caster,target,allPicks,log,phase:'state'}); break;
    default: break;
  }
}

function applyAttackBuff(f, amount){
  f.turn.attackBuff += amount;
  f.turn.buffedNoSecondAttack = true;
}

/* ---- Phase 2: attack computation ---- */
function computeAttack(state, p, packets, log){
  const c = p.card;
  consumeResource(p);
  // junction flat bonus is ONCE PER CARD: arm it here, queueDamage consumes it on
  // the card's first hit (so multi-hit cards don't multiply the +damage).
  const jx = p.caster.turn.junction;
  if(jx && jx.plus) p.caster.turn._jxArmed = jx.plus;
  if(c.special){ (SPECIALS[c.special]||(()=>{})).call(null,{state,p,c,caster:p.caster,target:p.target,packets,log,phase:'attack'}); return; }
  if(c.kind==='attack'){
    const tgt = resolveTarget(state, p, p.target);
    if(!tgt){ logLine(log,'sys',`  ${c.name}: no valid target`); return; }
    queueDamage(state, packets, p.caster, tgt, c.amount, {pierce:!!c.pierce, card:c, log});
  } else if(c.kind==='aoe'){
    for(const tgt of livingFighters(enemyOf(state, p.sideIdx))){
      queueDamage(state, packets, p.caster, tgt, c.amount, {pierce:!!c.pierce, card:c, log, aoe:true});
    }
  }
}

// figure out the actual fighter an attack lands on (taunt / cover redirects)
function resolveTarget(state, p, intended){
  if(!intended || !intended.alive){
    // retarget to any living enemy if intended is gone
    const enemies = livingFighters(enemyOf(state, p.sideIdx));
    intended = enemies[0]||null;
    if(!intended) return null;
  }
  const enemySide = enemyOf(state, p.sideIdx);
  // Taunt: a living taunter on the defending side forces all attacks onto it
  const taunter = enemySide.fighters.find(f=> f.alive && f.turn.tauntTo===f.uid);
  if(taunter) return taunter;
  // Cover: if intended is covered, redirect to the protector
  const protector = enemySide.fighters.find(f=> f.alive && f.turn.coverFor===intended.uid);
  if(protector) return protector;
  return intended;
}

// queue a damage packet after applying buffs/reductions (spec §3 order).
// `mods` records each adjustment so the reveal log can explain why a hit landed
// soft (or got fully negated).
function queueDamage(state, packets, attacker, target, base, opt){
  let dmg = base; const mods = [];
  // attacker's single-attack buff: consumed once, and only on a single-target
  // attack (applying it per-target on an AoE would break the 5/target AoE cap).
  if(!opt.aoe && !attacker.turn.attackBuffUsed && attacker.turn.attackBuff>0){
    dmg += attacker.turn.attackBuff; mods.push(`+${attacker.turn.attackBuff} buff`); attacker.turn.attackBuffUsed = true;
  }
  if(attacker.sidearm && opt.card && opt.card.speed===2){ dmg += 1; mods.push('+1 sidearm'); }
  // gunblade junction (Soldier): the weapon element modifies every hit this turn
  const jx = attacker.turn.junction;
  if(jx){
    if(attacker.turn._jxArmed){ dmg += attacker.turn._jxArmed; mods.push(`+${attacker.turn._jxArmed} ${jx.label}`); attacker.turn._jxArmed = 0; }  // once per card
    if(jx.pierce){ opt.pierce = true; }
    if(jx.burn){ target.pending.burn = Math.max(target.pending.burn||0, jx.burn); }
    if(jx.slow){ target.pending.outgoingNext = Math.min((target.pending.outgoingNext||0) + jx.slow, jx.slowCap||3); }
  }
  if(attacker.turn.outgoing>0){ dmg -= attacker.turn.outgoing; mods.push(`−${attacker.turn.outgoing} suppressed`); }
  const inc = target.turn.incoming + (target._permIncoming||0);
  if(inc>0){ dmg += inc; mods.push(`+${inc} marked`); }
  const red = target.turn.reduce + target.equipReduce;
  if(red>0){ dmg -= red; mods.push(`−${red} ${target.equipReduce>0&&target.turn.reduce===0?'armor':'reduced'}`); }
  if(dmg < 0) dmg = 0;
  packets.push({attacker, target, base, amount:dmg, mods, pierce:!!opt.pierce, card:opt.card, aoe:!!opt.aoe, log:opt.log});
  // riposte / bluff / trip-mine reactions (counter happens same tier)
  registerReaction(state, packets, attacker, target, opt);
}
function registerReaction(state, packets, attacker, target, opt){
  const t = target.turn;
  if(t.riposte){
    if(t.riposte.mode==='all') t.riposte.attackers.push(attacker);
    else if(t.riposte.mode==='one' && !t.riposte.fired && t.riposte.attackers.length===0) t.riposte.attackers.push(attacker);
  }
  if(t.bluff){ packets.push({attacker:target, target:attacker, amount:t.bluff.dmg, pierce:false, special:'bluff', log:opt.log}); }
  if(t.tripmine && !t.tripmine.fired){ t.tripmine.fired=true; packets.push({attacker:target, target:attacker, amount:t.tripmine.dmg, pierce:false, special:'tripmine', log:opt.log}); }
}

/* ---- Phase 3: apply packets to pools then HP ---- */
function applyPackets(state, packets, log, tier){
  state._tierAbsorbed = {};   // uid -> damage blocked this tier (for the animation)
  state._tierNegated = {};    // uid -> took an attack that was fully reduced to 0 (no block)
  // queue riposte counters generated this tier
  for(const side of state.sides) for(const f of side.fighters){
    const rip = f.turn.riposte;
    if(rip && rip.attackers && rip.attackers.length){
      const list = rip.mode==='all' ? rip.attackers : rip.attackers.slice(0,1);
      for(const atk of list){
        if(atk && atk.alive) packets.push({attacker:f, target:atk, amount:rip.counter, pierce:false, special:'riposte', log});
      }
      if(rip.mode==='one') rip.fired = true;  // Counter-Sniper: a single counter the whole turn
      rip.attackers = []; // 'all' mode re-arms per tier for each attack instance
    }
  }
  // group by target
  const byTarget = new Map();
  for(const pk of packets){
    if(!pk.target || !pk.target.alive) continue;
    if(pk.target.turn.invuln) { logLine(log,'sys',`  ${fname(pk.target)} is untouchable this turn (0 dmg)`); continue; }
    if(!byTarget.has(pk.target)) byTarget.set(pk.target, []);
    byTarget.get(pk.target).push(pk);
  }
  for(const [target, pks] of byTarget){
    const hadBulwark = target.turn.pools.some(p=> p.value>0 && !p.riposte);
    for(const pk of pks){
      const before = target.hp;
      let toAbsorb = pk.amount, absorbed=0;
      // spec §3: blocks may NEVER fully cover an 18 focused burst. Cap total
      // pool absorption per fighter per turn at MAX_BLOCK_ABSORB (< 18), so a
      // focused heavy always leaks through even when block pools stack.
      let cap = Math.max(0, MAX_BLOCK_ABSORB - target.turn.absorbed);
      for(const pool of target.turn.pools){
        if(cap<=0) break;
        if(pool.remaining<=0) continue;
        if(pk.pierce && !pool.stopsPierce) continue;   // pierce skips normal pools
        const a = Math.min(pool.remaining, toAbsorb, cap);
        pool.remaining-=a; toAbsorb-=a; absorbed+=a; cap-=a;
      }
      // Reinforced Plating: first time this fighter's bulwark breaks, absorb 2 more.
      if(!pk.pierce && toAbsorb>0 && cap>0 && hadBulwark && target.reinforced && !target.reinforcedUsed){
        const a = Math.min(2, toAbsorb, cap);
        toAbsorb-=a; absorbed+=a; cap-=a; target.reinforcedUsed=true;
        if(a>0) logLine(log,'sys',`  ${fname(target)}'s Reinforced Plating absorbs ${a} more`);
      }
      target.turn.absorbed += absorbed;
      state._tierAbsorbed[target.uid] = (state._tierAbsorbed[target.uid]||0) + absorbed;
      // a real attack reduced to 0 with no block absorbing it → "negated" by reductions
      if(pk.base>0 && toAbsorb===0 && absorbed===0) state._tierNegated[target.uid] = true;
      if(toAbsorb>0) target.turn.hitThisTurn = true;   // took HP damage
      target.hp -= toAbsorb;
      logDamage(log, pk, before, target, absorbed);
    }
    if(target.hp<0) target.hp = 0;
  }
}
const MAX_BLOCK_ABSORB = 17;   // < the 18 focused-burst ceiling (spec §3)

/* ---- Phase 4: deaths only at end of tier ---- */
function checkDeaths(state, log){
  for(const side of state.sides) for(const f of side.fighters){
    if(f.alive && f.hp<=0){
      // Worn Duster save: first lethal hit leaves them at 1, then +2 taken for the match
      if(f.duster && !f.dusterUsed){
        f.dusterUsed = true; f.hp = 1;
        f._permIncoming = (f._permIncoming||0) + 2;
        logLine(log,'sys',`  ${fname(f)}'s Worn Duster holds them at 1 HP! (now takes +2 from attacks)`);
        continue;
      }
      f.alive = false; f.hp = 0;
      logLine(log,'death',`  ✖ ${fname(f)} is down.`);
    }
  }
  // win check
  const aDead = state.sides[0].fighters.every(f=>!f.alive);
  const bDead = state.sides[1].fighters.every(f=>!f.alive);
  if(aDead||bDead){
    state.over = true;
    if(aDead&&bDead) state.result = {winner:-1, reason:'Both teams fell — draw.'};
    else state.result = {winner: aDead?1:0, reason:'All enemy fighters defeated.'};
  }
}

/* ---- end of turn cleanup ---- */
function endOfTurn(state, allPicks, log){
  // discard only the cards that were PLAYED (incl. cancelled ones — they were
  // committed/wasted). Unplayed cards carry over to next turn's hand.
  const playedItems = new Set((allPicks||[]).map(p=>p.handItem).filter(Boolean));
  for(const side of state.sides) for(const f of side.fighters){
    if(!f.hand) { f.hand=[]; continue; }
    const keep = [];
    for(const hi of f.hand){
      if(playedItems.has(hi)) hi.owner.deck.discard.push(hi.card);
      else keep.push(hi);
    }
    f.hand = keep;
  }
  // clear per-turn state. `pending` is a separate property (carries to next turn);
  // permanent state (_permIncoming, equips) lives on the fighter and persists.
  for(const side of state.sides) for(const f of side.fighters){
    f.turn = freshTurn();
  }
  if(!state.over && state.round>=MAX_ROUNDS){
    // end-of-match tiebreak: MOST ENEMY FIGHTERS KILLED first, then total HP, then draw.
    const a=state.sides[0], b=state.sides[1];
    const killsA = killsBy(state,0), killsB = killsBy(state,1);   // enemy fighters each side has downed
    const hpA = sumHp(a), hpB = sumHp(b);
    const tag = `Round ${MAX_ROUNDS} reached`;
    state.over = true;
    if(killsA!==killsB)
      state.result = killsA>killsB
        ? {winner:0, reason:`${tag} — ${a.name} wins on kills (${killsA} vs ${killsB}).`}
        : {winner:1, reason:`${tag} — ${b.name} wins on kills (${killsB} vs ${killsA}).`};
    else if(hpA!==hpB)
      state.result = hpA>hpB
        ? {winner:0, reason:`${tag} — kills tied ${killsA}-${killsB}; ${a.name} wins on HP (${hpA} vs ${hpB}).`}
        : {winner:1, reason:`${tag} — kills tied ${killsA}-${killsB}; ${b.name} wins on HP (${hpB} vs ${hpA}).`};
    else
      state.result = {winner:-1, reason:`${tag} — kills ${killsA}-${killsB} and HP ${hpA}-${hpB} both tied. Draw.`};
  }
}
const MAX_ROUNDS = 5;
function sumHp(side){ return side.fighters.reduce((s,f)=> s + (f.alive?f.hp:0), 0); }
// how many ENEMY fighters side `sideIdx` has killed (i.e. dead fighters on the other side)
function killsBy(state, sideIdx){ return state.sides[1-sideIdx].fighters.filter(f=>!f.alive).length; }

/* ---- primitives ---- */
function heal(state, f, amount, src, once){
  if(!f || !f.alive) return;
  const before=f.hp; f.hp=Math.min(f.maxHp, f.hp+amount);
  if(state.log) logLine(state.log,'heal',`  ${src||'Heal'} → ${fname(f)}: +${f.hp-before} HP (${before}→${f.hp})`);
}
function addPool(f, value, opt){ f.turn.pools.push({value, remaining:value, stopsPierce:!!(opt&&opt.stopsPierce), riposte:!!(opt&&opt.riposte)}); }
function addReduceEquip(f, amount){
  if(f.hasReduceEquip) return; // rule 2 safety
  f.hasReduceEquip = true; f.equipReduce += amount;
}
function consumeResource(p){
  if(p._consumed) return; p._consumed=true;
  const odeck = (p.owner||p.caster).deck;   // once-per-match is per originating deck
  if(p.card.type==='Potion') odeck.potionUsed = true;
  if(p.card.type==='Signature') odeck.signatureUsed = true;
}

/* =====================================================================
   SPECIAL HANDLERS (the weird 20%)
   Each receives a ctx; `phase` is 'state' or 'attack'.
   ===================================================================== */
const SPECIALS = {
  cover(ctx){ ctx.caster.turn.coverFor = pickAllyUid(ctx); logTag(ctx.log,ctx.c,ctx.caster,'covering ally'); },
  taunt(ctx){ ctx.caster.turn.tauntTo = ctx.caster.uid; logTag(ctx.log,ctx.c,ctx.caster,'taunting'); },
  bluff(ctx){ ctx.caster.turn.bluff = {dmg:3}; logTag(ctx.log,ctx.c,ctx.caster,'bluffing'); },
  trip_mine(ctx){ ctx.caster.turn.tripmine = {dmg:4, fired:false}; logTag(ctx.log,ctx.c,ctx.caster,'trip mine set'); },
  reload(ctx){ ctx.caster.deck.bonusDraw += 1; logTag(ctx.log,ctx.c,ctx.caster,'+1 draw next turn'); },
  ante_up(ctx){ ctx.caster.deck.bonusDraw += 2; logTag(ctx.log,ctx.c,ctx.caster,'+2 draw next turn'); },
  recon(ctx){ ctx.caster.pending.reconPick = true; logTag(ctx.log,ctx.c,ctx.caster,'recon — tutor a card next turn'); },
  // Soldier gunblade junctions: set the weapon element for the WHOLE turn (state phase,
  // resolves at T1 before attacks, so it modifies every hit this turn via queueDamage).
  junction_fire(ctx){ ctx.caster.turn.junction = {plus:1, burn:2, label:'fire'}; logTag(ctx.log,ctx.c,ctx.caster,'weapon junctioned: FIRE (+1 once & burn)'); },
  junction_thunder(ctx){ ctx.caster.turn.junction = {pierce:true, label:'thunder'}; logTag(ctx.log,ctx.c,ctx.caster,'weapon junctioned: THUNDER (pierce)'); },
  junction_blizzard(ctx){ ctx.caster.turn.junction = {slow:1, slowCap:2, label:'blizzard'}; logTag(ctx.log,ctx.c,ctx.caster,'weapon junctioned: BLIZZARD (slow)'); },
  haste(ctx){ retime(ctx, 4, 2); },
  disrupt(ctx){ retime(ctx, 4, 3, true); },
  sleep(ctx){ if(ctx.target){ ctx.target.pending.energyPenalty = Math.max(ctx.target.pending.energyPenalty,2); logTag(ctx.log,ctx.c,ctx.caster,`${fname(ctx.target)} drowsy (-2 energy next turn)`);} },
  silence_magic(ctx){ if(ctx.target){ ctx.target.pending.silence = new Set(['Spell','Signature']); logTag(ctx.log,ctx.c,ctx.caster,`${ctx.target.name} silenced`);} },
  silence_spell(ctx){ if(ctx.target){ ctx.target.pending.silence = new Set(['Spell']); logTag(ctx.log,ctx.c,ctx.caster,`${ctx.target.name} silenced`);} },
  regen(ctx){ const n=ctx.c.amount||2; heal(ctx.state, ctx.target||ctx.caster, n, 'Regen'); (ctx.target||ctx.caster).pending.regen += n; },
  whiskey(ctx){ heal(ctx.state, ctx.target||ctx.caster, 4, 'Whiskey'); (ctx.target||ctx.caster).pending.incomingNext += 1; },
  sanctuary(ctx){ for(const f of livingFighters(ctx.state.sides[ctx.p.sideIdx])){ heal(ctx.state,f,1,'Sanctuary'); f.turn.reduce += 1; } },
  stim_pack(ctx){ applyAttackBuff(ctx.target||ctx.caster, 3); (ctx.target||ctx.caster).turn.incoming += 1; logTag(ctx.log,ctx.c,ctx.caster,'+3 attack, +1 taken'); },
  lucky_coin(ctx){ const heads=ctx.state.rng.coin(); if(heads) applyAttackBuff(ctx.target||ctx.caster,4);
    logLine(ctx.log,'flip',`  ⊙ Lucky Coin (${fname(ctx.caster)}): flip = ${heads?'HEADS, +4 to next attack':'TAILS, +0'}`, ctx.caster); },
  lucky_streak(ctx){ const heads=ctx.state.rng.coin(); const amt=heads?4:2; applyAttackBuff(ctx.target||ctx.caster, amt);
    logLine(ctx.log,'flip',`  ⊙ Lucky Streak (${fname(ctx.caster)}): flip = ${heads?'HEADS, +4':'TAILS, +2'} to next attack`, ctx.caster); },
  suppress(ctx){ if(ctx.target){ const n=ctx.c.amount||3; ctx.target.turn.outgoing += n; logTag(ctx.log,ctx.c,ctx.caster,`${ctx.target.name} deals -${n}`);} },
  standoff(ctx){ ctx.caster.turn.outgoing += 2; if(ctx.target) ctx.target.turn.outgoing += 2; logTag(ctx.log,ctx.c,ctx.caster,'standoff -2 both'); },
  dispel(ctx){ const t=ctx.target; if(!t) return; t.turn.reduce=0; t.turn.attackBuff=0; t.turn.incoming=Math.max(0,t.turn.incoming);
    t.hasReduceEquip=false; t.equipReduce=0; t.sidearm=false; t.lightArmor=false; t.reinforced=false; t.duster=false;
    logTag(ctx.log,ctx.c,ctx.caster,`dispelled ${t.name}`); },
  sacrifice(ctx){ const side=ctx.state.sides[ctx.p.sideIdx]; const fs=livingFighters(side);
    if(fs.length<2){ return; }
    // move up to 6 HP from the higher-HP ally to the lower — never below 1 (must not kill the donor)
    let from=fs[0],to=fs[1]; if(from.hp<to.hp){ [from,to]=[to,from]; }
    const real=Math.min(6, from.hp-1, to.maxHp-to.hp);
    if(real<=0){ logTag(ctx.log,ctx.c,ctx.caster,'no HP to move'); return; }
    from.hp-=real; to.hp+=real;
    logTag(ctx.log,ctx.c,ctx.caster,`moved ${real} HP ${fname(from)}→${fname(to)}`); },
  divine(ctx){ for(const f of livingFighters(ctx.state.sides[ctx.p.sideIdx])){ addPool(f,10,{stopsPierce:true}); } logTag(ctx.log,ctx.c,ctx.caster,'divine shield'); },
  equip_sidearm(ctx){ ctx.caster.sidearm=true; logTag(ctx.log,ctx.c,ctx.caster,'sidearm equipped'); },
  equip_lightarmor(ctx){ ctx.caster.lightArmor=true; logTag(ctx.log,ctx.c,ctx.caster,'light armor equipped'); },
  equip_reinforced(ctx){ ctx.caster.reinforced=true; logTag(ctx.log,ctx.c,ctx.caster,'reinforced plating equipped'); },
  equip_duster(ctx){ ctx.caster.duster=true; logTag(ctx.log,ctx.c,ctx.caster,'worn duster equipped'); },

  // ---- attack-phase specials ----
  renzokuken(ctx){ const tgt=resolveTarget(ctx.state,ctx.p,ctx.target); if(!tgt) return;
    // a flurry of 3 small hits (3 each = 9); each hit carries the active junction
    for(let i=0;i<3;i++) queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, 3, {card:ctx.c, log:ctx.log}); },
  solid_barrel(ctx){ const tgt=resolveTarget(ctx.state,ctx.p,ctx.target); if(!tgt) return;
    const n=ctx.c.amount||2; queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, n, {card:ctx.c, log:ctx.log});
    queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, n, {card:ctx.c, log:ctx.log}); },
  high_noon(ctx){ const tgt=resolveTarget(ctx.state,ctx.p,ctx.target); if(!tgt) return;
    let dmg = (ctx.caster.hp < ctx.caster.maxHp/2) ? 10 : (ctx.c.amount||8);   // floor from card data
    queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, dmg, {card:ctx.c, log:ctx.log}); },
  drain(ctx){ const tgt=resolveTarget(ctx.state,ctx.p,ctx.target); if(!tgt) return;
    queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, 3, {card:ctx.c, log:ctx.log});
    heal(ctx.state, ctx.caster, 3, 'Drain'); },
  double_tap(ctx){ const tgt=resolveTarget(ctx.state,ctx.p,ctx.target); if(!tgt) return;
    // "then 1 more if they were hit this turn": already took HP damage in a prior
    // tier, OR another of your attacks this turn also targets them (focus fire).
    const focusFire = (ctx.state._allPicks||[]).some(pp=> pp!==ctx.p && pp.caster.alive &&
      isResolvedAsAttack(pp.card) && pp.target===tgt);
    let dmg = 3 + ((tgt.turn.hitThisTurn || focusFire) ? 1 : 0);
    queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, dmg, {card:ctx.c, log:ctx.log}); },
  fan_hammer(ctx){ const tgt=resolveTarget(ctx.state,ctx.p,ctx.target); if(!tgt) return;
    const base=ctx.c.amount||4; const heads=ctx.state.rng.coin(); const dmg=base+(heads?3:0);
    logLine(ctx.log,'flip',`  ⊙ Fan The Hammer (${fname(ctx.caster)}): flip = ${heads?'HEADS, +3 bonus damage':'TAILS, no bonus'}`, ctx.caster);
    queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, dmg, {card:ctx.c, log:ctx.log}); },
  ghost_protocol(ctx){ ctx.caster.turn.invuln=true; const tgt=resolveTarget(ctx.state,ctx.p,ctx.target);
    if(tgt) queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, 4, {card:ctx.c, log:ctx.log}); },
  concussive(ctx){ const tgt=resolveTarget(ctx.state,ctx.p,ctx.target); if(!tgt) return;
    queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, (ctx.c.amount||5), {card:ctx.c, log:ctx.log});
    tgt.pending.outgoingNext += 2; },
  siege(ctx){ const tgt=resolveTarget(ctx.state,ctx.p,ctx.target); if(!tgt) return;
    queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, (ctx.c.amount||4), {card:ctx.c, log:ctx.log});
    ctx.caster.pending.absorbNext += 8; },
  fire_burn(ctx){ const tgt=resolveTarget(ctx.state,ctx.p,ctx.target); if(!tgt) return;
    queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, (ctx.c.amount||3), {card:ctx.c, log:ctx.log});
    tgt.pending.burn = (tgt.pending.burn||0) + 2; },   // 2 burn at the start of their next turn
  firaga(ctx){ const tgt=resolveTarget(ctx.state,ctx.p,ctx.target); if(!tgt) return;
    queueDamage(ctx.state, ctx.packets, ctx.caster, tgt, (ctx.c.amount||9), {card:ctx.c, log:ctx.log});
    // splash 3 to the OTHER living enemy
    const other = livingFighters(enemyOf(ctx.state, ctx.p.sideIdx)).find(f=> f!==tgt);
    if(other) queueDamage(ctx.state, ctx.packets, ctx.caster, other, 3, {card:ctx.c, log:ctx.log, aoe:true}); },
};
function pickAllyUid(ctx){
  const side=ctx.state.sides[ctx.p.sideIdx];
  const ally = side.fighters.find(f=> f.alive && f!==ctx.caster);
  return ally? ally.uid : null;
}
function retime(ctx, from, to, enemyTarget){
  // find a locked pick that is a T<from> attack by the relevant fighter and change eff speed
  const fighter = enemyTarget ? ctx.target : (ctx.target||ctx.caster);
  if(!fighter) return;
  for(const p of ctx.allPicks){
    if(p.caster===fighter && p.card.speed===from && isResolvedAsAttack(p.card)){ p.eff=to; break; }
  }
  logTag(ctx.log, ctx.c, ctx.caster, `retimed T${from}→T${to}`);
}

/* =====================================================================
   LOGGING helpers
   ===================================================================== */
// `actor` (optional) is the performing fighter — recorded so the animated UI
// log can show its portrait next to the line.
function logLine(log, cls, text, actor){
  if(log) log.push({ cls, text, actorClass: actor&&actor.className, actorSide: actor&&actor._sideLabel });
}
function fname(f){ return f ? ((f._sideLabel?f._sideLabel+' ':'')+f.name) : '?'; }
function logTag(log, c, caster, what){ logLine(log,'sys',`  T${c.speed} ${c.name} (${fname(caster)}): ${what}`, caster); }
function logDamage(log, pk, before, target, absorbed){
  const after = Math.max(0, target.hp);
  const toHp = Math.max(0, before - after);
  const src = pk.special ? pk.special : (pk.card?`T${pk.card.speed} ${pk.card.name}`:'attack');
  const by = pk.attacker?` (${fname(pk.attacker)})`:'';
  const pierce = pk.pierce?' [pierce]':'';
  // show the damage math: base + buffs/reductions = pre-block amount, then block
  let calc = (pk.mods && pk.mods.length) ? `${pk.base} ${pk.mods.join(' ')} = ${pk.amount}` : `${pk.amount}`;
  if(absorbed>0) calc += ` − blocked ${absorbed}`;
  const outcome = toHp>0 ? `${toHp} to HP` : 'no damage';
  const cls = pk.pierce ? 'pie' : (toHp>0 ? 'dmg' : 'blk');
  logLine(log, cls,
    `  ${src}${by}${pierce} → ${fname(target)}: ${calc} → ${outcome} (HP ${before}→${after})`, pk.attacker);
}
/* fighterStatus: ALL active effects on a fighter, for the on-board tags and the
   per-tier animation snapshots. Reads live turn-state + permanent + pending. */
function fighterStatus(f){
  const out=[]; const tn=f.turn||{}; const pd=f.pending||{};
  let pool=0; for(const p of (tn.pools||[])) pool+=Math.max(0,p.remaining);
  if(pool>0) out.push({label:`block ${pool}`, cls:'block'});
  if(tn.junction) out.push({label:`⚔ ${tn.junction.label}`, cls:'buff'});
  if(tn.reduce>0) out.push({label:`−${tn.reduce} taken`, cls:'buff'});
  if(tn.attackBuff>0 && !tn.attackBuffUsed) out.push({label:`+${tn.attackBuff} atk`, cls:'buff'});
  if(tn.incoming>0) out.push({label:`marked +${tn.incoming}`, cls:'debuff'});
  if(tn.outgoing>0) out.push({label:`−${tn.outgoing} dealt`, cls:'debuff'});
  if(tn.riposte) out.push({label:`riposte ${tn.riposte.counter}`, cls:'buff'});
  if(tn.invuln) out.push({label:'untouchable', cls:'buff'});
  if(tn.tauntTo===f.uid) out.push({label:'taunting', cls:'buff'});
  if(tn.coverFor) out.push({label:'covering', cls:'buff'});
  if(tn.bluff) out.push({label:'bluffing', cls:'buff'});
  if(tn.tripmine && !tn.tripmine.fired) out.push({label:'trip mine', cls:'buff'});
  if(f.equipReduce>0) out.push({label:`−${f.equipReduce} armor`, cls:'equip'});
  if(f.sidearm) out.push({label:'sidearm', cls:'equip'});
  if(f.lightArmor) out.push({label:'light armor', cls:'equip'});
  if(f.reinforced && !f.reinforcedUsed) out.push({label:'reinforced', cls:'equip'});
  if(f.duster && !f.dusterUsed) out.push({label:'duster', cls:'equip'});
  if(f._permIncoming) out.push({label:`+${f._permIncoming} taken`, cls:'debuff'});
  if(pd.regen>0) out.push({label:`regen ${pd.regen}`, cls:'buff'});
  if(pd.absorbNext>0) out.push({label:`shield ${pd.absorbNext} next`, cls:'block'});
  if(pd.incomingNext>0) out.push({label:`+${pd.incomingNext} next`, cls:'debuff'});
  if(pd.outgoingNext>0) out.push({label:`−${pd.outgoingNext} dealt next`, cls:'debuff'});
  if(pd.burn>0) out.push({label:`burn ${pd.burn}`, cls:'debuff'});
  if(pd.silence) out.push({label:'silenced next', cls:'debuff'});
  if(pd.energyPenalty>0) out.push({label:`drowsy −${pd.energyPenalty}e`, cls:'debuff'});
  return out;
}
function snapHp(state){ const m={}; for(const s of state.sides) for(const f of s.fighters) m[f.uid]=f.hp; return m; }
function snapStatus(state){ const m={}; for(const s of state.sides) for(const f of s.fighters) m[f.uid]=fighterStatus(f); return m; }

/* =====================================================================
   AI
   ===================================================================== */
// Random AI (spec §6 Mode A): enumerate legal (card,target), pick 2 at random,
// respecting validatePicks (stacking rules etc.).
function aiRandom(state, sideIdx){
  const actions = buildLegalActions(state, sideIdx);
  return choosePicks(state, sideIdx, actions, (cands)=> state.rng.shuffle(cands.slice()));
}

// Heuristic AI (spec §6 Mode B): simple priority, no lookahead. One readable pass.
function aiHeuristic(state, sideIdx){
  const side = state.sides[sideIdx];
  const enemySide = enemyOf(state, sideIdx);
  const myFighters = livingFighters(side);
  const enemies = livingFighters(enemySide);
  const actions = buildLegalActions(state, sideIdx);
  if(energyBudget(state, side)===0 || actions.length===0) return [];

  const score = (a)=>{
    const c=a.card;
    let s=0;
    // 1. heal a low ally
    const lowAlly = myFighters.find(f=>f.hp<=6);
    if((c.kind==='heal') && lowAlly){ s += 100 + (a.target===lowAlly?20:0) + c.amount; }
    // 2. lethal: commit hard cards to a killable enemy
    const killable = enemies.find(e=> e.hp <= estimateDmg(side));
    if(isAttackCard(c) && killable){ s += 70 + cardDamage(c) + (a.target===killable?25:0); }
    // 3. defend a threatened fighter
    const threatened = myFighters.find(f=>f.hp<=10);
    if((c.kind==='block'||c.kind==='reduce'||c.kind==='reduceBoth'||c.kind==='blockBoth') && threatened){
      s += 55 + (a.target===threatened?15:0);
    }
    // 4. otherwise: FOCUS-FIRE the weakest enemy to actually close out a kill
    if(isAttackCard(c)){
      const lowEnemy = enemies.slice().sort((x,y)=>x.hp-y.hp)[0];
      s += 20 + cardDamage(c);
      if(a.target===lowEnemy) s += 30;                          // strongly concentrate on one target
      if(a.target && cardDamage(c) >= a.target.hp) s += 45;     // this hit can finish them
    }
    if(c.kind==='buffAttack'||a.card.special==='lucky_coin'||a.card.special==='lucky_streak') s += 8;
    if(c.kind==='heal' && !lowAlly) s += 5 + c.amount*0.5;
    // signature: only when it secures a kill or saves a fighter; never turn 1
    if(c.type==='Signature'){
      const securesKill = enemies.some(e=> e.hp <= cardDamage(c));
      const saves = myFighters.some(f=>f.hp<=8);
      if(state.round<=1 || !(securesKill||saves)) s -= 200; else s += 60;
    }
    if(c.type==='Potion'){ s += lowAlly?40:-30; } // save potion unless someone's low
    return s;
  };
  const ranked = actions.slice().sort((a,b)=> score(b)-score(a));
  return choosePicks(state, sideIdx, actions, ()=> ranked);
}
function estimateDmg(side){ // rough focused damage available (ignore blocks, per spec)
  let best=0;
  for(const f of livingFighters(side)) for(const hi of f.hand){ best=Math.max(best, cardDamage(hi.card)); }
  // two hardest cards
  const dmgs=[];
  for(const f of livingFighters(side)) for(const hi of f.hand) if(isAttackCard(hi.card)) dmgs.push(cardDamage(hi.card));
  dmgs.sort((a,b)=>b-a);
  return (dmgs[0]||0)+(dmgs[1]||0);
}
function cardDamage(c){
  if(c.kind==='attack'||c.kind==='aoe') return c.amount;
  if(c.special==='renzokuken') return 9;
  if(c.special==='high_noon') return c.amount||8;          // floor (10 when low HP)
  if(c.special==='ghost_protocol') return 4;
  if(c.special==='drain') return 3;
  if(c.special==='concussive') return c.amount||5;
  if(c.special==='double_tap') return (c.amount||3)+1;
  if(c.special==='fan_hammer') return (c.amount||4)+1;     // ~avg with the coin
  if(c.special==='siege') return c.amount||4;
  if(c.special==='fire_burn') return (c.amount||3)+2;      // hit + burn
  if(c.special==='firaga') return c.amount||9;             // single-target focus (+3 splash to other)
  if(c.special==='solid_barrel') return (c.amount||2)*2;   // two small hits
  return 0;
}

/* ---- Captain & Warden: elevated heuristics (spec §6 Modes C/D). No lookahead. ---- */
// Shared read of the board: HP fractions, thresholds, lethal range, hand pressure.
function aiContext(state, sideIdx){
  const side = state.sides[sideIdx];
  const myFighters = livingFighters(side);
  const enemies = livingFighters(enemyOf(state, sideIdx));
  const frac = (f)=> f.maxHp ? f.hp/f.maxHp : 1;
  const lowestAlly = myFighters.slice().sort((a,b)=> frac(a)-frac(b))[0];
  const critical = myFighters.filter(f=> frac(f) < 0.30);
  const allySafe = lowestAlly && frac(lowestAlly) > 0.50;
  const lowEnemy = enemies.slice().sort((a,b)=> a.hp-b.hp)[0];
  const killable = enemies.find(e=> e.hp <= estimateDmg(side));
  const handCount = myFighters.reduce((n,f)=> n + (f.hand?f.hand.length:0), 0);
  const flush = handCount >= myFighters.length*HAND_CAP_PAIR;   // hand near cap → spend, don't discard value
  const haveAttack = myFighters.some(f=> (f.hand||[]).some(hi=> isAttackCard(hi.card)));
  const threatened = myFighters.find(f=> f.hp<=10 || frac(f)<0.40);
  return { side, myFighters, enemies, frac, lowestAlly, critical, allySafe, lowEnemy, killable, flush, haveAttack, threatened };
}
const _isHealCard = (c)=> c.kind==='heal' || c.special==='regen' || c.special==='sanctuary' || c.special==='whiskey' || c.special==='drain';
const _isDefCard  = (c)=> c.kind==='block'||c.kind==='reduce'||c.kind==='reduceBoth'||c.kind==='blockBoth'||c.kind==='riposte';
// Captain priority: HP-threshold awareness, hand-size pressure, simple synergy.
function captainScore(state, ctx, a){
  const c=a.card; let s=0;
  // 1. heal by HP threshold — triage when critical, top up when wounded, hold when healthy
  if(_isHealCard(c)){
    if(ctx.critical.length){ s += 120 + (c.amount||3) + (a.target && ctx.frac(a.target)<0.30 ? 25:0); }
    else if(ctx.lowestAlly && ctx.frac(ctx.lowestAlly) < 0.50){ s += 45 + (c.amount||3) + (a.target===ctx.lowestAlly?15:0); }
    else { s -= 15; }
  }
  // 2. lethal + focus-fire: concentrate on the weakest enemy, reward finishers
  if(isAttackCard(c)){
    s += 22 + cardDamage(c);
    if(a.target===ctx.lowEnemy) s += 30;
    if(a.target && cardDamage(c) >= a.target.hp) s += 60;                  // this hit can kill
    if(ctx.killable && a.target===ctx.killable) s += 25;
    if(ctx.lowEnemy && ctx.frac(ctx.lowEnemy) < 0.40) s += 15;            // press a low enemy
  }
  // 3. defense: valuable when a fighter is threatened, wasteful when everyone's healthy
  if(_isDefCard(c)){ s += ctx.threatened ? 58 + (a.target===ctx.threatened?15:0) : -8; }
  // 4. setup buffs: lean into them when the team is safe, skip if nothing to amplify
  if(c.kind==='buffAttack' || c.special==='lucky_coin' || c.special==='lucky_streak'){
    s += ctx.allySafe ? 24 : 8;
    if(!ctx.haveAttack) s -= 20;
  }
  // 5. synergy: set the junction before the flurry (Breachblade)
  if(/^junction_/.test(c.special||'')) s += ctx.haveAttack ? 38 : 4;
  // 6. signature: only to secure a kill or save a fighter; never round 1
  if(c.type==='Signature'){
    const securesKill = ctx.enemies.some(e=> e.hp <= cardDamage(c));
    if(state.round<=1 || !(securesKill || ctx.critical.length)) s -= 200; else s += 70;
  }
  // 7. potion: hold unless someone's actually hurting
  if(c.type==='Potion'){ s += (ctx.critical.length || (ctx.lowestAlly && ctx.frac(ctx.lowestAlly)<0.45)) ? 45 : -30; }
  // 8. hand pressure: when the hand is overflowing, spend marginal cards before they're discarded
  if(ctx.flush) s += 6;
  return s;
}
function aiCaptain(state, sideIdx){
  const side = state.sides[sideIdx];
  const actions = buildLegalActions(state, sideIdx);
  if(energyBudget(state, side)===0 || actions.length===0) return [];
  const ctx = aiContext(state, sideIdx);
  const ranked = actions.slice().sort((a,b)=> captainScore(state,ctx,b) - captainScore(state,ctx,a));
  return choosePicks(state, sideIdx, actions, ()=> ranked);
}

// Class knowledge: what threats an enemy of this class can still bring this
// match — and, crucially, which of those it can actually AFFORD this round.
function classThreat(state, enemyFighter, eEnergy){
  const cls = enemyFighter.className;
  const pool = DECKLISTS[cls] || [];
  let maxBurst=0, affordBurst=0, hasSig=false, junctionThreat=false;
  for(const card of pool){
    if(isAttackCard(card)){
      const d = cardDamage(card);
      maxBurst = Math.max(maxBurst, d);
      if(energyCost(card) <= eEnergy) affordBurst = Math.max(affordBurst, d);  // playable NOW
    }
    if(card.type==='Signature') hasSig = true;
    if(/^junction_/.test(card.special||'')) junctionThreat = true;
  }
  const sigLive = hasSig && !enemyFighter.deck.signatureUsed;
  const seen = (state.cardMemory && state.cardMemory[cls] && state.cardMemory[cls].names) || {};
  const junctionSeen = Object.keys(seen).some(n=> /junction/i.test(n));
  return { maxBurst, affordBurst, sigLive, junctionThreat, junctionSeen };
}
// Warden: Captain's priorities, elevated by full-pool class knowledge + card memory.
function aiWarden(state, sideIdx){
  const side = state.sides[sideIdx];
  const actions = buildLegalActions(state, sideIdx);
  if(energyBudget(state, side)===0 || actions.length===0) return [];
  const ctx = aiContext(state, sideIdx);
  const eEnergy = ENERGY_BY_ROUND[Math.min(state.round, ENERGY_BY_ROUND.length)-1];   // enemy's energy this round
  const threats = ctx.enemies.map(e=> classThreat(state, e, eEnergy));
  const affordBurst = threats.reduce((m,t)=> Math.max(m, t.affordBurst), 0);
  const sigThreat = threats.some(t=> t.sigLive && eEnergy>=5);   // signature is T4 — only a threat once affordable
  const junctionWatch = threats.some(t=> t.junctionThreat && (t.junctionSeen || t.sigLive));
  // Which of our fighters could the enemy's affordable burst (+ a buff's worth) drop this turn?
  const inBurstRange = ctx.myFighters.filter(f=> f.hp <= affordBurst + 3);
  const score = (a)=>{
    let s = captainScore(state, ctx, a);
    const c = a.card;
    // Class-aware defense: guard the fighter actually in burst range, and prefer
    // a defense that covers them. Don't over-defend when no one is in danger.
    if(_isDefCard(c) && inBurstRange.length){
      let covers = false;
      if(c.kind==='reduceBoth' || c.kind==='blockBoth') covers = true;
      else if(c.aim==='self') covers = inBurstRange.includes(a.caster);
      else if(c.aim==='ally') covers = a.target && inBurstRange.includes(a.target);
      s += 34 + (covers ? 22 : 0);
    } else if(_isDefCard(c) && junctionWatch){
      s += 12;                                              // a junctioned flurry looms — keep one guard up
    }
    // Hedge our own once-per-match payoff while the enemy still holds a live signature
    if((c.type==='Signature' || c.type==='Potion') && sigThreat){
      const securesKill = ctx.enemies.some(e=> e.hp <= cardDamage(c));
      if(!(securesKill || ctx.critical.length)) s -= 25;
    }
    // No one in danger → press the offense harder than Captain would
    if(!inBurstRange.length && isAttackCard(c)) s += 14;
    return s;
  };
  const ranked = actions.slice().sort((a,b)=> score(b) - score(a));
  return choosePicks(state, sideIdx, actions, ()=> ranked);
}
// difficulty → AI function. recruit=random, clasher=heuristic, captain, warden.
function aiForMode(mode){
  return mode==='warden' ? aiWarden
       : mode==='captain' ? aiCaptain
       : mode==='heuristic' ? aiHeuristic
       : aiRandom;
}

// Generic: given a candidate ordering, greedily add every still-affordable,
// still-legal pick (validatePicks enforces the energy budget + stacking rules).
function choosePicks(state, sideIdx, actions, order){
  const ordered = order(actions);
  const chosen = [];
  for(const a of ordered){
    if(validatePicks(state, sideIdx, chosen.concat([a])).ok) chosen.push(a);
  }
  return chosen;
}

/* =====================================================================
   12 SPEC TEST ASSERTIONS  (spec §8)  — build & pass before any UI.
   ===================================================================== */
function findCard(cls, name, idx){
  const list = DECKLISTS[cls].filter(c=>c.name===name);
  return list[idx||0];
}
function bareState(){
  // two sides, two fighters each, no decks needed (we feed picks directly)
  const s = {
    rng: makeRng(12345), round:1, over:false, result:null, log:[],
    sides:[
      {name:'A', fighters:[makeFighter('A1','Soldier'), makeFighter('A2','Soldier')]},
